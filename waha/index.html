<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3D7D72">
<meta name="description" content="منصة رياضيات تفاعلية هادئة لطلبة صعوبات التعلم - الصفوف الثاني والثالث والرابع">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="واحة الأرقام">
<title>واحة الأرقام</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;600;700&display=swap">
<style>
/* Layout: one calm column, soft sage ground, large touch targets; a quiet top bar and big rounded "doors" for each section */
:root{
  --bg:#F1F5F1; --bg-2:#E6EEE8; --surface:#FBFCFA; --ink:#25322E; --ink-2:#5A6B65; --line:#D3DED6;
  --accent:#3D7D72; --accent-2:#2F6359; --accent-soft:#D5E8E2; --sand:#F3E8D4; --sun:#DDA050; --sun-soft:#F7E6C8;
  --rose:#C9796F; --rose-soft:#F5DEDA; --ok:#4E9363; --ok-soft:#DAEEDF; --sky:#7EA6C8; --sky-soft:#DCE8F2;
  --b-th:#9C88C2; --b-h:#7EA6C8; --b-t:#DDA050; --b-o:#86BC95;
  --shadow:0 1px 2px rgba(37,50,46,.06),0 6px 20px rgba(37,50,46,.06);
  --f-display:"Baloo Bhaijaan 2","Almarai","Segoe UI",Tahoma,sans-serif;
  --f-body:"Almarai","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B19; --bg-2:#1B2421; --surface:#1F2926; --ink:#E4EDE9; --ink-2:#9AAEA7; --line:#33433E;
  --accent:#7CC1B3; --accent-2:#9AD3C7; --accent-soft:#22403A; --sand:#3A3324; --sun:#E7B66C; --sun-soft:#3E3320;
  --rose:#E29A90; --rose-soft:#43292A; --ok:#86C597; --ok-soft:#203A28; --sky:#93B8D6; --sky-soft:#1F3140;
  --b-th:#B3A3D6; --b-h:#8DB3D3; --b-t:#E7B66C; --b-o:#93C9A2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141B19; --bg-2:#1B2421; --surface:#1F2926; --ink:#E4EDE9; --ink-2:#9AAEA7; --line:#33433E;
  --accent:#7CC1B3; --accent-2:#9AD3C7; --accent-soft:#22403A; --sand:#3A3324; --sun:#E7B66C; --sun-soft:#3E3320;
  --rose:#E29A90; --rose-soft:#43292A; --ok:#86C597; --ok-soft:#203A28; --sky:#93B8D6; --sky-soft:#1F3140;
  --b-th:#B3A3D6; --b-h:#8DB3D3; --b-t:#E7B66C; --b-o:#93C9A2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.7;margin:0;-webkit-tap-highlight-color:transparent}
body.big{font-size:20px}
#app{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.2rem} h4{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--ink-2)}
.small{font-size:.85em}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.stack{display:flex;flex-direction:column;gap:18px}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding-block:12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.25rem;font-weight:700;background:none;border:0;padding:0}
.brand svg{width:34px;height:34px}
.iconbtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.iconbtn svg{width:20px;height:20px}

/* install banner */
.install{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--r);padding:14px 16px;margin-block:10px 4px}
.install .txt{flex:1;min-width:200px}
.install b{font-family:var(--f-display);font-size:1.1rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;transition:transform .15s ease,background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{background:var(--accent-2)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.btn.warm{background:var(--sun-soft);border-color:transparent}
.btn.danger{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 40%,transparent)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.9em;border-radius:11px}
.btn.lg{min-height:60px;font-size:1.15em;padding:14px 28px;border-radius:18px}
.btn svg{width:20px;height:20px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:var(--bg-2);font-size:.85em;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.sun{background:var(--sun-soft);color:color-mix(in srgb,var(--sun) 70%,var(--ink))}
.chip.sky{background:var(--sky-soft)}
.chip.rose{background:var(--rose-soft);color:var(--rose)}
.chip.acc{background:var(--accent-soft);color:var(--accent-2)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card h3{margin-bottom:6px}
.section-title{display:flex;align-items:center;gap:10px;margin-block:22px 12px}
.section-title h2{font-size:1.35rem}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-2)}

/* home doors */
.hero{padding-block:26px 10px;display:grid;gap:8px}
.hero h1{font-size:clamp(1.9rem,5vw,2.8rem)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:18px}
.door{position:relative;overflow:hidden;text-align:start;display:flex;flex-direction:column;gap:10px;padding:26px;border-radius:26px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);min-height:220px;transition:transform .2s ease}
.door:hover{transform:translateY(-2px)}
.door .ill{width:84px;height:84px}
.door h2{font-size:1.7rem}
.door.stu{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}
.door.tea{background:linear-gradient(160deg,var(--sun-soft),var(--surface) 70%)}
.door .lock{position:absolute;top:18px;left:18px}
.quote{margin-top:22px;padding:16px 18px;border-radius:var(--r);background:var(--bg-2);display:flex;gap:12px;align-items:center}

/* grade + name pickers */
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:22px 12px;border-radius:22px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:1.3rem;font-weight:700;min-height:120px;transition:border-color .2s,transform .15s}
.pick:hover{border-color:var(--accent)}
.pick .num{font-size:2.6rem;line-height:1;color:var(--accent)}
.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem;font-weight:700;color:var(--ink)}

/* student home */
.welcome{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:20px;border-radius:24px;background:linear-gradient(150deg,var(--accent-soft),var(--surface));border:1px solid var(--line)}
@media (max-width:600px){.welcome{grid-template-columns:1fr}}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;padding:10px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:96px}
.stat b{font-family:var(--f-display);font-size:1.5rem;line-height:1.2}
.task{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:start;width:100%}
.task .ic{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.task .ic svg{width:30px;height:30px}
.task .body{flex:1;min-width:0}
.task.done{opacity:.75}
.task.locked{opacity:.55;cursor:default}
.ic.lesson{background:var(--sky-soft)} .ic.activity{background:var(--accent-soft)} .ic.game{background:var(--sun-soft)} .ic.homework{background:var(--rose-soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px;background:var(--bg-2);border-radius:16px;margin-block:12px}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:12px;font-weight:700;color:var(--ink-2);min-height:42px}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* teacher shell */
.tshell{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.tnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.tnav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:12px;text-align:start;font-weight:700;color:var(--ink-2)}
.tnav button svg{width:20px;height:20px;flex:none}
.tnav button.on{background:var(--accent-soft);color:var(--ink)}
.tmain{min-width:0}
@media (max-width:820px){.tshell{grid-template-columns:1fr}.tnav{position:static;flex-direction:row;overflow-x:auto;padding:6px}.tnav button{white-space:nowrap}}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92em;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;min-height:46px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:400}
textarea{min-height:90px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95em}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{background:var(--bg-2);font-weight:700;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td input[type=number]{width:76px;min-height:38px;text-align:center}

/* pin pad */
.pinwrap{max-width:360px;margin:30px auto;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.pindots{display:flex;gap:14px;justify-content:center;direction:ltr}
.pindots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent)}
.pindots span.on{background:var(--accent)}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;direction:ltr}
.pinpad button{height:68px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* player */
.player{max-width:820px;margin:0 auto}
.pbar{display:flex;align-items:center;gap:10px;margin-block:10px 16px}
.progress{flex:1;height:12px;border-radius:999px;background:var(--bg-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,4vw,34px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center}
.qtext{font-family:var(--f-display);font-size:clamp(1.3rem,3.6vw,1.8rem);font-weight:600}
.qmath{font-family:var(--f-display);font-size:clamp(2rem,7vw,3.2rem);font-weight:700;direction:ltr;letter-spacing:.04em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;width:100%;max-width:620px}
.opt{min-height:84px;border-radius:20px;border:2px solid var(--line);background:var(--bg);font-family:var(--f-display);font-size:clamp(1.4rem,4vw,1.9rem);font-weight:700;transition:border-color .2s,background .2s,transform .15s;display:grid;place-items:center;padding:8px}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--rose-soft);border-color:var(--rose);animation:shake .4s}
.feedback{min-height:34px;font-family:var(--f-display);font-size:1.25rem;font-weight:700}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--rose)}
.hintbox{background:var(--sun-soft);border-radius:14px;padding:10px 16px;max-width:560px}
.explain-text{font-size:clamp(1.1rem,3vw,1.35rem);max-width:60ch;line-height:1.9}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 6px}

/* visuals */
.vis{display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;gap:18px;direction:ltr;max-width:100%}
.vis svg{max-width:100%;height:auto}
.blocks{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;justify-content:center;direction:ltr}
.bgrp{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;max-width:280px;justify-content:center}
.b-th{width:60px;height:60px;border-radius:6px;background:var(--b-th);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--b-th) 60%,#000 0%);position:relative;background-image:linear-gradient(45deg,transparent 46%,rgba(255,255,255,.4) 47%,rgba(255,255,255,.4) 53%,transparent 54%)}
.b-h{width:50px;height:50px;border-radius:4px;background-color:var(--b-h);background-image:linear-gradient(rgba(255,255,255,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.45) 1px,transparent 1px);background-size:5px 5px}
.b-t{width:8px;height:50px;border-radius:3px;background-color:var(--b-t);background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px);background-size:8px 5px}
.b-o{width:9px;height:9px;border-radius:2px;background:var(--b-o)}
.blabel{font-family:var(--f-display);font-weight:700;font-size:.95rem;text-align:center;margin-top:4px;color:var(--ink-2)}
.pv{display:flex;direction:ltr;gap:6px;justify-content:center}
.pv div{display:flex;flex-direction:column;align-items:center;min-width:64px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pv div span{padding:4px 8px;font-size:.85rem;font-weight:700;width:100%;text-align:center}
.pv div b{font-family:var(--f-display);font-size:2rem;padding:4px 10px}
.pv .th span{background:var(--b-th);color:#fff}.pv .h span{background:var(--b-h);color:#fff}.pv .t span{background:var(--b-t);color:#fff}.pv .o span{background:var(--b-o);color:#fff}
.pv .hl{outline:3px solid var(--accent)}
.svgtext{fill:var(--ink);font-family:var(--f-display);font-weight:700}
.svgmuted{fill:var(--ink-2)}
.st-line{stroke:var(--ink-2)}
.st-acc{stroke:var(--accent)}
.fill-acc{fill:var(--accent)} .fill-soft{fill:var(--accent-soft)} .fill-sun{fill:var(--sun)} .fill-sky{fill:var(--sky)} .fill-ok{fill:var(--b-o)} .fill-surface{fill:var(--surface)} .fill-bg2{fill:var(--bg-2)} .fill-rose{fill:var(--rose)}

/* games */
.balloons{position:relative;width:100%;min-height:300px;display:flex;justify-content:space-around;align-items:center;gap:8px;flex-wrap:wrap}
.balloon{position:relative;width:110px;height:136px;border:0;background:none;padding:0;animation:float 5s ease-in-out infinite}
.balloon:nth-child(2){animation-delay:-1.6s}.balloon:nth-child(3){animation-delay:-3.1s}.balloon:nth-child(4){animation-delay:-.8s}
.balloon svg{width:100%;height:100%}
.balloon span{position:absolute;top:30px;left:0;right:0;text-align:center;font-family:var(--f-display);font-size:1.7rem;font-weight:700;color:var(--ink)}
.balloon.pop{animation:pop .45s forwards}
.balloon.nope{animation:shake .4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pop{to{transform:scale(1.4);opacity:0}}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:560px}
@media (max-width:480px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:1/1;max-width:100%;border-radius:18px;border:2px solid var(--line);background:var(--accent-soft);font-family:var(--f-display);font-weight:700;font-size:clamp(.95rem,3vw,1.3rem);display:grid;place-items:center;padding:6px;transition:background .25s,transform .25s;line-height:1.3}
.mcard.open{background:var(--surface);border-color:var(--accent)}
.mcard.matched{background:var(--ok-soft);border-color:var(--ok);opacity:.85}
.mcard .back{width:40%;opacity:.5}
.path{display:flex;gap:6px;align-items:center;justify-content:center;width:100%;direction:rtl;flex-wrap:wrap}
.stone{width:46px;height:46px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;border:2px solid var(--line);font-weight:700;transition:background .4s}
.stone.past{background:var(--accent-soft);border-color:var(--accent)}
.stone.here{background:var(--accent);border-color:var(--accent);color:var(--surface);transform:scale(1.15)}
.stone.goal{width:58px;height:58px;background:var(--sun-soft);border-color:var(--sun)}

/* certificate */
.cert{position:relative;max-width:640px;margin:0 auto;padding:clamp(22px,5vw,40px);border-radius:28px;background:var(--surface);border:2px solid var(--sun);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:var(--shadow);background-image:radial-gradient(circle at 10% 10%,var(--sun-soft),transparent 40%),radial-gradient(circle at 90% 90%,var(--accent-soft),transparent 40%)}
.cert .seal{width:96px;height:96px}
.cert h2{font-size:clamp(1.6rem,5vw,2.2rem)}
.cert .name{font-family:var(--f-display);font-size:clamp(1.8rem,6vw,2.6rem);font-weight:700;color:var(--accent-2)}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:40px;height:40px}
.mini-cert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.mini-cert svg{width:44px;height:44px;flex:none}

/* plant garden */
.plant svg{width:120px;height:120px}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(80px,140px) 1fr 54px;gap:10px;align-items:center}
.barrow .track{height:14px;border-radius:999px;background:var(--bg-2);overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* breathing */
.breath{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);display:grid;place-items:center;margin:20px auto}
.breath i{width:90px;height:90px;border-radius:50%;background:var(--accent);opacity:.75;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1.6)}}

/* mood */
.moods{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px;border-radius:18px;border:2px solid var(--line);background:var(--surface);font-weight:700;min-width:88px}
.mood svg{width:46px;height:46px}
.mood.on{border-color:var(--accent);background:var(--accent-soft)}

/* wheel */
.wheel{width:min(320px,80vw);aspect-ratio:1/1;max-width:100%;margin:0 auto;position:relative}
.wheel svg{width:100%;height:100%;transition:transform 4s cubic-bezier(.17,.67,.2,1)}
.wheel .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--rose)}

/* IEP form (prints on A4 landscape) */
.iep{background:#fff;color:#111;border-radius:12px;padding:16px;font-size:13px;line-height:1.5;border:1px solid var(--line)}
.iep h2{text-align:center;font-size:20px;margin-bottom:10px;color:#7a1c1c}
.iep table{border:1.5px solid #222;font-size:12.5px}
.iep th,.iep td{border:1px solid #444;white-space:normal;vertical-align:top;padding:6px 8px;color:#111;background:#fff}
.iep th{background:#f4edcf;text-align:center;position:static}
.iep .ck{display:block;white-space:nowrap}
.iep [contenteditable]{outline:none;min-height:1.4em;border-radius:4px}
.iep [contenteditable]:focus{background:#fffbe6}
.iep .chkline{display:flex;gap:4px;align-items:center;white-space:nowrap}
.iep input[type=checkbox]{width:14px;height:14px;accent-color:#3D7D72}
.iep .sig{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-weight:700;flex-wrap:wrap}

/* toast + modal */
#toast{opacity:0;visibility:hidden;position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(140%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:14px;font-weight:700;z-index:100;transition:transform .35s ease;max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible}
.modal-bg{position:fixed;inset:0;background:rgba(20,27,25,.45);z-index:90;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:24px;padding:22px;max-width:520px;width:100%;max-height:85vh;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}

.notice{padding:12px 16px;border-radius:14px;background:var(--sky-soft);font-size:.92em}
.kbd{font-family:var(--f-display);font-weight:700;background:var(--bg-2);padding:0 8px;border-radius:6px}
.fade-in{animation:fadein .35s ease}
@keyframes fadein{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media print{
  body{background:#fff}
  .bar,.tnav,.noprint,.install,#toast{display:none!important}
  .tshell{display:block}
  #app{max-width:none;padding:0}
  .iep{border:0;padding:0}
  @page{size:A4 landscape;margin:10mm}
}
@media (max-width:680px){#trackgrid{grid-template-columns:1fr!important}}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-5);
const ymd = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const GRADE_NAME = {2:'الثاني',3:'الثالث',4:'الرابع'};
const IN_FRAME = (()=>{ try{ return window.self !== window.top }catch(e){ return true } })();
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v) }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
};
let PREFS = Object.assign({theme:'auto', big:false, sound:true}, LS.get('waha-prefs',{}));

function digitsMode(){ return (Store.get('settings',{}).digits) || 'indic'; }
function D(s){ s = String(s ?? ''); return digitsMode()==='indic' ? s.replace(/[0-9]/g, d=>'٠١٢٣٤٥٦٧٨٩'[d]) : s; }
function T(s){ return esc(D(s)); }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return D(`${+d}/${+m}/${y}`); }
function weekday(s){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); try{ return new Date(y,m-1,d).toLocaleDateString('ar-OM',{weekday:'long'}) }catch(e){ return '' } }
function fmtTime(ts){ const d=new Date(ts); return D(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')); }

let AC=null;
function chime(good=true){
  if(!PREFS.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const notes = good ? [523.25,659.25,783.99] : [392,349.23];
    notes.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f;
      const t=AC.currentTime+i*0.12; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.12,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.55); });
  }catch(e){}
}
function speak(text){
  try{
    const ss=window.speechSynthesis; if(!ss){ toast('القراءة الصوتية غير متاحة على هذا الجهاز'); return; }
    ss.cancel();
    const u=new SpeechSynthesisUtterance(String(text).replace(/[×]/g,' ضرب ').replace(/[÷]/g,' قسمة ').replace(/−/g,' ناقص ').replace(/\+/g,' زائد ').replace(/=/g,' يساوي ').replace(/\?|؟/g,' '));
    u.lang='ar-SA'; u.rate=0.85;
    const v=ss.getVoices().find(v=>/^ar/i.test(v.lang)); if(v) u.voice=v;
    ss.speak(u);
  }catch(e){}
}

function vBlocks(n){

}
function vPV(n,hl){
  const s=String(n), places=[['th','الآلاف'],['h','المئات'],['t','العشرات'],['o','الآحاد']].slice(4-Math.max(2,s.length));

  return `<div class="pv">${places.map(([c,l],i)=>`<div class="${c} ${hl===c?'hl':''}"><span>${l}</span><b>${T(digs[i])}</b></div>`).join('')}</div>`;
}
function vNL(from,to,mark,show){
  const W=560,H=120,pad=30,n=to-from,step=(W-2*pad)/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}"><line x1="${pad-10}" y1="70" x2="${W-pad+10}" y2="70" class="st-line" stroke-width="2.5"/>`;
  for(let i=0;i<=n;i++){ const x=pad+i*step, big=(from+i)%5===0;
    s+=`<line x1="${x}" y1="${big?60:64}" x2="${x}" y2="${big?80:76}" class="st-line" stroke-width="2"/>`;
    if(i===0||i===n||(from+i)%5===0) s+=`<text x="${x}" y="102" text-anchor="middle" class="svgtext" font-size="17">${D(from+i)}</text>`; }
  if(mark!=null){ const x=pad+(mark-from)*step; s+=`<circle cx="${x}" cy="70" r="9" class="fill-sun"/><text x="${x}" y="42" text-anchor="middle" class="svgtext" font-size="20">${D(mark)}</text>`;
    if(show!=null){ const x2=pad+(show-from)*step, mid=(x+x2)/2; s+=`<path d="M${x} 60 Q${mid} 10 ${x2} 60" fill="none" class="st-acc" stroke-width="3" stroke-dasharray="6 5"/><circle cx="${x2}" cy="70" r="10" class="fill-acc"/>`; } }
  return s+'</svg>';
}
function plate(s,size=96){

  let dots=''; for(let i=0;i<s;i++){ const r=Math.floor(i/cols), c=i%cols; const x=size/2+(c-(cols-1)/2)*gap, y=size/2+(r-(rows-1)/2)*gap; dots+=`<circle cx="${x}" cy="${y}" r="${Math.min(gap*0.36,9)}" class="fill-sun"/>`; }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}"><circle cx="${size/2}" cy="${size/2}" r="${size/2-3}" class="fill-soft" stroke="var(--accent)" stroke-width="2"/>${dots}</svg>`;
}

}
function vClock(h,m){

  for(let i=0;i<60;i++){ if(i%5) { const a=i*Math.PI/30; s+=`<circle cx="${C+86*Math.sin(a)}" cy="${C-86*Math.cos(a)}" r="1.3" class="svgmuted"/>`; } }
  const ha=((h%12)+m/60)*Math.PI/6, ma=m*Math.PI/30;
  s+=`<line x1="100" y1="100" x2="${C+44*Math.sin(ha)}" y2="${C-44*Math.cos(ha)}" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>`;
  s+=`<line x1="100" y1="100" x2="${C+66*Math.sin(ma)}" y2="${C-66*Math.cos(ma)}" stroke="var(--rose)" stroke-width="4.5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" class="fill-acc"/>`;
  return s+'</svg>';
}

function vRect(w,h,lab){

function vColumn(a,b,op,step){
  const r = op==='+' ? a+b : a-b, L=Math.max(String(a).length,String(b).length,String(r).length);

  const row=(n,show)=>{ const s=String(n).padStart(L,' ').split(''); return s.map((ch,k)=>{ const place=L-1-k; return cell(ch===' '?'':(show(place)?ch:''),place); }).join(''); };

function V(v){
  if(!v) return '';
  switch(v.k){

    case 'pv': return vPV(v.n,v.hl);
    case 'nl': return `<div class="vis">${vNL(v.from,v.to,v.mark,v.show)}</div>`;
    case 'groups': return vGroups(v.g,v.s);
    case 'array': return `<div class="vis">${vArray(v.r,v.c)}</div>`;
    case 'share': return vShare(v.total,v.g);
    case 'clock': return `<div class="vis">${vClock(v.h,v.m)}</div>`;
    case 'frac': return `<div class="vis">${vFrac(v.n,v.d,v.circle)}</div>`;
    case 'shape': return `<div class="vis">${vShape(v.name)}</div>`;
    case 'rect': return `<div class="vis">${vRect(v.w,v.h,v.lab)}</div>`;
    case 'column': return vColumn(v.a,v.b,v.op,v.step??3);

    case 'addblocks': return `<div class="vis" style="align-items:center">${vBlocks(v.a)}<b class="qmath">${v.op==='-'?'−':'+'}</b>${vBlocks(v.b)}</div>`;

function mkOpts(ans, cands, n=3){
  const out=[String(ans)];
  for(const c of shuffle(cands)){ if(out.length>=n) break; const s=String(c); if(!out.includes(s) && !(typeof c==='number' && (c<0||!isFinite(c)))) out.push(s); }
  let k=1; while(out.length<n && k<50){ const c=Number(ans)+(k%2?k:-k); if(c>=0 && !out.includes(String(c))) out.push(String(c)); k++; }
  return shuffle(out);
}

function genQs(lesson, n){
  const out=[], seen=new Set(); let guard=0;
  while(out.length<n && guard++<200){ const q=GEN[lesson.gen](); const key=(q.math||'')+q.text+q.answer+JSON.stringify(q.v||''); if(seen.has(key)) continue; seen.add(key); out.push(q); }
  return out;
}
function genPairs(lesson, n){
  const out=[], A=new Set(), B=new Set(); let guard=0;
  while(out.length<n && guard++<400){ const q=GEN[lesson.gen](); const b=q.memB||q.answer; if(A.has(q.memA)||B.has(b)) continue; A.add(q.memA); B.add(b); out.push({a:q.memA, b, html:!!q.html}); }
  return out;
}

/* ===== التخزين: سحابي داخل Claude، ومحلي على الجهاز عند فتح الملف مباشرة ===== */
const Store = {
  mode:'local', db:null, docs:{}, events:[], ready:false,
  load(){ const d=LS.get('waha-data',null); if(d){ this.docs=d.docs||{}; this.events=d.events||[]; } },
  save(){ if(this.mode==='local') LS.set('waha-data',{docs:this.docs,events:this.events}); },
  async init(){
    this.load();
    window.addEventListener('storage', e=>{ if(e.key==='waha-data' && this.mode==='local'){ this.load(); onData(); } });
    let db=null;
    try{ if(window.claude && typeof window.claude.use==='function') db = await window.claude.use('db'); }catch(e){ db=null; }
    if(!db){ this.ready=true; onData(); return; }
    this.db=db; this.mode='cloud';
    const err = e => { console.warn('db', e); if(e && e.code==='revoked'){ this.mode='local'; this.load(); onData(); } };
    db.collection('app').onSnapshot(qs=>{ const docs={}; qs.docs.forEach(d=>{ docs[d.id]=d.data(); }); this.docs=docs; this.ready=true; onData(); }, err);
    db.collection('events').orderBy('ts').limit(1000).onSnapshot(qs=>{ this.events=qs.docs.map(d=>Object.assign({id:d.id}, d.data())); onData(); }, err);
  },
  get(k,def){ const v=this.docs[k]; return v===undefined ? def : v; },
  async set(k,val){
    this.docs[k]=val; onData();
    if(this.mode==='cloud'){ try{ await this.db.doc('app/'+k).set(JSON.parse(JSON.stringify(val))); }catch(e){ toast(e && e.code==='invalid_argument' ? 'هذا الحساب لا يملك صلاحية الحفظ في قسم المعلمة' : 'تعذّر الحفظ، نحاول لاحقاً'); } }
    else this.save();
  },
  async remove(k){ delete this.docs[k]; onData(); if(this.mode==='cloud'){ try{ await this.db.doc('app/'+k).delete(); }catch(e){} } else this.save(); },
  async addEvent(ev){
    ev = Object.assign({ts:Date.now(), date:ymd()}, ev);
    if(this.mode==='cloud'){ try{ await this.db.collection('events').add(ev); return; }catch(e){ toast('تعذّر حفظ النتيجة على هذا الحساب'); return; } }
    ev.id=uid(); this.events.push(ev); this.save(); onData();
  },
  async delEvent(id){
    if(this.mode==='cloud'){ try{ await this.db.doc('events/'+id).delete(); }catch(e){ toast('تعذّر الحذف'); } return; }
    this.events=this.events.filter(e=>e.id!==id); this.save(); onData();
  }
};

function evFor(sid){ return Store.events.filter(e=>e.sid===sid); }

  const evs=evFor(sid), scored=evs.filter(e=>typeof e.score==='number');
  return { points:evs.reduce((a,e)=>a+(+e.points||0),0), certs:evs.filter(e=>e.cert).length, perfect:evs.filter(e=>e.stars===3).length,
    games:evs.filter(e=>e.kind==='game').length, avg: scored.length? Math.round(scored.reduce((a,e)=>a+e.score,0)/scored.length) : null, evs, scored };

let pendingRender=false;
function onData(){
  const ae=document.activeElement;
  const typing = ae && (ae.matches('input,textarea,select,[contenteditable="true"]'));
  if(S.view==='player' || typing){ pendingRender=true; return; }
  render();
}
document.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(pendingRender && S.view!=='player'){ const ae=document.activeElement; if(!(ae && ae.matches('input,textarea,select,[contenteditable="true"]'))){ pendingRender=false; render(); } } },50); });

function applyPrefs(){
  const r=document.documentElement;
  if(PREFS.theme==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',PREFS.theme);
  document.body.classList.toggle('big', !!PREFS.big);
}
function render(){
  pendingRender=false;
  const app=$('#app'); const y=window.scrollY;
  let html='';
  switch(S.view){
    case 'home': html=vHome(); break;
    case 'grade': html=vGrade(); break;
    case 'name': html=vName(); break;
    case 'student': html=vStudent(); break;
    case 'player': html=vPlayer(); break;
    case 'tlogin': html=vLogin(); break;
    case 'teacher': html=S.unlocked ? vTeacher() : vLogin(); break;
  }
  app.innerHTML = vBar() + html;
  if(S._keepScroll) window.scrollTo(0,y); S._keepScroll=false;
  afterRender();
}
function go(view, extra={}){ Object.assign(S,extra); S.view=view; if('speechSynthesis' in window) speechSynthesis.cancel(); render(); window.scrollTo(0,0); }
function rerender(){ S._keepScroll=true; render(); }

  if(stage>=2) s+='<path d="M60 64c-10-1-17-8-17-15 10 0 17 7 17 15zM60 62c10-1 17-8 17-15-10 0-17 7-17 15z" fill="var(--accent)"/>';

function itemsForGrade(g){ return openedItems().filter(i=>i.grade==g).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); }
function taskCard(it, sid){

/* ===== المشغّل: الشرح والأنشطة والألعاب والشهادات ===== */
function startPlay({lessonId, type, game, itemId=null, preview=false}){
  const L=lessonById(lessonId); if(!L){ toast('الدرس غير موجود'); return; }
  const p={lesson:L, type, game, itemId, preview, i:0, first:[], wrong:{}, solved:false, hint:false, result:null, step:0, builder:{th:0,h:0,t:0,o:0}, mistakes:0};
  if(type==='lesson'){ p.tryQ=genQs(L,1)[0]; }
  else if(type==='game' && game==='memory'){ const pairs=genPairs(L,4); p.cards=shuffle(pairs.flatMap((pr,k)=>[{k,side:'a',c:pr.a,html:pr.html},{k,side:'b',c:pr.b,html:false}])); p.open=[]; p.matched=new Set(); }
  else { p.qs=genQs(L, type==='homework'?8:6); }
  S.p=p; go('player');
}
function backFromPlayer(){ const p=S.p; S.p=null; if(p && p.preview){ go('teacher'); } else go('student'); }

function vPlayer(){
  const p=S.p; if(!p) return vHome();
  if(p.result) return vResult();
  const L=p.lesson;
  const head = (prog, label)=>`<div class="pbar noprint"><button class="iconbtn" data-a="quitplay" aria-label="خروج">${ICON.back}</button><div class="progress" aria-label="التقدم"><i style="width:${Math.round(prog*100)}%"></i></div><span class="chip">${label}</span></div>
    <p class="muted small" style="text-align:center;margin-bottom:8px">${T(L.title)} · ${p.preview?'معاينة المعلمة':''}</p>`;
  if(p.type==='lesson'){
    const steps=L.explain, n=steps.length+1;
    if(p.step<steps.length){
      const st=steps[p.step];
      return `<div class="player fade-in">${head((p.step+1)/n,'شرح')}
      <div class="stage">
        <div class="row" style="justify-content:center"><span class="chip sky">خطوة ${T(p.step+1)} من ${T(n)}</span><button class="btn sm soft" data-a="speak" data-t="${esc(st.t)}">${ICON.speaker} استماع</button></div>
        <p class="explain-text">${T(st.t)}</p>
        ${st.v.k==='builder'?vBuilder(st.v):V(st.v)}
        <div class="row" style="justify-content:center">${p.step>0?`<button class="btn" data-a="estep" data-d="-1">السابق</button>`:''}<button class="btn primary lg" data-a="estep" data-d="1">التالي</button></div>
      </div></div>`;
    }
    return `<div class="player fade-in">${head(1,'جرّب')}${vQuestion(p.tryQ, 'جرّب بنفسك')}</div>`;
  }
  if(p.type==='game' && p.game==='memory'){
    const total=p.cards.length/2;
    return `<div class="player fade-in">${head(p.matched.size/total,'بطاقات الذاكرة')}
    <div class="stage"><p class="qtext">نقلب بطاقتين ونطابق السؤال مع إجابته</p>
    <div class="mem">${p.cards.map((c,i)=>{ const open=p.open.includes(i)||p.matched.has(c.k);
      return `<button class="mcard ${open?'open':''} ${p.matched.has(c.k)?'matched':''}" data-a="mflip" data-i="${i}" aria-label="بطاقة">${open?(c.html?c.c:(/^\d+\/\d+$/.test(c.c)?fracHtml(c.c):`<span>${T(c.c)}</span>`)):`<span class="back">${LOGO}</span>`}</button>`; }).join('')}</div>
    <p class="muted small">محاولات غير متطابقة: ${T(p.mistakes)}</p></div></div>`;
  }
  const q=p.qs[p.i], label = p.type==='game' ? GAMES[p.game].name : (p.type==='homework'?'واجب':'نشاط');
  if(p.type==='game' && p.game==='balloons') return `<div class="player fade-in">${head(p.i/p.qs.length,label)}${vBalloons(q)}</div>`;
  if(p.type==='game' && p.game==='treasure') return `<div class="player fade-in">${head(p.i/p.qs.length,label)}${vTreasure()}${vQuestion(q)}</div>`;
  return `<div class="player fade-in">${head(p.i/p.qs.length,label)}${vQuestion(q, `سؤال ${D(p.i+1)} من ${D(p.qs.length)}`)}</div>`;
}
function vQuestion(q, tag){
  const p=S.p;
  return `<div class="stage">
    <div class="row" style="justify-content:center">${tag?`<span class="chip sky">${tag}</span>`:''}<button class="btn sm soft" data-a="speak" data-t="${esc(q.text+' '+(q.math||''))}">${ICON.speaker} استماع</button><button class="btn sm warm" data-a="hint">${ICON.bulb} تلميح</button></div>
    <p class="qtext">${T(q.text)}</p>
    ${V(q.v)}
    ${q.math?`<div class="qmath">${T(q.math)}</div>`:''}
    ${p.hint?`<div class="hintbox">${T(q.hint)}</div>`:''}
    <div class="opts">${q.options.map((o,i)=>`<button class="opt ${p.solved&&o===q.answer?'right':''} ${p.wrong[o]?'wrong':''}" data-a="ans" data-o="${esc(o)}" ${p.solved||p.wrong[o]?'disabled':''}>${optHtml(o)}</button>`).join('')}</div>
    <div class="feedback ${p.fb?.ok?'ok':'no'}" aria-live="polite">${p.fb?esc(p.fb.t):''}</div>
  </div>`;
}
function vBalloons(q){

  return `<div class="stage"><div class="row" style="justify-content:center"><button class="btn sm soft" data-a="speak" data-t="${esc(q.text+' '+(q.math||''))}">${ICON.speaker} استماع</button><button class="btn sm warm" data-a="hint">${ICON.bulb} تلميح</button></div>
    <p class="qtext">${T(q.text)}</p>${V(q.v)}${q.math?`<div class="qmath">${T(q.math)}</div>`:''}
    ${p.hint?`<div class="hintbox">${T(q.hint)}</div>`:''}
    <div class="balloons">${q.options.map((o,i)=>`<button class="balloon ${p.solved&&o===q.answer?'pop':''} ${p.wrong[o]?'nope':''}" data-a="ans" data-o="${esc(o)}" ${p.solved?'disabled':''} aria-label="${esc(o)}">
      <svg viewBox="0 0 110 136"><path d="M55 8c24 0 42 18 42 42 0 26-22 46-42 50-20-4-42-24-42-50C13 26 31 8 55 8z" fill="${cols[i%4]}" opacity="${p.wrong[o]?.35:.9}"/><path d="M50 100l5 7 5-7z" fill="${cols[i%4]}"/><path d="M55 107q-6 12 2 28" stroke="var(--ink-2)" fill="none" stroke-width="1.5"/><ellipse cx="40" cy="34" rx="7" ry="11" fill="#fff" opacity=".35"/></svg>
      <span>${optHtml(o)}</span></button>`).join('')}</div>
    <div class="feedback ${p.fb?.ok?'ok':'no'}" aria-live="polite">${p.fb?esc(p.fb.t):''}</div></div>`;

function vTreasure(){
  const p=S.p, n=p.qs.length; let s='';
  for(let i=0;i<n;i++) s+=`<span class="stone ${i<p.i?'past':''} ${i===p.i?'here':''}">${i===p.i?'<svg viewBox="0 0 24 24" width="24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M5 21a7 7 0 0 1 14 0" fill="currentColor"/></svg>':T(i+1)}</span>`;
  s+=`<span class="stone goal"><svg viewBox="0 0 32 32" width="34"><rect x="4" y="13" width="24" height="14" rx="3" fill="var(--sun)"/><path d="M4 16a12 8 0 0 1 24 0" fill="var(--accent)"/><rect x="14" y="16" width="4" height="6" rx="1" fill="var(--surface)"/></svg></span>`;
  return `<div class="card flat" style="margin-bottom:14px"><div class="path">${s}</div></div>`;
}
function vBuilder(v){
  const p=S.p, b=p.builder, places=v.max===3?[['h','مئة',100],['t','عشرة',10],['o','واحد',1]]:[['t','عشرة',10],['o','واحد',1]];
  const n=b.h*100+b.t*10+b.o, ok=n===v.target;
  return `<div class="col" style="align-items:center;width:100%">
    <div class="card flat" style="width:100%;min-height:120px;display:grid;place-items:center">${vBlocks(n)}</div>
    <div class="qmath">${T(n)}</div>
    <div class="row" style="justify-content:center">${places.map(([k,l])=>`<button class="btn soft" data-a="bld" data-k="${k}" data-d="1">${ICON.plus} ${l}</button>`).join('')}<button class="btn sm" data-a="bld" data-k="reset">من جديد</button></div>
    <div class="feedback ${ok?'ok':''}">${ok?'رائع! بنيت العدد '+T(v.target):`الهدف: ${T(v.target)}`}</div></div>`;
}

function answer(o){
  const p=S.p; if(!p||p.solved) return;
  const q = p.type==='lesson' ? p.tryQ : p.qs[p.i];
  if(o===q.answer){
    p.solved=true; if(p.type!=='lesson' && p.first[p.i]===undefined) p.first[p.i]=true;
    p.fb={ok:true,t:pick(PRAISE)}; chime(true); render();
    setTimeout(()=>{ if(S.p!==p) return; nextQ(); }, p.type==='game'&&p.game==='balloons'?900:1200);
  } else {
    p.wrong[o]=true; if(p.type!=='lesson') p.first[p.i]=false;
    p.fb={ok:false,t:pick(RETRY)}; chime(false);
    if(Object.keys(p.wrong).length>=1) p.hint=true;
    render();
  }
}
function nextQ(){
  const p=S.p;
  if(p.type==='lesson'){ finish(100); return; }
  p.i++; p.solved=false; p.wrong={}; p.hint=false; p.fb=null;
  if(p.i>=p.qs.length){ const right=p.first.filter(Boolean).length; finish(Math.round(right/p.qs.length*100)); return; }
  render();
}
function flip(i){
  const p=S.p; const c=p.cards[i]; if(p.matched.has(c.k)||p.open.includes(i)||p.open.length>=2) return;
  p.open.push(i); render();
  if(p.open.length===2){
    const [a,b]=p.open.map(j=>p.cards[j]);
    if(a.k===b.k && a.side!==b.side){ setTimeout(()=>{ p.matched.add(a.k); p.open=[]; chime(true); render(); if(p.matched.size===p.cards.length/2) setTimeout(()=>finish(Math.max(40,100-p.mistakes*10)),600); },500); }
    else { p.mistakes++; setTimeout(()=>{ p.open=[]; render(); },1100); }
  }
}
function finish(score){
  const p=S.p, L=p.lesson, stars = score>=90?3:score>=60?2:1;
  const st=studentById(S.sid);
  const already = st && p.itemId && isDone(st.id,p.itemId);
  let points = p.type==='lesson' ? 5 : p.type==='game' ? 10+stars*2 : 8+stars*2;
  if(already) points = 2;
  const cert = p.type!=='lesson';
  const title = (p.type==='lesson'?'شرح: ':p.type==='game'?GAMES[p.game].name+': ':p.type==='homework'?'واجب: ':'نشاط: ')+L.title;
  p.result={score,stars,points,cert,title,date:ymd()};
  if(!p.preview && st){ Store.addEvent({sid:st.id, sname:st.name, grade:st.grade, kind:p.type, game:p.game||null, lessonId:L.id, itemId:p.itemId, title, score, stars, points, cert}); }
  chime(true); render();
}
function vResult(){
  const p=S.p, r=p.result, st=studentById(S.sid);
  if(!r.cert) return `<div class="player fade-in"><div class="stage" style="margin-top:20px">${sealSvg()}<h2>أنهيت شرح الدرس!</h2><p class="explain-text">${T(p.lesson.title)}</p><span class="chip sun">+${T(r.points)} نقاط</span><button class="btn primary lg" data-a="donePlay">العودة</button></div></div>`;
  return `<div class="player fade-in" style="margin-top:16px">${certHtml({name:st?st.name:'معاينة المعلمة', title:r.title, date:r.date, stars:r.stars, points:r.points, score:r.score})}
    <div class="row noprint" style="justify-content:center;margin-top:16px"><button class="btn primary lg" data-a="donePlay">العودة لمهامي</button><button class="btn" data-a="replay">إعادة المحاولة</button></div></div>`;
}

function pinHash(p){ let h=5381; for(const c of 'waha:'+p) h=((h<<5)+h+c.charCodeAt(0))>>>0; return 'h'+h.toString(36); }
function checkPin(p){ const cfg=Store.get('config',{}); return cfg.pinHash ? cfg.pinHash===pinHash(p) : p==='1234'; }
S.pin='';
function vLogin(){
  const cfg=Store.get('config',{});
  return `<div class="pinwrap fade-in"><div style="width:64px;color:var(--accent)">${ICON.lock}</div><h2>قسم المعلمة</h2><p class="muted">أدخلي الرقم السري</p>
  <div class="pindots" id="pindots">${[0,1,2,3].map(i=>`<span class="${i<S.pin.length?'on':''}"></span>`).join('')}</div>
  <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-a="pin" data-n="${n}">${T(n)}</button>`).join('')}<button data-a="pin" data-n="del" aria-label="مسح">⌫</button><button data-a="pin" data-n="0">${T(0)}</button><button data-a="home" aria-label="رجوع">${ICON.back.replace('<svg','<svg width="22"')}</button></div>
  ${!cfg.pinHash?`<p class="notice small">الرقم السري المبدئي ${T('1234')}. غيّريه بعد الدخول من الإعدادات.</p>`:''}</div>`;
}
function pinPress(n){
  if(n==='del'){ S.pin=S.pin.slice(0,-1); render(); return; }
  if(S.pin.length>=4) return; S.pin+=n; render();
  if(S.pin.length===4){
    if(checkPin(S.pin)){ S.unlocked=true; S.pin=''; try{ sessionStorage.setItem('waha-t','1'); }catch(e){} go('teacher',{ttab:'dash'}); }
    else { setTimeout(()=>{ const d=$('#pindots'); if(d) d.classList.add('shake'); chime(false); setTimeout(()=>{ S.pin=''; render(); },450); },150); }
  }
}

/* المتابعة والنقاط */
function scoreChart(evs){
  const pts=evs.filter(e=>typeof e.score==='number').slice(-20); if(pts.length<2) return '<p class="muted small">يظهر منحنى التحسن بعد نشاطين على الأقل.</p>';
  const W=600,H=200,P=34, x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>H-P-(v/100)*(H-2*P);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى درجات الأنشطة">`;
  [0,50,100].forEach(v=>{ s+=`<line x1="${P}" x2="${W-P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P-8}" y="${y(v)+5}" text-anchor="end" class="svgmuted" font-size="12">${D(v)}</text>`; });
  const d=pts.map((e,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(e.score).toFixed(1)}`).join(' ');
  s+=`<path d="${d} L${x(pts.length-1)} ${y(0)} L${x(0)} ${y(0)}Z" fill="var(--accent)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>`;
  pts.forEach((e,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(e.score)}" r="${i===pts.length-1?6:3.5}" fill="var(--accent)"><title>${T(e.title)}: ${e.score}%</title></circle>`; });
  const first=pts.slice(0,3).reduce((a,e)=>a+e.score,0)/Math.min(3,pts.length), last=pts.slice(-3).reduce((a,e)=>a+e.score,0)/Math.min(3,pts.length);
  return s+`</svg><p class="small ${last>=first?'':'muted'}" style="margin-top:6px">${last>first+4?'تحسّن واضح في آخر الأنشطة':last<first-4?'تراجع بسيط في آخر الأنشطة؛ قد يحتاج مراجعة':'أداء ثابت'} (من ${T(Math.round(first))}٪ إلى ${T(Math.round(last))}٪)</p>`;
}
function lessonMastery(evs, grade){
  const rows=LESSONS.filter(l=>l.grade==grade).map(l=>{ const sc=evs.filter(e=>e.lessonId===l.id && typeof e.score==='number' && e.kind!=='lesson'); return {l, avg: sc.length?Math.round(sc.reduce((a,e)=>a+e.score,0)/sc.length):null}; });
  return `<div class="bars">${rows.map(r=>`<div class="barrow"><span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${T(r.l.title)}</span><span class="track"><i style="width:${r.avg??0}%;background:${r.avg==null?'transparent':r.avg>=80?'var(--ok)':r.avg>=60?'var(--sun)':'var(--rose)'}"></i></span><span class="small tnum">${r.avg==null?'—':T(r.avg)+'٪'}</span></div>`).join('')}</div>`;
}
function assessTotal(sid, grade){
  const a=Store.get('assess',{items:[],scores:{}}), items=(a.items||[]).filter(i=>i.grade==grade), sc=(a.scores||{})[sid]||{};
  return {got:items.reduce((s,i)=>s+(+sc[i.id]||0),0), max:items.reduce((s,i)=>s+(+i.max||0),0), items, sc};
}

/* الأهداف */
function suggestGoals(){
  const out=[], goals=(Store.get('goals',{items:[]}).items||[]).map(g=>g.text), week=Date.now()-7*864e5;
  for(const s of students()){
    const evs=evFor(s.id).filter(e=>typeof e.score==='number'&&e.kind!=='lesson');
    const byL={}; evs.forEach(e=>{ (byL[e.lessonId]=byL[e.lessonId]||[]).push(e.score); });
    for(const [lid,arr] of Object.entries(byL)){ const avg=arr.reduce((a,b)=>a+b,0)/arr.length, L=lessonById(lid); if(!L) continue;
      if(avg<70) out.push({who:s.id, text:`أن يتقن ${s.name} درس «${L.title}» بنسبة ٨٠٪ (متوسطه الحالي ${Math.round(avg)}٪)`, pri:1});
      else if(avg>=95 && arr.length>=2) out.push({who:s.id, text:`تقديم نشاط إثرائي لـ${s.name} في درس «${L.title}»`, pri:3}); }
    const open=itemsForGrade(s.grade).filter(i=>i.date<=ymd()&&!isDone(s.id,i.id));
    if(open.length>=2 && !evFor(s.id).some(e=>e.ts>week)) out.push({who:s.id, text:`تشجيع ${s.name} على إكمال ${open.length} مهام مفتوحة`, pri:2});
  }
  const plan=Store.get('plan',{});
  LESSONS.filter(l=>(plan[l.id]||{}).status==='doing').forEach(l=>l.sub.slice(0,2).forEach(t=>out.push({who:'class'+l.grade, text:`${t.replace('أن ي','أن ي')} (الصف ${GRADE_NAME[l.grade]})`, pri:2})));
  TEACHER_GOALS.forEach(t=>out.push({who:'teacher', text:t, pri:4}));
  return out.filter(g=>!goals.includes(g.text)).sort((a,b)=>a.pri-b.pri);
}
function tGoals(){
  const goals=Store.get('goals',{items:[]}).items||[], sug=suggestGoals();

  return `${head('الأهداف المقترحة','مقترحات مبنية على أداء الطلبة وخطة السير، وأهداف مهنية للمعلمة.')}

    <div class="card col"><h3>الرقم السري</h3><label class="f">الرقم الحالي<input type="password" inputmode="numeric" maxlength="4" id="pw-old"></label><label class="f">الرقم الجديد (٤ أرقام)<input type="password" inputmode="numeric" maxlength="4" id="pw-new"></label><button class="btn primary" data-a="changepin">حفظ الرقم الجديد</button></div>
    <div class="card col"><h3>العرض</h3>
      <label class="f">شكل الأرقام<select id="set-digits" data-set="digits"><option value="indic" ${digitsMode()==='indic'?'selected':''}>عربية ١٢٣</option><option value="western" ${digitsMode()==='western'?'selected':''}>123</option></select></label>
      <label class="row"><input type="checkbox" id="pf-big" data-pref="big" ${PREFS.big?'checked':''} style="width:22px;height:22px;accent-color:var(--accent)"> خط كبير على هذا الجهاز</label>
      <label class="row"><input type="checkbox" id="pf-sound" data-pref="sound" ${PREFS.sound?'checked':''} style="width:22px;height:22px;accent-color:var(--accent)"> أصوات التشجيع</label></div>
    <div class="card col"><h3>النسخ الاحتياطي</h3><p class="small muted">${Store.mode==='cloud'?'البيانات محفوظة ومتزامنة تلقائياً بين الأجهزة التي تفتح المنصة من رابطها.':'البيانات محفوظة على هذا الجهاز. صدّري نسخة احتياطية بانتظام، ويمكن دمج نتائج أجهزة أخرى بالاستيراد.'}</p>
      <div class="row"><button class="btn soft" data-a="export">${ICON.download} تصدير نسخة</button><label class="btn soft" style="cursor:pointer">${ICON.upload} استيراد ودمج<input type="file" accept=".json,application/json" id="importfile" hidden></label></div></div>
    <div class="card col"><h3>حول المنصة</h3><p class="small">${esc(SCHOOL.school)} · ${esc(SCHOOL.gov)}<br>المعلمة: ${esc(SCHOOL.teacher)}<br>العام الدراسي ${T(SCHOOL.year)} · الفصل ${esc(SCHOOL.term)}</p>
      <button class="btn danger" data-a="resetall">حذف كل البيانات</button></div>
  </div>`;
}
function exportData(){
  const data=JSON.stringify({app:'waha', v:1, at:Date.now(), docs:Store.docs, events:Store.events});
  if(IN_FRAME){ modal(`<h3>نسخة احتياطية</h3><p class="small muted">انسخي النص واحفظيه في ملف.</p><textarea id="exptxt" style="min-height:200px;direction:ltr">${esc(data)}</textarea><button class="btn primary" data-a="copyexp">${ICON.copy} نسخ</button>`); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download='waha-backup-'+ymd()+'.json'; document.body.appendChild(a); a.click(); a.remove(); toast('تم تصدير النسخة');
}
async function importData(file){
  try{ const d=JSON.parse(await file.text()); if(d.app!=='waha') throw 0;
    for(const [k,v] of Object.entries(d.docs||{})){ if(k==='students'){ const cur=students(), add=(v.list||[]).filter(s=>!cur.some(c=>c.id===s.id)); await Store.set('students',{list:[...cur,...add]}); } else if(!Store.get(k)) await Store.set(k,v); }
    const ids=new Set(Store.events.map(e=>e.ts+'|'+e.sid)); let n=0;
    for(const e of d.events||[]){ if(ids.has(e.ts+'|'+e.sid)) continue; const c=Object.assign({},e); delete c.id; await Store.addEvent(c); n++; }
    toast(`تم الدمج: ${D(n)} سجل جديد`);
  }catch(e){ toast('الملف غير صالح'); }
}

/* ===== الأحداث ===== */
function confirmBox(text, yesLabel, fn){ S._confirm=fn; modal(`<h3>${text}</h3><div class="row"><button class="btn danger" data-a="confirmyes">${yesLabel}</button><button class="btn" data-a="closemodal">إلغاء</button></div>`); }
async function setStudents(list){ await Store.set('students',{list}); }

const ACTIONS = {
  home(){ go('home'); },
  gostudent(){ const r=LS.get('waha-student',null); if(r && studentById(r) && S.view==='home'){ go('student',{sid:r, sTab:'tasks'}); return; } go('grade'); },
  goteacher(){ go(S.unlocked?'teacher':'tlogin'); },
  pickgrade(el){ go('name',{grade:+el.dataset.g}); },
  pickname(el){ LS.set('waha-student', el.dataset.id); go('student',{sid:el.dataset.id, sTab:'tasks'}); },
  switchstudent(){ LS.set('waha-student', null); go('grade'); },
  stab(el){ S.sTab=el.dataset.t; rerender(); },
  async mood(el){ const st=studentById(S.sid); if(!st) return; await Store.addEvent({sid:st.id, sname:st.name, grade:st.grade, kind:'mood', mood:el.dataset.m, points:0}); toast('شكراً لمشاركتنا شعورك'); },
  startitem(el){ const it=openedItems().find(i=>i.id===el.dataset.id); if(!it) return; startPlay({lessonId:it.lessonId, type:it.type, game:it.game, itemId:it.id}); },
  showcert(el){ const e=Store.events.find(x=>x.id===el.dataset.id), st=studentById(S.sid); if(!e) return; modal(certHtml({name:st?.name||e.sname, title:e.title, date:e.date, stars:e.stars||1, points:e.points, score:e.score??100})+'<button class="btn primary" data-a="closemodal">إغلاق</button>'); },
  install(){ doInstall(); },
  theme(){ const dark = document.documentElement.getAttribute('data-theme')==='dark' || (PREFS.theme==='auto' && matchMedia('(prefers-color-scheme: dark)').matches); PREFS.theme = dark?'light':'dark'; LS.set('waha-prefs',PREFS); applyPrefs(); rerender(); },
  closemodal(){ closeModal(); },
  confirmyes(){ const f=S._confirm; S._confirm=null; closeModal(); if(f) f(); },
  tlock(){ S.unlocked=false; try{ sessionStorage.removeItem('waha-t'); }catch(e){} go('home'); },
  // المشغّل
  quitplay(){ backFromPlayer(); },
  estep(el){ const p=S.p; p.step=Math.max(0,p.step+ +el.dataset.d); p.builder={th:0,h:0,t:0,o:0}; render(); window.scrollTo(0,0); },
  speak(el){ speak(el.dataset.t); },
  hint(){ S.p.hint=true; render(); },
  ans(el){ answer(el.dataset.o); },
  mflip(el){ flip(+el.dataset.i); },
  bld(el){ const b=S.p.builder; if(el.dataset.k==='reset'){ S.p.builder={th:0,h:0,t:0,o:0}; } else if(b[el.dataset.k]<9){ b[el.dataset.k]++; } render();
    const st=S.p.lesson.explain[S.p.step]; if(st && st.v.k==='builder' && b.h*100+b.t*10+b.o===st.v.target) chime(true); },
  donePlay(){ backFromPlayer(); },
  replay(){ const p=S.p; startPlay({lessonId:p.lesson.id, type:p.type, game:p.game, itemId:p.itemId, preview:p.preview}); },
  // المعلمة
  pin(el){ pinPress(el.dataset.n); },
  ttab(el){ S.ttab=el.dataset.t; S.iep=null; go('teacher'); },
  tgrade(el){ S.tgrade=+el.dataset.g; S.tsel=null; rerender(); },
  async addstudent(){ const n=$('#ns-name').value.trim(), g=+$('#ns-grade').value; if(!n){ toast('اكتبي اسم الطالب'); return; } S.tgrade=g; await setStudents([...students(),{id:uid(),name:n,grade:g}]); toast('أُضيف '+n); setTimeout(()=>{ const i=$('#ns-name'); if(i) i.focus(); },50); },
  async addbulk(){ const g=+$('#ns-grade').value, names=$('#ns-bulk').value.split('\n').map(s=>s.trim()).filter(Boolean); if(!names.length) return; S.tgrade=g; await setStudents([...students(),...names.map(n=>({id:uid(),name:n,grade:g}))]); toast(`أُضيف ${D(names.length)} طالب`); },
  renamestudent(el){ const s=studentById(el.dataset.id); modal(`<h3>تعديل بيانات الطالب</h3><label class="f">الاسم<input type="text" id="rn-name" value="${esc(s.name)}"></label><label class="f">الصف<select id="rn-grade">${[2,3,4].map(g=>`<option value="${g}" ${s.grade==g?'selected':''}>الصف ${GRADE_NAME[g]}</option>`).join('')}</select></label><button class="btn primary" data-a="dorename" data-id="${s.id}">حفظ</button>`); },
  async dorename(el){ const n=$('#rn-name').value.trim(), g=+$('#rn-grade').value; if(!n) return; await setStudents(students().map(s=>s.id===el.dataset.id?{...s,name:n,grade:g}:s)); closeModal(); },
  delstudent(el){ const s=studentById(el.dataset.id); confirmBox(`حذف ${esc(s.name)} من القائمة؟ تبقى سجلاته محفوظة.`, 'حذف', ()=>setStudents(students().filter(x=>x.id!==s.id))); },
  tsel(el){ S.tsel=el.dataset.id; rerender(); },
  async mpts(el){ const st=studentById(S.tsel), n=+el.dataset.n, note=($('#mp-note')?.value||'').trim()||(n>0?'نقاط من المعلمة':'خصم نقطة'); await Store.addEvent({sid:st.id,sname:st.name,grade:st.grade,kind:'manual',points:n,note,title:note}); toast(`${n>0?'+':''}${D(n)} لـ${st.name}`); },
  async copyparent(){ const t=$('#parentmsg').innerText; try{ await navigator.clipboard.writeText(t); toast('نُسخت الرسالة'); }catch(e){ const r=document.createRange(); r.selectNodeContents($('#parentmsg')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('حدّدنا النص، انسخيه يدوياً'); } },
  delevent(el){ confirmBox('حذف هذا السجل؟','حذف',()=>Store.delEvent(el.dataset.id)); },
  async additem(){ const n=$('#as-name').value.trim(), m=+$('#as-max').value||10; if(!n){ toast('اكتبي اسم البند'); return; } const a=Store.get('assess',{items:[],scores:{}}); await Store.set('assess',{items:[...(a.items||[]),{id:uid(),grade:S.tgrade,name:n,max:m}],scores:a.scores||{}}); },
  quickitem(el){ $('#as-name').value=el.dataset.n; $('#as-name').focus(); },
  delitem(el){ confirmBox('حذف هذا البند ودرجاته؟','حذف',()=>{ const a=Store.get('assess',{items:[],scores:{}}); Store.set('assess',{items:a.items.filter(i=>i.id!==el.dataset.id),scores:a.scores||{}}); }); },
  openitem(){ openItems([makeItem(S.of.type,S.of.game)]); },
  openall(){ openItems([makeItem('lesson'),makeItem('activity'),makeItem('game',S.of.game||'balloons')]); },
  closeitem(el){ confirmBox('إغلاق هذا العنصر؟ يختفي من قسم الطلبة وتبقى نتائجهم.','إغلاق',()=>{ const o=Store.get('opened',{items:[]}); Store.set('opened',{items:o.items.filter(i=>i.id!==el.dataset.id)}); }); },
  async addgoal(el){ const g=Store.get('goals',{items:[]}); await Store.set('goals',{items:[...(g.items||[]),{id:uid(),text:el.dataset.text,who:el.dataset.who,done:false,due:''}]}); toast('أُضيف للأهداف'); },
  async addcustomgoal(){ const t=$('#gl-text').value.trim(); if(!t) return; const g=Store.get('goals',{items:[]}); await Store.set('goals',{items:[...(g.items||[]),{id:uid(),text:t,who:'teacher',done:false,due:$('#gl-due').value}]}); },
  delgoal(el){ const g=Store.get('goals',{items:[]}); Store.set('goals',{items:g.items.filter(x=>x.id!==el.dataset.id)}); },
  iep(el){ S.iep={lessonId:el.dataset.l, sid:''}; rerender(); window.scrollTo(0,0); },
  iepback(){ S.iep=null; rerender(); },
  async iepsave(){ await Store.set(iepKey(), collectIEP()); toast('حُفظ التحضير'); },
  print(){ window.print(); },
  preview(el){ startPlay({lessonId:el.dataset.l, type:el.dataset.t, game:el.dataset.g, preview:true}); },
  quickopen(el){ S.of={...S.of, grade:lessonById(el.dataset.l).grade, lessonId:el.dataset.l, date:ymd()}; S.ttab='open'; go('teacher'); toast('اختاري النوع ثم «افتحي للطلبة»'); },
  spin(){ const list=students().filter(s=>s.grade==S.tgrade); if(!list.length) return; const i=rnd(0,list.length-1), seg=360/list.length;
    S.wheelRot = S.wheelRot - S.wheelRot%360 + 360*5 + (360 - (i+0.5)*seg); S.wheelPick=null; const w=$('#wheelsvg'); if(w) w.style.transform=`rotate(${S.wheelRot}deg)`; $('#wheelres').textContent='';
    setTimeout(()=>{ S.wheelPick=list[i].name; const r=$('#wheelres'); if(r) r.textContent=list[i].name; chime(true); },4100); },
  timer(el){ startTimer(+el.dataset.m); },
  async att(el){ const a=Store.get('attendance',{}), day={...(a[S.attDate]||{})}; day[el.dataset.id]=el.dataset.v; await Store.set('attendance',{...a,[S.attDate]:day}); },
  async changepin(){ const o=$('#pw-old').value, n=$('#pw-new').value; if(!checkPin(o)){ toast('الرقم الحالي غير صحيح'); return; } if(!/^\d{4}$/.test(n)){ toast('الرقم الجديد ٤ أرقام'); return; } await Store.set('config',{...Store.get('config',{}),pinHash:pinHash(n)}); toast('تم تغيير الرقم السري'); },
  export(){ exportData(); },
  async copyexp(){ try{ await navigator.clipboard.writeText($('#exptxt').value); toast('نُسخ'); }catch(e){ $('#exptxt').select(); } },
  resetall(){ confirmBox('حذف كل الطلبة والنتائج والإعدادات نهائياً؟','حذف الكل', async ()=>{ for(const k of Object.keys(Store.docs)) await Store.remove(k); for(const e of [...Store.events]) await Store.delEvent(e.id); toast('حُذفت البيانات'); }); }
};
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const f=ACTIONS[el.dataset.a]; if(f){ e.preventDefault(); f(el); }
});
document.addEventListener('change', async e=>{
  const el=e.target;
  if(el.dataset.sc){ const [sid,iid]=el.dataset.sc.split('|'), a=Store.get('assess',{items:[],scores:{}}), item=a.items.find(i=>i.id===iid);
    let v=el.value===''?'':Math.max(0,Math.min(+item.max,+el.value)); const scores={...(a.scores||{})}; scores[sid]={...(scores[sid]||{}),[iid]:v}; if(v==='') delete scores[sid][iid];
    await Store.set('assess',{items:a.items,scores}); return; }
  if(el.dataset.of){ S.of[el.dataset.of] = el.dataset.of==='grade' ? +el.value : el.value; if(['grade','type'].includes(el.dataset.of)) rerender(); else if(el.dataset.of==='date') rerender(); return; }
  if(el.dataset.pw){ const p=Store.get('plan',{}); await Store.set('plan',{...p,[el.dataset.pw]:{...(p[el.dataset.pw]||{}),week:+el.value}}); return; }
  if(el.dataset.ps){ const p=Store.get('plan',{}); await Store.set('plan',{...p,[el.dataset.ps]:{...(p[el.dataset.ps]||{}),status:el.value,at:ymd()}}); return; }
  if(el.dataset.gdone){ const g=Store.get('goals',{items:[]}); await Store.set('goals',{items:g.items.map(x=>x.id===el.dataset.gdone?{...x,done:el.checked}:x)}); return; }
  if(el.id==='iep-sid'){ S.iep.sid=el.value; rerender(); return; }
  if(el.id==='att-date'){ S.attDate=el.value||ymd(); rerender(); return; }
  if(el.dataset.set){ await Store.set('settings',{...Store.get('settings',{}),[el.dataset.set]:el.value}); return; }
  if(el.dataset.pref){ PREFS[el.dataset.pref]=el.checked; LS.set('waha-prefs',PREFS); applyPrefs(); return; }
  if(el.id==='importfile' && el.files[0]){ importData(el.files[0]); }
});
document.addEventListener('keydown', e=>{
  if(S.view==='tlogin' || (S.view==='teacher'&&!S.unlocked)){ if(/^\d$/.test(e.key)) pinPress(e.key); else if(e.key==='Backspace') pinPress('del'); }
  if(e.key==='Enter' && e.target.id==='ns-name') ACTIONS.addstudent();
  if(e.key==='Escape') closeModal();
});
function afterRender(){}

/* ===== التثبيت كتطبيق (PWA) ===== */
function iconPng(size){
  return new Promise(res=>{ try{
    const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
    x.fillStyle='#D5E8E2'; x.beginPath(); x.roundRect ? x.roundRect(0,0,size,size,size*0.22) : x.rect(0,0,size,size); x.fill();
    x.fillStyle='#3D7D72'; x.font=`700 ${size*0.42}px sans-serif`; x.textAlign='center'; x.textBaseline='middle'; x.fillText('١٢٣',size/2,size*0.56);
    x.fillStyle='#DDA050'; x.beginPath(); x.arc(size*0.74,size*0.24,size*0.08,0,Math.PI*2); x.fill();
    res(c.toDataURL('image/png')); }catch(e){ res(null); } });
}
async function setupPWA(){
  if(IN_FRAME) return;
  const add=(tag,attrs)=>{ const el=document.createElement(tag); Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)); document.head.appendChild(el); return el; };
  const icon=await iconPng(512);
  if(icon){ add('link',{rel:'apple-touch-icon',href:icon}); add('link',{rel:'icon',href:icon}); }
  if(!document.querySelector('link[rel="manifest"]')){
    let hasFile=false;
    if(/^https?:$/.test(location.protocol)){ try{ const r=await fetch('manifest.webmanifest',{method:'HEAD',cache:'no-store'}); hasFile=r.ok; }catch(e){} }
    if(hasFile) add('link',{rel:'manifest',href:'manifest.webmanifest'});
    else if(icon){ const base=location.href.split('#')[0]; const m={name:'واحة الأرقام',short_name:'واحة الأرقام',lang:'ar',dir:'rtl',start_url:base,scope:base.replace(/[^/]*$/,''),display:'standalone',background_color:'#F1F5F1',theme_color:'#3D7D72',icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any'}]};
      add('link',{rel:'manifest',href:URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))}); }
  }
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}

/* ===== البداية ===== */
document.documentElement.setAttribute('dir','rtl'); document.documentElement.setAttribute('lang','ar');
applyPrefs();
if(matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if(PREFS.theme==='auto') rerender(); });
render();
Store.init();
setupPWA();
