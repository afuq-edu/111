<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F7FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1828" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="المجال الأول">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>منصة المجال الأول</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a morning-sky app shell. Right-hand sidebar (RTL) on wide screens, drawer + bottom bar on phones;
   school navy for text, school gold for the one accent, sage/rose only for done / needs-attention. */
:root{
  --sky:#F3F7FB; --sky-2:#E7F0F8; --paper:#FFFFFF; --ink:#1B2E4F; --ink-2:#506482; --ink-3:#7F90A8;
  --gold:#B48529; --gold-soft:#F7EEDA; --sea:#2D6A8C; --sea-soft:#E1EEF6;
  --sage:#3F7F5E; --sage-soft:#E2F1E8; --rose:#B9483D; --rose-soft:#F9E6E3; --amber:#A86E12; --amber-soft:#FBEFD9;
  --line:#DAE4EE; --shadow:0 1px 2px rgba(27,46,79,.06),0 6px 20px rgba(27,46,79,.06);
  --f-display:"El Messiri","Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI","Geeza Pro",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#0E1828; --sky-2:#132238; --paper:#15233A; --ink:#E7EDF6; --ink-2:#AFC0D6; --ink-3:#7F92AD;
  --gold:#DDB563; --gold-soft:#2E2718; --sea:#86BCDB; --sea-soft:#17304A;
  --sage:#82C6A1; --sage-soft:#16302A; --rose:#EE978C; --rose-soft:#3A1F22; --amber:#E9B65C; --amber-soft:#35290F;
  --line:#253750; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#0E1828; --sky-2:#132238; --paper:#15233A; --ink:#E7EDF6; --ink-2:#AFC0D6; --ink-3:#7F92AD;
  --gold:#DDB563; --gold-soft:#2E2718; --sea:#86BCDB; --sea-soft:#17304A;
  --sage:#82C6A1; --sage-soft:#16302A; --rose:#EE978C; --rose-soft:#3A1F22; --amber:#E9B65C; --amber-soft:#35290F;
  --line:#253750; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--sky)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.35;margin:0;text-wrap:balance;color:var(--ink)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.num,table{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:inherit}
.brand img{width:44px;height:44px;border-radius:12px;background:#fff;object-fit:contain;border:1px solid var(--line)}
.brand b{font-family:var(--f-display);font-size:18px;display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--ink-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.layout{display:grid;grid-template-columns:1fr;max-width:1320px;margin-inline:auto}
.side{display:none}
main{min-width:0;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:980px){
  .layout{grid-template-columns:260px 1fr}
  .side{display:block;position:sticky;top:calc(61px + env(safe-area-inset-top,0px));height:calc(100vh - 61px);overflow:auto;padding:18px 14px 18px 0;padding-right:max(14px,env(safe-area-inset-right,0px))}
  .bottom,#menuBtn{display:none!important}
  main{padding-block:26px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px}
}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a svg{width:19px;height:19px;flex:none;color:var(--ink-3)}
.nav a:hover{background:var(--sky-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.nav a[aria-current="page"] svg{color:var(--gold)}
.nav .sep{height:1px;background:var(--line);margin:8px 12px}
.nav .cap{font-size:12px;letter-spacing:.02em;color:var(--ink-3);padding:6px 12px 2px}
.drawer{position:fixed;inset:0;z-index:50;display:flex}
.drawer .scrim{position:absolute;inset:0;background:rgba(10,20,35,.35)}
.drawer .panel{position:relative;margin-inline-start:0;width:min(320px,86vw);height:100%;background:var(--sky);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);text-decoration:none;padding:4px 0;border-radius:10px}
.bottom a svg{width:22px;height:22px}
.bottom a[aria-current="page"]{color:var(--gold)}

/* ---------- page parts ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:clamp(24px,4vw,32px)}
.ph p{color:var(--ink-2);max-width:62ch}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:13px;font-weight:600;letter-spacing:.02em;margin-bottom:4px}
.eyebrow::before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.grid.s{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}
.section-title h2{font-size:21px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:8px 14px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
:root[data-theme="dark"] .btn.gold{color:#1b1406}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.gold{color:#1b1406}}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--sky-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--sage-soft);color:var(--sage)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.bad{background:var(--rose-soft);color:var(--rose)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.sea{background:var(--sea-soft);color:var(--sea)}
.seg{display:inline-flex;background:var(--sky-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;min-width:0}
textarea.input{min-height:92px;resize:vertical}
.input:focus{outline:2px solid color-mix(in srgb,var(--gold) 60%,transparent);border-color:var(--gold)}
.bar{height:8px;background:var(--sky-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sage);border-radius:99px}
.bar.gold>i{background:var(--gold)}
.bar.sea>i{background:var(--sea)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);background:var(--sky-2);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.diamond{display:inline-block;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);margin-inline:6px;vertical-align:middle}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 22px;background:
  radial-gradient(120% 90% at 100% 0%, color-mix(in srgb,var(--gold) 22%,transparent) 0%, transparent 46%),
  linear-gradient(180deg,var(--sea-soft),var(--paper));border:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(-45deg,var(--gold) 0 6px,transparent 6px 12px);opacity:.35}
.hero-in{position:relative;display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:720px){.hero-in{grid-template-columns:auto 1fr;align-items:center}}
.hero img{width:112px;height:112px;object-fit:contain;background:#fff;border-radius:24px;padding:6px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(24px,4.4vw,36px)}
.hero .who{color:var(--ink-2);margin-top:4px}
.hero .date{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.motto{font-family:var(--f-display);color:var(--gold);font-size:18px;margin-top:6px}
.vision{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:820px){.vision{grid-template-columns:1.25fr 1fr}}
.vision .v{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 18px;position:relative}
.vision .v h3{font-size:15px;color:var(--gold);font-family:var(--f-body);font-weight:600;letter-spacing:.02em;margin-bottom:6px}
.vision .big{font-family:var(--f-display);font-size:clamp(20px,2.6vw,25px);line-height:1.6;color:var(--ink)}
.values{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.values span{border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-size:13.5px;background:var(--sky)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:13px;color:var(--ink-2)}
.stat .v{font-family:var(--f-display);font-size:28px;line-height:1.1}
.stat .s{font-size:12.5px;color:var(--ink-3)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.tile{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:96px}
.tile:hover{border-color:var(--gold)}
.tile svg{width:24px;height:24px;color:var(--gold)}
.tile b{font-weight:600;font-size:14px;line-height:1.4}
.todo{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo span{flex:1;min-width:0}
.todo.done span{text-decoration:line-through;color:var(--ink-3)}
.check{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--ink-3);border-radius:6px;display:inline-grid;place-items:center;flex:none;margin-top:3px;background:var(--paper)}
.check:checked{background:var(--sage);border-color:var(--sage)}
.check:checked::after{content:"";width:6px;height:10px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* ---------- people ---------- */
.person{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.person:hover{border-color:var(--ink-3)}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;flex:none;background:var(--sea-soft);color:var(--sea)}
.person .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.person .meta b{font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* ---------- plan ---------- */
.goal{display:flex;flex-direction:column;gap:12px}
.goal .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal h3{font-size:17px;font-family:var(--f-body);font-weight:600;line-height:1.6}
.acts{display:flex;flex-direction:column}
.act{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line)}
.act label{flex:1;min-width:0}
.act.done label{color:var(--ink-3)}

/* ---------- prep matrix ---------- */
.prep th.t,.prep td.t{position:sticky;right:0;background:var(--paper);z-index:1;min-width:210px;max-width:320px;white-space:normal}
.prep th.t{background:var(--sky-2)}
.prep td.wk{background:var(--sky);font-weight:600;color:var(--ink-2);font-size:13px}
.prep td.c{text-align:center;padding:6px}
.prep th.c{text-align:center;white-space:normal;min-width:78px;font-size:12.5px}
.cell{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);display:inline-grid;place-items:center}
.cell[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--paper)}
.cell svg{width:16px;height:16px}
.tri{min-width:62px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);font-size:12.5px;padding:0 8px}
.tri[data-v="1"]{background:var(--sage-soft);color:var(--sage);border-color:color-mix(in srgb,var(--sage) 45%,transparent)}
.tri[data-v="0"]{background:var(--rose-soft);color:var(--rose);border-color:color-mix(in srgb,var(--rose) 45%,transparent)}

/* ---------- charts ---------- */
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:54px 1fr 52px;gap:10px;align-items:center;font-size:13.5px}
.hb .track{height:14px;background:var(--sky-2);border-radius:7px;overflow:hidden;position:relative}
.hb .track i{position:absolute;inset:0 0 0 auto;border-radius:7px;background:var(--sea)}
.hb .track .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-3)}
.stacked{display:flex;height:16px;border-radius:7px;overflow:hidden;background:var(--sky-2)}
.stacked i{display:block;height:100%}
.lv-a{background:var(--sage)} .lv-b{background:color-mix(in srgb,var(--sage) 55%,var(--sea))} .lv-c{background:var(--gold)} .lv-d{background:color-mix(in srgb,var(--rose) 65%,var(--gold))} .lv-e{background:var(--rose)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.poster{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;max-width:100%;background:var(--sky-2)}
.poster-ph{width:100%;aspect-ratio:4/5;border-radius:12px;display:grid;place-items:center;text-align:center;padding:20px;font-family:var(--f-display);font-size:26px;color:var(--ink);
  background:radial-gradient(90% 70% at 70% 20%,var(--gold-soft),transparent 60%),linear-gradient(160deg,var(--sea-soft),var(--sky-2))}

/* ---------- modal + toast ---------- */
dialog{border:0;padding:0;background:transparent;max-width:min(620px,calc(100vw - 24px));width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(10,20,35,.42)}
.sheet{background:var(--paper);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);max-height:min(86vh,820px);display:flex;flex-direction:column}
.sheet header{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet header h3{font-size:19px}
.sheet .body{padding:6px 18px 12px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet footer{padding:12px 18px 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
@media (min-width:980px){.toast{bottom:28px}}
@media (prefers-reduced-motion:no-preference){
  main>*{animation:rise .35s ease both}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>

<script>
(function(){

/* ============ icons ============ */
const P = {

 upload:'<path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>',
};
const ic = (n,extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${P[n]||''}</svg>`;

/* ============ helpers ============ */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
const AR = n => Number(n).toLocaleString('en-US');
const pct = (a,b) => b? Math.round(a*100/b) : 0;
function fmtDate(iso, opts){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return esc(iso); return d.toLocaleDateString('ar-OM-u-nu-latn', opts||{day:'numeric',month:'long',year:'numeric'}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2400); }

/* ============ state + storage ============ */
const KEY='muzn-field1-v1', KEY_STU='muzn-field1-students', KEY_THEME='muzn-theme';
function fresh(){ const s=clone(SEED.state); s.updatedAt=0; return s; }
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); return Object.assign(fresh(), s); } }catch(e){} return fresh(); }
let S = load();
let STU = (()=>{ try{ return JSON.parse(localStorage.getItem(KEY_STU)||'null'); }catch(e){ return null; } })();
let remote = null, remoteTimer;
function save(msg){
  S.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(remote){ clearTimeout(remoteTimer); remoteTimer=setTimeout(pushRemote, 900); }
  if(msg) toast(msg);
}
function pushRemote(){ if(!remote) return; remote.set({json:JSON.stringify(S), updatedAt:S.updatedAt}).then(()=>{syncState='on'; },()=>{ syncState='err'; }); }
let syncState='local';
async function initRemote(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc('data/users/'+id+'/state');
    const snap = await ref.get();
    remote = ref; syncState='on';
    if(snap.exists){
      const d = snap.data()||{};
      if((d.updatedAt||0) > (S.updatedAt||0) && d.json){ try{ S = Object.assign(fresh(), JSON.parse(d.json)); localStorage.setItem(KEY, JSON.stringify(S)); render(); toast('تم تحميل بياناتك المحفوظة'); }catch(e){} }
      else if((S.updatedAt||0) > (d.updatedAt||0)) pushRemote();
    } else if(S.updatedAt) pushRemote();
    if(route==='backup') render();
  }catch(e){ syncState='local'; }
}

/* ============ theme ============ */
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
try{ applyTheme(localStorage.getItem(KEY_THEME)); }catch(e){}
$('#themeBtn').onclick=()=>{ const cur=document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const nx=cur==='dark'?'light':'dark'; applyTheme(nx); try{localStorage.setItem(KEY_THEME,nx);}catch(e){} };

/* ============ navigation ============ */
const ROUTES = [
 {id:'home', t:'الرئيسية', i:'home'},
 {cap:'المجال الأول'},
 {id:'teachers', t:'بيانات المعلمات', i:'users'},
 {id:'org', t:'جداول تنظيم المعلمات', i:'grid'},
 {id:'plan', t:'خطة المعلم الأول', i:'target'},
 {id:'follow', t:'خطة المتابعة للمعلمات', i:'clip'},
 {id:'pd', t:'سجل الإنماء المهني', i:'award'},
 {id:'prep', t:'متابعة التحضير على نور', i:'book'},
 {id:'ach', t:'سجل التحصيل الدراسي', i:'chart'},
 {id:'visits', t:'سجل تبادل الزيارات', i:'swap'},
 {id:'inits', t:'مبادرات المجال الأول', i:'spark'},
 {cap:'إضافاتي'},
 {id:'more', t:'أقسام أضفتُها', i:'folder'},
 {id:'backup', t:'الحفظ والتثبيت', i:'save'},
];
const BOTTOM = ['home','teachers','prep','follow','more'];
let route = 'home', sub = null;
function navHTML(){
  return '<nav class="nav">'+ROUTES.map(r=> r.cap? `<div class="cap">${r.cap}</div>` :
    `<a href="#${r.id}" ${r.id===route?'aria-current="page"':''}>${ic(r.i)}<span>${r.t}</span></a>`).join('') +
    (S.custom.length? '<div class="sep"></div>'+S.custom.map(c=>`<a href="#more" data-cs="${c.id}">${ic('folder')}<span>${esc(c.title)}</span></a>`).join(''):'') + '</nav>';
}
function paintNav(){
  $('#side').innerHTML = navHTML();
  $('#bottom').innerHTML = BOTTOM.map(id=>{ const r=ROUTES.find(x=>x.id===id); const label = id==='more'?'المزيد':(id==='follow'?'المتابعة':id==='prep'?'التحضير':id==='teachers'?'المعلمات':r.t); return `<a href="#${id==='more'?'menu':id}" ${id===route?'aria-current="page"':''}>${ic(id==='more'?'more':r.i)}<span>${label}</span></a>`; }).join('');
}
function openDrawer(){
  const d=$('#drawer'); d.hidden=false; d.className='drawer';
  d.innerHTML='<div class="scrim"></div><div class="panel">'+navHTML()+'</div>';
  d.querySelector('.scrim').onclick=closeDrawer;
  d.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeDrawer));
}
function closeDrawer(){ const d=$('#drawer'); d.hidden=true; d.innerHTML=''; }
$('#menuBtn').onclick=openDrawer;
document.addEventListener('click',e=>{ const a=e.target.closest('a[data-cs]'); if(a){ sub=a.dataset.cs; } });
function onHash(){
  let h=(location.hash||'#home').slice(1);
  if(h==='menu'){ openDrawer(); history.replaceState(null,'','#'+route); return; }
  if(!ROUTES.some(r=>r.id===h)) h='home';
  if(h!=='more' ) sub=null;
  route=h; render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',onHash);

/* ============ modal ============ */
const dlg = $('#dlg');
function modal({title, body, onSave, onDelete, saveText='حفظ', wide}){
  dlg.style.maxWidth = wide? 'min(860px,calc(100vw - 24px))' : '';
  dlg.innerHTML = `<form class="sheet" method="dialog"><header><h3>${esc(title)}</h3><button type="button" class="iconbtn" data-x aria-label="إغلاق">${ic('x')}</button></header>
   <div class="body">${body}</div>
   <footer><div class="row">${onDelete?`<button type="button" class="btn danger" data-del>حذف</button>`:''}</div>
   <div class="row"><button type="button" class="btn ghost" data-x>إلغاء</button>${onSave?`<button type="submit" class="btn primary">${saveText}</button>`:''}</div></footer></form>`;
  const f=dlg.querySelector('form');
  f.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>dlg.close());
  f.onsubmit=e=>{ e.preventDefault(); if(onSave){ if(onSave(f)===false) return; } dlg.close(); };
  const del=f.querySelector('[data-del]');
  if(del){ let armed=false; del.onclick=()=>{ if(!armed){ armed=true; del.textContent='اضغطي مرة أخرى لتأكيد الحذف'; return; } onDelete(); dlg.close(); }; }
  dlg.showModal();
  return f;
}
function fieldHTML(fd, v){
  const id='f_'+fd.k, val=v??'';
  let inp;
  if(fd.type==='textarea') inp=`<textarea class="input" id="${id}" name="${fd.k}">${esc(val)}</textarea>`;
  else if(fd.type==='select') inp=`<select class="input" id="${id}" name="${fd.k}">${fd.options.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else inp=`<input class="input" id="${id}" name="${fd.k}" type="${fd.type||'text'}" value="${esc(val)}" ${fd.type==='number'?'inputmode="numeric"':''} ${fd.list?`list="dl_${fd.k}"`:''}>${fd.list?`<datalist id="dl_${fd.k}">${fd.list.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`;
  return `<div class="field"><label for="${id}">${fd.label}</label>${inp}</div>`;
}
function formRecord(title, fields, rec, onSave, onDelete){
  modal({title, body:`<div class="grid s" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))">${fields.filter(f=>f.type!=='textarea').map(f=>fieldHTML(f,rec[f.k])).join('')}</div>${fields.filter(f=>f.type==='textarea').map(f=>fieldHTML(f,rec[f.k])).join('')}`,
    onSave:f=>{ const out={...rec}; fields.forEach(fd=>{ let v=f.elements[fd.k].value.trim(); if(fd.type==='number') v = v===''? '' : Number(v); out[fd.k]=v; }); if(fields[0].req!==false && !String(out[fields[0].k]).trim()){ toast('اكتبي '+fields[0].label+' أولًا'); return false; } onSave(out); },
    onDelete});
}

  `<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><b>الإنجاز الكلي</b><span class="num">${AR(d)} / ${AR(t)} فعالية</span></div><div class="bar gold" style="margin-top:8px;height:10px"><i style="width:${pct(d,t)}%"></i></div></div>`+
  domains.map(dm=>`<div class="section-title"><h2>${esc(dm)}</h2><span class="chip">${AR(S.plan.filter(g=>g.domain===dm).length)} هدف</span></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))">${S.plan.filter(g=>g.domain===dm).map(g=>{ const gd=g.acts.filter(a=>a.done).length; return `<div class="card goal">
     <div class="head"><h3>${esc(g.goal)}</h3><button class="btn sm ghost" data-act="editGoal" data-id="${g.id}" aria-label="تعديل">${ic('edit')}</button></div>
     <div class="row small"><span class="chip">${fmtDate(g.from,{day:'numeric',month:'short',year:'numeric'})} ← ${fmtDate(g.to,{day:'numeric',month:'short',year:'numeric'})}</span><span class="chip ${gd===g.acts.length&&gd?'ok':'warn'}">${gd===g.acts.length&&gd?'مكتمل':esc(g.status||'جارٍ التنفيذ')}</span></div>
     <div class="bar"><i style="width:${pct(gd,g.acts.length)}%"></i></div>
     <div class="acts">${g.acts.map((a,i)=>`<div class="act ${a.done?'done':''}"><input type="checkbox" class="check" id="a_${g.id}_${i}" ${a.done?'checked':''} data-chg="toggleAct" data-id="${g.id}" data-i="${i}"><label for="a_${g.id}_${i}">${esc(a.t)}</label></div>`).join('')}</div>
     ${g.notes?`<p class="small muted"><b>ملاحظات:</b> ${esc(g.notes)}</p>`:''}${g.supNotes?`<p class="small muted"><b>ملاحظات المشرف:</b> ${esc(g.supNotes)}</p>`:''}
     <div><button class="btn sm" data-act="addAct" data-id="${g.id}">${ic('plus')} فعالية</button></div></div>`; }).join('')}</div>`).join('');
};
const G_FIELDS=[{k:'domain',label:'المجال الإشرافي',list:['الإنجاز الدراسي','التدريس والتقويم','القيادة والإدارة والحوكمة','النمو الشخصي','مناخ المدرسة وبيئة التعلم']},{k:'from',label:'من',type:'date'},{k:'to',label:'إلى',type:'date'},{k:'status',label:'آلية التنفيذ',type:'select',options:['جارٍ التنفيذ','نُفّذ','لم يُنفّذ','مؤجل']},{k:'goal',label:'الهدف',type:'textarea'},{k:'acts',label:'الأساليب والأنشطة (كل فعالية في سطر)',type:'textarea'},{k:'notes',label:'ملاحظات',type:'textarea'},{k:'supNotes',label:'ملاحظات المشرف',type:'textarea'}];
function goalForm(g,isNew){
  const rec={...g, acts:g.acts.map(a=>a.t).join('\n')};
  const f=[...G_FIELDS]; f.unshift(f.splice(4,1)[0]); // goal first for validation
  formRecord(isNew?'هدف جديد':'تعديل الهدف', f, rec, o=>{
    const lines=String(o.acts).split('\n').map(s=>s.trim()).filter(Boolean);
    const old=g.acts; o.acts=lines.map(t=>({t, done:(old.find(a=>a.t===t)||{}).done||false}));
    if(isNew){ o.id=uid(); S.plan.push(o);} else Object.assign(g,o);
    save('تم حفظ الهدف'); render();
  }, isNew?null:()=>{ S.plan=S.plan.filter(x=>x!==g); save('حُذف الهدف'); render(); });
}
ACT.addGoal=()=>goalForm({domain:'الإنجاز الدراسي',goal:'',acts:[],from:todayISO(),to:'',status:'جارٍ التنفيذ'},true);
ACT.editGoal=d=>goalForm(S.plan.find(g=>g.id===d.id),false);
ACT.toggleAct=(d,el)=>{ const g=S.plan.find(x=>x.id===d.id); g.acts[d.i].done=el.checked; save(el.checked?'أُحسنتِ! سُجّل التنفيذ':''); render(); };
ACT.addAct=d=>{ const g=S.plan.find(x=>x.id===d.id); formRecord('فعالية جديدة',[{k:'t',label:'الفعالية'}],{},o=>{ g.acts.push({t:o.t,done:false}); save('أُضيفت الفعالية'); render(); }); };

/* ---------- FOLLOW ---------- */
const PERIODS=['سبتمبر / أكتوبر','نوفمبر / ديسمبر','فبراير / مارس','أبريل / مايو'];
const CRIT=[['prep','التحضير في المنصة'],['grades','تفعيل سجل الدرجات'],['correct','التصحيح والتغذية الراجعة'],['forms','تفعيل الاستمارات']];
const INITS_F=[['curious','كن فضوليًا'],['can','أنا أستطيع'],['dict','تحدي الإملاء'],['reader','قراء المزن']];
let fPeriod=0;
function fRec(tid){ const k=tid+'|'+fPeriod; return S.follow[k]||(S.follow[k]={c:{},i:{},note:''}); }
V.follow=()=>{
  const recs=S.teachers.map(t=>({t, r:S.follow[t.id+'|'+fPeriod]||{c:{},i:{},note:''}}));
  let done=0,tot=0; recs.forEach(({r})=>CRIT.forEach(([k])=>{ if(r.c[k]!=null){tot++; if(r.c[k]===1) done++;} }));
  const label=v=> v===1?'نفّذ':v===0?'لم ينفّذ':'—';
  return pageHead('القسم الرابع','خطة المتابعة للمعلمات','استمارة متابعة الأعمال لكل معلمة على أربع فترات. اضغطي على الخانة لتتبدل بين: نفّذ، لم ينفّذ، فارغة.')+
  `<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="seg">${PERIODS.map((p,i)=>`<button data-act="fPeriod" data-i="${i}" aria-pressed="${i===fPeriod}">${p}</button>`).join('')}</div><span class="chip ${tot&&done===tot?'ok':'sea'}">${AR(done)} منفّذ من ${AR(tot)} مُتابَع</span></div>
  <div class="tablewrap prep"><table><thead><tr><th class="t">المعلمة</th>${CRIT.map(c=>`<th class="c">${c[1]}</th>`).join('')}<th class="c" style="border-inline-start:2px solid var(--line)">تفعيل المبادرات</th><th>ملاحظات ومتابعة</th></tr></thead><tbody>
  ${recs.map(({t,r})=>`<tr><td class="t"><b>${esc(t.short)}</b></td>${CRIT.map(([k])=>`<td class="c"><button class="tri" data-act="tri" data-id="${t.id}" data-k="${k}" data-v="${r.c[k]??''}">${label(r.c[k])}</button></td>`).join('')}
   <td class="c" style="border-inline-start:2px solid var(--line);white-space:nowrap">${INITS_F.map(([k,n])=>`<button class="cell" title="${n}" aria-label="${n}" aria-pressed="${!!r.i[k]}" data-act="fInit" data-id="${t.id}" data-k="${k}" style="margin:1px">${r.i[k]?ic('tick'):`<span class="small faint">${n.split(' ').pop()[0]}</span>`}</button>`).join('')}</td>
   <td style="min-width:200px"><button class="btn sm ghost" data-act="fNote" data-id="${t.id}">${r.note?esc(r.note.slice(0,60))+(r.note.length>60?'…':''):'<span class="faint">أضيفي ملاحظة</span>'}</button></td></tr>`).join('')}
  </tbody></table></div>
  <p class="small faint" style="margin-top:8px">المبادرات بالترتيب: ${INITS_F.map(x=>x[1]).join(' · ')}</p>
  <div class="section-title"><h2>ملاحظات وتوصيات الفترة</h2></div>
  <div class="card"><textarea class="input" id="frec" data-inp="fRecNote" placeholder="اكتبي ملاحظاتك وتوصياتك لفترة ${PERIODS[fPeriod]}">${esc(S.followNotes[fPeriod]||'')}</textarea><p class="small faint" style="margin-top:6px">تُحفظ تلقائيًا.</p></div>`;
};
ACT.fPeriod=d=>{ fPeriod=+d.i; render(); };
ACT.tri=d=>{ const r=fRec(d.id); const v=r.c[d.k]; r.c[d.k]= v==null?1: v===1?0: null; if(r.c[d.k]==null) delete r.c[d.k]; save(); render(); };
ACT.fInit=d=>{ const r=fRec(d.id); r.i[d.k]=!r.i[d.k]; save(); render(); };
ACT.fNote=d=>{ const t=S.teachers.find(x=>x.id===d.id); const r=fRec(d.id); formRecord('ملاحظة — '+t.short+' ('+PERIODS[fPeriod]+')',[{k:'note',label:'ملاحظات ومتابعة',type:'textarea',req:false}],{note:r.note},o=>{ r.note=o.note; save('تم الحفظ'); render(); }); };
let fnT; ACT.fRecNote=(d,el)=>{ S.followNotes[fPeriod]=el.value; clearTimeout(fnT); fnT=setTimeout(()=>save(),500); };

/* ---------- PD ---------- */

  `<p class="motto" style="margin:-6px 0 14px;font-size:16px">تعلّم · تطوير · مستقبل أفضل</p>
  <div class="grid">${S.pd.map(p=>{ const c=Object.values(p.att||{}).filter(Boolean).length; return `<div class="card stack" style="gap:10px">
   <div class="row" style="justify-content:space-between"><span class="chip gold">${esc(p.type)}</span><button class="btn sm ghost" data-act="editPD" data-id="${p.id}" aria-label="تعديل">${ic('edit')}</button></div>
   <h3 style="font-size:18px">${esc(p.title)}</h3>
   <p class="small muted">تقديم: أ. ${esc(p.presenter||'—')} · ${p.date?fmtDate(p.date):'التاريخ لم يُحدد'}${p.place?' · '+esc(p.place):''}</p>

ACT.addPD=()=>formRecord('برنامج إنماء مهني',PD_FIELDS(),{type:'ورشة تدريبية'},o=>{ o.id=uid(); o.att={}; S.pd.push(o); save('أُضيف البرنامج'); render(); });

   onSave:f=>{ S.teachers.forEach(t=>{ p.att[t.id]=f.elements['t_'+t.id].checked; }); save('تم حفظ الحضور'); render(); }});

};

/* ---------- PREP ---------- */
let pSubj='أحب لغتي', pGrade=1;
function sheetTopics(sh){ const out=[]; sh.weeks.forEach((w,wi)=>w.topics.forEach((t,ti)=>out.push({key:sh.id+'|'+wi+'|'+ti,t,w,wi}))); (S.prepExtra[sh.id]||[]).forEach((x,xi)=>out.push({key:sh.id+'|x'+xi,t:x.t,w:{period:x.period,week:x.week,unit:x.unit},extra:xi})); return out; }
V.prep=()=>{
  const sh=SEED.prep.find(s=>s.subject===pSubj&&s.grade===pGrade);
  let body='';
  if(!sh) body=`<div class="empty">لا توجد خطة لهذا الصف في الملفات بعد.</div>`;
  else{
    const tops=sheetTopics(sh);
    const per=sh.teachers.map(tn=>tops.filter(tp=>S.prepChecks[tp.key+'|'+tn]).length);
    let lastW=null;
    body=`<div class="grid" style="margin-bottom:14px;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))">${sh.teachers.map((tn,i)=>`<div class="card stat" style="padding:10px 12px;gap:4px"><span class="k">${esc(tn)}</span><span class="v num" style="font-size:20px">${pct(per[i],tops.length)}%</span><div class="bar"><i style="width:${pct(per[i],tops.length)}%"></i></div><span class="s">${AR(per[i])} من ${AR(tops.length)} درسًا</span></div>`).join('')}</div>
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><p class="small muted">${esc(sh.title)}</p><button class="btn sm" data-act="addTopic" data-id="${sh.id}">${ic('plus')} إضافة درس</button></div>
    <div class="tablewrap prep"><table><thead><tr><th class="t">الموضوع (اسم الدرس)</th>${sh.teachers.map(tn=>`<th class="c">${esc(tn)}</th>`).join('')}</tr></thead><tbody>
    ${tops.map(tp=>{ const wk=tp.w.period+'|'+tp.w.week+'|'+tp.w.unit; let head=''; if(wk!==lastW){ lastW=wk; head=`<tr><td class="wk t">${esc(tp.w.week||'')} · ${esc(tp.w.period||'')}${tp.w.unit?` · <span style="color:var(--gold)">${esc(tp.w.unit)}</span>`:''}</td>${sh.teachers.map(()=>'<td class="wk"></td>').join('')}</tr>`; }
      return head+`<tr><td class="t">${esc(tp.t)}${tp.extra!=null?` <button class="btn sm ghost" data-act="delTopic" data-id="${sh.id}" data-x="${tp.extra}" aria-label="حذف">${ic('x','style="width:14px;height:14px"')}</button>`:''}</td>${sh.teachers.map(tn=>{ const on=!!S.prepChecks[tp.key+'|'+tn]; return `<td class="c"><button class="cell" aria-label="${esc(tn)}: ${esc(tp.t)}" aria-pressed="${on}" data-act="pc" data-k="${esc(tp.key+'|'+tn)}">${on?ic('tick'):''}</button></td>`; }).join('')}</tr>`; }).join('')}
    </tbody></table></div><p class="small faint" style="margin-top:8px">${esc(sh.motto||'')}</p>`;
  }
  return pageHead('القسم السادس','سجل متابعة التحضير على منصة نور','الخطة الفصلية للفصل الدراسي الأول. علّمي الدرس عند تأكدك من تحضير المعلمة له على المنصة.')+
  `<div class="row" style="margin-bottom:14px"><div class="seg">${SUBJ.map(s=>`<button data-act="pSubj" data-s="${s}" aria-pressed="${s===pSubj}">${s}</button>`).join('')}</div>
   <div class="seg">${[1,2,3,4].map(g=>`<button data-act="pGrade" data-g="${g}" aria-pressed="${g===pGrade}">الصف ${['','الأول','الثاني','الثالث','الرابع'][g]}</button>`).join('')}</div></div>`+body;
};
ACT.pSubj=d=>{ pSubj=d.s; render(); };
ACT.pGrade=d=>{ pGrade=+d.g; render(); };
ACT.pc=(d,el)=>{ const k=d.k; if(S.prepChecks[k]) delete S.prepChecks[k]; else S.prepChecks[k]=1; save(); const on=!!S.prepChecks[k]; el.setAttribute('aria-pressed',on); el.innerHTML=on?ic('tick'):''; const y=scrollY; render(); scrollTo(0,y); };
ACT.addTopic=d=>{ const sh=SEED.prep.find(s=>s.id===d.id); const last=sh.weeks[sh.weeks.length-1]||{};
  formRecord('إضافة درس',[{k:'t',label:'اسم الدرس'},{k:'week',label:'الأسبوع'},{k:'period',label:'الفترة الزمنية'},{k:'unit',label:'الوحدة / المحور'}],{unit:last.unit},o=>{ (S.prepExtra[sh.id]=S.prepExtra[sh.id]||[]).push(o); save('أُضيف الدرس'); render(); }); };
ACT.delTopic=d=>{ const arr=S.prepExtra[d.id]; arr.splice(+d.x,1); Object.keys(S.prepChecks).forEach(k=>{ if(k.startsWith(d.id+'|x')) delete S.prepChecks[k]; }); save('حُذف الدرس'); render(); };

/* ---------- ACHIEVEMENT ---------- */
let aGrade=0;
V.ach=()=>{
  const D=SEED.diag; const rows=D.filter(r=>!aGrade||r.g===aGrade);
  const tot=rows.reduce((a,r)=>a+r.n,0), pass=rows.reduce((a,r)=>a+r.n*r.pass/100,0);
  const lv=[0,0,0,0,0]; rows.forEach(r=>r.lv.forEach((x,i)=>lv[i]+=x));
  const LV=['أ','ب','ج','د','هـ'];
  const skills={}; rows.forEach(r=>(r.skills||[]).forEach(s=>{ (skills[s.skill]=skills[s.skill]||[]).push({cls:r.g+'/'+r.s,m:s.mastery}); }));
  const ex=S.excel.filter(e=>!aGrade||e.cls.startsWith(aGrade+'/'));
  return pageHead('القسم السابع','سجل التحصيل الدراسي','نتائج الاختبارات التشخيصية في اللغة العربية (الصفوف ٢-٤)، وحصر المجيدين ومن هم دون المستوى، والخطة الإجرائية والمبادرات.')+
  `<div class="seg" style="margin-bottom:14px">${[0,2,3,4].map(g=>`<button data-act="aGrade" data-g="${g}" aria-pressed="${g===aGrade}">${g?'الصف '+['','','الثاني','الثالث','الرابع'][g]:'كل الصفوف'}</button>`).join('')}</div>
  <div class="grid s">
    <div class="card stat"><span class="k">طلبة اكتمل تقييمهم</span><span class="v num">${AR(tot)}</span><span class="s">في ${AR(rows.length)} شعبة</span></div>
    <div class="card stat"><span class="k">نسبة النجاح (حد ٥٠%)</span><span class="v num">${tot?Math.round(pass*100/tot):0}%</span><div class="bar"><i style="width:${tot?Math.round(pass*100/tot):0}%"></i></div></div>
    <div class="card stat"><span class="k">مستوى (أ) و(ب)</span><span class="v num">${pct(lv[0]+lv[1],tot)}%</span><span class="s">${AR(lv[0]+lv[1])} طالبًا وطالبة</span></div>
    <div class="card stat"><span class="k">مستوى (د) و(هـ)</span><span class="v num" style="color:var(--rose)">${pct(lv[3]+lv[4],tot)}%</span><span class="s">${AR(lv[3]+lv[4])} يحتاجون خطة علاجية</span></div>
  </div>

  <div class="grid" style="margin-top:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))">
   <div class="card"><h3 style="font-size:17px;margin-bottom:4px">نسبة النجاح حسب الشعبة</h3><p class="small faint" style="margin-bottom:12px">الخط الرأسي = حد النجاح ٥٠%</p>
    <div class="hbars">${rows.map(r=>`<div class="hb"><span>${r.g} / ${r.s}</span><div class="track"><i style="width:${r.pass}%;background:${r.pass<50?'var(--rose)':r.pass<70?'var(--gold)':'var(--sage)'}"></i><span class="mark" style="right:50%"></span></div><b class="num">${Math.round(r.pass)}%</b></div>`).join('')}</div></div>
   <div class="card"><h3 style="font-size:17px;margin-bottom:4px">توزيع المستويات</h3><p class="small faint" style="margin-bottom:12px">أ: 17–20 · ب: 13–16 · ج: 9–12 · د: 5–8 · هـ: 0–4 (من 20)</p>
    <div class="hbars">${rows.map(r=>`<div class="hb" style="grid-template-columns:54px 1fr"><span>${r.g} / ${r.s}</span><div class="stacked">${r.lv.map((x,i)=>`<i class="lv-${'abcde'[i]}" style="width:${pct(x,r.n)}%" title="${LV[i]}: ${x}"></i>`).join('')}</div></div>`).join('')}</div>
    <div class="legend" style="margin-top:12px">${LV.map((l,i)=>`<span><i class="lv-${'abcde'[i]}"></i>${l} (${AR(lv[i])})</span>`).join('')}</div></div>
  </div>

  <div class="section-title"><h2>إتقان المهارات</h2></div>
  <div class="tablewrap"><table><thead><tr><th>الشعبة</th>${Object.keys(skills).map(k=>`<th>${esc(k)}</th>`).join('')}<th>متوسط الدرجة /20</th></tr></thead><tbody>

function loadScript(src){ return new Promise((res,rej)=>{ if(window.XLSX) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
$('#fileXlsx').onchange=async e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file) return;
  toast('جارٍ قراءة الملف…');
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const classes={};
    wb.SheetNames.filter(n=>/^\d-\d$/.test(n.trim())).forEach(n=>{
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});
      const hi=rows.findIndex(r=>r.some(c=>String(c).includes('اسم التلميذ'))); if(hi<0) return;
      const h=rows[hi].map(c=>String(c));
      const ci=k=>h.findIndex(c=>c.includes(k));
      const iN=ci('اسم'), iT=ci('الإجمالي'), iL=ci('المستوى'), iS=ci('الحالة');
      const list=[];
      for(let r=hi+1;r<rows.length;r++){ const row=rows[r]; const name=String(row[iN]||'').trim(); if(!name){ if(list.length) break; else continue; } if(name==='المهارة') break; list.push({name, total:row[iT]===''?null:row[iT], level:row[iL]||'', status:row[iS]||''}); }
      if(list.length) classes[n.trim()]=list;
    });
    if(!Object.keys(classes).length){ toast('لم أجد صفحات شعب بأسماء مثل 2-1 في هذا الملف'); return; }
    STU={file:file.name, at:Date.now(), classes}; try{ localStorage.setItem(KEY_STU,JSON.stringify(STU)); }catch(err){}
    toast('تمت قراءة '+Object.keys(classes).length+' شعبة'); render();
  }catch(err){ toast('تعذّرت قراءة الملف. تأكدي أنه ملف Excel بصيغة xlsx'); }
};

   <div class="row"><button class="btn primary" data-act="exportJson">${ic('save')} حفظ نسخة احتياطية</button><button class="btn" data-act="importJson">${ic('upload')} استرجاع نسخة</button></div></div>
  <div class="card stack"><h3 style="font-size:18px">التثبيت على الهاتف</h3>
   <p><b>أندرويد (Chrome):</b> افتحي القائمة ⋮ ثم «إضافة إلى الشاشة الرئيسية» أو «تثبيت التطبيق».</p>
   <p><b>آيفون وآيباد (Safari):</b> اضغطي زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</p>
   <p class="small faint">تعمل المنصة بعد التثبيت دون إنترنت، وتتكيف مع شاشة الهاتف واللوحي والحاسوب.</p></div>
  <div class="card stack"><h3 style="font-size:18px">البدء من جديد</h3>
   <p class="muted">إعادة البيانات إلى ما كانت عليه في ملفات المجال، مع حذف كل الإضافات والعلامات.</p>
   <div><button class="btn danger" data-act="resetAll">إعادة الضبط</button></div></div>
 </div>`;
ACT.exportJson=async()=>{
  const name='نسخة-منصة-المجال-الأول-'+todayISO()+'.json'; const data=JSON.stringify({app:'muzn-field1',v:1,state:S},null,1);
  try{ if(window.claude&&window.claude.use){ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename:name,data}); toast('تم حفظ النسخة'); return; } } }catch(e){ if(e&&e.code==='declined') return; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('تم حفظ النسخة'); }catch(e){ toast('تعذّر الحفظ في هذا العرض'); }
};
ACT.importJson=()=>$('#fileJson').click();
$('#fileJson').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; try{ const o=JSON.parse(await f.text()); if(!o||o.app!=='muzn-field1'||!o.state) throw 0; S=Object.assign(fresh(),o.state); save('تم استرجاع النسخة'); render(); }catch(err){ toast('هذا الملف ليس نسخة احتياطية من المنصة'); } };
ACT.resetAll=(d,el)=>{ if(el.dataset.armed){ S=fresh(); save('أُعيدت البيانات الأصلية'); render(); } else { el.dataset.armed=1; el.textContent='اضغطي مرة أخرى للتأكيد'; } };

/* ============ boot ============ */
onHash();
setTimeout(initRemote,0);
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
