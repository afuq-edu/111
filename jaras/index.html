<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-accent="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>جَرَس المعلم</title>
<meta name="description" content="جدول المعلم الذكي — تتبع الحصص وتنبيهات قبل البداية والنهاية">
<meta name="theme-color" content="#0B1113">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="جَرَس">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ac:#E3A64A;--ac2:#F6CD7E;--ac-ink:#2B1D06;
  --bg:#F3EEE5;--surface:rgba(255,255,255,.62);--surface-2:rgba(255,255,255,.9);--solid:#FFFCF7;
  --line:rgba(52,38,20,.09);--line-2:rgba(52,38,20,.17);
  --text:#1E1912;--muted:#6E6457;--faint:#A69B8C;
  --shadow:0 1px 0 rgba(255,255,255,.85) inset,0 14px 34px -16px rgba(80,50,10,.28);
  --trk:rgba(52,38,20,.08);--warn:#E2584D;--warn2:#FF9C8A;--ok:#2EAE76;
  --blob-op:.5;--blob2:#E6C79B;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1113;--surface:rgba(25,36,39,.6);--surface-2:rgba(30,43,47,.88);--solid:#131C1F;
    --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);
    --text:#ECF1EF;--muted:#91A29E;--faint:#566661;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -18px rgba(0,0,0,.75);
    --trk:rgba(255,255,255,.07);--blob-op:.32;--blob2:#1C6A64;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1113;--surface:rgba(25,36,39,.6);--surface-2:rgba(30,43,47,.88);--solid:#131C1F;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);
  --text:#ECF1EF;--muted:#91A29E;--faint:#566661;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -18px rgba(0,0,0,.75);
  --trk:rgba(255,255,255,.07);--blob-op:.32;--blob2:#1C6A64;color-scheme:dark;
}
:root[data-accent="teal"]{--ac:#36B5A5;--ac2:#7FE3CF;--ac-ink:#03231E}
:root[data-accent="violet"]{--ac:#8B7CF6;--ac2:#BBB0FF;--ac-ink:#160F3A}
:root[data-accent="coral"]{--ac:#EE7465;--ac2:#FFAE92;--ac-ink:#3A0D08}
:root[data-accent="blue"]{--ac:#4C9AFF;--ac2:#93C8FF;--ac-ink:#061A36}
:root[data-accent="emerald"]{--ac:#2FBF78;--ac2:#8BE6AC;--ac-ink:#052614}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;line-height:1.5;transition:background-color .4s,color .4s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,.disp{font-family:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;font-weight:700}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;direction:ltr;unicode-bidi:isolate}
svg.i{width:var(--s,22px);height:var(--s,22px);flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}

/* ambient */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;opacity:var(--blob-op);will-change:transform;animation:drift 24s ease-in-out infinite alternate}
.ambient i:nth-child(1){width:95vmax;height:95vmax;top:-52vmax;right:-38vmax;background:radial-gradient(closest-side,var(--ac),transparent)}
.ambient i:nth-child(2){width:85vmax;height:85vmax;bottom:-50vmax;left:-40vmax;background:radial-gradient(closest-side,var(--blob2),transparent);animation-duration:30s;animation-delay:-9s}
.ambient i:nth-child(3){width:45vmax;height:45vmax;top:40%;left:15%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 60%,transparent),transparent);opacity:calc(var(--blob-op)*.45);animation-duration:36s}
@keyframes drift{to{transform:translate3d(-7vmax,6vmax,0) scale(1.12)}}

/* layout */
#app{position:relative;z-index:1}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 108px)}
.view{display:none}
.view.on{display:block;animation:viewIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.who{min-width:0}
.greet{display:flex;align-items:center;gap:6px;color:var(--ac);font:600 13px 'Readex Pro',sans-serif}
.greet svg{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.who h1{font-size:clamp(20px,5.6vw,26px);line-height:1.35;margin-top:2px;overflow-wrap:anywhere}
.who .subj{color:var(--muted);font-size:14px}
.clockbox{text-align:left;flex:none}
.clock{font:600 30px/1 'IBM Plex Sans Arabic',sans-serif;background:linear-gradient(180deg,var(--ac2),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
.clock small{font-size:17px;opacity:.75}
.date{color:var(--muted);font-size:12.5px;margin-top:6px;white-space:nowrap}
.date.h{margin-top:0;color:var(--faint)}

/* install banner */
.ibar{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--ac) 12%,var(--surface));border:1px dashed color-mix(in srgb,var(--ac) 45%,transparent)}
.ibar p{flex:1;font-size:13px;color:var(--muted)}
.ibar p b{display:block;color:var(--text);font-size:14px}

/* hero */
.hero{position:relative;margin-top:18px;border-radius:30px;padding:20px 20px 18px;background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 13%,var(--surface)) 0%,var(--surface) 60%);border:1px solid color-mix(in srgb,var(--ac) 38%,transparent);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;width:260px;height:260px;left:-80px;top:-110px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 30%,transparent),transparent);z-index:-1}
.hero.warn{--ac:var(--warn);--ac2:var(--warn2);animation:warnPulse 2.2s ease-in-out infinite}
.hero.soon{animation:soonPulse 2.6s ease-in-out infinite}
@keyframes warnPulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 22%,transparent),var(--shadow)}}
@keyframes soonPulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent),var(--shadow)}}
.h-tag{display:inline-flex;align-items:center;gap:8px;font:600 14px 'Readex Pro',sans-serif;color:var(--ac)}
.h-tag .dot{width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}
.h-tag.live .dot{animation:live 1.6s ease-in-out infinite}
@keyframes live{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--ac) 0%,transparent);transform:scale(.85)}}
.h-tag small{color:var(--muted);font-weight:500}
.h-grid{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:10px}
.h-title{font:700 clamp(20px,5.6vw,28px)/1.3 'Readex Pro',sans-serif;color:var(--cc,var(--ac));overflow-wrap:anywhere}
.h-sub{color:var(--muted);font-size:14.5px;margin-top:4px}
.h-chip{display:inline-block;margin-top:12px;padding:7px 16px;border-radius:99px;background:linear-gradient(180deg,var(--ac2),var(--ac));color:var(--ac-ink);font:700 15px 'IBM Plex Sans Arabic',sans-serif;box-shadow:0 10px 22px -12px var(--ac)}
.h-ring{position:relative;width:150px;height:150px}
.h-ring svg{width:100%;height:100%}
.h-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.h-center b{font:700 25px/1.1 'IBM Plex Sans Arabic',sans-serif}
.h-center small{color:var(--muted);font-size:12.5px;margin-top:4px}
.h-foot{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:16px}
.h-foot>div{padding:10px 14px;border-radius:16px;background:color-mix(in srgb,var(--text) 4%,transparent);border:1px solid var(--line);min-width:0}
.h-foot small{display:block;color:var(--muted);font-size:11.5px}
.h-foot b{display:block;font:600 14px 'Readex Pro',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-note{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--ac) 10%,transparent);font-size:13.5px}
.h-note svg{color:var(--ac);margin-top:2px}
.h-calm{display:flex;align-items:center;gap:16px;margin-top:12px}
.h-calm .big{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;flex:none;background:linear-gradient(160deg,var(--ac2),var(--ac));color:var(--ac-ink);box-shadow:0 14px 30px -14px var(--ac);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
.h-calm h3{font-size:20px;line-height:1.4}
.h-calm p{color:var(--muted);font-size:14px;margin-top:2px}
.h-cta{margin-top:16px}

/* ring */
.ring .trk{fill:none;stroke:var(--trk);stroke-width:9}
.ring .prg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .9s linear}
.ring .glow{opacity:.55}
.ring .tip{fill:var(--solid);stroke:var(--ac);stroke-width:3}
.ring .tk{stroke:var(--line-2);stroke-width:1.2;stroke-linecap:round}
.ring .tk.m{stroke-width:2}

/* timeline */
.tl-wrap{margin-top:16px;padding:14px 16px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.tl-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
.tl-head b{color:var(--text);font-weight:600}
.tl{position:relative;height:12px;border-radius:99px;background:var(--trk)}
.tl .seg{position:absolute;top:0;bottom:0;border-radius:99px;background:color-mix(in srgb,var(--faint) 30%,transparent)}
.tl .seg.f{background:var(--cc)}
.tl .seg.past{opacity:.35}
.tl-now{position:absolute;top:-5px;bottom:-5px;width:4px;margin-inline-start:-2px;border-radius:4px;background:var(--text);box-shadow:0 0 0 3px var(--bg)}
.tl-lbl{display:flex;flex-direction:row-reverse;justify-content:space-between;color:var(--faint);font-size:11.5px;margin-top:8px}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);transition:transform .2s,background .2s}
.qa svg{color:var(--ac)}
.qa:active{transform:scale(.95)}
.qa.on{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn)}
.qa.on svg{color:var(--warn)}

/* days */
.days{display:flex;gap:8px;margin-top:22px}
.day{flex:1;min-width:0;padding:10px 4px 9px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .25s;position:relative}
.day b{font:600 14.5px 'Readex Pro',sans-serif}
.day .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:5px;max-width:44px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--faint)}
.day.today::after{content:"";position:absolute;top:6px;left:8px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.day.on{background:linear-gradient(180deg,var(--ac2),var(--ac));color:var(--ac-ink);border-color:transparent;box-shadow:0 12px 26px -14px var(--ac);transform:translateY(-2px)}
.day.on .dots i{background:var(--ac-ink);opacity:.55}
.day.on.today::after{background:var(--ac-ink)}

/* slot list */
.list-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 2px;color:var(--muted);font-size:13px}
.list-h b{color:var(--text);font:600 15px 'Readex Pro',sans-serif}
.slot{position:relative;width:100%;display:grid;grid-template-columns:56px 3px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);margin-top:10px;text-align:right;overflow:hidden;transition:transform .2s,opacity .3s}
.anim .slot{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.slot:active{transform:scale(.98)}
.s-tm{display:flex;flex-direction:column;align-items:center;font-size:15px;line-height:1.5}
.s-tm b{font-weight:600}
.s-tm span{color:var(--muted)}
.s-bar{align-self:stretch;border-radius:4px;background:var(--cc)}
.s-info{min-width:0}
.s-ttl{display:block;font:600 16.5px 'Readex Pro',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-sub{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.s-note{display:flex;align-items:center;gap:5px;margin-top:6px;color:var(--ac);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-st{font-size:12px;font-weight:600}
.s-st .b{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px}
.s-st .live{background:color-mix(in srgb,var(--cc) 20%,transparent);color:var(--cc)}
.s-st .live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:live 1.6s infinite}
.s-st .nx{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.s-st .ok{width:26px;height:26px;padding:0;justify-content:center;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.slot.past{opacity:.5}
.slot.free{background:transparent;border-style:dashed}
.slot.free .s-ttl{color:var(--faint);font-weight:500}
.slot.free .s-bar{background:var(--line-2)}
.slot.now{border-color:color-mix(in srgb,var(--cc) 55%,transparent);background:linear-gradient(150deg,color-mix(in srgb,var(--cc) 14%,var(--surface)),var(--surface));box-shadow:0 14px 30px -18px var(--cc)}
.slot.next{border-color:color-mix(in srgb,var(--ac) 40%,transparent)}
.s-pb{position:absolute;bottom:0;inset-inline-start:0;height:3px;background:var(--cc);border-radius:0 3px 3px 0;transition:width 1s linear}
.brk{display:flex;align-items:center;gap:10px;margin:12px 6px 2px;color:var(--faint);font-size:12.5px}
.brk::before,.brk::after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 11px)}
.empty{text-align:center;padding:36px 20px;color:var(--muted);border-radius:24px;border:1px dashed var(--line-2);margin-top:14px}
.empty svg{color:var(--ac);margin-bottom:10px}
.empty b{display:block;color:var(--text);font:600 17px 'Readex Pro',sans-serif;margin-bottom:4px}
.empty p{font-size:14px;margin-bottom:16px}

/* tabbar */
.tabbar{position:fixed;z-index:30;bottom:calc(env(safe-area-inset-bottom) + 12px);left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 28px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:26px;background:var(--surface-2);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);box-shadow:0 18px 40px -18px rgba(0,0,0,.5)}
.tab{height:56px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);transition:all .25s}
.tab.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 15%,transparent)}
.tab.on svg{transform:translateY(-1px) scale(1.08)}
.tab svg{transition:transform .25s}

/* generic */
.btn{height:50px;border-radius:16px;padding:0 20px;font:600 15px 'Readex Pro',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--ac2),var(--ac));color:var(--ac-ink);box-shadow:0 12px 26px -12px var(--ac)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line-2)}
.btn.danger{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.btn.sm{height:40px;padding:0 14px;font-size:14px;border-radius:13px}
.btn.block{width:100%}
.btn.grow{flex:1}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.icon-btn.sm{width:36px;height:36px;border-radius:11px}
.link{color:var(--ac);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:10px}
.vh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vh h2{font-size:24px}
.vh p{color:var(--muted);font-size:13.5px}
.vh-act{display:flex;gap:8px}
.hint{margin-top:10px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sec-t{display:flex;justify-content:space-between;align-items:center;font:700 13px 'Readex Pro',sans-serif;color:var(--muted);margin:24px 6px 8px}
.sec-t button{color:var(--ac);font-size:13px;font-weight:600}
.inp{width:100%;height:50px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 14px;font-size:16px;outline:none;transition:border .2s,box-shadow .2s}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.inp.sm{height:44px;padding:0 8px;font-size:15px;text-align:center}
.ta{height:84px;padding:12px 14px;resize:none;line-height:1.6}
input[type=time]{direction:ltr}
.fld{display:block;margin-top:14px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:7px 13px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:500}
.chip.on{background:color-mix(in srgb,var(--ac) 18%,transparent);border-color:var(--ac);color:var(--ac)}
.muted{color:var(--muted);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}

/* switch / seg / pills */
.sw{width:50px;height:30px;border-radius:99px;background:var(--trk);position:relative;flex:none;transition:background .25s;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--ac)}
.sw.on::after{transform:translateX(-20px)}
.seg{display:flex;background:var(--trk);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--solid);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{min-width:52px;height:34px;padding:0 10px;border-radius:11px;background:var(--trk);font-size:13px;font-weight:600;color:var(--muted)}

/* settings */
.group{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}

.row:first-child{border-top:0}
.row[role=button]{cursor:pointer}

.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:600;font-size:15px}
.rt small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.sub-row{padding:0 16px 14px 16px;padding-inline-start:64px}
.sub-row.dis{opacity:.4;pointer-events:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;background:var(--c);position:relative;transition:transform .2s}
.swatch.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c);transform:scale(1.05)}
.status{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.status.good{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.status.bad{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
input[type=range]{width:100%;accent-color:var(--ac)}

.ver{text-align:center;color:var(--faint);font-size:12px;margin-top:22px}

/* week grid */
.gridbox{margin-top:16px;padding:12px;border-radius:24px;background:var(--surface);border:1px solid var(--line);overflow-x:auto}
.editing-pad{height:84px}
.gridbox.editing{border-color:color-mix(in srgb,var(--ac) 50%,transparent);touch-action:none}
.grid{display:grid;grid-template-columns:42px repeat(var(--days),minmax(52px,1fr));gap:6px}
.gh{text-align:center;font:600 12.5px 'Readex Pro',sans-serif;color:var(--muted);padding:2px 0 4px}
.gh.today{color:var(--ac)}
.gp{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--faint);line-height:1.3}
.gp b{font-size:14px;color:var(--muted)}
.gc{min-height:54px;border-radius:13px;border:1.5px dashed var(--line-2);display:flex;align-items:center;justify-content:center;text-align:center;font:600 11px/1.3 'Readex Pro',sans-serif;padding:4px 3px;color:var(--faint);overflow-wrap:anywhere;transition:background .2s}
.gc.f{border:0;border-inline-start:3px solid var(--cc);background:color-mix(in srgb,var(--cc) 22%,var(--surface-2));color:var(--text)}
.gc.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.12)}}
.editing .gc:not(.f)::after{content:"+";font-size:16px;opacity:.5}
.palette{position:fixed;z-index:31;bottom:calc(env(safe-area-inset-bottom) + 90px);left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 28px));display:flex;gap:8px;overflow-x:auto;padding:10px;border-radius:22px;background:var(--surface-2);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--line-2);box-shadow:0 18px 40px -18px rgba(0,0,0,.5);animation:rise .35s both;scrollbar-width:none}
.palette.inline{position:static;transform:none;width:auto;margin-top:12px;box-shadow:none;animation:none}
.brush{flex:none;height:42px;padding:0 14px;border-radius:13px;border:2px solid transparent;background:color-mix(in srgb,var(--cc) 20%,transparent);font:600 13px 'Readex Pro',sans-serif;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.brush i{width:10px;height:10px;border-radius:50%;background:var(--cc)}
.brush.on{border-color:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 25%,transparent)}
.brush.er{--cc:var(--muted)}
.clist{display:flex;flex-wrap:wrap;gap:8px}
.ccard{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}

.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pl{padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px}

/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.kpi{padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.kpi svg{color:var(--ac)}
.kpi b{display:block;font:700 28px/1.2 'Readex Pro',sans-serif;margin-top:8px}
.kpi small{color:var(--muted);font-size:13px}
.card{padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);margin-top:10px}
.card h3{font-size:15px;margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}
.bar-c{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;font-size:12px;color:var(--muted)}
.bar-c b{color:var(--text);font-size:13px}
.bar-v{width:100%;max-width:42px;border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,var(--ac2),var(--ac));transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms);min-height:4px}

.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;background:var(--solid);border-radius:30px 30px 0 0;padding:8px 20px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(105%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.25,1.04),visibility 0s .42s;box-shadow:0 -20px 50px -20px rgba(0,0,0,.4)}

.pe{display:grid;grid-template-columns:62px 1fr 12px 1fr 36px;gap:8px;align-items:center;margin-top:8px}

.stp button{width:38px;height:38px;border-radius:11px;background:var(--trk);font-size:20px;font-weight:600;color:var(--ac);display:grid;place-items:center}
.stp b{font-size:17px;font-weight:600}
.stp b small{font-size:12px;color:var(--muted);font-weight:500;margin-inline-start:3px}
.stp.mini{height:40px;display:inline-flex;gap:4px;padding:0 3px}
.stp.mini button{width:30px;height:30px;font-size:17px}
.stp.mini b{min-width:34px;text-align:center;font-size:15px}
.brk-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;padding:8px 10px;border-radius:14px;background:var(--trk)}

.gprev{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.gprev span{padding:6px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px}
.gprev span b{color:var(--ac);margin-inline-end:4px}
.gprev .bk{background:transparent;border-style:dashed;color:var(--muted)}

/* gates */
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.gate-in{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 34px) 22px calc(env(safe-area-inset-bottom) + 30px);text-align:center;animation:viewIn .6s both}
.logo-big{position:relative;width:104px;height:104px;margin:0 auto 22px}
.logo-big svg{width:100%;height:100%;position:relative;z-index:1;animation:floaty 5s ease-in-out infinite;filter:drop-shadow(0 18px 30px color-mix(in srgb,var(--ac) 55%,transparent))}
.logo-big .lg-bell{transform-origin:32px 14px;animation:ringBell 3.6s ease-in-out infinite}
.wave{position:absolute;inset:0;border-radius:32px;border:2px solid var(--ac);animation:wave 2.8s ease-out infinite;opacity:0}
.wave.w2{animation-delay:1.4s}
@keyframes wave{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.7);opacity:0}}
@keyframes floaty{50%{transform:translateY(-8px)}}
@keyframes ringBell{0%,60%,100%{transform:rotate(0)}64%{transform:rotate(14deg)}70%{transform:rotate(-12deg)}76%{transform:rotate(8deg)}82%{transform:rotate(-5deg)}88%{transform:rotate(2deg)}}
.gate h2{font-size:clamp(24px,7vw,30px);line-height:1.35}
.gate h2 em{font-style:normal;color:var(--ac)}
.lead{color:var(--muted);font-size:15px;margin-top:8px;line-height:1.7}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.perk{padding:14px 6px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.perk svg{color:var(--ac);margin-bottom:6px}
.perk b{display:block;color:var(--text);font-size:13px;font-weight:600}
.howto{text-align:right;padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);margin-bottom:18px}
.howto h4{font:700 14px 'Readex Pro',sans-serif;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14.5px;border-top:1px solid var(--line)}

.note-s{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.7}
.wz{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px)}
.wz-top{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.wz-prog{flex:1;display:flex;gap:6px}
.wz-prog i{flex:1;height:5px;border-radius:99px;background:var(--trk);transition:background .4s}
.wz-prog i.on{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.wz-body{flex:1;padding:24px 0 20px}

.wz-mini{width:64px;height:64px;margin-bottom:16px}
.wz-foot{display:flex;gap:10px;position:sticky;bottom:calc(env(safe-area-inset-bottom) + 10px)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{border-radius:20px;padding:12px;border:2px solid var(--line);text-align:right;transition:all .2s}
.tcard.on{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.tcard .pv{height:70px;border-radius:13px;padding:10px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.tcard .pv i{display:block;height:8px;border-radius:9px}
.tcard b{font-size:14px}
.clsrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* focus */
.focus{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--ac) 16%,var(--bg)),var(--bg) 70%);animation:viewIn .4s both}

.f-sub{color:var(--muted);font-size:clamp(14px,2.8vmin,22px)}
.f-clock{color:var(--faint);font-size:clamp(14px,2.6vmin,20px)}
@media (orientation:landscape) and (max-height:600px){.focus{flex-direction:row;flex-wrap:wrap;gap:4px 30px}.f-ring{width:72vh;height:72vh}}

/* toast */
.toasts{position:fixed;z-index:90;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}

@keyframes drop{from{transform:translateY(-120%) scale(.9);opacity:0}}

.t-tx b{display:block;font:600 15px 'Readex Pro',sans-serif}

@media (min-width:900px){
  .wrap{max-width:1060px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}

  .days{margin-top:18px}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

 const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.2,y:H*.35,vx:(Math.random()-.5)*26*devicePixelRatio,vy:(-Math.random()*22-8)*devicePixelRatio,r:(4+Math.random()*5)*devicePixelRatio,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,s:Math.random()>.5}));let f=0;
 (function loop(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.7*devicePixelRatio;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.a+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-f/120);if(p.s)x.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{x.beginPath();x.arc(0,0,p.r/1.4,0,7);x.fill()}x.restore()});if(++f<130)requestAnimationFrame(loop);else c.remove()})()}

function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function fold(line){const enc=new TextEncoder();let out='',cur='',n=0;for(const ch of line){const b=enc.encode(ch).length;if(n+b>73){out+=cur+'\r\n ';cur='';n=1}cur+=ch;n+=b}return out+cur}
function buildICS(weeks){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Jaras Teacher//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc('حصص '+(S.profile.name||'المعلم'))];
 const now=new Date(),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),base=new Date(now);base.setHours(0,0,0,0);const n=S.settings.notif;let cnt=0;
 const ymd=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()),t4=m=>pad(Math.floor(m/60))+pad(m%60);
 orderedDays().forEach(d=>{const date=new Date(base);date.setDate(base.getDate()+((d-base.getDay()+7)%7));daySlots(d).filter(x=>x.c).forEach(x=>{cnt++;const ds=ymd(date);
  L.push('BEGIN:VEVENT','UID:'+uid()+'-'+d+'-'+x.p.id+'@jaras',`DTSTAMP:${stamp}`,`DTSTART:${ds}T${t4(x.s)}00`,`DTEND:${ds}T${t4(x.e)}00`,`RRULE:FREQ=WEEKLY;COUNT=${weeks}`,'SUMMARY:'+icsEsc(x.c.name+' — '+(x.c.subject||S.profile.subject||'حصة')),'DESCRIPTION:'+icsEsc('الحصة '+(ORD[x.i]||x.i+1)+' · جَرَس'));
  if(n.beforeStart)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('بعد '+n.bsMin+' دقائق: '+x.c.name),`TRIGGER:-PT${n.bsMin}M`,'END:VALARM');
  if(n.beforeEnd)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('تبقى '+n.beMin+' دقائق على نهاية الحصة'),`TRIGGER;RELATED=END:-PT${n.beMin}M`,'END:VALARM');
  L.push('END:VEVENT')})});L.push('END:VCALENDAR');return cnt?L.map(fold).join('\r\n'):''}
async function giveFile(name,text,mime){const blob=new Blob([text],{type:mime});
 try{const f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}

  ${row('volume','نغمة التنبيه','اضغط للاستماع','<button class="btn sm ghost" data-x="hear">'+ic('play',16)+'</button>')}</div></div>`}
function clsChips(){return S.classes.map(c=>`<span class="ccard" style="--cc:${c.color}"><i></i>${esc(c.name)}<button data-x="rmc" data-v="${c.id}" aria-label="حذف">${ic('x',15)}</button></span>`).join('')}
let wzAddHandler=null;
function renderWz(anim){const w=$('#wizard'),N=5,last=wz.step===N-1;
 w.innerHTML=`<div class="ambient"><i></i><i></i><i></i></div><div class="wz"><div class="wz-top"><div class="wz-prog">${Array.from({length:N},(_,i)=>`<i class="${i<=wz.step?'on':''}"></i>`).join('')}</div><small>${ar(wz.step+1)} / ${ar(N)}</small></div>
 <div class="wz-body ${anim?'anim':''}" id="wzBody">${wzBody()}</div>
 <div class="wz-foot">${wz.step>0?`<button class="btn ghost" data-x="back">السابق</button>`:''}<button class="btn pri grow" data-x="next">${last?ic('sparkle',18)+' ابدأ الآن':wz.step===3?'التالي':'التالي'}</button></div></div>`;
 wzAddHandler=wz.step===2?bindAddForm(w,'wa',wz.add):null;if(wz.step===3)bindPaint($('#wzGrid'));w.scrollTop=0}
$('#wizard').addEventListener('input',e=>{const k=e.target.dataset.pf;if(k){S.profile[k]=e.target.value.trim();save()}});
$('#wizard').addEventListener('change',e=>{if(e.target.dataset.gt){wz.g.start=e.target.value||wz.g.start;$('#genBox').innerHTML=genFormHTML(wz.g)}});
$('#wizard').addEventListener('click',async e=>{if(!wz)return;
 if(wz.step===1&&handleGen(e.target,wz.g)){tap();$('#genBox').innerHTML=genFormHTML(wz.g);return}
 if(wzAddHandler&&wzAddHandler(e))return;
 const b=e.target.closest('[data-x],[data-act="brush"],[data-act="addclass"]');if(!b)return;
 if(b.dataset.act==='brush'){brush=b.dataset.v;tap();$('#wzPal').innerHTML=paletteHTML();return}
 if(b.dataset.act==='addclass'){wz.step=2;renderWz(true);return}
 const x=b.dataset.x;
 if(x==='subj'){S.profile.subject=b.dataset.v;save();$('#wzSub').value=b.dataset.v;$$('#wzBody .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===b.dataset.v));tap()}
 if(x==='demo'){loadDemo();finishWz();return}
 if(x==='addc'){const made=makeClasses($('#waName').value,wz.add.n,S.profile.subject);if(!made.length){toast('اكتب اسم الصف','أو اختر صفاً من الأزرار');return}plink();$('#waName').value='';wz.add.n=1;$('#waSec').textContent='١';$('#waPrev').textContent='صف واحد';$('#wzCls').innerHTML=clsChips()}
 if(x==='rmc'){S.classes=S.classes.filter(c=>c.id!==b.dataset.v);prune();save();$('#wzCls').innerHTML=clsChips()}
 if(x==='theme'){S.settings.theme=b.dataset.v;save();applyTheme();renderWz()}
 if(x==='accent'){S.settings.accent=b.dataset.v;save();applyTheme();renderWz()}
 if(x==='notif'){await askNotif();renderWz()}
 if(x==='hear')sfx('preStart',true);
 if(x==='back'){wz.step--;renderWz(true)}
 if(x==='next'){if(wz.step===1){S.periods=genPeriods(wz.g,S.periods);prune();save()}if(wz.step===2){const v=$('#waName').value.trim();if(v){makeClasses(v,wz.add.n,S.profile.subject)}}
  if(wz.step===4){finishWz();return}wz.step++;tap();renderWz(true)}});
function finishWz(){S.setup=true;save();$('#wizard').hidden=true;wz=null;sel=null;applyTheme();renderAll();confetti();sfx('success',true);toast('جاهز! 🎉',S.classes.length?'جدولك يعمل الآن — سنذكّرك قبل كل حصة':'أضف حصصك من تبويب «الجدول» متى شئت','ok',6000)}
function loadDemo(){const sub=S.profile.subject||'اللغة الإنجليزية';if(!S.profile.subject)S.profile.subject=sub;S.periods=genPeriods(DEF_GEN);S.classes=[];S.sched={};S.notes={};
 const C=makeClasses('الخامس أساسي',3,sub).concat(makeClasses('السادس أساسي',1,sub));const P=S.periods.map(p=>p.id);
 const plan={0:[[0,0],[1,1],[4,2]],1:[[1,3],[2,0],[5,1]],2:[[0,2],[3,3],[6,0]],3:[[2,1],[3,0],[7,1]],4:[[1,0],[2,2],[4,3]]};
 Object.entries(plan).forEach(([d,arr])=>{S.sched[d]={};arr.forEach(([pi,ci])=>{if(P[pi]&&C[ci])S.sched[d][P[pi]]=C[ci].id})});S.notes['3-'+P[7]]='مراجعة الوحدة ١ — صفحة ٦٣';save()}

/* ============ global actions ============ */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.closest('#wizard'))return;const a=b.dataset.act;
 switch(a){
  case'tab':tap();setView(b.dataset.v);break;
  case'day':sel=+b.dataset.d;tap();listAnim=true;renderDays();renderList(new Date());break;
  case'slot':openSlot(+b.dataset.d,b.dataset.p);break;
  case'cell':if(!editing)openSlot(+b.dataset.d,b.dataset.p);break;
  case'focus':openFocus();break;case'focus-x':closeFocus();break;
  case'pause':{const k=dkey(new Date());if(S.off[k])delete S.off[k];else S.off[k]=true;save();tap();renderToday();toast(S.off[k]?'أُوقف اليوم':'استُؤنف اليوم',S.off[k]?'لن تصلك تنبيهات اليوم':'عادت التنبيهات','ok');break}
  case'theme':{const r=b.getBoundingClientRect();setTheme(isDark()?'light':'dark',r.left+r.width/2,r.top+r.height/2);break}
  case'goedit':editing=true;setView('week');renderWeek();break;
  case'edit':editing=!editing;tap();renderWeek();if(!editing){sfx('success');renderStats()}break;
  case'brush':brush=b.dataset.v;tap();renderPalette();break;
  case'addclass':openAddClass();break;case'editclass':openEditClass(b.dataset.v);break;
  case'periods':openPeriods();break;case'copyday':openCopy();break;case'profile':openProfile();break;
  case'sw':{const k=b.dataset.k,v=!getK(k);setK(k,v);save();tap();if(k==='keepAwake')syncWake();if(k==='notif.sys'&&v&&notifState()!=='granted'){askNotif()}renderSettings();lastKey='';break}
  case'seg':{const k=b.dataset.k,v=b.dataset.v;if(k==='theme'){const r=b.getBoundingClientRect();setTheme(v,r.left+r.width/2,r.top+r.height/2);break}if(k==='h12')setK(k,v==='1');else setK(k,v);save();if(k==='voice')sfx('preStart');else tap();renderAllSoft();break}
  case'pill':setK(b.dataset.k,+b.dataset.v);save();tap();renderSettings();lastKey='';break;
  case'accent':S.settings.accent=b.dataset.v;save();applyTheme();sfx('info');renderSettings();break;
  case'wday':{const d=+b.dataset.d,w=S.settings.workDays;S.settings.workDays=w.includes(d)?w.filter(x=>x!==d):[...w,d].sort();if(!S.settings.workDays.length)S.settings.workDays=[d];save();tap();renderAllSoft();break}
  case'asknotif':askNotif().then(renderSettings);break;
  case'testalert':testAlert();break;
  case'ics':openICS();break;
  case'backup':giveFile('jaras-backup-'+dkey(new Date())+'.json',JSON.stringify(S,null,1),'application/json');break;
  case'restore':$('#impFile').click();break;
  case'install':showInstall();break;case'wizard':showWizard();break;case'reset':openReset();break;
 }});
document.addEventListener('input',e=>{if(e.target.dataset.act==='vol'){S.settings.volume=+e.target.value;save();if(master)master.gain.value=S.settings.volume}});
document.addEventListener('change',e=>{if(e.target.dataset.act==='vol')sfx('info')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(focusOpen)closeFocus();else closeSheet()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncWake();lastKey='';tick()}});

/* ============ boot ============ */
function renderAll(){renderTabs();renderToday();renderWeek();renderStats();renderSettings();setView(view)}
function renderAllSoft(){const y=scrollY;renderTabs();renderToday();renderWeek();renderStats();renderSettings();$$('.view').forEach(e=>e.classList.toggle('on',e.id==='view-'+view));$$('.view.on').forEach(e=>e.style.animation='none');scrollTo(0,y);requestAnimationFrame(()=>$$('.view').forEach(e=>e.style.animation=''))}
applyTheme();renderAll();
(function loop(){tick();setTimeout(loop,1000-(Date.now()%1000)+5)})();
syncWake();
if(!isStandalone()&&!store.get('jaras.skipInstall',false))showInstall();else if(!S.setup)showWizard();
})();
</script>
</body>
