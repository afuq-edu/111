<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رحلة الأشكال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Daylight airport terminal: a fixed 1600x900 stage scaled to fit the screen; pastel boarding-pass cards over sky, glass and tiled floor */
  --navy:#1d2a4d; --ink:#3a4c76; --cream:#fffaf3;
  --pink:#fde4e8; --pink2:#f4b3be; --pink3:#df7487;
  --blue:#e0effd; --blue2:#a7cdf2; --blue3:#4a8fd8;
  --yel:#fff3cc; --yel2:#f7d779; --yel3:#dfa520;
  --grn:#e2f5e0; --grn2:#a6dba1; --grn3:#3f9e52;
  --gate:#243150; --amber:#f7c53c; --red:#e5484d; --ok:#1f9d55;
  --font:"Baloo Bhaijaan 2","Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#152242}
#app{position:fixed;inset:0;background:#152242}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;font-family:var(--font);color:var(--navy);direction:rtl;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#bfe6fb;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--amber);outline-offset:3px}
svg{display:block}

/* ---------- backdrop ---------- */
.bg{position:absolute;inset:0;z-index:0;pointer-events:none}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#68bdf0 0%,#a6dbfa 42%,#e4f5fd 70%)}
.cloud{position:absolute;left:0;height:46px;background:#fff;border-radius:60px;opacity:.95;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:62px;height:62px;top:-30px;right:22%}
.cloud::after{width:44px;height:44px;top:-20px;left:20%}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1860px)}}
.horizon{position:absolute;left:0;top:410px;width:1600px;height:270px}
.mul{position:absolute;top:0;height:680px;width:20px;background:linear-gradient(90deg,#7f8ea6,#eef2f7 45%,#9aa8bd);box-shadow:0 0 0 2px rgba(60,75,100,.15)}
.beam{position:absolute;left:0;right:0;top:0;height:30px;background:linear-gradient(#6f7f99,#c7d1df)}
.sill{position:absolute;left:0;right:0;top:668px;height:20px;background:linear-gradient(#e7ecf2,#9aa8bd)}
.floor{position:absolute;left:0;right:0;top:686px;bottom:0;overflow:hidden;background:linear-gradient(180deg,#f6e9df,#ecd8c9)}
.floor .tiles{position:absolute;left:-60%;width:220%;top:0;height:700px;transform-origin:50% 0;transform:perspective(420px) rotateX(62deg);background-image:repeating-linear-gradient(90deg,rgba(150,110,90,.20) 0 3px,transparent 3px 140px),repeating-linear-gradient(0deg,rgba(150,110,90,.20) 0 3px,transparent 3px 140px)}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 60%)}

/* ---------- slide container ---------- */
#slide{position:absolute;inset:0;z-index:2}
#slide.out{opacity:0;transform:translateX(60px);transition:opacity .25s,transform .25s}
#slide.in{animation:slideIn .45s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
.quiet,.quiet *,.quiet *::before,.quiet *::after{transition:none!important;animation-duration:0s!important;animation-delay:0s!important}
.rv{opacity:0;transform:scale(.6) translateY(30px);transition:opacity .45s,transform .55s cubic-bezier(.3,1.6,.5,1);transition-delay:var(--d,0s)}
.rv.on{opacity:1;transform:none}
.gone{opacity:0!important;transform:scale(.8)!important;transition:all .3s!important}

/* ---------- shared components ---------- */
.banner{position:absolute;top:20px;left:0;right:0;margin-inline:auto;width:max-content;max-width:1420px;display:flex;align-items:center;gap:24px;padding:10px 40px;background:var(--bg,var(--pink));border:5px solid var(--bd,var(--pink3));border-radius:30px;box-shadow:0 8px 0 rgba(29,42,77,.13),0 16px 30px rgba(29,42,77,.16);animation:bannerIn .6s cubic-bezier(.3,1.5,.5,1) both;z-index:5}
.banner::after{content:"";position:absolute;inset:7px;border:3px dashed var(--bd,var(--pink3));opacity:.45;border-radius:22px;pointer-events:none}
@keyframes bannerIn{from{transform:translateY(-160%)}to{transform:none}}
.banner h1{margin:0;font-size:52px;font-weight:800;line-height:1.25;white-space:nowrap}
.banner .bi svg{width:110px;height:auto}
.banner .bi.sm svg{width:74px}
.banner .bi.flip svg{transform:scaleX(-1)}

.gsign{display:flex;align-items:center;gap:22px;background:linear-gradient(#2e3c5f,#1e2944);border-radius:16px;padding:12px 24px;box-shadow:0 7px 0 rgba(0,0,0,.18);color:#fff}
.gsign .gi{width:78px;height:66px;background:var(--amber);border-radius:12px;display:grid;place-items:center}
.gsign .gi svg{width:46px;transform:rotate(-45deg)}
.gsign .gtx b{display:block;font-size:38px;line-height:1.1}
.gsign .gtx small{display:block;font-size:22px;opacity:.9}
.gsign .gc{background:var(--amber);color:var(--navy);font-weight:800;font-size:52px;border-radius:12px;padding:0 18px;line-height:1.25;direction:ltr}

.case{position:absolute;background:linear-gradient(#f7bdc7,#f0a2b0);border:6px solid #d6788a;border-radius:46px;box-shadow:inset 0 -16px 0 rgba(0,0,0,.06),0 18px 0 rgba(29,42,77,.12),0 26px 40px rgba(29,42,77,.18)}
.case::before{content:"";position:absolute;top:-74px;left:0;right:0;margin-inline:auto;width:200px;height:84px;border:18px solid #353b4a;border-bottom:0;border-radius:34px 34px 0 0;box-sizing:border-box}
.case .panel{position:absolute;inset:24px;background:var(--cream);border-radius:30px;border:3px dashed #eba4b1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}

.ticket{position:absolute;display:flex;align-items:center;height:108px;background:var(--c1);border:4px solid var(--c2);border-radius:24px;box-shadow:0 7px 0 rgba(29,42,77,.10),0 12px 24px rgba(29,42,77,.12);overflow:hidden}
.ticket .tx{flex:1;padding:0 34px;font-size:38px;font-weight:700;line-height:1.3}
.ticket .tn{width:110px;height:100%;display:grid;place-items:center;font-size:58px;font-weight:800;border-inline-start:3px dashed var(--c2)}
.ticket .ts{width:84px;height:100%;display:grid;place-items:center;background:var(--c2)}
.ticket .ts svg{width:46px;transform:rotate(-45deg)}
.ticket .bar{width:40px;height:72%;margin-inline:18px;background:repeating-linear-gradient(0deg,var(--c2) 0 5px,transparent 5px 9px);border-radius:4px;opacity:.85}

.deco{position:absolute;pointer-events:none}
.deco.fids{top:110px;width:170px}
.deco.fids.l{left:34px}.deco.fids.r{right:34px}
.deco.plant{bottom:40px;width:190px}
.deco.plant.l{left:10px}.deco.plant.r{right:10px}
.deco.seats{bottom:30px;width:330px}
.deco.seats.l{left:150px}.deco.seats.r{right:150px}

.mini-btn{position:absolute;z-index:6;background:#fff;border:3px solid var(--navy);border-radius:999px;padding:4px 22px;font-size:26px;font-weight:700;box-shadow:0 5px 0 rgba(29,42,77,.25)}
.mini-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(29,42,77,.25)}

.bubble{position:absolute;z-index:4;background:#fff;border:4px solid var(--navy);border-radius:26px;padding:8px 26px;font-size:34px;font-weight:700;box-shadow:0 8px 0 rgba(29,42,77,.15);opacity:0;transform:scale(.5);transition:all .45s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.bubble.on{opacity:1;transform:none}

/* ---------- cover ---------- */
.sky-plane{position:absolute;top:300px;left:0;width:150px;z-index:0;animation:skyfly 16s linear infinite;opacity:.95}
.sky-plane svg{transform:scaleX(-1) rotate(-6deg)}
@keyframes skyfly{from{transform:translateX(1700px) translateY(40px)}to{transform:translateX(-260px) translateY(-60px)}}
.cv-gate{position:absolute;top:156px;left:0;right:0;margin-inline:auto;width:max-content;animation:bannerIn .7s .15s cubic-bezier(.3,1.5,.5,1) both}
.carpet{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(#e2363b,#c4232b);clip-path:polygon(35% 0,65% 0,82% 100%,18% 100%)}
.carpet::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46%,rgba(255,215,120,.6) 46% 46.4%,transparent 46.4% 53.6%,rgba(255,215,120,.6) 53.6% 54%,transparent 54%)}
.post{position:absolute;bottom:56px;width:22px;height:210px;border-radius:10px;background:linear-gradient(90deg,#a87a22,#ffe28c 50%,#a87a22)}
.post::before{content:"";position:absolute;top:-22px;left:-8px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b8,#c8962e 60%,#8d6516)}
.post::after{content:"";position:absolute;bottom:-12px;left:-30px;width:82px;height:24px;border-radius:50%;background:radial-gradient(#ffe28c,#a87a22)}
.post.p1{left:330px}.post.p2{right:330px}
.rope{position:absolute;top:668px;height:46px;width:110px;border-bottom:12px solid #cf2f3a;border-radius:0 0 60% 60%}
.rope.r1{left:350px}.rope.r2{right:350px}
.cv-case{left:0;right:0;margin-inline:auto;top:330px;width:740px;height:440px}
.cv-case.rv{transform:translateY(-500px) rotate(-6deg)}
.cv-case.rv.on{transform:none;transition:opacity .2s,transform .8s cubic-bezier(.3,1.35,.5,1)}
.cv-case .tagline{font-size:40px;font-weight:700;background:#fbd0d8;padding:0 30px;border-radius:16px;transform:rotate(-2deg)}
.cv-case .ttl{font-size:150px;font-weight:800;line-height:1.05}
.stk-row{display:flex;gap:30px;margin-top:4px}
.stk{display:flex;flex-direction:column;align-items:center;gap:0}
.stk svg{width:92px;height:92px}
.stk span{font-size:24px;font-weight:700}
.hint{position:absolute;bottom:90px;left:0;right:0;margin-inline:auto;width:max-content;display:flex;align-items:center;gap:12px;background:#fff;border:4px solid var(--navy);border-radius:999px;padding:8px 32px;font-size:34px;font-weight:700;animation:pulse 1.6s ease-in-out infinite;z-index:4}
.hint svg{width:40px;transform:rotate(-135deg)}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ---------- warm-up game ---------- */
.gate{position:absolute;left:46px;top:160px;width:480px;height:620px}
.gate .gsign{position:relative;z-index:2;justify-content:center;padding:10px 14px;gap:14px}
.gate .gsign .gtx b{font-size:32px}
.gate .gsign .gc{font-size:44px}
.gframe{position:absolute;top:96px;left:12px;right:12px;bottom:0;border:16px solid #93a2b8;border-bottom:0;border-radius:10px 10px 0 0;overflow:hidden;background:linear-gradient(#cfe9fb,#f6fbff)}
.beyond{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#8fd0f7,#e9f7ff)}
.beyond svg{width:250px}
.beyond b{font-size:40px;background:#fff;padding:0 24px;border-radius:16px}
.door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(100deg,rgba(210,236,252,.92),rgba(170,212,240,.92) 60%,rgba(220,240,252,.92));transition:transform 1.4s cubic-bezier(.6,0,.3,1)}
.door.dl{left:0;border-left:0;box-shadow:inset -6px 0 0 #9fb2c8}
.door.dr{right:0;box-shadow:inset 6px 0 0 #9fb2c8}
.door::after{content:"";position:absolute;top:40%;width:10px;height:90px;border-radius:5px;background:#7c8aa3}
.door.dl::after{right:22px}.door.dr::after{left:22px}
.lock{position:absolute;left:0;right:0;margin-inline:auto;top:120px;width:170px;height:170px;border-radius:50%;background:rgba(80,100,130,.55);border:8px solid rgba(255,255,255,.85);display:grid;place-items:center;transition:transform .6s,opacity .6s}
.lock svg{width:96px}
.lock .shackle{transition:transform .5s}
.tape{position:absolute;left:-10px;right:-10px;top:360px;height:46px;background:repeating-linear-gradient(-45deg,#e5484d 0 28px,#fff 28px 56px);box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform 1s,opacity 1s}
.glight{position:absolute;top:10px;left:0;right:0;margin-inline:auto;width:70px;height:14px;border-radius:8px;background:#e5484d;box-shadow:0 0 18px #e5484d}
.gate.open .lock .shackle{transform:translateY(-14px)}
.gate.open .lock{transform:scale(0) rotate(30deg);opacity:0;transition-delay:.5s}
.gate.open .tape{transform:translateY(260px) rotate(14deg);opacity:0;transition-delay:.3s}
.gate.open .door.dl{transform:translateX(-102%);transition-delay:.9s}
.gate.open .door.dr{transform:translateX(102%);transition-delay:.9s}
.gate.open .glight{background:#22c55e;box-shadow:0 0 22px #22c55e}

.ann{position:absolute;right:46px;top:160px;width:1000px;height:136px;display:flex;align-items:center;gap:20px;padding:0 26px;box-sizing:border-box;background:var(--gate);color:#fff;border-radius:24px;border:5px solid #3c4d75;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.ann .spk{width:76px;height:76px;flex:none;background:var(--amber);border-radius:50%;display:grid;place-items:center}
.ann .spk svg{width:46px}
.ann-t{flex:1;display:flex;flex-direction:column}
.ann-t small{font-size:28px;opacity:.92}
.ann-k{font-size:62px;line-height:1.1;color:var(--amber);display:inline-block}
.ann-k.pop{animation:pop .5s}
.ann .ann-n{font-size:30px;background:rgba(255,255,255,.14);border-radius:14px;padding:4px 16px}
.ann.shake{animation:shake .45s}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:none}}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}

.belt{position:absolute;right:46px;top:310px;width:1000px;height:330px}
.belt-items{position:absolute;left:0;right:0;top:0;bottom:56px;overflow:hidden}
.belt-band{position:absolute;left:-10px;right:-10px;bottom:0;height:60px;border-radius:30px;background:repeating-linear-gradient(90deg,#3b4255 0 30px,#4b5368 30px 60px);border:6px solid #262b38;animation:beltmove 1.6s linear infinite;box-shadow:0 10px 0 rgba(0,0,0,.15)}
@keyframes beltmove{to{background-position:-60px 0}}
.lug{position:absolute;bottom:0;left:0;width:176px;height:250px;cursor:pointer;will-change:transform}
.lug-in{position:absolute;inset:0;transition:transform .2s}
.lug-in:hover{transform:translateY(-8px)}
.lug-body{position:absolute;left:4px;right:4px;bottom:0;height:206px;border-radius:30px;border:5px solid rgba(29,42,77,.55);background:var(--lc);box-shadow:inset 0 -12px 0 rgba(0,0,0,.08)}
.lug-body::before{content:"";position:absolute;top:-50px;left:0;right:0;margin-inline:auto;width:70px;height:54px;border:12px solid #353b4a;border-bottom:0;border-radius:22px 22px 0 0;box-sizing:border-box}
.lug-body .lp{position:absolute;inset:16px;border-radius:20px;background:rgba(255,255,255,.88);display:grid;place-items:center}
.lug-body .lp svg{width:120px;height:120px}
.lug.picked .lug-in{animation:pickup 1s forwards}
@keyframes pickup{30%{transform:translateY(-60px) scale(1.12)}100%{transform:translateY(-320px) scale(.4);opacity:0}}
.lug.bad .lug-in{animation:shake .45s}
.lug.bad .lug-body{border-color:var(--red)}

.bpass{position:absolute;right:46px;top:660px;width:1000px;height:170px;box-sizing:border-box;display:flex;align-items:center;gap:20px;padding:0 26px;background:#fff;border:5px solid var(--blue3);border-radius:26px;box-shadow:0 8px 0 rgba(29,42,77,.12)}
.bp-h{display:flex;flex-direction:column;width:200px;flex:none;border-inline-end:4px dashed var(--blue2);padding-inline-end:16px}
.bp-h b{font-size:36px;line-height:1.1}
.bp-h small{font-size:20px;color:var(--ink)}
.bp-slots{display:flex;gap:10px;flex:1;justify-content:center}
.slot{width:66px;height:66px;border-radius:50%;border:4px dashed var(--blue2);display:grid;place-items:center;background:var(--blue)}
.slot svg{width:44px;height:44px;opacity:0;transform:scale(0);transition:all .45s cubic-bezier(.3,1.7,.5,1)}
.slot.on{border-style:solid;border-color:var(--ok);background:#e8f8ee}
.slot.on svg{opacity:1;transform:none}
.bp-stamp{position:absolute;left:30px;top:20px;font-size:44px;font-weight:800;color:var(--ok);border:6px double var(--ok);border-radius:14px;padding:0 16px;transform:rotate(-14deg) scale(2);opacity:0;transition:all .4s cubic-bezier(.3,1.6,.5,1);background:rgba(255,255,255,.9)}
.bpass.done .bp-stamp{opacity:1;transform:rotate(-14deg)}
.wu-reset{left:60px;top:800px}

/* ---------- objectives ---------- */
.ob-sign{left:0;right:0;margin-inline:auto;top:110px;width:900px;height:300px;animation:bannerIn .7s cubic-bezier(.3,1.5,.5,1) both}
.ob-sign .panel{gap:0}
.ob-sign small{font-size:34px;font-weight:700;color:var(--ink)}
.ob-sign b{font-size:120px;line-height:1.05;background:linear-gradient(transparent 55%,#fde9a8 55%);padding:0 30px}
.ob-sign .pl{position:absolute;top:26px;right:40px;width:150px}
.ob-sign .pl2{position:absolute;top:30px;left:40px;width:110px}
.ob-t{left:0;right:0;margin-inline:auto;width:1040px}

/* ---------- board with big shape ---------- */
.board{position:absolute;left:56px;top:150px;width:670px;height:484px;background:#fff;border-radius:32px;border:5px solid #b7c6da;box-shadow:0 10px 0 rgba(29,42,77,.10),0 18px 36px rgba(29,42,77,.14);background-image:radial-gradient(#dbe5f1 2px,transparent 2.5px);background-size:34px 34px}
.board .bigsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.board-q{position:absolute;top:-24px;left:0;right:0;margin-inline:auto;width:max-content;background:var(--amber);border:4px solid var(--navy);border-radius:999px;padding:0 28px;font-size:34px;font-weight:800;z-index:3;transition:all .3s}
.stamp{position:absolute;top:-40px;right:-14px;z-index:3;font-size:48px;font-weight:800;color:var(--c);border:7px double var(--c);border-radius:18px;padding:0 20px;background:rgba(255,255,255,.92);transform:rotate(8deg) scale(2.4);opacity:0;transition:all .35s cubic-bezier(.4,1.6,.6,1)}
.stamp.on{opacity:1;transform:rotate(8deg)}
.board .bubble{bottom:-30px;left:0;right:0;margin-inline:auto;width:max-content}
.sh-out{fill:none;stroke:var(--navy);stroke-width:10;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sh-fill{opacity:0;transition:opacity .7s}
.filled .sh-fill{opacity:1}
.sd,.sdc{stroke-linecap:round;opacity:0;transition:opacity .3s}
.sdc{stroke:#fff;stroke-width:28}
.sd{stroke-width:16}
.sd.on,.sdc.on{opacity:1}
.sd.on{animation:glow 1s}
@keyframes glow{0%,100%{stroke-width:16}40%{stroke-width:30}}
.dim .sd,.dim .sdc{opacity:.35}
.vt{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .4s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.vt.on{opacity:1;transform:scale(1);animation:vpulse 1s .3s 2}
@keyframes vpulse{50%{transform:scale(1.5)}}
.lbl{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.7,.5,1)}
.lbl.on{transform:scale(1)}
.svgt{font-family:var(--font);font-weight:800;text-anchor:middle;fill:var(--navy)}
.ex-el{opacity:0;transition:opacity .5s}
.ex-el.on{opacity:1}
.tracer{opacity:0}
.trace .tracer{opacity:1}

.info{position:absolute;right:56px;top:150px;width:770px;display:flex;flex-direction:column;gap:16px}
.itk{display:flex;align-items:center;justify-content:space-between;min-height:100px;box-sizing:border-box;padding:6px 26px 6px 100px;background:var(--c1);border:4px solid var(--c2);border-radius:24px;font-size:38px;font-weight:700;position:relative;box-shadow:0 7px 0 rgba(29,42,77,.09);opacity:0;transform:translateX(-80px);transition:all .5s cubic-bezier(.3,1.4,.5,1)}
.itk.on{opacity:1;transform:none}
.itk::after{content:"";position:absolute;left:18px;top:14px;bottom:14px;width:56px;background:repeating-linear-gradient(90deg,var(--c2) 0 5px,transparent 5px 9px);opacity:.6;border-radius:4px}
.itk::before{content:"";position:absolute;left:88px;top:10px;bottom:10px;border-left:3px dashed var(--c2);opacity:.7}
.itk b{font-size:60px;line-height:1.1;min-width:96px;text-align:center;background:#fff;border-radius:18px;padding:0 16px;border:3px solid var(--c2)}
.itk b.w{font-size:50px}
.itk.prop{justify-content:flex-start;gap:18px;font-size:34px;line-height:1.35}
.itk.prop .mini{display:flex;gap:8px;flex:none}
.itk.prop .mini svg{width:58px;height:58px}

.gwrap{position:absolute;left:470px;top:150px;width:660px;height:360px}

/* ---------- landing ---------- */
.land-plane{position:absolute;width:300px;top:200px;left:0;animation:landing 5s ease-in-out both;z-index:0}
.land-plane svg{transform:scaleX(-1)}
@keyframes landing{0%{transform:translate(1500px,-160px) rotate(-10deg) scale(.8)}60%{transform:translate(600px,330px) rotate(0) scale(.8);opacity:1}100%{transform:translate(-420px,340px) scale(.8);opacity:0}}
.arr-sign{position:absolute;top:160px;left:0;right:0;margin-inline:auto;width:max-content}
.chars{position:absolute;left:0;right:0;top:330px;display:flex;justify-content:center;gap:50px}

.hud{position:absolute;left:20px;right:20px;bottom:8px;height:50px;z-index:50;display:flex;align-items:center;gap:16px;padding:0 16px;background:rgba(255,255,255,.78);border-radius:26px;box-shadow:0 4px 14px rgba(29,42,77,.18);backdrop-filter:blur(6px)}
.track{position:relative;flex:1;height:30px}
.track .ln{position:absolute;left:12px;right:12px;top:14px;border-top:4px dashed #9fb3d1}

.cnt{font-size:24px;font-weight:800;min-width:90px;text-align:center}
.sdots{display:flex;gap:6px;min-width:60px}
.sdots i{width:12px;height:12px;border-radius:50%;background:#c7d3e6}

@media (prefers-reduced-motion:reduce){.cloud,.sky-plane,.belt-band,.char svg,.hint{animation:none!important}}
</style>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.random()*a.length|0];

/* ================= SOUND ================= */
const SND={on:true,ctx:null,nb:null};
let Q=false;
function ac(){
  if(!SND.ctx){try{SND.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(SND.ctx.state==='suspended'){SND.ctx.resume().catch(()=>{})}
  return SND.ctx;
}
function tone(f,d=.15,type='sine',v=.18,t0=0,f2=null){
  if(!SND.on||Q)return;const c=ac();if(!c)return;
  const t=c.currentTime+t0,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05);
}
function noise(d=.4,v=.15,t0=0,f1=400,f2=2000,q=1){
  if(!SND.on||Q)return;const c=ac();if(!c)return;
  if(!SND.nb){const b=c.createBuffer(1,c.sampleRate*2.5,c.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;SND.nb=b}

<div class="gsign arr-sign"><span class="gi">${PICON}</span><span class="gtx"><b>صالة الوصول</b><small>Arrivals</small></span><span class="gc">M2</span></div>
<div class="chars">${K.map((k,i)=>`<div class="char rv" data-s="1" style="--d:${i*.2}s;--b:${i*.3}s;--c:${SHAPES[k].dark}">${shapeIcon(k,{face:1})}<span>${SHAPES[k].full}</span></div>`).join('')}</div>
<div class="ticket hw rv" data-s="2" style="--c1:var(--yel);--c2:var(--yel3)"><div class="tx">واجبُ الرحلة: كتابُ النشاط صفحة ٢٦ — «الأشكالُ في كلِّ مكان»</div><div class="bar"></div><div class="ts">${PICONW}</div></div>`,
enter(b){later(sfx.engine,200)},
step(b,s){if(s===1){K.forEach((_,i)=>later(()=>sfx.count(i*2),i*200));later(()=>{sfx.fanfare();confetti()},900)}if(s===2){sfx.stamp();later(sfx.ding,200)}}});

/* ================= NAVIGATION ================= */
function show(i,toStep=0,quiet=false){
  timers.forEach(clearTimeout);timers=[];GEN++;parts=[];
  cur=i;stepN=0;const S=SL[i];
  box.className=quiet?'quiet':'';box.innerHTML=S.html();
  Q=quiet;S.enter&&S.enter(box);
  for(let k=1;k<=toStep;k++){stepN=k;doStep(k)}
  Q=false;hud();
}
function doStep(k){$$(`[data-s="${k}"]`,box).forEach(on);SL[cur].step&&SL[cur].step(box,k)}
function next(){
  box.classList.remove('quiet');if(busy)return;
  const S=SL[cur];
  if(stepN<S.steps){stepN++;doStep(stepN);hud()}
  else if(cur<SL.length-1)go(cur+1);
}
function prev(){box.classList.remove('quiet');if(busy)return;if(stepN>0)show(cur,stepN-1,true);else if(cur>0)show(cur-1,SL[cur-1].steps,true)}
function go(i){
  if(busy)return;busy=true;sfx.whoosh();box.classList.add('out');
  setTimeout(()=>{show(i);box.classList.add('in');setTimeout(()=>box.classList.remove('in'),460);busy=false},260);
}
function hud(){
  const n=SL.length,p=cur/(n-1);
  $('#cnt').textContent=`${ar(cur+1)} / ${ar(n)}`;
  const tr=$('.track').getBoundingClientRect().width/SCALE-24;
  $('#trkPlane').style.right=(12+p*tr)+'px';$('#trkFill').style.width=(p*tr)+'px';
  const S=SL[cur];$('#sdots').innerHTML=Array.from({length:S.steps},(_,i)=>`<i class="${i<stepN?'on':''}"></i>`).join('');
  $('#bNext').firstChild.textContent=(stepN<S.steps)?'التالي ':(cur<n-1?'الشريحة التالية ':'النهاية ');
}
$('#trkPlane').innerHTML=PLANE();
$('#horizon').innerHTML=HORIZON();

stage.addEventListener('pointerdown',()=>ac(),{passive:true});
stage.addEventListener('click',e=>{
  if(!$('#menu').hidden)return;
  if(e.target.closest('.hud,.menu,button,.mini-btn'))return;
  if(SL[cur].noclick)return;
  next();
});
$('#bNext').addEventListener('click',e=>{e.stopPropagation();ac();next()});
$('#bPrev').addEventListener('click',e=>{e.stopPropagation();prev()});
$('#bSnd').addEventListener('click',e=>{e.stopPropagation();SND.on=!SND.on;$('#bSnd').classList.toggle('off',!SND.on);if(SND.on){ac();sfx.pop()}});
$('#bFs').addEventListener('click',e=>{e.stopPropagation();try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(err){}});
function openMenu(){$('#mgrid').innerHTML=SL.map((s,i)=>`<button class="mi${i===cur?' cur':''}" data-i="${i}"><i>${ar(i+1)}</i>${s.t}</button>`).join('');$('#menu').hidden=false}
$('#bMenu').addEventListener('click',e=>{e.stopPropagation();openMenu()});
$('#mClose').addEventListener('click',e=>{e.stopPropagation();$('#menu').hidden=true});
$('#mgrid').addEventListener('click',e=>{const b=e.target.closest('.mi');if(!b)return;e.stopPropagation();$('#menu').hidden=true;go(+b.dataset.i)});
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();ac();next()}
  else if(['ArrowRight','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='m'||e.key==='M')$('#bSnd').click();
  else if(e.key==='f'||e.key==='F')$('#bFs').click();
  else if(e.key==='Escape')$('#menu').hidden=true;
});
function fit(){const W=innerWidth,H=innerHeight,s=Math.min(W/1600,H/900);SCALE=s;stage.style.transform=`translate(${(W-1600*s)/2}px,${(H-900*s)/2}px) scale(${s})`;hud()}
addEventListener('resize',fit);
show(0);fit();
window.__lesson={next,prev,show,go,SL,get cur(){return cur},get step(){return stepN}};
})();
</script>
</body>
</html>
