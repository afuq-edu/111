ding:6px 26px;border:6px solid;border-radius:14px;transform:rotate(-12deg) scale(2);opacity:0;transition:all .35s cubic-bezier(.3,1.6,.5,1)}\n.stamp.on{transform:rotate(-12deg) scale(1);opacity:.9}\n.stamp.t{color:var(--ok)}.stamp.f{color:var(--bad)}\n.tfx{margin-top:22px;font:500 25px/1.6 var(--body);background:var(--cream2);border-radius:16px;padding:16px 22px}\n.tfside{display:flex;flex-direction:column;gap:18px}\n.bigcount{padding:26px;text-align:center}\n.bigcount b{display:block;font:700 72px var(--display);color:var(--ac)}\n.bigcount span{font:600 21px var(--body);color:var(--ink-soft)}\n.note{padding:22px 24px;font:500 21px/1.55 var(--body);color:#dfe8f3;background:rgba(255,255,255,.07);border:1.5px dashed rgba(255,255,255,.25);border-radius:20px}\n.note b{display:block;color:var(--gold);font:600 22px var(--display);margin-bottom:4px}\n\n/* fill */\n.fillc{padding:44px 54px}\n.fillc .tx{font:600 40px/2.1 var(--display)}\n.blank{display:inline-block;min-width:170px;border-bottom:4px dashed var(--line);text-align:center;color:var(--ac);margin:0 6px;line-height:1.3;transition:all .3s}\n.blank.next{border-color:var(--ac);animation:pulse 1.4s infinite}\n.blank.done{border-bottom-style:solid;border-color:var(--ok);color:var(--ok)}\n.chips{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:30px}\n.chip{font:600 28px var(--display);padding:12px 28px;border-radius:999px;border:3px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;transition:all .2s}\n.chip:hover{background:rgba(255,255,255,.2)}\n.chip.used{opacity:0;pointer-events:none;transform:scale(.6)}\n\n/* explore */\n.exw{display:grid;grid-template-columns:780px 1fr;gap:30px}\n.orbit{position:relative;height:620px}\n.orbit .hub{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;text-align:center;font:700 30px/1.35 var(--display);padding:20px; ont:700 40px var(--display);color:var(--gold);margin:24px 0}\n.end .stats{display:flex;gap:22px;margin:10px 0 26px}\n.end .stats div{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);border-radius:20px;padding:14px 30px}\n.end .stats b{display:block;font:700 50px var(--display);color:var(--gold)}\n.end .stats span{font:500 21px var(--body);color:#c9d6e6}\n\n/* nav */\n#nav{position:absolute;left:0;right:0;bottom:0;height:88px;display:flex;align-items:center;gap:12px;padding:0 24px;box-sizing:border-box;background:rgba(6,18,32,.72);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.08);z-index:50}\n.navb{width:56px;height:56px;border-radius:14px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}\n.navb:hover{background:rgba(255,255,255,.18)}\n.navb.main{background:var(--gold);color:var(--ink)}\n.navb.off{opacity:.4}\n.navb svg{width:28px;height:28px}\n#dots{flex:1;display:flex;justify-content:center;gap:9px;align-items:center}\n#dots button{width:15px;height:15px;border-radius:50%;border:2.5px solid rgba(255,255,255,.55);background:transparent;cursor:pointer;padding:0;transition:all .25s}\n#dots button.seen{background:rgba(255,255,255,.35)}\n#dots button.on{background:var(--gold);border-color:var(--gold);transform:scale(1.35)}\n#where{color:#cfdbe8;font:500 20px var(--body);min-width:210px}\n#score{display:flex;gap:6px;align-items:center;flex:none}\n#score span{font:700 20px var(--display);color:#fff;padding:6px 12px;border-radius:10px;min-width:30px;text-align:center}\n#score .a{background:var(--ta)}#score .b{background:var(--tb)}\n#fx{position:absolute;inset:0;pointer-events:none;z-index:60}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style><\/head>\n<body>\n<div id=\"wrap\"><div id=\"stage\">\n<svg id=\"pattern\" width=\"1600\" height=\"900\" aria-hidden=\"true\"><defs><pattern id=\"p\" width=\"120\" height=\"120\" patternUnits=\"userSpaceOnUse\">\n<g fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\"><path d=\"M60 14 L74 46 L106 60 L74 74 L60 106 L46 74 L14 60 L46 46Z\"/><rect x=\"38\" y=\"38\" width=\"44\" height=\"44\" transform=\"rotate(45 60 60)\"/><circle cx=\"60\" cy=\"60\" r=\"8\"/><\/g><\/pattern><\/defs>\n<rect width=\"1600\" height=\"900\" fill=\"url(#p)\"/><\/svg>\n<div id=\"slides\"><\/div>\n<canvas id=\"fx\" width=\"1600\" height=\"900\"><\/canvas>\n<nav id=\"nav\" aria-label=\"التنقل\">\n  <button class=\"navb main\" id=\"next\" aria-label=\"التالي\" title=\"التالي (←)\"><svg viewBox=\"0 0 24 24\"><path d=\"M15 5l-7 7 7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n  <button class=\"navb\" id=\"prev\" aria-label=\"السابق\" title=\"السابق (→)\"><svg viewBox=\"0 0 24 24\"><path d=\"M9 5l7 7-7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n  <div id=\"where\"><\/div>\n  <div id=\"dots\"><\/div>\n  <div id=\"score\" title=\"نقاط الفريقين: الأزرق والبرتقالي\"><span class=\"a\">٠<\/span><span class=\"b\">٠<\/span><\/div>\n  <button class=\"navb\" id=\"home\" aria-label=\"قائمة العروض\" title=\"قائمة العروض\" hidden><svg viewBox=\"0 0 24 24\"><path d=\"M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z\" fill=\"currentColor\"/><\/svg><\/button>\n  <button class=\"navb\" id=\"snd\" aria-label=\"المؤثرات الصوتية\" title=\"المؤثرات الصوتية\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 9h4l5-4v14l-5-4H4z\" fill=\"currentColor\"/><path d=\"M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg><\/button>\n  <button class=\"navb\" id=\"fs\" aria-label=\"ملء الشاشة\" title=\"ملء الشاشة\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/svg><\/button>\n<\/nav>\n<\/div><\/div>\n<script>\nconst D={\"n\": 2, \"slug\": \"02-assessment-for-learning\", \"title\": \"التقويم من أجل التعلّم\", \"sub\": \"نقيس لنُحسّن… لا لنحكم\", \"icon\": \"🎯\", \"color\": \"#4f6bd8\", \"floaters\": [\"📊\", \"✋\", \"🚦\", \"📝\", \"🔍\", \"✅\"], \"goals\": [[\"معرفي\", \"يفرّق بين التقويم التكويني والتقويم الختامي.\"], [\"مهاري\", \"يستخدم أدوات تقويم سريعة يشارك فيها جميع الطلاب.\"], [\"وجداني\", \"يتبنّى اتخاذ القرار التدريسي بناءً على الأدلة.\"]], \"quote\": \"التقويم ليس محطة في نهاية الطريق، بل إشارات مرور على طوله.\", \"slides\": [{\"type\": \"cover\"}, {\"type\": \"goals\"}, {\"type\": \"poll\", \"e\": \"🎯\", \"q\": \"كيف تعرف غالبًا أن طلابك فهموا الدرس؟\", \"opts\": [[\"🙋\", \"أسئلة شفهية لبعض الطلاب\"], [\"👀\", \"ملامح الوجوه والتفاعل\"], [\"📝\", \"الواجبات والاختبارات\"], [\"✋\", \"أداة يشارك فيها كل الطلاب\"]]}, {\"type\": \"tf\", \"h\": \"اختبر <em>قناعاتك<\\/em> عن التقويم\", \"items\": [[\"التقويم التكويني يعني اختبارات قصيرة كثيرة بالدرجات.\", false, \"هو أي نشاط يكشف الفهم أثناء التعلّم ليُبنى عليه قرار، وغالبًا يكون بلا درجات.\"], [\"إجابة «نعم» على سؤال «هل فهمتم؟» دليل كافٍ على الفهم.\", false, \"كثير من الطلاب يجيبون «نعم» خجلًا أو مجاراةً لزملائهم؛ نحتاج دليلًا من كل طالب.\"], [\"معرفة الطالب معايير النجاح قبل المهمة ترفع جودة عمله.\", true, \"حين يعرف الطالب شكل العمل الجيد يستطيع أن يوجّه نفسه نحوه ويقيّم تقدّمه.\"], [\"نتائج التقويم التكويني قد تغيّر خطة المعلم في اليوم التالي.\", true, \"هذا جوهره: تعديل التدريس بناءً على ما تكشفه الأدلة عن تعلّم الطلاب.\"]]}, {\"type\": \"fill\", \"h\": \"ما <em>التقويم من أجل التعلّم<\\/em>؟\", \"text\": \"هو جمع {أدلة} على تعلّم الطلاب {أثناء} الحصة، واستخدامها في {تعديل} التدريس و{توجيه} الطالب نحو الهدف.\", \"distract\": [\"درجات\", \"بعد\", \"معاقبة\"]}, {\"type\": \"explore\", \"h\": \"دورة <em>التقويم التكويني<\\/em>\", \"center\": \"التقويم التكويني\", \"nodes\": [[\"🎯\", \"إلى أين نذهب؟\", \"أهداف واضحة ومعايير نجاح يعرفها الطالب قبل أن يبدأ العمل.\"], [\"🔍\", \"أين نحن الآن؟\", \"أدلة من كل طالب: سبورات صغيرة، أسئلة، بطاقات، ملاحظة أثناء العمل.\"], [\"🧭\", \"كيف نصل؟\", \"تغذية راجعة محددة تُخبر الطالب بخطوته التالية.\"], [\"🔁\", \"نعدّل التدريس\", \"نعيد الشرح بطريقة أخرى، أو ننتقل، أو نشكّل مجموعة دعم مؤقتة.\"], [\"🙋\", \"الطالب مقيّمًا\", \"يقيّم الطالب عمله وعمل زميله وفق المعايير، فيصبح مسؤولًا عن تعلّمه.\"]]}, {\"type\": \"flips\", \"h\": \"أدوات تكشف <em>فهم الجميع<\\/em>\", \"cards\": [[\"🪧\", \"السبورات الصغيرة\", \"يكتب كل طالب إجابته ويرفعها مع زملائه في اللحظة نفسها.\", \"«اكتب ناتج ٣/٤ + ١/٤» وارفعوا معًا.\"], [\"🚦\", \"إشارات المرور\", \"بطاقة خضراء (فهمت)، صفراء (لست متأكدًا)، حمراء (أحتاج مساعدة) على الطاولة.\", \"تتّجه مباشرة إلى الطاولات ذات البطاقات الحمراء.\"], [\"🔑\", \"سؤال المفصل\", \"سؤال اختيار من متعدد في منتصف الدرس، كل بديل خاطئ فيه يكشف خطأً شائعًا محددًا.\", \"إن اختار نصف الصف البديل (ب) فقد خلطوا بين المفهومين.\"], [\"3️⃣\", \"٣ – ٢ – ١\", \"ثلاثة أشياء تعلّمتها، شيئان أثارا اهتمامي، سؤال واحد ما زال لديّ.\", \"نشاط ختامي بعد مقطع مرئي أو قراءة.\"], [\"✋\", \"الأصابع الخمسة\", \"يُظهر الطالب بأصابعه مدى ثقته بفهمه من ١ إلى ٥.\", \"قبل الانتقال إلى التمارين المستقلة.\"], [\"🎫\", \"بطاقة الخروج\", \"سؤال أو سؤالان مرتبطان بالهدف، تُفرز الإجابات لتخطيط الحصة القادمة.\", \"«متى نستخدم الفاصلة؟ اكتب جملة مثالًا».\"]]}, {\"type\": \"match\", \"h\": \"الأداة <em>ومتى نستخدمها<\\/em>\", \"pairs\": [[\"سؤال المفصل\", \"منتصف الدرس قبل الانتقال إلى فكرة جديدة\"], [\"بطاقة الخروج\", \"آخر دقيقتين لتخطيط الحصة القادمة\"], [\"إشارات المرور\", \"أثناء العمل المستقل لطلب المساعدة\"], [\"التقييم الذاتي بالمعايير\", \"قبل تسليم المهمة\"], [\"الاختبار القبلي القصير\", \"بداية الوحدة لمعرفة الخبرات السابقة\"]]}, {\"type\": \"order\", \"h\": \"رتّب خطوات <em>بطاقة الخروج<\\/em> الصحيحة\", \"steps\": [\"حدّد سؤالًا مرتبطًا بهدف الدرس\", \"وزّع البطاقات في آخر دقيقتين\", \"اجمعها وافرزها في ثلاث مجموعات: أتقن، قريب، يحتاج دعمًا\", \"خطّط بداية الحصة القادمة بناءً على الفرز\", \"عالج الخطأ الشائع ثم تحقّق من الفهم مجددًا\"]}, {\"type\": \"scen\", \"list\": [[\"أظهرت بطاقات الخروج أن ٦٠٪ من الطلاب أخطؤوا في المفهوم نفسه. ما الخطوة الأفضل؟\", [\"أبدأ الحصة التالية بمعالجة قصيرة للمفهوم بطريقة مختلفة\", \"أكمل خطة الوحدة كما هي\", \"أعطيهم واجبًا إضافيًا في المفهوم نفسه\"], \"قيمة التقويم التكويني في أنه يغيّر قرارك التدريسي؛ ٦٠٪ مؤشر واضح على الحاجة إلى إعادة التدريس.\"], [\"طالب يرفع البطاقة الخضراء دائمًا، لكن إجاباته في التمارين خاطئة. ماذا تفعل؟\", [\"أطلب منه أن يشرح الفكرة لزميله وأستمع إليه\", \"أصدّق البطاقة؛ هو أعلم بنفسه\", \"ألومه أمام زملائه\"], \"التقييم الذاتي يحتاج إلى تدريب؛ الشرح للآخرين يكشف الفهم الحقيقي ويعلّم الطالب معايرة ثقته.\"], [\"تريد معرفة فهم الصف كله خلال ثلاثين ثانية. ماذا تستخدم؟\", [\"سؤال اختيار من متعدد يرفع الجميع إجاباتهم معًا\", \"أسأل الطالب المتميز في الصف\", \"اختبار ورقي قصير أصحّحه في البيت\"], \"الاستجابة الجماعية المتزامنة تعطيك صورة عن كل طالب في لحظتها.\"]]}, {\"type\": \"swap\", \"h\": \"أسئلة <em>تكشف<\\/em> الفهم بدل أن تخفيه\", \"pairs\": [[\"هل فهمتم؟\", \"اشرح لزميلك الخطوة الثانية بكلماتك.\"], [\"هل لديكم أسئلة؟\", \"اكتب سؤالًا واحدًا ما زال يحيّرك على ورقة لاصقة.\"], [\"من يعرف الإجابة؟\", \"اكتب إجابتك على السبورة الصغيرة، وارفعوها معًا.\"], [\"واضح؟\", \"بأصابعك من ١ إلى ٥: ما مدى ثقتك بحل مسألة مشابهة؟\"]]}, {\"type\": \"tps\", \"q\": \"طالب حصل على ٥ من ١٠ في اختبار قصير. ما المعلومات المهمة التي لا تخبرك بها هذه الدرجة؟\"}, {\"type\": \"task\", \"title\": \"صمّم سؤال مفصل واحد لدرسك القادم\", \"steps\": [\"اكتب سؤالًا مرتبطًا مباشرة بهدف الدرس\", \"ضع بديلًا صحيحًا وثلاثة بدائل يكشف كل منها خطأً شائعًا\", \"حدّد ماذا ستفعل إن اختار الطلاب كل بديل\"], \"min\": 5, \"example\": \"السؤال: أيّ الكسور التالية هو الأكبر؟\\nأ) ١/٣   ب) ١/٥   ج) ١/٤   د) كلها متساوية\\n• من اختار (ب): يظن أن المقام الأكبر يعني كسرًا أكبر ← نشاط طيّ الورق.\\n• من اختار (د): يظن أن البسط وحده يحدد القيمة ← مقارنة بالرسم.\\n• من اختار (أ): أتقن ← مهمة إثرائية.\"}, {\"type\": \"quiz\", \"qs\": [[\"الفرق الأساس ){background:#e0a21b}.qzo button:nth-child(4){background:#2f9a5a}\n.qzo button.dim{opacity:.25}.qzo button.win{transform:scale(1.03);box-shadow:0 0 0 6px var(--gold),0 6px 0 rgba(0,0,0,.2)}\n.tbar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:auto}\n.tbar i{display:block;height:100%;background:var(--ac);width:100%;transition:width 1s linear}\n.qzfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font:600 22px var(--body);color:var(--ink-soft)}\n\n/* pledge */\n.plw{display:grid;grid-template-columns:1fr 560px;gap:34px}\n.plo{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}\n.plo button{font:600 23px/1.45 var(--body);padding:18px 20px;border-radius:18px;border:3px solid transparent;background:var(--cream);color:var(--ink);cursor:pointer;text-align:right;box-shadow:0 8px 18px rgba(0,0,0,.2);transition:all .2s;display:flex;gap:12px;align-items:center}\n.plo button .e{font-size:30px}\n.plo button.on{border-color:var(--gold);background:#fff6df;transform:scale(1.02)}\n.cert{padding:34px 36px;text-align:center;border:3px double var(--gold);background:linear-gradient(#fffdf8,#fff6e6);min-height:600px;display:flex;flex-direction:column}\n.cert .seal{font-size:64px}\n.cert h3{margin:4px 0 4px;font:700 36px var(--display)}\n.cert .s2{font:500 21px var(--body);color:var(--ink-soft);margin-bottom:16px}\n.cert ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;text-align:right}\n.cert li{font:600 23px/1.45 var(--body);padding:12px 16px;border-radius:12px;background:#fff;border-inline-start:6px solid var(--ac);animation:stampin .5s cubic-bezier(.3,1.6,.5,1)}\n@keyframes stampin{from{transform:scale(1.4);opacity:0}}\n.cert .empty{font:500 22px var(--body);color:#a39a8b;margin:auto}\n.cert .sig{margin-top:auto;padding-top:18px;border-top:2px dashed var(--line);font:500 20px var(--body);color:var(--ink-soft);display:flex;justify-content:space-between}\n\n/* summary */\n.sumg{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:10px}\n.sumi{padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;min-height:330px;justify-content:center}\n.sumi .e{font-size:72px}\n.sumi p{margin:0;font:700 27px/1.45 var(--display)}\n.sumq{margin-top:30px;text-align:center;color:#fff;font:600 30px/1.6 var(--display)}\n.sumq::before,.sumq::after{content:\"❝\";color:var(--gold);margin:0 10px}\n.sumq::after{content:\"❞\"}\n\n/* closing */\n.end{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff}\n.end .e{font-size:110px;animation:bob 3s ease-in-out infinite}\n.end h1{font:700 92px var(--display);margin:6px 0}\n.end p{font:500 32px/1.6 var(--body);color:#c9d6e6;max-width:1100px;margin:0}\n.end .win{font:700 40px var(--display);color:var(--gold);margin:24px 0}\n.end .stats{display:flex;gap:22px;margin:10px 0 26px}\n.end .stats div{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);border-radius:20px;padding:14px 30px}\n.end .stats b{display:block;font:700 50px var(--display);color:var(--gold)}\n.end .stats span{font:500 21px var(--body);color:#c9d6e6}\n\n/* nav */\n#nav{position:absolute;left:0;right:0;bottom:0;height:88px;display:flex;align-items:center;gap:12px;padding:0 24px;box-sizing:border-box;background:rgba(6,18,32,.72);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.08);z-index:50}\n.navb{width:56px;height:56px;border-radius:14px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}\n.navb:hover{background:rgba(255,255,255,.18)}\n.navb.main{background:var(--gold);color:var(--ink)}\n.navb.off{opacity:.4}\n.navb svg{width:28px;height:28px}\n#dots{flex:1;display:flex;justify-content:center;gap:9px;align-items:center}\n#dots button{width:15px;height:15px;border-radius:50%;border:2.5px solid rgba(255,255,255,.55);background:transparent;cursor:pointer;padding:0;transition:all .25s}\n#dots button.seen{background:rgba(255,255,255,.35)}\n#dots button.on{background:var(--gold);border-color:var(--gold);transform:scale(1.35)}\n#where{color:#cfdbe8;font:500 20px var(--body);min-width:210px}\n#score{display:flex;gap:6px;align-items:center;flex:none}\n#score span{font:700 20px var(--display);color:#fff;padding:6px 12px;border-radius:10px;min-width:30px;text-align:center}\n#score .a{background:var(--ta)}#score .b{background:var(--tb)}\n#fx{position:absolute;inset:0;pointer-events:none;z-index:60}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style><\/head>\n<body>\n<div id=\"wrap\"><div id=\"stage\">\n<svg id=\"pattern\" width=\"1600\" height=\"900\" aria-hidden=\"true\"><defs><pattern id=\"p\" width=\"120\" height=\"120\" patternUnits=\"userSpaceOnUse\">\n<g fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\"><path d=\"M60 14 L74 46 L106 60 L74 74 L60 106 L46 74 L14 60 L46 46Z\"/><rect x=\"38\" y=\"38\" width=\"44\" height=\"44\" transform=\"rotate(45 60 60)\"/><circle cx=\"60\" cy=\"60\" r=\"8\"/><\/g><\/pattern><\/defs>\n<rect width=\"1600\" height=\"900\" fill=\"url(#p)\"/><\/svg>\n<div id=\"slides\"><\/div>\n<canvas id=\"fx\" width=\"1600\" height=\"900\"><\/canvas>\n<nav id=\"nav\" aria-label=\"التنقل\">\n  <button class=\"navb main\" id=\"next\" aria-label=\"التالي\" title=\"التالي (←)\"><svg viewBox=\"0 0 24 24\"><path d=\"M15 5l-7 7 7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n  <button class=\"navb\" id=\"prev\" aria-label=\"السابق\" title=\"السابق (→)\"><svg viewBox=\"0 0 24 24\"><path d=\"M9 5l7 7-7 7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n  <div id=\"where\"><\/div>\n  <div id=\"dots\"><\/div>\n  <div id=\"score\" title=\"نقاط الفريقين: الأزرق والبرتقا rue, \"لذلك تمنع الإجراءات الروتينية الواضحة نسبة كبيرة من المشكلات قبل حدوثها.\"], [\"مدح الطالب أمام الجميع مناسب لكل الطلاب.\", false, \"بعض الطلاب، خصوصًا الأكبر سنًا، يُحرَجون من المدح العلني؛ المدح الخاص أنسب لهم.\"], [\"تصحيح السلوك على انفراد يقلّل التحدّي والعناد.\", true, \"يحفظ كرامة الطالب ولا يضعه أمام جمهور يدفعه إلى المكابرة.\"]]}, {\"type\": \"fill\", \"h\": \"على ماذا تقوم <em>الإدارة الإيجابية<\\/em>؟\", \"text\": \"تقوم الإدارة الصفية الإيجابية على {الوقاية} قبل العلاج، وبناء {العلاقة} مع الطالب، و{الاتساق} في تطبيق القواعد، و{تعزيز} السلوك المرغوب.\", \"distract\": [\"العقاب\", \"التهديد\", \"الصراخ\"]}, {\"type\": \"explore\", \"h\": \"ستّ ركائز <em>لصفّ هادئ<\\/em>\", \"center\": \"صفّ إيجابي\", \"nodes\": [[\"📋\", \"القواعد\", \"قليلة (من ٣ إلى ٥)، مصاغة بالإيجاب، يشارك الطلاب في وضعها، ومعلّقة أمامهم.\"], [\"🔁\", \"الإجراءات\", \"روتين متدرَّب عليه للدخول وتوزيع الأدوات والانتقال وطلب المساعدة.\"], [\"💛\", \"العلاقات\", \"الطالب يتعاون مع من يشعر أنه يعرفه ويهتم به؛ اسمه وتحيته واهتماماته.\"], [\"🌟\", \"التعزيز\", \"مدح محدد للسلوك المرغوب أكثر بكثير من التنبيه على الخطأ.\"], [\"🤫\", \"التدخّل الهادئ\", \"أقل تدخّل ممكن أولًا: نظرة، اقتراب، إشارة، ثم تصاعد تدريجي.\"], [\"🪞\", \"القدوة\", \"هدوء المعلم ونبرة صوته وانضباطه في المواعيد يُعدي طلابه.\"]]}, {\"type\": \"flips\", \"h\": \"أساليب <em>تصنع الفرق<\\/em>\", \"cards\": [[\"🚪\", \"التحية على الباب\", \"استقبال الطلاب بأسمائهم عند الباب يبني العلاقة ويهيّئ بداية هادئة.\", \"مصافحة أو ابتسامة وسؤال: «كيف كانت مباراتك أمس؟»\"], [\"🗣️\", \"التعزيز المحدّد\", \"امدح السلوك بدقة لا الشخص بعموم، ليعرف الطالب ما الذي يكرّره.\", \"«أعجبني أنك انتظرت دورك ورفعت يدك».\"], [\"👀\", \"التدخّل غير اللفظي\", \"الاقتراب، النظرة، الإشارة… توقف السلوك دون أن توقف الدرس.\", \"تكمل الشرح وأنت واقف بجانب الطالب المنشغل.\"], [\"📅\", \"قاعدة ٢ × ١٠\", \"دقيقتان يوميًا لمدة عشرة أيام لحديث شخصي مع طالب صعب، بعيدًا عن الدروس.\", \"تسأله عن فريقه المفضل أو هوايته في الاستراحة.\"], [\"🔀\", \"الاختيارات المحدودة\", \"بدل الأمر المباشر، قدّم خيارين مقبولين لك، فيشعر الطالب بالسيطرة.\", \"«تبدأ بالسؤال الأول أم الثالث؟»\"], [\"🔔\", \"إشارة الهدوء\", \"إشارة متّفق عليها لطلب الانتباه بدل رفع الصوت.\", \"يد مرفوعة، أو تصفيق إيقاعي يردّده الطلاب.\"]]}, {\"type\": \"sort\", \"h\": \"وقائي أم <em>علاجي<\\/em>؟\", \"cats\": [\"وقائي\", \"علاجي\"], \"items\": [[\"تحديد إجراءات الدخول من أول أسبوع\", 0], [\"الاقتراب من طالب منشغل أثناء الشرح\", 1], [\"تحية الطلاب بأسمائهم عند الباب\", 0], [\"حديث خاص مع طالب بعد الحصة\", 1], [\"تجهيز الأدوات قبل بدء الحصة\", 0], [\"إعطاء خيارين لطالب يرفض العمل\", 1], [\"كتابة مهمة البداية على السبورة\", 0], [\"التواصل مع ولي الأمر بعد تكرار السلوك\", 1]]}, {\"type\": \"order\", \"h\": \"سلّم <em>التدخّل المتدرّج<\\/em>: من الأخف إلى الأشد\", \"steps\": [\"تجاهل مخطّط للسلوك البسيط العابر\", \"إشارة غير لفظية: نظرة أو اقتراب\", \"ذكر اسم الطالب بهدوء ضمن الشرح\", \"تذكير خاص وهادئ بالقاعدة\", \"حوار فردي مع الطالب بعد الحصة\", \"إشراك ولي الأمر أو الأخصائي الاجتماعي\"]}, {\"type\": \"scen\", \"list\": [[\"طالب يتحدث مع زميله أثناء الشرح بشكل متكرر. ما الاستجابة الأفضل؟\", [\"أقترب منه بهدوء وأكمل الشرح بجانبه\", \"أوقف الدرس وأوبّخه أمام الجميع\", \"أُخرجه من الصف فورًا\"], \"التدخّل غير اللفظي يوقف السلوك، ويحافظ على سير الدرس وعلى العلاقة.\"], [\"طالب يرفض أداء النشاط ويقول: «ما أبغى». ماذا تفعل؟\", [\"أقدّم له خيارين: يبدأ بالسؤال الأول أو الثالث\", \"أدخل معه في نقاش أمام الصف حتى يقتنع\", \"أتجاهله طوال الحصة\"], \"الاختيارات المحدودة تُخرج الطالب من موقف التحدّي، وتبقيه داخل المهمة.\"], [\"أول خمس دقائق من الحصة فوضى يوميًا. ما الحل الأنجع؟\", [\"أثبّت «مهمة بداية» قصيرة على السبورة يبدأها الطلاب فور دخولهم\", \"أرفع صوتي حتى يهدؤوا\", \"أنتظر بصمت حتى يهدؤوا وحدهم\"], \"الإجراءات الروتينية تمنع المشكلة قبل وقوعها بدل أن تعالجها بعده.\"]]}, {\"type\": \"swap\", \"h\": \"لغة المعلم <em>تصنع<\\/em> المناخ\", \"pairs\": [[\"توقّف عن الكلام!\", \"أحتاج انتباهك هنا الآن، شكرًا لك.\"], [\"أنت دائمًا مشاغب.\", \"هذا السلوك لا يناسب صفنا، وأنا أعرف أنك تستطيع أفضل منه.\"], [\"لماذا لم تحلّ الواجب؟!\", \"لاحظت أن الواجب لم يُحلّ، ما الذي حدث؟ كيف أساعدك؟\"], [\"إذا تكلّمت مرة أخرى سأُخرجك.\", \"تستطيع أن تعمل بهدوء هنا، أو تنتقل إلى الطاولة الأمامية. اختر.\"]]}, {\"type\": \"wheel\", \"h\": \"عجلة <em>الخبرات<\\/em>\", \"qs\": [\"ما أصعب موقف سلوكي واجهته؟ وكيف تصرّفت؟\", \"كيف تبني علاقة مع طالب صعب؟\", \"ما إشارتك الخاصة لطلب الهدوء؟\", \"كيف تكافئ دون أن يعتاد الطلاب المكافآت المادية؟\", \"ما القاعدة التي تتمسّك بها دائمًا؟ ولماذا؟\", \"كيف تتعامل مع طالب يجادلك أمام زملائه؟\"]}, {\"type\": \"task\", \"title\": \"اكتب ثلاثة إجراءات روتينية تريد تثبيتها في صفك\", \"steps\": [\"إجراء الدخول وبداية الحصة\", \"إجراء توزيع الأدوات وجمعها\", \"إجراء الانتقال بين الأنشطة وإشارة الهدوء\", \"كيف ستدرّب طلابك عليها في الأسبوع الأول؟\"], \"min\": 5, \"example\": \"• الدخول: يدخل الطلاب بهدوء، يضعون الحقائب، ويبدؤون «مهمة البداية» المكتوبة خلال دقيقة.\\n• الأدوات: قائد كل مجموعة يستلم السلة ويعيدها عند الإشارة.\\n• الانتقال: عدّ تنازلي من ٥ مع يد مرفوعة؛ عند الصفر الجميع في المكان الجديد.\\n• التدريب: نمثّل كل إجراء ونكرره حتى يُتقن، ونمدح من يلتزم به.\"}, {\"type\": \"quiz\", \"qs\": [[\"قاعدة ٢ × ١٠ تعني:\", [\"دقيقتان يوميًا لمدة عشرة أيام لحديث شخصي مع طالب صعب\", \"دقيقتان عقاب لكل عشر مخالفات\", \"عشرة طلاب في كل مجموعتين\", \"مكافأة كل عشرة أيام\"]], [\"أفضل وقت لتعليم الإجراءات الروتينية:\", [\"الأسابيع الأولى مع التدريب والتكرار\", \"بعد ظهور المشكلات\", \"منتصف الفصل الدراسي\", \"لا حاجة لتعليمها\"]], [\"التعزيز المحدّد هو:\", [\"مدح السلوك بدقة ليتكرّر\", \"قول «ممتاز» للجميع\", \"توزيع الحلوى\", \"رفع الدرجة\"]], [\"أول درجة في سلّم التدخّل:\", [\"أقل تدخّل ممكن، كالنظرة أو الاقتراب\", \"إخراج الطالب من الصف\", \"استدعاء ولي الأمر\", \"خصم الدرجات\"]], [\"عدد القواعد الصفية المناسب:\", [\"من ثلاث إلى خمس قواعد واضحة\", \"أكثر من عشرين قاعدة\", \"قاعدة واحدة فقط\", \"بلا قواعد\"]]]}, {\"type\": \"pledge\", \"opts\": [[\"🚪\", \"سأحيّي طلابي بأسمائهم على الباب\"], [\"📅\", \"سأطبّق قاعدة ٢ × ١٠ مع طالب واحد\"], [\"🔁\", \"سأدرّب طلابي على ثلاثة إجراءات روتينية\"], [\"🤫\", \"سأصحّح السلوك على انفراد\"], [\"🌟\", \"سأمدح السلوك بعبارات محددة\"], [\"👀\", \"سأبدأ بالإشارات غير اللفظية\"]]}, {\"type\": \"summary\", \"points\": [[\"💛\", \"العلاقة قبل القاعدة\"], [\"🔁\", \"الروتين يمنع الفوضى\"], [\"🌟\", \"امدح السلوك لا الشخص\"], [\"🤫\", \"أقل تدخّل ممكن أولًا\"], [\"🪞\", \"هدوؤك يُعدي طلابك\"]]}, {\"type\": \"closing\"}]};window.__D=D;\n<\/script>\n<script>\n(()=>{\nconst $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];\nconst stage=$('#stage');\nfunction fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}\naddEventListener('resize',fit);fit();\nconst AR=n=>String(n).replace(/\\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst KEYS=['أ','ب','ج','د'];\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction bump(el){if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}\nfunction shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}\n\n/* ---------- sound: soft, synthesised, offline ---------- */\nlet ac=null,sfxOn=true;\nfunction ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}\nfunction tone(f,d,type='sine',v=.12,t0=0,f2){const a=ctx();if(!a||!sfxOn)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();\n  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);\n  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}\nfunction noise(d,v=.15,t0=0,lp=1500,lp2){const a=ctx();if(!a||!s ", \"title\": \"التمايز في التعليم\", \"sub\": \"هدف واحد… وطرق متعدّدة للوصول\", \"icon\": \"🧭\", \"color\": \"#d99a1e\", \"floaters\": [\"🪜\", \"🎨\", \"📚\", \"🧩\", \"🌱\", \"⚖️\"], \"goals\": [[\"معرفي\", \"يوضّح مفهوم التمايز وعناصره: المحتوى، العملية، المُنتج، البيئة.\"], [\"مهاري\", \"يصمّم نشاطًا متدرّجًا بثلاثة مستويات.\"], [\"وجداني\", \"يتقبّل اختلاف الطلاب ويحترم أنماط تعلّمهم.\"]], \"quote\": \"نعلّم الطلاب كما هم، لا كما نتمنّى أن يكونوا.\", \"slides\": [{\"type\": \"cover\"}, {\"type\": \"goals\"}, {\"type\": \"poll\", \"e\": \"🧭\", \"q\": \"كم مستوى تقريبًا تلاحظ بين طلاب صفك؟\", \"opts\": [[\"1️⃣\", \"مستوى واحد متقارب\"], [\"2️⃣\", \"مستويان\"], [\"3️⃣\", \"ثلاثة مستويات\"], [\"➕\", \"أكثر من ثلاثة\"]]}, {\"type\": \"tf\", \"h\": \"ماذا تعرف <em>عن التمايز<\\/em>؟\", \"items\": [[\"التمايز يعني إعداد خطة مختلفة لكل طالب.\", false, \"يكفي غالبًا مستويان أو ثلاثة، مع مجموعات مرنة تتغيّر حسب الهدف.\"], [\"يمكن أن يبقى الهدف واحدًا وتختلف طرق الوصول إليه.\", true, \"التمايز يغيّر الطريق ويحافظ على الهدف، فلا يُحرم أحد من التعلّم الأساسي.\"], [\"التمايز خاص بطلاب صعوبات التعلّم.\", false, \"يشمل المتفوقين والمتوسطين وكل طالب؛ فلكلٍّ احتياجه.\"], [\"التقويم القبلي هو نقطة البداية للتمايز.\", true, \"لا يمكن أن نمايز دون أن نعرف أين يقف طلابنا بالضبط.\"]]}, {\"type\": \"fill\", \"h\": \"عرّف <em>التمايز<\\/em> في جملة\", \"text\": \"التمايز أن نُبقي {الهدف} واحدًا، ونُنوّع {المحتوى} و{العملية} و{المنتج} حسب {احتياجات} الطلاب.\", \"distract\": [\"الدرجة\", \"الاختبار\", \"أعمار\"]}, {\"type\": \"explore\", \"h\": \"أين <em>نمايز<\\/em>؟\", \"center\": \"التمايز\", \"nodes\": [[\"📚\", \"المحتوى\", \"ماذا يتعلّم الطالب وبأي مستوى؟ نصوص بمستويات، صور، مقاطع، أمثلة محسوسة أو مجرّدة.\"], [\"⚙️\", \"العملية\", \"كيف يعالج المعلومة؟ عمل فردي أو ثنائي أو جماعي، نشاط حركي أو بصري أو حواري.\"], [\"🎨\", \"المنتج\", \"كيف يُظهر تعلّمه؟ ملصق، تسجيل صوتي، مقال، نموذج، عرض شفهي.\"], [\"🏫\", \"البيئة\", \"أين وكيف يتعلّم؟ ركن هادئ، طاولات تعاونية، وقت إضافي، إضاءة وجلوس مناسبان.\"], [\"🔍\", \"على ماذا نبني؟\", \"على استعداد الطالب ومستواه، واهتماماته، وطريقته المفضّلة في التعلّم.\"]]}, {\"type\": \"flips\", \"h\": \"أدوات <em>عملية<\\/em> للتمايز\", \"cards\": [[\"🪜\", \"المهام المتدرّجة\", \"المهمة نفسها بثلاثة مستويات من الصعوبة: أساسي، متوسط، متقدم.\", \"حلّ المسألة / حلّها بطريقتين / اكتب مسألة مشابهة.\"], [\"#️⃣\", \"لوحة الاختيارات\", \"شبكة من ٩ أنشطة يختار منها الطالب ثلاثة تشكّل خطًا.\", \"لوحة «إكس-أو» لمراجعة الوحدة.\"], [\"🔄\", \"المجموعات المرنة\", \"مجموعات تتغيّر حسب الهدف ونتائج التقويم، لا مجموعات ثابتة طوال العام.\", \"مجموعة علاجية مؤقتة لعشر دقائق.\"], [\"🗂️\", \"بطاقات الدعم\", \"بطاقات تلميح أو مثال محلول يأخذها الطالب عند الحاجة.\", \"بطاقة «خطوات الحل» على طاولة جانبية.\"], [\"⚓\", \"الأنشطة المرساة\", \"أنشطة إثرائية جاهزة يعمل عليها من ينهي مبكرًا دون انتظار المعلم.\", \"ركن الألغاز والتحديات.\"], [\"📜\", \"عقد التعلّم\", \"اتفاق مع الطالب على مهام ومدة محددة يختار ترتيبها بنفسه.\", \"عقد أسبوعي لطالب متفوق في القراءة.\"]]}, {\"type\": \"match\", \"h\": \"الطالب <em>والدعم المناسب<\\/em>\", \"pairs\": [[\"طالب ضعيف في القراءة\", \"نص مسموع أو مبسّط مع صور\"], [\"طالب متفوق ينهي سريعًا\", \"مهمة إثرائية أعمق\"], [\"طالب يحب الرسم\", \"يُظهر فهمه بخريطة مصوّرة\"], [\"طالب كثير الحركة\", \"نشاط عملي أو محطات\"], [\"طالب خجول\", \"مشاركة كتابية أو ثنائية قبل الصف\"]]}, {\"type\": \"sort\", \"h\": \"تمايز في <em>المحتوى<\\/em> أم في <em>المنتج<\\/em>؟\", \"cats\": [\"المحتوى\", \"المنتج\"], \"items\": [[\"نصوص بثلاثة مستويات قراءة\", 0], [\"يختار الطالب بين ملصق أو تسجيل صوتي\", 1], [\"مقطع مرئي لمجموعة ونص لمجموعة أخرى\", 0], [\"تقديم الفهم بعرض شفهي أو مقال\", 1], [\"أمثلة محسوسة لمجموعة ومجرّدة لأخرى\", 0], [\"تصميم نموذج أو كتابة تقرير\", 1], [\"مفردات مساندة مع الصور\", 0], [\"إجابة شفهية بدل الكتابية\", 1]]}, {\"type\": \"scen\", \"list\": [[\"طالب متفوّق ينهي المهام بسرعة، ثم يبدأ بإزعاج زملائه. ماذا تفعل؟\", [\"أعطيه مهمة إثرائية أعمق: تحدٍّ أو سؤال تفكير\", \"أعطيه مزيدًا من التمارين نفسها\", \"أطلب منه الجلوس بهدوء حتى ينتهي الآخرون\"], \"المتفوّق يحتاج إلى عمق لا إلى كمّ؛ المزيد من الشيء نفسه عقاب على السرعة.\"], [\"طالب ضعيف في القراءة، والنشاط يعتمد على نص طويل. ما الأنسب؟\", [\"أقدّم النص نفسه مبسّطًا أو مسموعًا مع الصور، مع بقاء الهدف نفسه\", \"أعفيه من النشاط\", \"أطلب من زميله أن يجيب عنه\"], \"التمايز يغيّر الطريق ويحافظ على الهدف؛ الإعفاء يحرم الطالب من التعلّم.\"], [\"نتائج الاختبار القبلي: ثلث الصف أتقن المهارة مسبقًا. ما الخطوة الأفضل؟\", [\"أوجّههم إلى مهام تطبيقية وإثرائية بينما أدرّس البقية\", \"أشرح الدرس للجميع من البداية\", \"أعطيهم إجازة من الحصة\"], \"لا معنى لتدريس من أتقن ما يعرفه؛ الوقت يُستثمر في توسيع تعلّمهم.\"]]}, {\"type\": \"swap\", \"h\": \"من مهمة واحدة <em>إلى خيارات<\\/em>\", \"pairs\": [[\"حلّوا التمارين من ١ إلى ١٠.\", \"🟢 حلّ ١–٤ بمساعدة المثال · 🟡 حلّ ٣–٨ · 🔴 حلّ ٧–١٠ واكتب مسألة مشابهة.\"], [\"اكتبوا فقرة عن الماء.\", \"اختر: فقرة بإطار جاهز، أو فقرة حرّة، أو مقال إقناعي قصير.\"], [\"اقرأ القصة وأجب عن الأسئلة.\", \"اقرأ القصة أو استمع إليها، ثم أجب عن أسئلة مستواك.\"], [\"ارسم دورة الماء.\", \"ارسم دورة الماء، أو مثّلها بحركات، أو اشرحها في تسجيل صوتي.\"]]}, {\"type\": \"tps\", \"q\": \"تذكّر طالبًا لم يصل إلى الهدف رغم جهودك. ما الذي كان يحتاجه ولم تقدّمه له الحصة؟\"}, {\"type\": \"task\", \"title\": \"حوّل تمرينًا واحدًا من كتابك إلى ثلاثة مستويات\", \"steps\": [\"حدّد الهدف الذي يجب أن يحققه الجميع\", \"المستوى الأساسي: يحقّق الحدّ الأدنى من الهدف\", \"المستوى المتوسط: يطبّق في موقف جديد\", \"المستوى المتقدم: يحلّل أو يُبدع\"], \"min\": 5, \"example\": \"الهدف: إيجاد محيط المستطيل (الصف الرابع)\\n🟢 أساسي: احسب المحيط بعدّ الوحدات على شبكة مربعات.\\n🟡 متوسط: احسب محيط مستطيلات من أبعادها.\\n🔴 متقدم: صمّم حديقة محيطها ٢٤ مترًا بأكثر من شكل، وأيّها أكبر مساحة؟\"}, {\"type\": \"quiz\", \"qs\": [[\"عناصر التمايز الأربعة:\", [\"المحتوى، العملية، المنتج، البيئة\", \"القراءة، الكتابة، الحساب، العلوم\", \"الهدف، الدرجة، الاختبار، الواجب\", \"الصف، المدرسة، البيت، المجتمع\"]], [\"المجموعات المرنة هي:\", [\"مجموعات تتغيّر حسب الهدف ونتائج التقويم\", \"مجموعات ثابتة طوال العام\", \"مجموعات حسب أماكن الجلوس\", \"مجموعات يختارها الطلاب دائمًا\"]], [\"لوحة الاختيارات (إكس-أو) تتيح للطالب:\", [\"اختيار ثلاثة أنشطة تشكّل خطًا من تسعة\", \"اللعب بدل التعلّم\", \"اختيار درجته\", \"ترك الأنشطة الصعبة كلها\"]], [\"قبل أن تمايز يجب أن:\", [\"تعرف مستويات طلابك بتقويم قبلي\", \"تُعدّ ثلاثين خطة\", \"تفصل الطلاب الضعاف\", \"تلغي الأهداف\"]], [\"المهمة المناسبة للطالب المتفوق:\", [\"أعمق وأكثر تحدّيًا\", \"أكثر عددًا من النوع نفسه\", \"مساعدة المعلم في التصحيح\", \"لا شيء حتى ينتهي الآخرون\"]]]}, {\"type\": \"pledge\", \"opts\": [[\"🔍\", \"سأبدأ وحدتي بتقويم قبلي قصير\"], [\"🪜\", \"سأصمّم مهمة بثلاثة مستويات أسبوعيًا\"], [\"⚓\", \"سأعدّ أنشطة إثرائية جاهزة للمتفوقين\"], [\"🔄\", \"سأغيّر مجموعاتي حسب الأهداف\"], [\"🎨\", \"سأتيح خيارين لإظهار التعلّم\"], [\"🗂️\", \"سأجهّز بطاقات دعم للطلاب المتعثرين\"]]}, {\"type\": \"summary\", \"points\": [[\"🎯\", \"الهدف ثابت والطرق متعدّدة\"], [\"🔍\", \"التقويم القبلي بداية التمايز\"], [\"🪜\", \"ثلاثة مستويات تكفي\"], [\"🔄\", \"المجموعات مرنة لا ثابتة\"], [\"⚖️\", \"العدل: لكل طالب ما يحتاجه\"]]}, {\"type\": \"closing\"}]};window.__D=D;\n<\/script>\n<script>\n(()=>{\nconst $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];\nconst stage=$('#stage');\nfunction fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}\naddEventListener('resize',fit);fit();\nconst AR=n=>String(n).replace(/\\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst KEYS=['أ','ب','ج','د'];\nfunction shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction bump(el){if(!el)return;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}\nfunction shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}\n\n/* ------ , true, \"وهذا ما يفتح باب الحوار والتبرير والمقارنة بين الآراء.\"]]}, {\"type\": \"fill\", \"h\": \"أين يقع <em>التفكير العالي<\\/em>؟\", \"text\": \"التفكير العالي يتجاوز {التذكّر} إلى {التحليل} و{التقويم} و{الإبداع}، ويحتاج إلى {وقت} انتظار كافٍ.\", \"distract\": [\"الحفظ\", \"النسخ\", \"سرعة\"]}, {\"type\": \"explore\", \"h\": \"سُلّم <em>بلوم<\\/em> المعدّل\", \"center\": \"مستويات التفكير\", \"nodes\": [[\"📚\", \"التذكّر\", \"استرجاع المعلومات كما هي. أفعاله: عدّد، سمِّ، عرّف. مثال: «عدّد مراحل دورة الماء».\"], [\"🗣️\", \"الفهم\", \"شرح المعنى بأسلوب الطالب. أفعاله: وضّح، لخّص، أعطِ مثالًا. «وضّح كيف يتكوّن المطر».\"], [\"🛠️\", \"التطبيق\", \"استخدام المعرفة في موقف جديد. أفعاله: احسب، طبّق، نفّذ. «احسب استهلاك أسرتك من الماء».\"], [\"🔍\", \"التحليل\", \"تفكيك الكل وإيجاد العلاقات. أفعاله: قارن، ميّز، صنّف. «قارن بين ماء البحر وماء الأفلاج».\"], [\"⚖️\", \"التقويم\", \"حكم مبرّر وفق معايير. أفعاله: احكم، دافع، انقد. «أيّ طرق الترشيد أنجح؟ برّر».\"], [\"✨\", \"الإبداع\", \"إنتاج فكرة أو حل جديد. أفعاله: صمّم، اقترح، ابتكر. «صمّم حملة لترشيد الماء».\"]]}, {\"type\": \"flips\", \"h\": \"أدوات <em>تُشعل<\\/em> التفكير\", \"cards\": [[\"🌀\", \"«ماذا لو؟»\", \"سؤال افتراضي يغيّر شرطًا في الموقف ليتخيّل الطلاب النتائج.\", \"«ماذا لو اختفى النحل من العالم؟»\"], [\"🎩\", \"قبعات التفكير الست\", \"ينظر الطلاب إلى القضية من ست زوايا: الحقائق، المشاعر، المخاطر، الفوائد، الإبداع، التنظيم.\", \"مناقشة «منع الهواتف في المدرسة» بالقبعات.\"], [\"🔗\", \"السبب والنتيجة\", \"خريطة تربط الأسباب بالنتائج لتعميق الفهم وكشف العلاقات.\", \"أسباب التصحّر ونتائجه على الزراعة.\"], [\"💭\", \"التفكير بصوت عالٍ\", \"يُظهر المعلم خطوات تفكيره وهو يحل المسألة، فيتعلّم الطلاب طريقة التفكير.\", \"«أول ما ألاحظه… لذلك سأبدأ بـ…»\"], [\"⚔️\", \"المناظرة المصغّرة\", \"فريقان يدافعان عن رأيين متعارضين بالأدلة، ثم يتبادلان المواقف.\", \"«الواجب المنزلي: مفيد أم غير مفيد؟»\"], [\"📌\", \"رأي ودليل\", \"يكتب الطالب رأيه، ثم دليلًا يدعمه، ثم تفسيرًا يربط بينهما.\", \"«أرى أن… لأن… والدليل…»\"]]}, {\"type\": \"match\", \"h\": \"الفعل <em>ومستواه<\\/em>\", \"pairs\": [[\"عدّد\", \"التذكّر\"], [\"لخّص بأسلوبك\", \"الفهم\"], [\"قارن وميّز\", \"التحليل\"], [\"احكم وبرّر\", \"التقويم\"], [\"صمّم واقترح\", \"الإبداع\"]]}, {\"type\": \"sort\", \"h\": \"سؤال <em>مغلق<\\/em> أم <em>مفتوح<\\/em>؟\", \"cats\": [\"مغلق\", \"مفتوح\"], \"items\": [[\"كم عدد كواكب المجموعة الشمسية؟\", 0], [\"لماذا يستقرّ الإنسان قرب مصادر الماء؟\", 1], [\"ما عاصمة سلطنة عُمان؟\", 0], [\"كيف تحلّ مشكلة الزحام أمام المدرسة؟\", 1], [\"اذكر ثلاثة أنواع من الصخور.\", 0], [\"ما رأيك في نهاية القصة؟ ولماذا؟\", 1], [\"في أي عام بُنيت قلعة نزوى؟\", 0], [\"ماذا يحدث لو اختفى النحل؟\", 1]]}, {\"type\": \"scen\", \"list\": [[\"طرحت سؤالًا عميقًا فساد الصمت عشر ثوانٍ. ماذا تفعل؟\", [\"أعيد صياغة السؤال أو أعطي مثالًا، وأمنحهم دقيقة: فكّر، زاوج، شارك\", \"أجيب بنفسي لأوفّر الوقت\", \"أنتقل إلى سؤال أسهل\"], \"الصمت قد يعني أن الطلاب يفكّرون؛ الحوار الثنائي يمنحهم ثقة قبل المشاركة.\"], [\"طالب أجاب إجابة صحيحة مختصرة: «لأنه مهم». ما الاستجابة الأفضل؟\", [\"أسأله: «ما الذي يجعلك تقول ذلك؟ أعطنا دليلًا»\", \"أقول: «أحسنت» وأنتقل\", \"أصحّح إجابته وأكملها بنفسي\"], \"طلب الدليل والتوسّع يحوّل الإجابة القصيرة إلى تفكير عميق.\"], [\"تريد أن يقارن الطلاب بين نصّين، لكنهم يكتبون ملخّصًا لكل نص فقط. ما الحل؟\", [\"أقدّم منظّمًا بصريًا (أوجه الشبه والاختلاف) وجملًا مساعدة\", \"أطلب منهم إعادة الكتابة دون توضيح\", \"ألغي المقارنة لأنها صعبة\"], \"السقالات تساعد الطلاب على الانتقال من التلخيص إلى التحليل.\"]]}, {\"type\": \"swap\", \"h\": \"ارتقِ <em>بالسؤال<\\/em>\", \"pairs\": [[\"ما مراحل دورة الماء؟\", \"ماذا يحدث لو توقّفت مرحلة التبخّر؟\"], [\"من هو بطل القصة؟\", \"هل كان تصرّف البطل صحيحًا؟ دافع عن رأيك.\"], [\"ما مساحة المستطيل؟\", \"صمّم مستطيلين مختلفين لهما المساحة نفسها.\"], [\"عدّد فوائد النخلة.\", \"قارن بين النخلة وشجرة الغاف في تكيّفهما مع البيئة.\"]]}, {\"type\": \"wheel\", \"h\": \"عجلة <em>الأسئلة الكبيرة<\\/em>\", \"qs\": [\"ماذا لو أُلغيت الكتب المدرسية أسبوعًا كاملًا؟\", \"ما السؤال الذي غيّر طريقة تف ه الحقيقي.\"], [\"تريد الاستفادة من أداة في مراجعة كتابات الطلاب. ما التصرّف السليم؟\", [\"أحذف الأسماء والبيانات الشخصية، وأراجع الحكم النهائي بنفسي\", \"أرفع الأعمال بأسماء الطلاب ودرجاتهم\", \"أعتمد ما تقترحه الأداة نهائيًا\"], \"حماية البيانات واجب، والحكم التربوي النهائي يبقى للمعلم.\"]]}, {\"type\": \"swap\", \"h\": \"حسّن <em>الأمر<\\/em>\", \"pairs\": [[\"أسئلة عن الكسور.\", \"اكتب ٥ أسئلة اختيار من متعدد عن جمع الكسور للصف الرابع، مع بديل يكشف خطأ جمع المقامات، ثم أجب عنها.\"], [\"اشرح البناء الضوئي.\", \"أنت معلم علوم. اشرح البناء الضوئي لطلاب الصف الرابع في خمس جمل قصيرة، مع تشبيه من الحياة اليومية.\"], [\"اعمل خطة درس.\", \"صمّم خطة درس مدتها ٤٠ دقيقة عن الجمع بإعادة التجميع للصف الثاني: تهيئة، نشاط ثنائي، بطاقة خروج.\"], [\"قصة للأطفال.\", \"اكتب قصة من ١٥٠ كلمة لطلاب الصف الثالث عن طفل في سوق نزوى، توضّح قيمة الأمانة، وانتهِ بسؤالين للنقاش.\"]]}, {\"type\": \"tps\", \"q\": \"ما المهمة التي تستهلك أكثر وقتك أسبوعيًا؟ وكيف يمكن أن يساعدك الذكاء الاصطناعي فيها دون أن يمسّ دورك التربوي؟\"}, {\"type\": \"task\", \"title\": \"اكتب أمرًا (Prompt) لدرس ستقدّمه هذا الأسبوع\", \"steps\": [\"الدور: «أنت معلم … خبير»\", \"السياق: الصف، ومستوى الطلاب، والهدف\", \"المهمة: ماذا تريد بالتحديد؟\", \"الشكل: العدد والتنسيق (جدول، نقاط، أسئلة مع إجابات)\"], \"min\": 5, \"example\": \"«أنت معلم لغة عربية خبير. طلابي في الصف السادس، ومستواهم متفاوت. الهدف: التمييز بين الفاعل والمفعول به.\\nاكتب ٦ جمل قصيرة من بيئة عُمانية بثلاثة مستويات (سهل، متوسط، صعب)، وضع تحت كل جملة سؤالًا: أين الفاعل؟ وأين المفعول به؟\\nقدّمها في جدول مع الإجابات في عمود منفصل.»\"}, {\"type\": \"quiz\", \"qs\": [[\"«الهلوسة» في الذكاء الاصطناعي تعني:\", [\"إنتاج معلومات خاطئة تبدو مقنعة\", \"توقّف الأداة عن العمل\", \"بطء الاستجابة\", \"رفض الإجابة\"]], [\"أول ما تفعله قبل رفع عمل طالب إلى أداة:\", [\"حذف اسمه وبياناته الشخصية\", \"تصويره بالهاتف\", \"إخبار زملائه\", \"تصحيحه يدويًا كاملًا\"]], [\"أيّ عنصر في الأمر يحدّد «لمن» المحتوى؟\", [\"السياق\", \"الشكل\", \"الدور\", \"المهمة\"]], [\"الحكم النها
