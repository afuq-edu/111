<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>واحة الأرقام</title>
<meta name="description" content="منصة رياضيات تفاعلية هادئة لطلبة صعوبات التعلم – الصفوف ٢ و٣ و٤">
<meta name="theme-color" content="#4E8C69">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="واحة الأرقام">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* واحة الأرقام: a calm oasis. Sand and soft sky, palm green and water teal; slow, gentle motion only. */
:root{
  --bg:#F7F2E8; --surface:#FFFDF8; --surface2:#F0E9DA; --ink:#2C3A3E; --muted:#68797C; --line:#E4DAC7;
  --palm:#4E8C69; --palm2:#7DB592; --water:#3D97A1; --water2:#8CCBD0; --sun:#E0A541; --coral:#D7836A; --lav:#8A84C0; --rose:#C9758A; --sand:#E9D6AE;
  --sky1:#D7EEF0; --sky2:#F6E7C9; --good:#4E8C69; --soft-red:#C9806E;
  --shadow:0 12px 30px -14px rgba(70,60,30,.35); --shadow-lg:0 24px 60px -20px rgba(60,50,20,.45);
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif; --body:"Tajawal",system-ui,"Segoe UI",sans-serif;
  --fs:1; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141C1F; --surface:#1B2629; --surface2:#233236; --ink:#E9EFEC; --muted:#A3B4B2; --line:#2E3F43;
  --palm:#86C4A0; --palm2:#5E9C79; --water:#6CC0C8; --water2:#2F7178; --sun:#EBC173; --coral:#EBA48E; --lav:#B2ACE6; --rose:#E59BAE; --sand:#4A4130;
  --sky1:#1C3540; --sky2:#2E2E3F; --good:#86C4A0; --soft-red:#E8A08E;
  --shadow:0 12px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141C1F; --surface:#1B2629; --surface2:#233236; --ink:#E9EFEC; --muted:#A3B4B2; --line:#2E3F43;
  --palm:#86C4A0; --palm2:#5E9C79; --water:#6CC0C8; --water2:#2F7178; --sun:#EBC173; --coral:#EBA48E; --lav:#B2ACE6; --rose:#E59BAE; --sand:#4A4130;
  --sky1:#1C3540; --sky2:#2E2E3F; --good:#86C4A0; --soft-red:#E8A08E;
  --shadow:0 12px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html{font-size:calc(17px * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.75;direction:rtl;overflow-x:hidden;min-height:100vh;
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--sun) 16%,transparent) 1px,transparent 0);background-size:28px 28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:14px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.3;margin:0;text-wrap:balance}
[hidden]{display:none!important}
.wrap{max-width:1140px;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}
img,svg{max-width:100%}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:10px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-family:var(--display);font-weight:800;font-size:1.2rem;background:none;border:0;padding:0}
.brand svg{width:42px;height:42px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))}
.top .sp{flex:1}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.15rem;transition:transform .25s,background .25s}
.icon-btn:hover{transform:translateY(-2px);background:var(--surface2)}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;font-weight:700}
.who .av{width:34px;height:34px;font-size:1.2rem}
.pts{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--sun) 20%,var(--surface));color:var(--ink);border-radius:999px;padding:2px 12px;font-weight:800}
.pts.bump{animation:bump .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{40%{transform:scale(1.35)}}

/* ---------- hero oasis ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,var(--sky1),var(--sky2));border-bottom:1px solid var(--line)}
.scene{position:absolute;inset:0;z-index:-1;width:100%;height:100%}
.hero-in{position:relative;padding-block:34px 150px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.hero h1{font-size:clamp(2.3rem,7vw,4rem);font-weight:800;color:var(--ink);letter-spacing:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.hero h1 span{background:linear-gradient(90deg,var(--palm),var(--water),var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:sheen 8s ease-in-out infinite}
@keyframes sheen{50%{background-position:100% 0}}
.hero p.lead{font-size:1.15rem;max-width:640px;margin:0;color:var(--ink);opacity:.86;animation:rise .9s .12s cubic-bezier(.2,.8,.2,1) both}
.credit{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line);border-radius:18px;padding:8px 16px;font-size:.92rem;animation:rise .9s .24s cubic-bezier(.2,.8,.2,1) both;backdrop-filter:blur(4px)}
.credit b{color:var(--palm)}
.hero .logo-big{width:118px;height:118px;animation:floaty 6s ease-in-out infinite,rise .9s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 14px 22px rgba(0,0,0,.18))}
@keyframes floaty{50%{transform:translateY(-8px)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
.sway.b{animation-duration:9s;animation-delay:-3s}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.2deg)}}
.cloud{animation:drift 60s linear infinite}
.cloud.c2{animation-duration:85s;animation-delay:-40s}
@keyframes drift{from{transform:translateX(-30%)}to{transform:translateX(130%)}}
.sunrays{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 5s ease-out infinite;opacity:0}
.ripple.r2{animation-delay:-2.5s}
@keyframes ripple{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.fdig{font-family:var(--display);font-weight:800;animation:fdig 14s linear infinite;opacity:0}
@keyframes fdig{0%{opacity:0;transform:translateY(0)}15%{opacity:.55}85%{opacity:.4}100%{opacity:0;transform:translateY(-160px)}}
.bird{animation:bird 26s linear infinite}
@keyframes bird{from{transform:translateX(110%)}to{transform:translateX(-20%)}}

/* doors on landing */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin:-110px auto 30px;position:relative;z-index:2;max-width:860px}
.door{position:relative;border:0;border-radius:30px;padding:26px 22px 24px;text-align:center;color:#fff;box-shadow:var(--shadow-lg);overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;animation:rise .8s both}
.door:nth-child(2){animation-delay:.12s}
.door:hover{transform:translateY(-6px) scale(1.015)}
.door .em{font-size:3.4rem;display:block;animation:floaty 5s ease-in-out infinite}
.door h2{font-size:1.75rem;color:#fff}
.door p{margin:4px 0 0;opacity:.92}
.door.st{background:linear-gradient(140deg,#4E8C69,#3D97A1)}
.door.tc{background:linear-gradient(140deg,#8A84C0,#C9758A)}
.door::after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),transparent 40%);animation:spin 18s linear infinite;pointer-events:none}

.feature-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:10px 0 40px}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);animation:rise .8s both}
.feat .fi{font-size:1.8rem}
.feat h3{font-size:1.1rem;margin:4px 0}
.feat p{margin:0;color:var(--muted);font-size:.95rem}

/* ---------- generic ---------- */
main{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.page{animation:pagein .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pagein{from{opacity:0;transform:translateY(14px)}}
.sec-h{display:flex;align-items:center;gap:12px;margin:28px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:1.6rem}
.sec-h .ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;background:color-mix(in srgb,var(--c,var(--palm)) 18%,var(--surface));flex:none}
.sec-h .sp{flex:1}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(var(--min,240px),1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 22px;border-radius:16px;border:0;font-weight:700;font-size:1.05rem;background:var(--palm);color:#fff;box-shadow:0 8px 18px -10px color-mix(in srgb,var(--palm) 80%,black);transition:transform .2s,filter .2s,box-shadow .2s;text-decoration:none}
:root[data-theme="dark"] .btn,.dark-btn-fix{color:#10201a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10201a}}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.water{background:var(--water)}
.btn.sun{background:var(--sun);color:#2c2108}
.btn.lav{background:var(--lav)}
.btn.rose{background:var(--rose)}
.btn.sm{min-height:40px;padding:4px 14px;font-size:.95rem;border-radius:12px}
.btn.big{min-height:64px;font-size:1.25rem;padding:10px 30px;border-radius:20px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.sample{background:color-mix(in srgb,var(--sun) 25%,var(--surface));color:var(--ink)}
.tag.sug{background:color-mix(in srgb,var(--lav) 22%,var(--surface));color:var(--ink)}
.tag.ok{background:color-mix(in srgb,var(--palm) 22%,var(--surface));color:var(--ink)}
.tag.warn{background:color-mix(in srgb,var(--coral) 24%,var(--surface));color:var(--ink)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .e{font-size:3rem;display:block;animation:floaty 5s ease-in-out infinite}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:8px 14px;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--water);outline:none}
label.f{display:block;font-weight:700;margin-bottom:4px;font-size:.95rem}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--c,var(--water)) 22%,var(--surface));flex:none}

/* ---------- student pick ---------- */
.kid{border:2px solid transparent;background:var(--surface);border-radius:26px;padding:18px 12px;text-align:center;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s;animation:rise .6s both}
.kid:hover{transform:translateY(-5px);border-color:var(--palm2)}
.kid .av{width:84px;height:84px;font-size:3rem;margin:0 auto 8px;animation:floaty 6s ease-in-out infinite}
.kid b{display:block;font-size:1.2rem;font-family:var(--display)}
.gtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.gtab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 20px;font-weight:700;transition:all .25s}
.gtab.on{background:var(--palm);border-color:var(--palm);color:#fff}

/* ---------- student home ---------- */
.welcome{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:22px}
@media (max-width:760px){.welcome{grid-template-columns:1fr}}
.greet{background:linear-gradient(135deg,color-mix(in srgb,var(--palm) 16%,var(--surface)),color-mix(in srgb,var(--water) 14%,var(--surface)));border-radius:28px;padding:22px;border:1px solid var(--line);display:flex;gap:16px;align-items:center;animation:rise .6s both}
.greet .av{width:90px;height:90px;font-size:3.2rem;animation:floaty 5s ease-in-out infinite}
.greet h2{font-size:1.7rem}
.my-oasis{border-radius:28px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--sky1),var(--sky2));position:relative;min-height:190px;animation:rise .6s .1s both}
.my-oasis svg{display:block;width:100%;height:100%}
.my-oasis .lbl{position:absolute;top:10px;right:14px;background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:999px;padding:2px 12px;font-weight:700;font-size:.9rem}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes grow{from{transform:scale(0)}}

.task{display:flex;gap:14px;align-items:center;border-radius:22px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:right;width:100%;transition:transform .25s;animation:rise .6s both}
.task:hover{transform:translateX(-4px)}
.task .ti{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.8rem;flex:none;background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.task b{font-size:1.1rem;display:block}
.task small{color:var(--muted)}
.task .go{margin-inline-start:auto;font-size:1.5rem;color:var(--c)}
.task.done{opacity:.75}

.unit{margin-bottom:22px}
.unit h3{font-size:1.25rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.lcard{position:relative;border:0;text-align:right;border-radius:24px;padding:18px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .3s cubic-bezier(.2,.8,.2,1);overflow:hidden;animation:rise .6s both;display:flex;flex-direction:column;gap:6px;min-height:150px}
.lcard:hover{transform:translateY(-5px)}
.lcard .li{font-size:2.2rem}
.lcard b{font-size:1.1rem;font-family:var(--display)}
.lcard::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;background:var(--c)}
.lcard .stars{margin-top:auto;letter-spacing:2px;font-size:1.1rem}
.lcard.locked{opacity:.55;filter:grayscale(.6)}
.lcard .lock{position:absolute;left:14px;top:14px;font-size:1.3rem}

/* ---------- lesson ---------- */
.lhead{display:flex;align-items:center;gap:14px;margin:22px 0 10px;flex-wrap:wrap}
.lhead .li{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:2.1rem;background:color-mix(in srgb,var(--c) 20%,var(--surface));flex:none}
.lhead h2{font-size:1.6rem}
.ltabs{display:flex;gap:8px;margin:8px 0 18px;flex-wrap:wrap}
.ltab{flex:1;min-width:130px;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:12px;font-weight:800;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .25s}
.ltab.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.ltab .ok{color:var(--good)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:380px}
.stage .say{position:absolute;top:14px;left:14px}
.speak-btn{width:56px;height:56px;border-radius:50%;border:0;background:var(--water);color:#fff;font-size:1.5rem;display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--water);transition:transform .2s}
.speak-btn:hover{transform:scale(1.08)}
.speak-btn.on{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--water) 60%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
.step-text{font-size:1.45rem;font-weight:700;line-height:1.9;max-width:760px;margin:6px auto 14px;text-align:center;padding-inline:60px}
.step-vis{display:grid;place-items:center;min-height:200px;margin:8px 0 16px}
.step-anim{animation:stepin .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes stepin{from{opacity:0;transform:translateY(16px) scale(.98)}}
.dots{display:flex;justify-content:center;gap:8px;margin:6px 0}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);transition:all .3s}
.dots i.on{background:var(--c,var(--palm));width:30px;border-radius:8px}
.nav-row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

/* question */
.qtext{font-size:1.5rem;font-weight:800;text-align:center;margin:4px auto 10px;max-width:760px;padding-inline:60px;line-height:1.8}
.qvis{display:grid;place-items:center;min-height:120px;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;max-width:720px;margin:0 auto}
.opt{min-height:84px;border-radius:24px;border:3px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:800;font-size:2rem;transition:transform .2s,border-color .2s,background .2s;box-shadow:0 6px 0 var(--line);position:relative}
.opt.txt{font-size:1.35rem}
.opt:hover{transform:translateY(-3px);border-color:var(--water2)}
.opt.right{background:color-mix(in srgb,var(--palm) 22%,var(--surface));border-color:var(--palm);animation:yay .6s cubic-bezier(.3,1.7,.5,1)}
.opt.wrong{border-color:var(--soft-red);animation:nope .5s}
.opt.dim{opacity:.4}
@keyframes yay{40%{transform:scale(1.08)}}
@keyframes nope{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.feedback{text-align:center;min-height:56px;font-size:1.3rem;font-weight:800;margin-top:14px}
.feedback.good{color:var(--good)}
.feedback.soft{color:var(--soft-red)}
.hint{background:color-mix(in srgb,var(--sun) 16%,var(--surface));border-radius:16px;padding:10px 16px;max-width:640px;margin:10px auto 0;text-align:center;animation:rise .4s both}
.prog{height:14px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:4px 0 16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--palm2),var(--palm));border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* math visuals */
.eq{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--display);font-weight:800;font-size:3rem;direction:rtl;flex-wrap:wrap}
.eq b{min-width:56px;text-align:center;unicode-bidi:isolate}
.eq b.q{color:var(--water);border-bottom:4px dashed var(--water);min-width:70px}
.eq i{font-style:normal;color:var(--coral)}
.objs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px;font-size:2.4rem;line-height:1}
.objs span{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
.objs.counted span{position:relative}
.objs.counted span::after{content:attr(data-n);position:absolute;top:-10px;left:-6px;font-size:.9rem;background:var(--sun);color:#2c2108;border-radius:999px;padding:0 6px;font-family:var(--display);font-weight:800}
.blocks{display:flex;gap:18px;align-items:flex-end;justify-content:center;flex-wrap:wrap;direction:ltr}

.srow .nm{font-weight:800;font-size:1.1rem}

.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;min-width:90px}

.prep{font-size:1rem}

.chk input{width:22px;height:22px;margin-top:4px;accent-color:var(--palm);flex:none}
.chk.done span{text-decoration:line-through;color:var(--muted)}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}

.chart{width:100%;height:auto}

.install{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 16px;background:var(--sun);color:#2c2108;font-weight:800;animation:rise .6s both}
footer.ft{text-align:center;color:var(--muted);font-size:.9rem;padding:30px 16px calc(30px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:30px}

@media (max-width:600px){
  .step-text{padding-inline:0;margin-top:56px;font-size:1.25rem}

}

}

const EAST='٠١٢٣٤٥٦٧٨٩';
function N(x){return (window.S&&S.settings&&S.settings.eastern===false)?String(x):String(x).replace(/\d/g,d=>EAST[d])}

const eq=(a,op,b,c='؟')=>`<div class="eq"><b>${a}</b><i>${op}</i><b>${b}</b><i>=</i><b class="${c==='؟'?'q':''}">${c}</b></div>`;
const EM=['🍎','⭐','🐟','🌴','🐪','🍊','🦋','⚽','🌼','🐢','🍓','🐥'];

const PLACES=['الآحاد','العشرات','المئات','الآلاف'];
function pvTable(n,d,hl=-1){

function numline(a,b,{step=1,lab=1,mark=null,q=null,jumps=[],hide=[]}={}){

    if(l)s+=`<text x="${mx}" y="${82-hh-6}" text-anchor="middle" font-size="17" font-weight="800" fill="var(--coral)" opacity="0" style="animation:fadein .3s ${i*.45+.3}s forwards">${l}</text>`});

function seqBoxes(arr,qi){return `<div class="eq" style="font-size:2.3rem;gap:8px">${arr.map((v,i)=>`<b style="background:var(--surface2);border-radius:16px;padding:2px 12px" class="${i===qi?'q':''}">${i===qi?'؟':N(v)}</b>`).join('<i>،</i>')}</div>`}
function clock(h,m,size=210){

let AC;
function chime(good=true){if(!S.settings.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;(good?[523.25,659.25,783.99]:[311.13,277.18]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+i*.11);g.gain.linearRampToValueAtTime(good?.16:.08,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.11+.5);o.connect(g).connect(AC.destination);o.start(t+i*.11);o.stop(t+i*.11+.55)})}catch(e){}}
let voice=null,voiceWarned=false;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));voice=vs.find(v=>/SA|OM|AE/i.test(v.lang))||vs[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let curAudio=null;
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}if(curAudio){curAudio.pause();curAudio=null}$$('.speak-btn.on').forEach(b=>b.classList.remove('on'))}
function speak(text,btn){
  stopSpeak();if(!text)return;
  if(!('speechSynthesis' in window)){toast('القراءة الصوتية غير مدعومة في هذا المتصفح');return}
  if(!voice)pickVoice();
  if(!voice&&!voiceWarned){voiceWarned=true;toast('لا يوجد صوت عربي مثبت على هذا الجهاز؛ يمكن للمعلمة تسجيل شرحها بصوتها')}
  const u=new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,' ').replace(/[٠-٩]/g,d=>EAST.indexOf(d)));u.lang=voice?voice.lang:'ar-SA';if(voice)u.voice=voice;u.rate=S.settings.rate||.85;
  if(btn){btn.classList.add('on');u.onend=u.onerror=()=>btn.classList.remove('on')}
  speechSynthesis.speak(u);
}
/* teacher voice recordings live in IndexedDB (audio is too big for localStorage) */
const idb={db:null,open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open('wahat-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('rec');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async get(k){const db=await this.open();return new Promise(res=>{const q=db.transaction('rec').objectStore('rec').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})},
  async set(k,v){const db=await this.open();return new Promise(res=>{const tx=db.transaction('rec','readwrite');tx.objectStore('rec').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)})},
  async del(k){const db=await this.open();return new Promise(res=>{const tx=db.transaction('rec','readwrite');tx.objectStore('rec').delete(k);tx.oncomplete=()=>res(true)})},
  async keys(){try{const db=await this.open();return new Promise(res=>{const q=db.transaction('rec').objectStore('rec').getAllKeys();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}catch(e){return []}}};
async function playRec(key,btn){stopSpeak();const b=await idb.get(key).catch(()=>null);if(!b)return false;curAudio=new Audio(URL.createObjectURL(b));if(btn){btn.classList.add('on');curAudio.onended=()=>btn.classList.remove('on')}curAudio.play();return true}

function modal(html,{wide=false,onClose}={}){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog">${html}</div>`;document.body.appendChild(o);const close=()=>{o.remove();document.body.classList.remove('printing');stopSpeak();onClose&&onClose()};o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-close]'))close()});return {el:o,close}}

function oasisSVG(points){
  const slots=[[70,150,'palm',.55],[330,152,'palm',.6],[150,160,'🌼'],[250,162,'🌸'],[30,165,'🌷'],[200,150,'palm2',.45],[370,160,'🐪'],[110,158,'🐢'],[290,140,'🦜'],[60,120,'🦋'],[230,170,'🌼'],[380,120,'palm',.4],[20,140,'palm2',.4],[170,120,'🐦'],[310,168,'🌻'],[130,175,'🍉'],[350,175,'🦆'],[270,175,'🌺'],[40,178,'🐇'],[210,110,'🌈']];
  const n=Math.min(slots.length,Math.floor((points||0)/10)+1);let s=`<svg viewBox="0 0 400 190" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><circle cx="340" cy="40" r="20" fill="#F2C063" opacity=".9"/><path d="M0 150 Q100 125 200 145 T400 140 V190 H0Z" fill="#E7CC94"/><ellipse cx="200" cy="172" rx="70" ry="10" fill="#5DB3BA"/><ellipse class="ripple" cx="190" cy="172" rx="30" ry="5" fill="none" stroke="#fff"/>`;
  for(let i=0;i<n;i++){const [x,y,k,sc]=slots[i];s+=`<g class="grow" style="animation-delay:${i*.08}s">`;if(k==='palm'||k==='palm2')s+=palmG(x,y,sc,i%2?'sway b':'sway',k==='palm'?'#4E8C69':'#7DB592');else s+=`<text x="${x}" y="${y}" font-size="26" text-anchor="middle">${k}</text>`;s+='</g>'}

}
function level(p){return p>=200?['واحة مزهرة','🏝️']:p>=120?['نخلة باسقة','🌴']:p>=60?['نخلة صغيرة','🌿']:p>=20?['نبتة','🌱']:['بذرة','🌰']}

function cycleFont(){const a=[1,1.12,1.25];S.settings.fs=a[(a.indexOf(S.settings.fs)+1)%a.length]||1;save();applyPrefs()}
function cycleTheme(){const dark=S.settings.theme==='dark'||(S.settings.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);S.settings.theme=dark?'light':'dark';save();applyPrefs();render()}
const app=()=>$('#app');
function render(){

/* ---------- student home ---------- */
const KIND={lesson:['📖','درس','var(--palm)'],homework:['📝','واجب','var(--coral)'],game:['🎮','لعبة','var(--lav)']};
function itemDone(stu,x){if(x.kind==='homework')return !!(S.hw[x.id]&&S.hw[x.id][stu.id])||!!(stu.hwDone&&stu.hwDone[x.id]);const d=stu.done[x.lessonId]||{};return x.kind==='game'?!!d.game:!!d.cert}
function itemHref(stu,x){return x.kind==='homework'?`/s/${stu.id}/hw/${x.id}`:`/s/${stu.id}/l/${x.lessonId}/${x.kind==='game'?'game':'ex'}`}
function viewStudent(stu){
  const items=openItems(stu),up=upcoming(stu).slice(0,4),[lv,lvi]=level(stu.points);
  const openL=CUR.filter(u=>u.g===+stu.grade).map(u=>({u,L:u.L.map(l=>l[0]).filter(id=>gameOpen(stu,id))})).filter(x=>x.L.length);
  const certs=Object.values(stu.done).filter(d=>d.cert).length;
  shell(`<div class="wrap page"><div class="welcome"><div class="greet"><span class="av" style="--c:${GRADES[stu.grade].c}">${stu.avatar}</span><div><h2>أهلًا ${esc(stu.name)} 🌞</h2><div class="muted">${GRADES[stu.grade].name} · ${fmtDate(today())}</div><div class="row" style="margin-top:8px"><span class="pts">⭐ ${N(stu.points||0)} نقطة</span><span class="tag ok">${lvi} ${lv}</span>${stu.guest?'<span class="tag sample">ضيف</span>':''}</div></div></div>
  <div class="my-oasis"><span class="lbl">واحتي تكبر مع نقاطي</span>${oasisSVG(stu.points)}</div></div>

  ${up.length?`<div class="row" style="margin-top:14px">${up.map(x=>`<span class="tag">🔒 ${KIND[x.kind][1]}: ${esc(lessonTitle(x.lessonId))} · يُفتح ${fmtDate(x.from)}</span>`).join('')}</div>`:''}
  <div class="sec-h"><span class="ic" style="--c:var(--water)">📚</span><h2>دروسي</h2><div class="sp"></div><button class="btn sun sm" onclick="go('/s/${stu.id}/certs')">🏅 شهاداتي (${N(certs)})</button></div>
  ${openL.length?openL.map(({u,L})=>`<div class="unit"><h3>🌿 ${esc(u.u)}</h3><div class="grid" style="--min:220px">${L.map((id,i)=>{const l=LESSONS[id],d=stu.done[id]||{},st=(d.ex?1:0)+((d.act||0)>=60?1:0)+(d.game?1:0);return `<button class="lcard" style="--c:${GRADES[stu.grade].c};animation-delay:${i*.05}s" onclick="go('/s/${stu.id}/l/${id}/${lessonOpen(stu,id)?'ex':'game'}')"><span class="li">${ENG[l.e].ic}</span><b>${esc(lessonTitle(id))}</b><small class="muted">${lessonOpen(stu,id)?'شرح · نشاط · ألعاب':'ألعاب فقط'}</small><span class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}${d.cert?' 🏅':''}</span></button>`}).join('')}</div></div>`).join(''):`<div class="empty card"><span class="e">🔒</span>ستفتح معلمتك الدروس في موعدها.</div>`}

/* ---------- lesson ---------- */
function viewLesson(stu,lid,tab){
  const l=LESSONS[lid];if(!l)return go('/s/'+stu.id);
  const full=lessonOpen(stu,lid)||teacherOK;if(!full&&!gameOpen(stu,lid))return go('/s/'+stu.id);
  if(!full)tab='game';
  const d=stu.done[lid]||{},c=GRADES[l.g].c;
  shell(`<div class="wrap page" style="--c:${c}"><div class="lhead"><button class="icon-btn" aria-label="رجوع" onclick="go('/s/${stu.id}')">➡️</button><span class="li">${ENG[l.e].ic}</span><div><h2>${esc(lessonTitle(lid))}</h2><div class="muted">${GRADES[l.g].name} · ${esc(l.u)}</div></div></div>
  <div class="ltabs">${full?`<button class="ltab ${tab==='ex'?'on':''}" onclick="go('/s/${stu.id}/l/${lid}/ex')">📖 الشرح ${d.ex?'<span class="ok">✔</span>':''}</button><button class="ltab ${tab==='act'?'on':''}" onclick="go('/s/${stu.id}/l/${lid}/act')">✏️ النشاط ${(d.act||0)>=60?'<span class="ok">✔</span>':''}</button>`:''}<button class="ltab ${tab==='game'?'on':''}" onclick="go('/s/${stu.id}/l/${lid}/game')">🎮 الألعاب ${d.game?'<span class="ok">✔</span>':''}</button></div>
  <div id="stage"></div></div>`,stu);
  const st=$('#stage');
  if(tab==='act')runQuiz(st,stu,l,{n:S.settings.qCount||5,kind:'act'});else if(tab==='game')gameMenu(st,stu,l);else runExplain(st,stu,l);
}
function markDone(stu,lid,k,v){stu.done[lid]=stu.done[lid]||{};const d=stu.done[lid];const first=!d[k];if(k==='act')d.act=Math.max(d.act||0,v);else d[k]=v;if(!stu.guest)save();return first}
function maybeCert(stu,l){const d=stu.done[l.id];if(d&&d.ex&&(d.act||0)>=60&&d.game&&!d.cert){d.cert=today();addPoints(stu,10);setTimeout(()=>showCert(stu,l.id,true),700)}}
function runExplain(st,stu,l){
  const steps=ENG[l.e].ex(l.p);let i=0;let hasRec=false;
  idb.get('lesson:'+l.id).then(b=>{hasRec=!!b;const rb=$('#recBtn');if(rb)rb.hidden=!hasRec}).catch(()=>{});
  const draw=(auto)=>{const s=steps[i];
    st.innerHTML=`<div class="stage"><div class="say row"><button class="speak-btn" id="spk" aria-label="استمع">🔊</button><button class="speak-btn" id="recBtn" style="background:var(--lav)" title="شرح المعلمة بصوتها" aria-label="شرح المعلمة" ${hasRec?'':'hidden'}>👩‍🏫</button></div>
    <div class="dots">${steps.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
    <div class="step-anim"><p class="step-text">${s.t}</p><div class="step-vis">${s.v}</div></div>
    <div class="nav-row"><button class="btn ghost" ${i?'':'disabled'} id="prev">➡️ السابق</button><span class="muted">${N(i+1)} من ${N(steps.length)}</span>${i<steps.length-1?`<button class="btn" id="next">التالي ⬅️</button>`:`<button class="btn sun" id="fin">فهمت! إلى النشاط ✏️</button>`}</div></div>`;
    $('#spk').onclick=e=>speak(s.t,e.currentTarget);$('#recBtn').onclick=e=>playRec('lesson:'+l.id,e.currentTarget);
    $('#prev').onclick=()=>{i--;draw(true)};if($('#next'))$('#next').onclick=()=>{i++;draw(true)};
    if($('#fin'))$('#fin').onclick=e=>{if(markDone(stu,l.id,'ex',true)){addPoints(stu,2);sparkle(e.currentTarget)}chime();maybeCert(stu,l);go(`/s/${stu.id}/l/${l.id}/act`)};
    if(auto&&S.settings.autoSpeak)speak(s.t,$('#spk'));
  };draw(false);
}
const PRAISE=['ممتاز! 🌟','أحسنت! 👏','رائع جدًا! 🌴','إجابة صحيحة! 💚','بطل! ⭐','عمل جميل! 🌼'];
const SOFT=['لا بأس، حاول مرة أخرى 🌱','قريب! فكّر بهدوء 🙂','جرّب مرة ثانية، أنت تستطيع 💪'];
// one question at a time; first-try answers count, a hint appears after a miss, the answer is shown after two misses
function askOne(box,q,onDone,{compact=false}={}){
  let tries=0;
  box.innerHTML=`${compact?'':'<div class="say"><button class="speak-btn" id="qs" aria-label="استمع للسؤال">🔊</button></div>'}<p class="qtext">${q.t}</p><div class="qvis">${q.vis||''}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt ${o.txt||q.txto||/[ء-ي]/.test(o.h.replace(/<[^>]+>/g,''))?'txt':''}" data-v="${esc(o.v)}">${o.h}</button>`).join('')}</div><div class="feedback" id="fb"></div><div id="hintBox"></div>`;
  const qs=$('#qs',box);if(qs){qs.onclick=e=>speak(q.say||q.t,e.currentTarget);if(S.settings.autoSpeak)setTimeout(()=>speak(q.say||q.t,qs),250)}
  $$('.opt',box).forEach(b=>b.onclick=()=>{
    if(b.classList.contains('dim')||box.dataset.lock)return;
    const ok=b.dataset.v===q.ans,fb=$('#fb',box);
    if(ok){b.classList.add('right');$$('.opt',box).forEach(x=>x!==b&&x.classList.add('dim'));fb.className='feedback good';fb.textContent=tries?'أحسنت، وصلت إلى الجواب! 🌱':pick(PRAISE);chime(true);sparkle(b,tries?6:14);box.dataset.lock=1;speak(tries?'أحسنت':'ممتاز');setTimeout(()=>{delete box.dataset.lock;onDone(tries===0)},1300);return}
    tries++;b.classList.add('wrong','dim');chime(false);

function makeQs(l,n){const out=[],seen=new Set();let k=0;while(out.length<n&&k<n*20){const q=ENG[l.e].gen(l.p);const key=q.t+q.ans+(q.vis||'').length;k++;if(seen.has(key)&&k<n*10)continue;seen.add(key);out.push(q)}return out}

/* continuous assessment */
function lvl(p){return p>=90?['ممتاز','ok']:p>=80?['جيد جدًا','ok']:p>=65?['جيد','sug']:p>=50?['مقبول','sample']:['يحتاج إلى دعم','warn']}
function tAssess(){
  const g=tGrade,items=S.assess.items[g]=S.assess.items[g]||DEF_ITEMS(),ss=S.students.filter(s=>+s.grade===g),maxT=items.reduce((a,b)=>a+(+b.max||0),0);
  const mk=(sid,iid)=>(S.assess.marks[sid]||{})[iid];
  tShell('assess',`${gradeTabs('tAssess()')}<div class="card"><h3>بنود التقويم المستمر لـ${GRADES[g].name} <span class="tag sug">بنود مقترحة، عدّليها حسب لائحة التقويم</span></h3>
  ${items.map(it=>`<div class="row" style="margin-bottom:8px"><input type="text" value="${esc(it.name)}" data-in="${it.id}" style="flex:3;min-width:180px"><label class="row" style="flex:1;min-width:120px;gap:6px">الدرجة <input type="number" min="1" max="100" value="${it.max}" data-im="${it.id}" style="width:80px"></label>${it.auto==='hw'?'<span class="tag ok">يُحسب من واجبات المنصة</span>':''}<button class="btn ghost sm" data-idel="${it.id}">🗑️</button></div>`).join('')}
  <div class="row"><button class="btn ghost sm" id="iAdd">＋ بند جديد</button><button class="btn water sm" id="iAuto">⚡ احسبي درجة الواجبات من المنصة</button></div></div>
  <div class="sec-h"><h3 style="font-size:1.25rem">سجل الدرجات</h3><div class="sp"></div><button class="btn ghost sm" id="csv">⬇️ تصدير Excel (CSV)</button><button class="btn ghost sm" onclick="window.print()">🖨️ طباعة</button></div>
  ${ss.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>الطالب</th>${items.map(it=>`<th>${esc(it.name)}<br><small>(${N(it.max)})</small></th>`).join('')}<th>المجموع (${N(maxT)})</th><th>النسبة</th><th>المستوى</th></tr></thead><tbody>${ss.map(s=>{const tot=items.reduce((a,it)=>a+(+mk(s.id,it.id)||0),0),p=maxT?Math.round(tot/maxT*100):0,[lv,c]=lvl(p);
    return `<tr><td><b>${s.avatar} ${esc(s.name)}</b></td>${items.map(it=>`<td><input type="number" min="0" max="${it.max}" step="0.5" value="${mk(s.id,it.id)??''}" data-s="${s.id}" data-i="${it.id}"></td>`).join('')}<td><b>${N(tot)}</b></td><td>${N(p)}٪</td><td><span class="tag ${c}">${lv}</span></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">لا يوجد طلبة في هذا الصف.</div>'}`);
  $$('[data-in]').forEach(i=>i.onchange=()=>{items.find(x=>x.id===i.dataset.in).name=i.value.trim()||'بند';save()});
  $$('[data-im]').forEach(i=>i.onchange=()=>{items.find(x=>x.id===i.dataset.im).max=Math.max(1,+i.value||10);save();tAssess()});
  $$('[data-idel]').forEach(b=>b.onclick=()=>confirmBox('حذف هذا البند ودرجاته؟','حذف',()=>{S.assess.items[g]=items.filter(x=>x.id!==b.dataset.idel);save();tAssess()}));
  $('#iAdd').onclick=()=>{items.push({id:uid(),name:'بند جديد',max:10});save();tAssess()};
  $('#iAuto').onclick=()=>{let it=items.find(x=>x.auto==='hw');if(!it){it={id:uid(),name:'الواجبات',max:10,auto:'hw'};items.push(it)}let n=0;
    ss.forEach(s=>{const rs=S.schedule.filter(x=>x.kind==='homework'&&S.hw[x.id]&&S.hw[x.id][s.id]).map(x=>S.hw[x.id][s.id]);if(rs.length){const p=rs.reduce((a,r)=>a+r.score/r.total,0)/rs.length;(S.assess.marks[s.id]=S.assess.marks[s.id]||{})[it.id]=Math.round(p*it.max*2)/2;n++}});save();toast(n?'حُسبت درجة الواجبات لـ'+N(n)+' طالب':'لا توجد واجبات محلولة بعد');tAssess()};
  $$('input[data-s]').forEach(i=>i.onchange=()=>{const it=items.find(x=>x.id===i.dataset.i);let v=i.value===''?undefined:Math.min(+it.max,Math.max(0,+i.value));const m=S.assess.marks[i.dataset.s]=S.assess.marks[i.dataset.s]||{};if(v===undefined)delete m[it.id];else m[it.id]=v;save();tAssess()});
  $('#csv').onclick=()=>{const rows=[['الطالب',...items.map(i=>i.name+' ('+i.max+')'),'المجموع','النسبة','المستوى']];ss.forEach(s=>{const vals=items.map(it=>mk(s.id,it.id)??'');const tot=vals.reduce((a,b)=>a+(+b||0),0),p=maxT?Math.round(tot/maxT*100):0;rows.push([s.name,...vals,tot,p+'%',lvl(p)[0]])});
    download('﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),`التقويم-المستمر-${GRADES[g].name}.csv`,'text/csv')};
}
function download(text,name,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function recordDialog(lid){
  const m=modal(`<h3>🎙️ تسجيل شرح: ${esc(lessonTitle(lid))}</h3><p class="muted">اقرئي خطوات الشرح بصوتك الهادئ. يُحفظ التسجيل على هذا الجهاز ويعمل دون إنترنت.</p><div class="card" style="max-height:220px;overflow:auto;margin-bottom:12px">${ENG[LESSONS[lid].e].ex(LESSONS[lid].p).map((s,i)=>`<p style="margin:4px 0"><b>${N(i+1)}.</b> ${s.t}</p>`).join('')}</div><div style="text-align:center"><button class="speak-btn" id="rBtn" style="width:84px;height:84px;font-size:2.2rem;background:var(--rose);margin:0 auto">🎙️</button><p id="rSt" class="muted">اضغطي للبدء</p></div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-close>إغلاق</button></div>`,{onClose:()=>{if(rec&&rec.state==='recording')rec.stop()}});
  const btn=$('#rBtn',m.el),stt=$('#rSt',m.el);
  btn.onclick=async()=>{
    if(rec&&rec.state==='recording'){rec.stop();return}
    if(!navigator.mediaDevices||!window.MediaRecorder)return toast('التسجيل غير مدعوم في هذا المتصفح');
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast('لم يُسمح باستخدام الميكروفون')}
    const chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());btn.classList.remove('on');btn.textContent='🎙️';if(!chunks.length)return;await idb.set('lesson:'+lid,new Blob(chunks,{type:rec.mimeType||'audio/webm'}));stt.textContent='✅ حُفظ التسجيل';toast('حُفظ تسجيلك الصوتي 🎙️');m.close();tLessons()};
    rec.start();btn.classList.add('on');btn.textContent='⏹️';stt.textContent='جارٍ التسجيل... اضغطي للإيقاف';
  };
}

const STATUS=[['todo','لم يبدأ','tag'],['doing','جارٍ','tag sample'],['done','منجز','tag ok']];
function planProgress(subnav){
  const ids=CUR.filter(u=>u.g===tGrade).flatMap(u=>u.L.map(l=>l[0])),pl=id=>(S.lessons[id]=S.lessons[id]||{}).plan=(S.lessons[id].plan||{});

function planGoals(subnav,sid){
  const ss=S.students.slice().sort((a,b)=>a.grade-b.grade);const s=getStu(sid)||ss[0];

    stuPart=`<div class="row" style="margin-bottom:12px"><select id="gS" style="max-width:320px">${ss.map(x=>`<option value="${x.id}" ${x===s?'selected':''}>${x.avatar} ${esc(x.name)} – ${GRADES[x.grade].name}</option>`).join('')}</select></div>

  $$('[data-tx]').forEach(b=>b.onclick=e=>{e.preventDefault();S.tgoals=S.tgoals.filter(x=>x.id!==b.dataset.tx);save();re()});

   <label class="chk"><input type="checkbox" id="oCalm" ${s.calm?'checked':''}><span>وضع أهدأ (حركة أقل)</span></label>
   <div class="fgrid"><div><label class="f">عدد أسئلة النشاط</label><select id="oQ">${[3,4,5,6,8].map(n=>`<option value="${n}" ${n===s.qCount?'selected':''}>${N(n)}</option>`).join('')}</select></div><div><label class="f">سرعة الصوت</label><select id="oR">${[['.7','بطيئة'],['.85','هادئة'],['1','عادية']].map(([v,t])=>`<option value="${v}" ${+v===+s.rate?'selected':''}>${t}</option>`).join('')}</select></div></div>
   <button class="btn water sm" style="margin-top:10px" onclick="speak('مرحبًا بكم في واحة الأرقام. خمسة زائد ثلاثة يساوي ثمانية.')">🔊 تجربة الصوت</button> <small class="muted" id="vInfo"></small></div>
  <div class="card"><h3>💾 النسخ الاحتياطي</h3><p class="muted">كل البيانات محفوظة على هذا الجهاز فقط. احفظي نسخة احتياطية في ملف، واستعيديها على جهاز آخر لنقل الأسماء والدرجات (التسجيلات الصوتية لا تُنقل).</p><div class="row"><button class="btn" id="bExp">⬇️ حفظ نسخة احتياطية</button><label class="btn ghost">⬆️ استعادة من ملف<input type="file" accept=".json,application/json" id="bImp" hidden></label></div>
   <hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><button class="btn rose sm" id="bReset">🗑️ مسح كل البيانات والبدء من جديد</button></div></div>`);
  setTimeout(()=>{const v=$('#vInfo');if(v)v.textContent=voice?'الصوت المستخدم: '+voice.name:'لا يوجد صوت عربي مثبت على هذا الجهاز؛ سجّلي شرحك من «الدروس والصوت».'},300);
  $('#pSave').onclick=()=>{const a=$('#p1').value.trim(),b=$('#p2').value.trim();if(!/^\d{4,8}$/.test(a))return toast('الرقم السري من ٤ إلى ٨ أرقام');if(a!==b)return toast('الرقمان غير متطابقين');s.pin=a;save();toast('تم تغيير الرقم السري 🔐');tSettings()};
  $('#infoSave').onclick=()=>{s.teacher=$('#sTe').value.trim()||s.teacher;s.role=$('#sRo').value.trim();s.school=$('#sSc').value.trim();s.region=$('#sRe').value.trim();save();toast('حُفظت البيانات');tSettings()};
  const bind=(id,k)=>$(id).onchange=e=>{s[k]=e.target.checked;save();applyPrefs();toast('تم الحفظ')};
  bind('#oAll','openAll');bind('#oEast','eastern');bind('#oAuto','autoSpeak');bind('#oSnd','sound');bind('#oCalm','calm');
  $('#oQ').onchange=e=>{s.qCount=+e.target.value;save()};$('#oR').onchange=e=>{s.rate=+e.target.value;save()};
  $('#bExp').onclick=()=>download(JSON.stringify(S),`واحة-الأرقام-نسخة-${today()}.json`);
  $('#bImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.v||!d.students)throw 0;confirmBox('استبدال البيانات الحالية بالنسخة المحفوظة؟','استعادة',()=>{localStorage.setItem(KEY,JSON.stringify(d));window.S=load();save();toast('تمت الاستعادة ✅');tSettings()})}catch(x){toast('الملف غير صالح')}};r.readAsText(f)};
  $('#bReset').onclick=()=>confirmBox('سيُحذف كل شيء: الطلبة والدرجات والجدولة. هل أنت متأكدة؟','امسحي كل شيء',()=>{localStorage.removeItem(KEY);window.S=defState();S.students=[];S.schedule=[];save();toast('بدأتِ من جديد');tSettings()});
}

/* ---------- boot ---------- */
applyPrefs();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
</body>
</html>
