[["من يحكي القصة؟","قطرة ماء","سحابة","نخلة"],["ماذا حدث للقطرة عندما سخنتها الشمس؟","تحولت إلى بخار","تجمدت","اختفت للأبد"],["أين نزلت القطرة مطرا؟","على قمة الجبل الأخضر","على الصحراء","في البحر"],["ماذا يسمي العلماء رحلة القطرة؟","دورة الماء","رحلة الشمس","دورة الهواء"]]},{"id":"g4-15","title":"الْفَرِيقُ الْمُتَعَاوِنُ","lines":["اسْتَعَدَّ فَرِيقُ كُرَةِ الْقَدَمِ فِي الْمَدْرَسَةِ لِمُبَارَاةٍ مُهِمَّةٍ.","كَانَ مُعَاذٌ أَمْهَرَ لَاعِبٍ فِي الْفَرِيقِ، لَكِنَّهُ لَا يُمَرِّرُ الْكُرَةَ لِأَحَدٍ.","فِي الشَّوْطِ الْأَوَّلِ حَاوَلَ أَنْ يُسَجِّلَ وَحْدَهُ، فَأَخَذَ الْخَصْمُ مِنْهُ الْكُرَةَ مَرَّاتٍ.","انْتَهَى الشَّوْطُ الْأَوَّلُ بِتَقَدُّمِ الْفَرِيقِ الْآخَرِ بِهَدَفٍ.","جَمَعَ الْمُدَرِّبُ اللَّاعِبِينَ وَقَالَ: لَا يَفُوزُ لَاعِبٌ وَاحِدٌ، بَلْ يَفُوزُ الْفَرِيقُ.","فَكَّرَ مُعَاذٌ فِي كَلَامِ مُدَرِّبِهِ، وَقَرَّرَ أَنْ يُغَيِّرَ طَرِيقَتَهُ.","فِي الشَّوْطِ الثَّانِي مَرَّرَ الْكُرَةَ إِلَى زَمِيلِهِ الْمُنْفَرِدِ، فَسَجَّلَ هَدَفَ التَّعَادُلِ.","ثُمَّ تَبَادَلَ اللَّاعِبُونَ الْكُرَةَ بِذَكَاءٍ حَتَّى سَجَّلَ مُعَاذٌ هَدَفَ الْفَوْزِ.","احْتَفَلَ الْفَرِيقُ كُلُّهُ مَعًا، وَرَفَعُوا الْمُدَرِّبَ عَلَى أَكْتَافِهِمْ.","قَالَ مُعَاذٌ: طَعْمُ الْفَوْزِ مَعَ الْفَرِيقِ أَحْلَى مِنْ أَيِّ هَدَفٍ أُسَجِّلُهُ وَحْدِي."],"qs":[["ما مشكلة معاذ في البداية؟","لا يمرر الكرة لأحد","لا يجيد اللعب","يتأخر عن التدريب"],["كيف انتهى الشوط الأول؟","بتقدم الفريق الآخر","بفوز فريق معاذ","بالتعادل"],["ماذا قال المدرب؟","لا يفوز لاعب واحد بل يفوز الفريق","العب وحدك","لا تلمس الكرة"],["من سجل هدف الفوز؟","معاذ","المدرب","حارس المرمى"]]},{"id":"g4-16","title":"الْوَرَقَةُ الْأَخِيرَةُ","lines":["مَرِضَتْ سَلْمَى مَرَضًا طَوِيلًا، وَلَزِمَتْ سَرِيرَهَا بِجَانِبِ النَّافِذَةِ.","كَانَتْ تَنْظُرُ إِلَى شَجَرَةٍ قَدِيمَةٍ تَتَسَاقَطُ أَوْرَاقُهَا مَعَ رِيَاحِ الشِّتَاءِ.","قَالَتْ لِأُخْتِهَا: عِنْدَمَا تَسْقُطُ آخِرُ وَرَقَةٍ سَأَفْقِدُ الْأَمَلَ.","سَمِعَ ذَلِكَ جَارُهُمُ الرَّسَّامُ الْعَجُوزُ، فَحَزِنَ عَلَيْهَا كَثِيرًا.","فِي لَيْلَةٍ عَاصِفَةٍ تَسَاقَطَتِ الْأَوْرَاقُ كُلُّهَا إِلَّا وَرَقَةً وَاحِدَةً.","ظَلَّتِ الْوَرَقَةُ ثَابِتَةً أَيَّامًا، رَغْمَ الْمَطَرِ وَالرِّيحِ.","قَالَتْ سَلْمَى: إِذَا صَمَدَتْ هَذِهِ الْوَرَقَةُ، فَسَأَصْمُدُ أَنَا أَيْضًا.","بَدَأَتْ تَأْكُلُ وَتَتَنَاوَلُ دَوَاءَهَا، وَتَحَسَّنَتْ صِحَّتُهَا يَوْمًا بَعْدَ يَوْمٍ.","وَبَعْدَ شِفَائِهَا عَرَفَتْ أَنَّ الرَّسَّامَ رَسَمَ الْوَرَقَةَ عَلَى الْجِدَارِ فِي تِلْكَ اللَّيْلَةِ.","فَهِمَتْ سَلْمَى أَنَّ الْأَمَلَ دَوَاءٌ، وَأَنَّ الْعَطَاءَ الصَّادِقَ يُغَيِّرُ حَيَاةَ النَّاسِ."],"qs":[["أين كان سرير سلمى؟","بجانب النافذة","في الحديقة","في المطبخ"],["ماذا قالت سلمى عن آخر ورقة؟","عندما تسقط سأفقد الأمل","سأقطفها","لا تهمني"],["من رسم الورقة؟","الرسام العجوز","أخت سلمى","سلمى"],["ما الذي ساعد سلمى على الشفاء؟","الأمل","الريح","الشتاء"]]},{"id":"g4-17","title":"التَّاجِرُ الْأَمِينُ","lines":["كَانَ سَعْدٌ تَاجِرًا يَبِيعُ التَّمْرَ فِي سُوقِ الْمَدِينَةِ.","عُرِفَ بِأَمَانَتِهِ، فَكَانَ يُظْهِرُ التَّمْرَ الرَّدِيءَ وَلَا يُخْفِيهِ تَحْتَ الْجَيِّدِ.","قَالَ لَهُ تَاجِرٌ مُجَاوِرٌ: لِمَاذَا لَا تَخْلِطُ التَّمْرَ لِتَرْبَحَ أَكْثَرَ؟","أَجَابَ سَعْدٌ: الرِّبْحُ الْقَلِيلُ مَعَ الْأَمَانَةِ خَيْرٌ مِنَ الْكَثِيرِ مَعَ الْغِشِّ.","فِي الْبِدَايَةِ كَانَ رِبْحُ جَارِهِ أَكْثَرَ مِنْ رِبْحِهِ.","لَكِنَّ النَّاسَ اكْتَشَفُوا الْغِشَّ، وَتَوَقَّفُوا عَنِ الشِّرَاءِ مِنْ ذَلِكَ التَّاجِرِ.","وَصَارُوا يَأْتُونَ إِلَى سَعْدٍ مِنْ أَمَاكِنَ بَعِيدَةٍ لِأَنَّهُمْ يَثِقُونَ بِهِ.","كَبُرَتْ تِجَارَةُ سَعْدٍ، وَفَتَحَ دُكَّانًا ثَانِيًا وَثَالِثًا.","أَمَّا جَارُهُ فَجَاءَهُ نَادِمًا، وَطَلَبَ مِنْهُ أَنْ يُعَلِّمَهُ كَيْفَ يَكْسِبُ ثِقَةَ النَّاسِ.","قَالَ سَعْدٌ: الثِّقَةُ تُبْنَى بِالصِّدْقِ يَوْمًا بَعْدَ يَوْمٍ، وَتَضِيعُ بِكِذْبَةٍ وَاحِدَةٍ."],"qs":[["ماذا كان يبيع سعد؟","التمر","الأقمشة","السمك"],["ماذا اقترح التاجر المجاور؟","أن يخلط التمر ليربح أكثر","أن يغلق دكانه","أن يرفع الأسعار"],["لماذا جاء الناس إلى سعد من أماكن بعيدة؟","لأنهم يثقون به","لأن تمره رخيص فقط","لأنه قريب منهم"],["كيف تضيع الثقة كما قال سعد؟","بكذبة واحدة","بالصدق","بالعمل"]]},{"id":"g4-18","title":"الْمَرِّيخُ يُنَادِي","lines":["فِي نَادِي الْعُلُومِ شَاهَدَ الطُّلَّابُ فِيلْمًا عَنْ كَوْكَبِ الْمَرِّيخِ.","عَرَفُوا أَنَّهُ يُسَمَّى الْكَوْكَبَ الْأَحْمَرَ بِسَبَبِ لَوْنِ تُرْبَتِهِ.","وَأَنَّ الْيَوْمَ فِيهِ أَطْوَلُ قَلِيلًا مِنْ يَوْمِ الْأَرْضِ، وَأَنَّ جَوَّهُ بَارِدٌ جِدًّا.","سَأَلَتْ شَهْدُ: هَلْ يُمْكِنُ أَنْ يَعِيشَ النَّاسُ عَلَى الْمَرِّيخِ؟","قَالَتِ الْمُشْرِفَةُ: يَدْرُسُ الْعُلَمَاءُ ذَلِكَ، لَكِنْ لَا يُوجَدُ هُنَاكَ هَوَاءٌ نَتَنَفَّسُهُ.","اقْتَرَحَتِ الْمُشْرِفَةُ أَنْ يُصَمِّمَ الطُّلَّابُ بَيْتًا لِلْعَيْشِ عَلَى الْمَرِّيخِ.","رَسَمَتْ مَجْمُوعَةُ شَهْدٍ قُبَّةً شَفَّافَةً فِيهَا نَبَاتَاتٌ تُنْتِجُ الْأُكْسُجِينَ.","وَرَسَمَتْ مَجْمُوعَةٌ أُخْرَى بَيْتًا تَحْتَ الْأَرْضِ يَحْمِي مِنَ الْبَرْدِ وَالْأَشِعَّةِ.","عَرَضَتِ الْمَجْمُوعَاتُ تَصَامِيمَهَا، وَنَاقَشَ الطُّلَّابُ مَزَايَا كُلِّ فِكْرَةٍ.","قَالَتِ الْمُشْرِفَةُ: رُبَّمَا يَكُونُ بَيْنَكُمْ مَنْ يُشَارِكُ يَوْمًا فِي رِحْلَةٍ إِلَى الْمَرِّيخِ."],"qs":[["لماذا يسمى المريخ الكوكب الأحمر؟","بسبب لون تربته","لأنه حار جدا","لأن فيه نارا"],["كيف جو المريخ؟","بارد جدا","حار جدا","معتدل"],["ماذا رسمت مجموعة شهد؟","قبة شفافة فيها نباتات","سفينة","سيارة"],["لماذا لا يستطيع الناس العيش هناك الآن؟","لا يوجد هواء نتنفسه","لأنه قريب","لأنه مليء بالماء"]]},{"id":"g4-19","title":"جُحَا وَالْحِمَارُ","lines":["خَرَجَ جُحَا وَابْنُهُ إِلَى السُّوقِ وَمَعَهُمَا حِمَارٌ.","رَكِبَ جُحَا الْحِمَارَ وَمَشَى ابْنُهُ، فَقَالَ النَّاسُ: يَا لَهُ مِنْ أَبٍ قَاسٍ!","نَزَلَ جُحَا وَأَرْكَبَ ابْنَهُ، فَقَالُوا: يَا لَهُ مِنِ ابْنٍ لَا يَحْتَرِمُ أَبَاهُ!","رَكِبَا مَعًا، فَقَالُوا: مَا أَقْسَى قَلْبَيْهِمَا عَلَى هَذَا الْحِمَارِ الْمِسْكِينِ!","نَزَلَا وَمَشَيَا بِجَانِبِ الْحِمَارِ، فَضَحِكَ النَّاسُ وَقَالُوا: مَعَهُمَا حِمَارٌ وَيَمْشِيَانِ!","تَوَقَّفَ جُحَا وَنَظَرَ إِلَى ابْنِهِ مُبْتَسِمًا.","قَالَ: يَا بُنَيَّ، هَلْ رَأَيْتَ؟ لَمْ يَرْضَ النَّاسُ عَنَّا فِي أَيِّ حَالٍ.","إِرْضَاءُ النَّاسِ جَمِيعًا غَايَةٌ لَا تُدْرَكُ.","فَافْعَلْ مَا تَرَاهُ صَوَابًا، وَاسْتَمِعْ لِلنَّصِيحَةِ النَّافِعَةِ، وَلَا تَشْغَلْ نَفْسَكَ بِكُلِّ كَلَامٍ.","وَاصَلَ جُحَا وَابْنُهُ طَرِيقَهُمَا إِلَى السُّوقِ، يَرْكَبَانِ تَارَةً وَيَمْشِيَانِ تَارَةً."],"qs":[["إلى أين خرج جحا وابنه؟","إلى السوق","إلى البحر","إلى المدرسة"],["ماذا قال الناس عندما ركبا معا؟","ما أقسى قلبيهما على الحمار","ما أذكاهما","ما أجملهما"],["ما الدرس الذي علمه جحا لابنه؟","إرضاء الناس جميعا غاية لا تدرك","يجب أن نسمع كل كلام","الحمار لا يركب"],["كيف واصلا طريقهما؟","يركبان تارة ويمشيان تارة","حملا الحمار","رجعا إلى البيت"]]},{"id":"g4-20","title":"حَمْلَةُ الشَّجَرَةِ","lines":["لَاحَظَ طُلَّابُ الصَّفِّ الرَّابِعِ أَنَّ سَاحَةَ مَدْرَسَتِهِمْ تَخْلُو مِنَ الْأَشْجَارِ.","كَانَتِ الشَّمْسُ حَارَّةً فِي الِاسْتِرَاحَةِ، وَلَا يَجِدُونَ ظِلًّا يَجْلِسُونَ فِيهِ.","اقْتَرَحَ مَالِكٌ أَنْ يُطْلِقُوا حَمْلَةً بِعُنْوَانِ: شَجَرَةٌ لِكُلِّ صَفٍّ.","كَتَبُوا رِسَالَةً إِلَى مُدِيرِ الْمَدْرَسَةِ يَشْرَحُونَ فِيهَا فِكْرَتَهُمْ وَفَوَائِدَهَا.","وَافَقَ الْمُدِيرُ، وَتَوَاصَلَ مَعَ الْبَلَدِيَّةِ لِتَوْفِيرِ الشَّتَلَاتِ.","اخْتَارَ الطُّلَّابُ أَشْجَارًا تُنَاسِبُ بِيئَةَ عُمَانَ، مِثْلَ الْغَافِ وَالسِّدْرِ وَالنِّيمِ.","فِي يَوْمِ الزِّرَاعَةِ حَضَرَ أَوْلِيَاءُ الْأُمُورِ، وَشَارَكُوا أَبْنَاءَهُمْ فِي الْحَفْرِ وَالسَّقْيِ.","وَضَعَ كُلُّ صَفٍّ لَوْحَةً صَغِيرَةً بِجَانِبِ شَجَرَتِهِ، وَتَكَفَّلَ بِرِعَايَتِهَا.","بَعْدَ عَامَيْنِ صَارَتِ السَّاحَةُ خَضْرَاءَ، وَامْتَدَّتِ الظِّلَالُ فِي كُلِّ مَكَانٍ.","قَالَ الْمُدِيرُ فِي الطَّابُورِ: فِكْرَةٌ صَغِيرَةٌ مِنْ طُلَّابٍ صِغَارٍ غَيَّرَتْ وَجْهَ مَدْرَسَتِنَا."],"qs":[["ما المشكلة التي لاحظها الطلاب؟","الساحة تخلو من الأشجار","الفصول مظلمة","المكتبة صغيرة"],["ما عنوان الحملة؟","شجرة لكل صف","نظف مدرستك","اقرأ كتابا"],["ما الأشجار التي اختاروها؟","الغاف والسدر والنيم","التفاح والعنب","الصنوبر والأرز"],["كيف صارت الساحة بعد عامين؟","خضراء ممتدة الظلال","فارغة","مغلقة"]]},{"id":"g4-21","title":"الْأَمِيرُ وَالْحَكِيمُ","lines":["سَأَلَ أَمِيرٌ شَابٌّ حَكِيمًا: كَيْفَ أَكُونُ قَوِيًّا يَحْتَرِمُنِي النَّاسُ؟","أَعْطَاهُ الْحَكِيمُ كِيسًا مِنَ الْمَسَامِيرِ وَقَالَ: كُلَّمَا غَضِبْتَ فَاطْرُقْ مِسْمَارًا فِي هَذَا السُّورِ.","فِي الْيَوْمِ الْأَوَّلِ طَرَقَ الْأَمِيرُ عِشْرِينَ مِسْمَارًا.","ثُمَّ أَخَذَ الْعَدَدُ يَقِلُّ يَوْمًا بَعْدَ يَوْمٍ، لِأَنَّهُ تَعَلَّمَ أَنْ يَضْبِطَ غَضَبَهُ.","وَجَاءَ يَوْمٌ لَمْ يَطْرُقْ فِيهِ أَيَّ مِسْمَارٍ، فَفَرِحَ وَأَخْبَرَ الْحَكِيمَ.","قَالَ الْحَكِيمُ: الْآنَ انْزِعْ مِسْمَارًا عَنْ كُلِّ يَوْمٍ تَمْلِكُ فِيهِ نَفْسَكَ.","مَرَّتِ الْأَيَّامُ حَتَّى نَزَعَ الْأَمِيرُ الْمَسَامِيرَ كُلَّهَا.","أَخَذَهُ الْحَكِيمُ إِلَى السُّورِ وَقَالَ: انْظُرْ إِلَى الثُّقُوبِ الَّتِي بَقِيَتْ.","هَكَذَا الْكَلِمَةُ الْجَارِحَةُ وَقْتَ الْغَضَبِ، تَتْرُكُ أَثَرًا حَتَّى بَعْدَ الِاعْتِذَارِ.","فَالْقَوِيُّ حَقًّا مَنْ يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ."],"qs":[["ماذا أعطى الحكيم الأمير؟","كيسا من المسامير","سيفا","كتابا"],["كم مسمارا طرق الأمير في اليوم الأول؟","عشرين","خمسة","مئة"],["ماذا تمثل الثقوب في السور؟","أثر الكلمة الجارحة","جمال السور","قوة الأمير"],["من القوي حقا؟","من يملك نفسه عند الغضب","من يطرق مسامير كثيرة","من يغضب بسرعة"]]},{"id":"g4-22","title":"صَوْتُ الْأَمْوَاجِ","lines":["عَاشَتْ مَيْسُونُ فِي مَدِينَةِ صُورَ الْمُطِلَّةِ عَلَى بَحْرِ الْعَرَبِ.","كَانَ أَبُوهَا يَعْمَلُ فِي مَصْنَعٍ لِبِنَاءِ السُّفُنِ الْخَشَبِيَّةِ الَّتِي تُسَمَّى الدَّاوَ.","فِي إِجَازَةِ الصَّيْفِ اصْطَحَبَهَا إِلَى الْمَصْنَعِ لِتَرَى كَيْفَ تُبْنَى السَّفِينَةُ.","رَأَتِ الْعُمَّالَ يَثْنُونَ الْأَلْوَاحَ بِالْبُخَارِ، وَيُثَبِّتُونَهَا بِمَسَامِيرَ طَوِيلَةٍ.","أَخْبَرَهَا أَبُوهَا أَنَّ سُفُنَ صُورَ أَبْحَرَتْ قَدِيمًا إِلَى الْهِنْدِ وَشَرْقِ إِفْرِيقْيَا.","كَانَ الْبَحَّارَةُ يَحْمِلُونَ التَّمْرَ وَاللُّبَانَ، وَيَعُودُونَ بِالتَّوَابِلِ وَالْأَخْشَابِ.","سَأَلَتْ مَيْسُونُ: وَكَيْفَ كَانُوا يَعْرِفُونَ الطَّرِيقَ فِي الْبَحْرِ الْوَاسِعِ؟","قَالَ الْأَبُ: بِالنُّجُومِ، وَبِمَعْرِفَةِ مَوَاسِمِ الرِّيَاحِ الَّتِي تَدْفَعُ الْأَشْرِعَةَ.","عِنْدَ الْغُرُوبِ جَلَسَتْ مَيْسُونُ عَلَى الشَّاطِئِ تَسْتَمِعُ إِلَى صَوْتِ الْأَمْوَاجِ.","شَعَرَتْ أَنَّ الْأَمْوَاجَ تَحْكِي حِكَايَاتِ الْأَجْدَادِ الَّذِينَ صَادَقُوا الْبَحْرَ."],"qs":[["في أي مدينة عاشت ميسون؟","صور","نزوى","عبري"],["ماذا تسمى السفن الخشبية في القصة؟","الداو","القارب السريع","الباخرة"],["إلى أين أبحرت سفن صور قديما؟","إلى الهند وشرق إفريقيا","إلى القطب الشمالي","إلى أمريكا"],["كيف كان البحارة يعرفون الطريق؟","بالنجوم ومواسم الرياح","بالهاتف","بالأقمار الصناعية"]]},{"id":"g4-23","title":"الْجَائِزَةُ الْحَقِيقِيَّةُ","lines":["أَعْلَنَتِ الْمَدْرَسَةُ عَنْ مُسَابَقَةٍ لِلرَّسْمِ عُنْوَانُهَا: وَطَنِي فِي عُيُونِي.","اشْتَرَكَتْ رَغَدُ، وَرَسَمَتْ لَوْحَةً لِقَرْيَتِهَا بَيْنَ النَّخِيلِ وَالْجِبَالِ.","وَاشْتَرَكَتْ صَدِيقَتُهَا جُودُ بِلَوْحَةٍ لِلْبَحْرِ وَالسُّفُنِ الشِّرَاعِيَّةِ.","قَبْلَ يَوْمٍ مِنَ التَّسْلِيمِ انْسَكَبَ الْمَاءُ عَلَى لَوْحَةِ جُودَ فَتَلِفَتْ أَلْوَانُهَا.","بَكَتْ جُودُ، فَقَدْ قَضَتْ أُسْبُوعًا كَامِلًا فِي رَسْمِهَا.","كَانَ بِإِمْكَانِ رَغَدَ أَنْ تَفْرَحَ لِأَنَّ مُنَافِسَتَهَا الْأَقْوَى خَرَجَتْ مِنَ الْمُسَابَقَةِ.","لَكِنَّهَا جَلَسَتْ مَعَ جُودَ حَتَّى الْمَسَاءِ، تُسَاعِدُهَا عَلَى إِعَادَةِ الرَّسْمِ.","فِي يَوْمِ الْإِعْلَانِ فَازَتْ لَوْحَةُ جُودَ بِالْمَرْكَزِ الْأَوَّلِ، وَلَوْحَةُ رَغَدَ بِالثَّانِي.","صَعِدَتْ جُودُ إِلَى الْمِنَصَّةِ، وَحَكَتْ لِلْجَمِيعِ كَيْفَ سَاعَدَتْهَا صَدِيقَتُهَا.","فَمَنَحَتِ الْمُدِيرَةُ رَغَدَ جَائِزَةً خَاصَّةً بِاسْمِ: الصَّدِيقَةُ الْوَفِيَّةُ."],"qs":[["ما عنوان مسابقة الرسم؟","وطني في عيوني","مدرستي الجميلة","البحر الأزرق"],["ماذا حدث للوحة جود؟","انسكب عليها الماء","ضاعت","تمزقت"],["ماذا فعلت رغد؟","ساعدت جود على إعادة الرسم","فرحت وتركتها","أخبرت المعلمة"],["ما الجائزة الخاصة التي نالتها رغد؟","الصديقة الوفية","أفضل رسامة","الطالبة المثالية"]]},{"id":"g4-24","title":"الذِّئْبُ وَالرَّاعِي الْكَاذِبُ","lines":["كَانَ رَاعٍ صَغِيرٌ يَرْعَى الْغَنَمَ قُرْبَ الْقَرْيَةِ، وَكَانَ يَشْعُرُ بِالْمَلَلِ.","فَكَّرَ فِي لُعْبَةٍ يَتَسَلَّى بِهَا، فَصَاحَ: الذِّئْبُ! الذِّئْبُ! أَنْقِذُونِي!","تَرَكَ أَهْلُ الْقَرْيَةِ أَعْمَالَهُمْ، وَأَسْرَعُوا إِلَيْهِ يَحْمِلُونَ الْعِصِيَّ.","فَلَمَّا وَصَلُوا لَمْ يَجِدُوا ذِئْبًا، وَوَجَدُوا الرَّاعِيَ يَضْحَكُ مِنْهُمْ.","بَعْدَ أَيَّامٍ كَرَّرَ الرَّاعِي الْكِذْبَةَ، فَجَاؤُوا مَرَّةً ثَانِيَةً وَرَجَعُوا غَاضِبِينَ.","وَفِي يَوْمٍ مِنَ الْأَيَّامِ ظَهَرَ ذِئْبٌ حَقِيقِيٌّ، وَهَجَمَ عَلَى الْغَنَمِ.","صَاحَ الرَّاعِي بِأَعْلَى صَوْتِهِ يَطْلُبُ النَّجْدَةَ.","قَالَ أَهْلُ الْقَرْيَةِ: إِنَّهُ يَكْذِبُ كَعَادَتِهِ، وَلَمْ يَأْتِ أَحَدٌ.","خَسِرَ الرَّاعِي عَدَدًا مِنْ أَغْنَامِهِ، وَجَلَسَ يَبْكِي نَادِمًا.","عَرَفَ أَنَّ الْكَاذِبَ لَا يُصَدِّقُهُ النَّاسُ حَتَّى لَوْ قَالَ الصِّدْقَ."],"qs":[["لماذا كذب الراعي في البداية؟","لأنه كان يشعر بالملل","لأنه خائف","لأنه جائع"],["كم مرة كذب قبل ظهور الذئب الحقيقي؟","مرتين","مرة واحدة","خمس مرات"],["لماذا لم يأت أهل القرية في المرة الأخيرة؟","ظنوا أنه يكذب كعادته","كانوا نائمين","لم يسمعوا"],["ما العبرة من القصة؟","الكاذب لا يصدقه الناس حتى لو صدق","الذئب صديق","الرعي ممل"]]},{"id":"g4-25","title":"الْمَكْتَبَةُ الْمُتَنَقِّلَةُ","lines":["فِي قَرْيَةٍ جَبَلِيَّةٍ بَعِيدَةٍ لَمْ تَكُنْ هُنَاكَ مَكْتَبَةٌ عَامَّةٌ.","كَانَ الْأَطْفَالُ يُحِبُّونَ الْقِرَاءَةَ، لَكِنَّهُمْ لَا يَجِدُونَ إِلَّا كُتُبَ الْمَدْرَسَةِ.","وَفِي صَبَاحِ يَوْمٍ مُشْمِسٍ وَصَلَتْ إِلَى الْقَرْيَةِ حَافِلَةٌ مُلَوَّنَةٌ مَلِيئَةٌ بِالْكُتُبِ.","كُتِبَ عَلَى جَانِبِهَا بِخَطٍّ كَبِيرٍ: الْمَكْتَبَةُ الْمُتَنَقِّلَةُ.","تَجَمَّعَ الْأَطْفَالُ حَوْلَهَا، وَصَعِدُوا إِلَيْهَا وَاحِدًا بَعْدَ الْآخَرِ.","وَجَدُوا قِصَصًا عَنِ الْمُغَامَرَاتِ، وَكُتُبًا عَنِ الْحَيَوَانَاتِ وَالْعُلُومِ وَالتَّارِيخِ.","اسْتَعَارَ كُلُّ طِفْلٍ كِتَابَيْنِ، وَوَعَدَ أَنْ يُعِيدَهُمَا فِي الزِّيَارَةِ الْقَادِمَةِ.","صَارَ الْأَطْفَالُ يَنْتَظِرُونَ الْحَافِلَةَ كُلَّ أُسْبُوعَيْنِ بِشَوْقٍ كَبِيرٍ.","وَأَسَّسَتْ مُعَلِّمَةُ الْقَرْيَةِ نَادِيًا يَجْتَمِعُ فِيهِ الْأَطْفَالُ لِمُنَاقَشَةِ مَا قَرَؤُوا.","وَبَعْدَ سَنَةٍ تَبَرَّعَ أَهْلُ الْقَرْيَةِ بِغُرْفَةٍ صَغِيرَةٍ، صَارَتْ أَوَّلَ مَكْتَبَةٍ فِيهَا."],"qs":[["ماذا كان ينقص القرية؟","مكتبة عامة","مدرسة","مسجد"],["ماذا وصل إلى القرية؟","حافلة مليئة بالكتب","سيارة إسعاف","شاحنة طعام"],["كم كتابا استعار كل طفل؟","كتابين","عشرة","كتابا واحدا"],["ماذا حدث بعد سنة؟","تبرع أهل القرية بغرفة صارت مكتبة","توقفت الحافلة","انتقل الأطفال"]]},{"id":"g4-26","title":"الزِّلْزَالُ التَّدْرِيبِيُّ","lines":["فِي صَبَاحِ يَوْمِ الثُّلَاثَاءِ رَنَّ جَرَسُ الْإِنْذَارِ فِي الْمَدْرَسَةِ رَنِينًا مُتَقَطِّعًا.","قَالَ الْمُعَلِّمُ بِهُدُوءٍ: هَذَا تَمْرِينٌ عَلَى الزِّلْزَالِ، طَبِّقُوا مَا تَعَلَّمْنَاهُ.","انْخَفَضَ الطُّلَّابُ تَحْتَ الطَّاوِلَاتِ، وَغَطَّوْا رُؤُوسَهُمْ بِأَيْدِيهِمْ.","وَأَمْسَكُوا بِأَرْجُلِ الطَّاوِلَاتِ، وَابْتَعَدُوا عَنِ النَّوَافِذِ الزُّجَاجِيَّةِ.","بَعْدَ دَقِيقَةٍ أَشَارَ الْمُعَلِّمُ إِلَيْهِمْ بِالْخُرُوجِ فِي صَفٍّ مُنْتَظِمٍ.","نَزَلُوا عَلَى الدَّرَجِ دُونَ رَكْضٍ أَوْ تَدَافُعٍ، وَلَمْ يَسْتَخْدِمُوا الْمِصْعَدَ.","تَجَمَّعَ الْجَمِيعُ فِي سَاحَةٍ مَفْتُوحَةٍ بَعِيدَةٍ عَنِ الْمَبَانِي وَالْأَعْمِدَةِ.","عَدَّ كُلُّ مُعَلِّمٍ طُلَّابَهُ، لِيَتَأَكَّدَ أَنَّ أَحَدًا لَمْ يَتَخَلَّفْ.","قَالَ ضَابِطُ الدِّفَاعِ الْمَدَنِيِّ: أَحْسَنْتُمْ، خَرَجْتُمْ جَمِيعًا فِي ثَلَاثِ دَقَائِقَ.","وَأَضَافَ: التَّدْرِيبُ يَجْعَلُنَا نَتَصَرَّفُ بِحِكْمَةٍ عِنْدَ الْخَطَرِ الْحَقِيقِيِّ."],"qs":[["ماذا فعل الطلاب أولا؟","انخفضوا تحت الطاولات","ركضوا إلى الباب","صرخوا"],["لماذا ابتعدوا عن النوافذ؟","لأنها زجاجية قد تنكسر","لأن الشمس حارة","ليروا السماء"],["أين تجمع الطلاب؟","في ساحة مفتوحة بعيدة عن المباني","في المصعد","في المكتبة"],["في كم دقيقة خرجوا جميعا؟","ثلاث دقائق","عشر دقائق","نصف ساعة"]]},{"id":"g4-27","title":"الْبَيْتُ الْعُمَانِيُّ الْقَدِيمُ","lines":["زَارَتْ نُهَى مَعَ جَدَّتِهَا حَارَةً قَدِيمَةً فِي وِلَايَةِ إِزْكِي.","كَانَتِ الْبُيُوتُ مَبْنِيَّةً مِنَ الطِّينِ وَجُذُوعِ النَّخِيلِ، وَأَبْوَابُهَا خَشَبِيَّةٌ مَنْقُوشَةٌ.","قَالَتِ الْجَدَّةُ: هُنَا وُلِدْتُ، وَهُنَا لَعِبْتُ مَعَ صَدِيقَاتِي فِي الطُّفُولَةِ.","دَخَلَتَا بَيْتًا قَدِيمًا، فَشَعَرَتْ نُهَى بِبُرُودَةٍ لَطِيفَةٍ رَغْمَ حَرَارَةِ الْجَوِّ.","شَرَحَتِ الْجَدَّةُ أَنَّ الْجُدْرَانَ السَّمِيكَةَ مِنَ الطِّينِ تَمْنَعُ حَرَارَةَ الشَّمْسِ.","وَأَشَارَتْ إِلَى فَتَحَاتٍ صَغِيرَةٍ أَعْلَى الْجِدَارِ تُدْخِلُ الْهَوَاءَ وَتُخْرِجُ الْحَرَارَةَ.","وَأَرَتْهَا الْمَطْبَخَ الْقَدِيمَ، وَالْجِرَارَ الْفَخَّارِيَّةَ الَّتِي كَانَتْ تُبَرِّدُ الْمَاءَ.","تَعَجَّبَتْ نُهَى وَقَالَتْ: كَانَ الْأَجْدَادُ مُهَنْدِسِينَ بِلَا مَدَارِسِ هَنْدَسَةٍ!","ضَحِكَتِ الْجَدَّةُ وَقَالَتْ: كَانُوا يَتَعَلَّمُونَ مِنَ الطَّبِيعَةِ وَالتَّجْرِبَةِ.","الْتَقَطَتْ نُهَى صُوَرًا كَثِيرَةً، لِتَصْنَعَ مِنْهَا كُتَيِّبًا عَنْ تُرَاثِ بِلَادِهَا."],"qs":[["أين الحارة القديمة؟","في ولاية إزكي","في مسقط","في صلالة"],["مم بنيت البيوت؟","من الطين وجذوع النخيل","من الإسمنت","من الحديد"],["لماذا كان البيت باردا؟","لأن الجدران السميكة تمنع الحرارة","لأن فيه مكيفا","لأنه تحت الأرض"],["ماذا ستصنع نهى من الصور؟","كتيبا عن التراث","لعبة","لوحة للبيع"]]},{"id":"g4-28","title":"الْقَلَمُ الْمَفْقُودُ","lines":["اشْتَرَى وَالِدُ قُصَيٍّ لَهُ قَلَمًا فَاخِرًا هَدِيَّةً لِنَجَاحِهِ.","أَخَذَهُ قُصَيٌّ إِلَى الْمَدْرَسَةِ، وَبَعْدَ الْفُسْحَةِ لَمْ يَجِدْهُ فِي حَقِيبَتِهِ.","شَكَّ فِي زَمِيلِهِ الْجَالِسِ بِجَانِبِهِ، وَكَادَ يَتَّهِمُهُ أَمَامَ الْجَمِيعِ.","لَكِنَّهُ تَذَكَّرَ نَصِيحَةَ أَبِيهِ: لَا تَحْكُمْ عَلَى أَحَدٍ دُونَ دَلِيلٍ.","ذَهَبَ إِلَى الْمُعَلِّمِ، وَأَخْبَرَهُ بِالْأَمْرِ بِهُدُوءٍ.","طَلَبَ الْمُعَلِّمُ مِنْهُ أَنْ يَتَذَكَّرَ الْأَمَاكِنَ الَّتِي ذَهَبَ إِلَيْهَا.","تَذَكَّرَ قُصَيٌّ أَنَّهُ كَتَبَ اسْمَهُ فِي سِجِلِّ الْمَكْتَبَةِ قَبْلَ الْفُسْحَةِ.","ذَهَبَ إِلَى الْمَكْتَبَةِ، فَوَجَدَ أَمِينَ الْمَكْتَبَةِ يَحْتَفِظُ بِالْقَلَمِ لَهُ.","شَعَرَ قُصَيٌّ بِالِارْتِيَاحِ لِأَنَّهُ لَمْ يَظْلِمْ زَمِيلَهُ.","وَتَعَلَّمَ أَنَّ التَّسَرُّعَ فِي الِاتِّهَامِ قَدْ يَجْرَحُ بَرِيئًا وَيَهْدِمُ صَدَاقَةً."],"qs":[["لماذا اشترى الوالد القلم؟","هدية لنجاح قصي","لأن قلمه انكسر","لأخيه"],["فيمن شك قصي؟","زميله الجالس بجانبه","المعلم","أخيه"],["أين وجد القلم؟","في المكتبة","في الساحة","في البيت"],["ماذا تعلم قصي؟","التسرع في الاتهام قد يجرح بريئا","الأقلام لا تضيع","لا يذهب إلى المكتبة"]]},{"id":"g4-29","title":"الْفَارِسُ وَالنَّهْرُ","lines":["خَرَجَ فَارِسٌ فِي رِحْلَةٍ طَوِيلَةٍ، فَوَصَلَ إِلَى نَهْرٍ عَرِيضٍ لَا جِسْرَ عَلَيْهِ.","سَأَلَ رَجُلًا عَجُوزًا يَجْلِسُ عَلَى الضِّفَّةِ: هَلْ هَذَا النَّهْرُ عَمِيقٌ؟","قَالَ الْعَجُوزُ: لَا، إِنَّهُ لَا يَتَجَاوَزُ رُكْبَةَ الْحِصَانِ.","دَخَلَ الْفَارِسُ النَّهْرَ، فَإِذَا الْمَاءُ يَعْلُو حَتَّى كَادَ يُغْرِقُهُ.","عَادَ غَاضِبًا وَقَالَ: لِمَاذَا خَدَعْتَنِي؟","قَالَ الْعَجُوزُ مُتَعَجِّبًا: لَقَدْ رَأَيْتُ الْبَطَّ يَعْبُرُ النَّهْرَ، وَالْمَاءُ يَبْلُغُ رُكَبَهُ فَقَطْ!","ضَحِكَ الْفَارِسُ رَغْمَ غَضَبِهِ، وَعَرَفَ أَنَّ الْعَجُوزَ لَمْ يَقْصِدِ الْخِدَاعَ.","قَالَ: لِكُلِّ سُؤَالٍ جَوَابٌ يُنَاسِبُ مَنْ يَسْأَلُ، فَعَلَيَّ أَنْ أَسْأَلَ بِدِقَّةٍ.","بَحَثَ الْفَارِسُ عَنْ مَكَانٍ ضَيِّقٍ ضَحْلٍ، وَعَبَرَ مِنْهُ بِسَلَامٍ.","وَتَعَلَّمَ أَنَّ التَّحَقُّقَ بِنَفْسِهِ خَيْرٌ مِنَ الِاعْتِمَادِ عَلَى أَوَّلِ جَوَابٍ يَسْمَعُهُ."],"qs":[["ماذا وجد الفارس في طريقه؟","نهرا عريضا بلا جسر","جبلا عاليا","صحراء"],["ماذا قال العجوز عن عمق النهر؟","لا يتجاوز ركبة الحصان","عميق جدا","لا أعرف"],["لماذا أخطأ العجوز؟","قاس العمق على البط","أراد خداعه","كان نائما"],["ماذا تعلم الفارس؟","التحقق بنفسه وأن يسأل بدقة","ألا يسافر","أن العجائز يكذبون"]]},{"id":"g4-30","title":"سَفِيرُ الْقِرَاءَةِ","lines":["اخْتَارَتِ الْمَدْرَسَةُ طَالِبًا مِنَ الصَّفِّ الرَّابِعِ لِيَكُونَ سَفِيرَ الْقِرَاءَةِ لِهَذَا الْعَامِ.","وَقَعَ الِاخْتِيَارُ عَلَى نَاصِرٍ، لِأَنَّهُ قَرَأَ أَكْثَرَ مِنْ خَمْسِينَ قِصَّةً فِي الْفَصْلِ الْأَوَّلِ.","لَمْ يَكُنْ نَاصِرٌ قَارِئًا جَيِّدًا فِي الصَّفِّ الْأَوَّلِ، بَلْ كَانَ يَتَلَعْثَمُ وَيَخْجَلُ.","بَدَأَ يَقْرَأُ كُلَّ يَوْمٍ عَشْرَ دَقَائِقَ بِصَوْتٍ عَالٍ أَمَامَ أُمِّهِ.","وَكَانَ يَسْتَمِعُ إِلَى الْقِصَصِ الْمَسْمُوعَةِ، ثُمَّ يُحَاوِلُ تَقْلِيدَ النُّطْقِ الصَّحِيحِ.","كُلَّمَا أَنْهَى قِصَّةً، أَلْصَقَ نَجْمَةً عَلَى لَوْحَةٍ فِي غُرْفَتِهِ.","مَعَ الْوَقْتِ صَارَتْ قِرَاءَتُهُ سَرِيعَةً وَاضِحَةً، وَصَارَ يَفْهَمُ مَا يَقْرَأُ بِعُمْقٍ.","مُهِمَّتُهُ الْآنَ أَنْ يَزُورَ صُفُوفَ الصِّغَارِ، وَيَقْرَأَ لَهُمْ قِصَّةً كُلَّ أُسْبُوعٍ.","قَالَ لِلصِّغَارِ: لَا تَخَافُوا مِنَ الْخَطَأِ، فَكُلُّ قَارِئٍ مَاهِرٍ كَانَ مُبْتَدِئًا يَوْمًا مَا.","وَخَتَمَ كَلِمَتَهُ قَائِلًا: اقْرَؤُوا كُلَّ يَوْمٍ، وَسَتَصِيرُونَ أَبْطَالًا لِلْقِرَاءَةِ."],"qs":[["لماذا اختير ناصر سفيرا للقراءة؟","لأنه قرأ أكثر من خمسين قصة","لأنه الأطول","لأنه الأكبر سنا"],["كيف كان ناصر في الصف الأول؟","يتلعثم ويخجل","قارئا ممتازا","لا يذهب إلى المدرسة"],["ماذا كان يفعل بعد كل قصة؟","يلصق نجمة على لوحة","يمزقها","يرسمها"],["ما مهمة ناصر الآن؟","القراءة لصفوف الصغار","تنظيف المكتبة","بيع الكتب"]]}]}];
</script>
<script>

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const fmt = s => { s = Math.max(0, Math.round(s)); return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };

  pen: `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>`,
  medal: (c) => `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 2h5l3 9h-5zM22 2h-5l-3 9h5z" fill="${c}" opacity=".55"/><circle cx="16" cy="20" r="9" fill="${c}"/><circle cx="16" cy="20" r="6.2" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.4"/><path d="M16 15.8l1.3 2.7 3 .4-2.2 2 .6 3-2.7-1.5-2.7 1.5.6-3-2.2-2 3-.4z" fill="#fff"/></svg>`
};

/* ---------- ranks & badges ---------- */
const RANKS = [

  {min:60, name:"قارئ ماهر"}, {min:100, name:"فارس القراءة"}, {min:180, name:"بطل القراءة"}, {min:280, name:"أسطورة واحة المجد"}
];
const BADGES = [
  {id:"first", name:"الخطوة الأولى", desc:"أنهيت قراءة أول قصة", c:"#3E8DB8", test:p=>p.read>=1},
  {id:"r5", name:"قارئ نشيط", desc:"أنهيت قراءة ٥ قصص", c:"#2E9C8F", test:p=>p.read>=5},
  {id:"r10", name:"عاشق الكتب", desc:"أنهيت قراءة ١٠ قصص", c:"#8A2B3A", test:p=>p.read>=10},
  {id:"r25", name:"نجم المكتبة", desc:"أنهيت قراءة ٢٥ قصة", c:"#B0842F", test:p=>p.read>=25},
  {id:"quiz5", name:"العقل الذكي", desc:"٥ اختبارات بلا أخطاء", c:"#6D4BB0", test:p=>p.perfect>=5},
  {id:"game5", name:"مهندس الجمل", desc:"أنهيت ٥ ألعاب ترتيب", c:"#C25B2C", test:p=>p.games>=5},
  {id:"listen", name:"الأذن الواعية", desc:"استمعت إلى ٥ قصص", c:"#2F7FAF", test:p=>p.listens>=5},
  {id:"speed", name:"البرق", desc:"قرأت بسرعة ممتازة", c:"#D49A1F", test:p=>p.fast},
  {id:"gradeAll", name:"بطل الصف", desc:"أنهيت كل قصص صفك", c:"#23794A", test:p=>p.gradeDone}
];
const FAST_WPM = {1:35, 2:50, 3:65, 4:80};

function storyStars(sp){
  if (!sp) return 0;
  let n = 0;
  if (sp.readSecs) n++;
  if (sp.quizTotal){ if (sp.quiz === sp.quizTotal) n += 2; else if (sp.quiz >= Math.ceil(sp.quizTotal/2)) n += 1; }
  if (sp.game) n++;
  return n;
}
function summarize(rec){
  const st = rec.stories || {};
  let stars=0, read=0, perfect=0, games=0, seen=0, fast=false;
  for (const id in st){ const sp = st[id]; stars += storyStars(sp); if (sp.seen) seen++; if (sp.readSecs) read++;
    if (sp.quizTotal && sp.quiz===sp.quizTotal) perfect++; if (sp.game) games++;
    const s = ALL[id]; if (s && sp.wpm && sp.wpm >= FAST_WPM[s.grade]) fast = true; }
  const own = STORIES.find(g=>g.grade==rec.grade);
  const gradeDone = !!own && own.stories.every(s => st[s.id] && st[s.id].readSecs);
  return {stars, read, perfect, games, seen, fast, gradeDone, listens: rec.listens||0};
}
function rankOf(stars){ let r = 0; RANKS.forEach((x,i)=>{ if (stars>=x.min) r=i; }); return r; }

/* ---------- storage: local + optional Firebase ---------- */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const loadScript = src => new Promise((res, rej) => { const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
const Store = {
  mode: "local", db: null, error: "",
  async init(){
    if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId) return;
    try {
      const v = "10.12.2";
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
      await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      this.db = firebase.firestore();
      this.mode = "cloud";
    } catch(e){ this.mode = "local"; this.error = "تعذر الاتصال بـ Firebase، يعمل الحفظ على هذا الجهاز فقط."; }
  },
  localAll(){ return LS.get("waha_students", {}); },
  async load(id){
    const local = this.localAll()[id] || null;
    if (this.mode !== "cloud") return local;
    try {
      const d = await this.db.collection("students").doc(id).get();
      const cloud = d.exists ? d.data() : null;
      if (cloud && (!local || (cloud.updatedAt||0) >= (local.updatedAt||0))) return cloud;
      return local;
    } catch(e){ return local; }
  },
  save(rec){
    rec.updatedAt = Date.now();
    const all = this.localAll(); all[rec.id] = rec; LS.set("waha_students", all);
    if (this.mode === "cloud"){
      clearTimeout(this._t);
      this._t = setTimeout(() => { this.db.collection("students").doc(rec.id).set(JSON.parse(JSON.stringify(rec))).catch(()=>toast("لم تُحفظ البيانات في السحابة، تحقق من الاتصال.")); }, 400);
    }
  },
  watchAll(cb){
    if (this.mode === "cloud"){
      return this.db.collection("students").onSnapshot(s => cb(s.docs.map(d=>d.data())), () => cb(Object.values(this.localAll())));
    }
    cb(Object.values(this.localAll()));
    const h = e => { if (e.key === "waha_students") cb(Object.values(this.localAll())); };
    addEventListener("storage", h); return () => removeEventListener("storage", h);
  },
  remove(id){
    const all = this.localAll(); delete all[id]; LS.set("waha_students", all);
    if (this.mode === "cloud") this.db.collection("students").doc(id).delete().catch(()=>{});
  }
};

const S = { rec: null, tab: 1, story: null, step: "read", fs: 26, teacher: false, unwatch: null };
const studentId = (name, grade, section) => `${grade}-${section||0}-${norm(name).replace(/[\/\s]+/g,"_")}`.slice(0, 140);

function toast(msg, icon=""){
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast pop"; t.setAttribute("role","status");
  t.innerHTML = icon + `<span>${msg}</span>`; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function storyRec(id){ const st = S.rec.stories || (S.rec.stories = {}); return st[id] || (st[id] = {}); }
function commit(){
  const before = new Set(S.rec.badges || []);
  const sum = summarize(S.rec);
  const now = BADGES.filter(b => b.test(sum)).map(b => b.id);
  S.rec.badges = now;
  S.rec.stars = sum.stars; S.rec.read = sum.read;
  Store.save(S.rec);
  const hs = document.getElementById("hstars"); if (hs && S.story) hs.innerHTML = starsRow(storyStars(S.rec.stories[S.story.id]));
  const fresh = BADGES.filter(b => now.includes(b.id) && !before.has(b.id));
  if (fresh.length) setTimeout(() => toast(`وسام جديد: ${fresh[0].name}`, I.medal(fresh[0].c)), 600);
}

/* ---------- reader ---------- */
const Timer = { start:0, acc:0, run:false, h:null,
  secs(){ return this.acc + (this.run ? (performance.now()-this.start)/1000 : 0); },
  go(){ if (this.run) return; this.run = true; this.start = performance.now(); this.h = setInterval(paintClock, 250); paintClock(); },
  pause(){ if (!this.run) return; this.acc = this.secs(); this.run = false; clearInterval(this.h); paintClock(); },
  reset(){ this.pause(); this.acc = 0; paintClock(); }
};
function paintClock(){ const c = document.getElementById("clock"); if (c){ c.textContent = fmt(Timer.secs()); c.classList.toggle("run", Timer.run); }
  const b = document.getElementById("tgo"); if (b){ b.innerHTML = Timer.run ? I.stop : I.timer; b.classList.toggle("on", Timer.run); b.setAttribute("aria-label", Timer.run?"إيقاف المؤقت":"تشغيل المؤقت"); } }

const TTS = { voice:null, rate:0.85, on:false, i:0, lines:[], ok: "speechSynthesis" in window,
  pick(){ if (!this.ok) return; const vs = speechSynthesis.getVoices().filter(v => /^ar/i.test(v.lang));
    this.voice = vs.find(v=>/natural|online|google/i.test(v.name)) || vs.find(v=>/OM|SA/i.test(v.lang)) || vs[0] || null; },
  play(from=0){ if (!this.ok) return; speechSynthesis.cancel(); this.on = true; this.i = from; this.next(); paintTTS(); },
  next(){ if (!this.on || this.i >= this.lines.length){ this.stop(true); return; }
    const u = new SpeechSynthesisUtterance(strip(this.lines[this.i]) === this.lines[this.i] ? this.lines[this.i] : this.lines[this.i]);
    u.lang = this.voice?.lang || "ar-SA"; if (this.voice) u.voice = this.voice; u.rate = this.rate;
    const idx = this.i; mark(idx);
    u.onend = () => { if (this.on && this.i === idx){ this.i++; this.next(); } };
    u.onerror = () => { if (this.on && this.i === idx){ this.i++; this.next(); } };
    speechSynthesis.speak(u); },
  stop(finished=false){ const was = this.on; this.on = false; if (this.ok) speechSynthesis.cancel(); mark(-1); paintTTS();
    if (finished && was && S.rec && S.story){ const sp = storyRec(S.story.id); if (!sp.listened){ sp.listened = true; S.rec.listens = (S.rec.listens||0)+1; commit(); } } },
  say(i){ if (!this.ok) return; this.on = false; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(this.lines[i]);
    u.lang = this.voice?.lang || "ar-SA"; if (this.voice) u.voice = this.voice; u.rate = this.rate; mark(i); u.onend = () => mark(-1); speechSynthesis.speak(u); paintTTS(); }
};
if (TTS.ok){ TTS.pick(); speechSynthesis.onvoiceschanged = () => TTS.pick(); }
function mark(i){ document.querySelectorAll(".text li").forEach((li,k)=>li.classList.toggle("speaking", k===i)); }
function paintTTS(){ const b = document.getElementById("tplay"); if (b){ b.innerHTML = TTS.on ? I.stop : I.speaker; b.classList.toggle("on", TTS.on); b.setAttribute("aria-label", TTS.on?"إيقاف الاستماع":"استمع إلى القصة"); } }
function stopAll(){ Timer.pause(); Timer.acc = 0; if (TTS.on || (TTS.ok && speechSynthesis.speaking)) TTS.stop(); if (S.unwatch){ S.unwatch(); S.unwatch = null; } }

function openStory(id){
  stopAll();
  S.story = ALL[id]; S.step = "read";
  const sp = storyRec(id);
  if (!sp.seen){ sp.seen = Date.now(); } sp.lastSeen = Date.now();
  S.rec.lastStory = id;
  commit();
  TTS.lines = S.story.lines;
  vStory();
  scrollTo({top:0});
}

  document.getElementById("tplay").onclick = () => TTS.on ? TTS.stop() : TTS.play(0);
  document.getElementById("rate").oninput = e => { TTS.rate = +e.target.value; };
  document.getElementById("fsm").onclick = () => { S.fs = Math.max(18, S.fs-2); app.querySelector(".text").style.setProperty("--fs", S.fs+"px"); };
  document.getElementById("fsp").onclick = () => { S.fs = Math.min(40, S.fs+2); app.querySelector(".text").style.setProperty("--fs", S.fs+"px"); };
  app.querySelectorAll(".text li").forEach(li => li.onclick = () => TTS.say(+li.dataset.i));
  document.getElementById("done").onclick = () => {
    const secs = Timer.secs();
    if (secs < Math.max(5, wordsOf(s.lines).length/4)){ toast(Timer.secs() < 1 ? "شغّل المؤقت أولًا، ثم اقرأ القصة كاملة." : "اقرأ القصة كاملة بتمهّل، ثم اضغط «أنهيت القراءة»."); return; }
    Timer.pause();
    const words = wordsOf(s.lines).length;
    const wpm = Math.round(words / (secs/60));
    const prevBest = sp.bestSecs;
    sp.readSecs = Math.round(secs); sp.wpm = wpm; sp.words = words;
    sp.bestSecs = prevBest ? Math.min(prevBest, sp.readSecs) : sp.readSecs;
    sp.reads = (sp.reads||0) + 1;
    commit();
    document.getElementById("res").innerHTML = resultCard(sp, true, prevBest);
    app.querySelector('.step[data-s="read"]').classList.add("done");
    document.getElementById("res").scrollIntoView({behavior:"smooth", block:"center"});
  };
}
const CHEERS = ["أحسنت يا بطل! قراءة رائعة.","ممتاز! استمر على هذا التميز.","قراءة جميلة، أنت تتقدم كل يوم.","رائع! القارئ الماهر يبدأ هكذا.","بارك الله فيك، قراءتك تتحسن."];
function resultCard(sp, fresh, prevBest){
  const better = fresh && prevBest && sp.readSecs < prevBest;
  return `<div class="result ${fresh?"pop":""}">
    <b>${fresh ? (better ? "حطّمت رقمك السابق!" : CHEERS[Math.floor(Math.random()*CHEERS.length)]) : "آخر قراءة لك"}</b>
    <div class="nums"><div><span>${ar(fmt(sp.readSecs))}</span>الزمن</div><div><span>${ar(sp.wpm)}</span>كلمة في الدقيقة</div><div><span>${ar(fmt(sp.bestSecs))}</span>أفضل زمن</div></div>
    <div>${fresh?"حصلت على نجمة القراءة. انتقل الآن إلى «افهم» لتختبر فهمك.":"يمكنك القراءة مرة أخرى لتحسين زمنك."}</div>
    ${fresh?`<div><button class="btn small" id="goQuiz">اختبر فهمك</button></div>`:""}
  </div>`;
}
document.addEventListener("click", e => { if (e.target.closest && e.target.closest("#goQuiz")){ S.step = "quiz"; vStory(); } });

function pQuiz(){
  const s = S.story, pane = document.getElementById("pane");
  const qs = s.qs.map(q => ({q:q[0], ans:q[1], opts: shuffle(q.slice(1))}));
  let answered = 0, correct = 0;
  pane.innerHTML = qs.map((q,i)=>`<div class="card q" data-q="${i}"><h3>${ar(i+1)}. ${q.q}</h3><div class="opts">${q.opts.map(o=>`<button class="opt">${o}</button>`).join("")}</div><p class="fb" aria-live="polite"></p></div>`).join("") + `<div id="score"></div>`;
  pane.querySelectorAll(".q").forEach(box => {
    const q = qs[+box.dataset.q];
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const ok = b.textContent === q.ans;
      box.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (x.textContent === q.ans) x.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      const fb = box.querySelector(".fb");
      fb.className = "fb " + (ok ? "good" : "bad");
      fb.textContent = ok ? "إجابة صحيحة، أحسنت!" : `ليست صحيحة. الإجابة الصحيحة: ${q.ans}`;
      answered++; if (ok) correct++;
      if (answered === qs.length) finishQuiz(correct, qs.length);
    });
  });
}
function finishQuiz(correct, total){
  const sp = storyRec(S.story.id);
  const before = storyStars(sp);
  sp.quiz = Math.max(sp.quiz||0, correct); sp.quizTotal = total; sp.quizLast = correct; sp.quizTries = (sp.quizTries||0)+1;
  commit();
  const got = correct===total ? 2 : correct>=Math.ceil(total/2) ? 1 : 0;
  const msg = correct===total ? "ممتاز! أجبت عن كل الأسئلة إجابة صحيحة." : correct>=Math.ceil(total/2) ? "جيد! راجع القصة وحاول أن تحصل على العلامة الكاملة." : "لا بأس، اقرأ القصة مرة أخرى ثم أعد المحاولة.";
  const el = document.getElementById("score");
  el.innerHTML = `<div class="card score pop"><b style="font-family:var(--f-display);font-size:30px">${ar(correct)} / ${ar(total)}</b>
    <div>${starsRow(got,2)}</div><div>${msg}</div>
    <div class="row" style="justify-content:center"><button class="btn ghost small" id="retry">أعد الاختبار</button><button class="btn small" id="toGame">العب لعبة الترتيب</button></div></div>`;
  document.getElementById("retry").onclick = () => { pQuiz(); scrollTo({top:0, behavior:"smooth"}); };
  document.getElementById("toGame").onclick = () => { S.step = "game"; vStory(); };
  app.querySelector('.step[data-s="quiz"]').classList.add("done");
  el.scrollIntoView({behavior:"smooth", block:"center"});
}

/* ---------- ordering game ---------- */
const cleanWord = w => w.replace(/[.،؛:؟!]+$/,"").replace(/^[«"]+|[»"]+$/g,"");
function buildRounds(s){
  const cands = s.lines.map(l => l.split(/\s+/).map(cleanWord).filter(Boolean)).filter(w => w.length>=3 && w.length<= (s.grade<=2?7:9));
  const picks = shuffle(cands).slice(0, 2);
  const rounds = picks.map(w => ({type:"words", answer:w}));
  const n = s.grade<=2 ? 3 : 4;
  const start = Math.floor(Math.random()*(s.lines.length-n+1));
  rounds.push({type:"lines", answer: s.lines.slice(start, start+n)});
  return rounds;
}
function pGame(){
  const s = S.story, pane = document.getElementById("pane");
  const rounds = buildRounds(s);
  let r = 0;
  const draw = () => {
    const R = rounds[r];
    const items = R.answer.map((t,i)=>({t, i}));
    let pool = shuffle(items); if (pool.every((x,k)=>x.i===k) && pool.length>1) pool.reverse();
    let placed = [];
    const isLines = R.type==="lines";
    pane.innerHTML = `<div class="card game">
      <div class="gamehead"><h3 style="font-size:20px">${isLines?"رتّب جمل القصة حسب تسلسل أحداثها":"رتّب الكلمات لتكوّن جملة صحيحة من القصة"}</h3><span class="pill">الجولة ${ar(r+1)} من ${ar(rounds.length)}</span></div>
      <div class="muted">${isLines?"اضغط الجمل بالترتيب: الأولى ثم الثانية ثم...":"اضغط الكلمات بالترتيب لتنتقل إلى مربع الإجابة، واضغط كلمة في الإجابة لإرجاعها."}</div>
      <div class="slot ${isLines?"col":""}" id="ans" aria-label="الإجابة"></div>
      <div class="slot ${isLines?"col":""}" id="pool" aria-label="الكلمات" style="border-style:solid;background:transparent"></div>
      <p class="fb" id="gfb" aria-live="polite"></p>
      <div class="row"><button class="btn" id="check" disabled>تحقّق</button><button class="btn ghost small" id="hint">تلميح</button><span class="spacer"></span><button class="btn ghost small" id="new">جولات جديدة</button></div>
    </div>`;
    const ansEl = pane.querySelector("#ans"), poolEl = pane.querySelector("#pool"), fb = pane.querySelector("#gfb"), chk = pane.querySelector("#check");
    const paint = (marks) => {
      ansEl.innerHTML = placed.map((x,k)=>`<button class="tile in ${marks?(marks[k]?"good":"bad"):""}" data-k="${k}">${isLines?`${ar(k+1)}. `:""}${x.t}</button>`).join("") || `<span class="muted">${isLines?"ضع الجمل هنا":"ضع الكلمات هنا"}</span>`;
      poolEl.innerHTML = pool.map((x,k)=>`<button class="tile" data-k="${k}">${x.t}</button>`).join("") || `<span class="muted">أحسنت، اضغط «تحقّق»</span>`;
      chk.disabled = pool.length > 0;
      poolEl.querySelectorAll(".tile").forEach(b => b.onclick = () => { placed.push(pool.splice(+b.dataset.k,1)[0]); fb.textContent=""; paint(); });
      ansEl.querySelectorAll(".tile").forEach(b => b.onclick = () => { pool.push(placed.splice(+b.dataset.k,1)[0]); fb.textContent=""; paint(); });
    };
    paint();
    chk.onclick = () => {
      const marks = placed.map((x,k)=>norm(x.t)===norm(R.answer[k]));
      if (marks.every(Boolean)){
        paint(marks); fb.className = "fb good";
        if (r < rounds.length-1){ fb.textContent = "صحيح! استعد للجولة التالية."; setTimeout(()=>{ r++; draw(); }, 1200); }
        else { fb.textContent = "أحسنت! أنهيت كل الجولات وحصلت على نجمة اللعبة."; winGame(); }
      } else { paint(marks); fb.className = "fb bad"; fb.textContent = "بعض الأجزاء في غير مكانها (باللون الأحمر). أعِدها وحاول مرة أخرى."; }
    };
    pane.querySelector("#hint").onclick = () => {
      const k = placed.findIndex((x,j)=>norm(x.t)!==norm(R.answer[j]));
      const need = k === -1 ? placed.length : k;
      while (placed.length > need) pool.push(placed.pop());
      const pi = pool.findIndex(x => norm(x.t)===norm(R.answer[need]));
      if (pi > -1) placed.push(pool.splice(pi,1)[0]);
      fb.className = "fb"; fb.textContent = "وضعنا لك الجزء التالي في مكانه الصحيح."; paint();
    };
    pane.querySelector("#new").onclick = () => pGame();
  };
  draw();
}
function winGame(){
  const sp = storyRec(S.story.id);
  const first = !sp.game; sp.game = true; sp.games = (sp.games||0)+1; commit();
  app.querySelector('.step[data-s="game"]').classList.add("done");
  if (first) toast("حصلت على نجمة اللعبة!", `<span style="width:28px;height:28px;display:inline-block">${I.star()}</span>`);
}

/* ---------- teacher ---------- */
function vTeacherGate(){
  stopAll();
  if (S.teacher) return vTeacher();
  app.innerHTML = `<div style="max-width:420px;margin:40px auto" class="card login">
    <h2 style="font-size:24px">دخول المعلمة</h2><p class="muted" style="margin:0">لوحة متابعة الطلاب وما شاهدوه من القصص.</p>
    <form id="pinForm" class="login" style="padding:0"><div><label for="pin">كلمة سر المعلمة</label><input class="field" id="pin" type="password" inputmode="numeric" autocomplete="off"></div>
    <p class="err" id="perr"></p><div class="row"><button class="btn" type="submit">دخول</button><button class="btn ghost" type="button" id="cancel">رجوع</button></div></form></div>`;
  document.getElementById("cancel").onclick = vLogin;
  document.getElementById("pinForm").onsubmit = e => { e.preventDefault();
    if (document.getElementById("pin").value === TEACHER_PIN){ S.teacher = true; vTeacher(); } else document.getElementById("perr").textContent = "كلمة السر غير صحيحة."; };
}
const T = { grade: 1, section: "all", list: [] };
function vTeacher(){
  stopAll();
  app.innerHTML = `<div class="row" style="margin-bottom:6px"><h2 style="font-size:28px">لوحة المعلمة</h2><span class="status"><i class="dot ${Store.mode==="cloud"?"on":""}"></i>${Store.mode==="cloud"?"مباشر من Firebase":"بيانات هذا الجهاز فقط"}</span>
    <span class="spacer"></span><button class="btn ghost small" id="copy">نسخ التقرير</button><button class="btn ghost small" id="out">خروج</button></div>
    <div class="tabs" role="tablist">${[1,2,3,4].map(n=>`<button class="tab" role="tab" data-t="${n}" aria-selected="${T.grade==n}">الصف ${GRADE_NAMES[n]}</button>`).join("")}
    <select class="field" id="sec" style="width:auto;padding:6px 12px;font-size:15px"><option value="all">كل الشعب</option><option value="0">بدون شعبة</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}">شعبة ${ar(n)}</option>`).join("")}</select></div>
    <div id="tbody"></div>`;
  document.getElementById("sec").value = T.section;
  document.getElementById("out").onclick = () => { S.teacher = false; vLogin(); };
  document.getElementById("sec").onchange = e => { T.section = e.target.value; paintTeacher(); };
  app.querySelectorAll(".tab").forEach(b => b.onclick = () => { T.grade = +b.dataset.t; app.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===b)); paintTeacher(); });
  document.getElementById("copy").onclick = copyReport;
  S.unwatch = Store.watchAll(list => { T.list = list; paintTeacher(); });
}
function teacherRows(){
  return T.list.filter(r => r.grade==T.grade && (T.section==="all" || String(r.section||0)===T.section))
    .sort((a,b)=> (a.section||0)-(b.section||0) || a.name.localeCompare(b.name,"ar"));
}
function paintTeacher(){
  const box = document.getElementById("tbody"); if (!box) return;
  const g = STORIES.find(x=>x.grade==T.grade), rows = teacherRows();
  const views = rows.reduce((n,r)=>n+g.stories.filter(s=>r.stories?.[s.id]?.seen).length,0);
  const reads = rows.reduce((n,r)=>n+g.stories.filter(s=>r.stories?.[s.id]?.readSecs).length,0);
  const avgStars = rows.length ? Math.round(rows.reduce((n,r)=>n+summarize(r).stars,0)/rows.length) : 0;
  box.innerHTML = `
  <div class="tiles">
    <div class="card tile-stat"><b>${ar(rows.length)}</b><span>طالب مسجّل</span></div>
    <div class="card tile-stat"><b>${ar(views)}</b><span>مشاهدة للقصص</span></div>
    <div class="card tile-stat"><b>${ar(reads)}</b><span>قراءة مكتملة بالمؤقت</span></div>
    <div class="card tile-stat"><b>${ar(avgStars)}</b><span>متوسط النجوم</span></div>
  </div>
  <div class="legend"><span class="row" style="gap:6px"><span class="cell v">${I.eye}</span>تمت المشاهدة</span><span class="row" style="gap:6px"><span class="cell c">${I.check}</span>قرأ وأجاب عن الاختبار</span><span class="row" style="gap:6px"><span class="cell n">•</span>لم يشاهد</span></div>
  ${rows.length ? `<div class="tbl-wrap"><table>
    <thead><tr><th class="name">الطالب</th><th>شوهد</th><th>النجوم</th>${g.stories.map((s,i)=>`<th title="${esc(strip(s.title))}">${ar(i+1)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>{ const seen = g.stories.filter(s=>r.stories?.[s.id]?.seen).length;
      return `<tr><td class="name"><button class="linkbtn" data-id="${esc(r.id)}">${esc(r.name)}</button>${r.section?` <span class="muted" style="font-size:12px">ش${ar(r.section)}</span>`:""}</td><td>${ar(seen)}/${ar(g.stories.length)}</td><td>${ar(summarize(r).stars)}</td>
      ${g.stories.map(s=>{ const sp = r.stories?.[s.id];
        if (!sp?.seen) return `<td><span class="cell n">•</span></td>`;
        const full = sp.readSecs && sp.quizTotal != null;
        const tip = `${strip(s.title)} — شوهد ${new Date(sp.lastSeen||sp.seen).toLocaleDateString("ar-OM")}${sp.readSecs?` · زمن القراءة ${fmt(sp.readSecs)}`:""}${sp.quizTotal!=null?` · الاختبار ${sp.quiz}/${sp.quizTotal}`:""}${sp.game?" · أنهى اللعبة":""}`;
        return `<td><span class="cell ${full?"c":"v"}" title="${esc(tip)}">${full?I.check:I.eye}</span></td>`; }).join("")}</tr>`; }).join("")}</tbody></table></div>`
  : `<div class="card" style="padding:28px;text-align:center"><b>لا يوجد طلاب في هذا الصف بعد.</b><p class="muted" style="margin:6px 0 0">يظهر الطالب هنا بعد أن يدخل باسمه ويختار الصف ${GRADE_NAMES[T.grade]}${Store.mode==="cloud"?"":" على هذا الجهاز. فعّل Firebase لرؤية طلاب كل الأجهزة"}.</p></div>`}`;
  box.querySelectorAll(".linkbtn").forEach(b => b.onclick = () => studentModal(T.list.find(r=>r.id===b.dataset.id)));
}
function studentModal(r){
  if (!r) return;
  const sum = summarize(r);
  const items = Object.entries(r.stories||{}).filter(([id,sp])=>sp.seen && ALL[id]).sort((a,b)=>(b[1].lastSeen||b[1].seen)-(a[1].lastSeen||a[1].seen));
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role","dialog");
  m.innerHTML = `<div class="card" dir="rtl"><div class="row"><h3 style="font-size:22px">${esc(r.name)}</h3><span class="pill">الصف ${GRADE_NAMES[r.grade]}${r.section?` · شعبة ${ar(r.section)}`:""}</span><span class="spacer"></span><button class="btn ghost small" id="mclose">إغلاق</button></div>
    <p class="muted">النجوم: ${ar(sum.stars)} · المرتبة: ${RANKS[rankOf(sum.stars)].name} · قصص مكتملة: ${ar(sum.read)} · الأوسمة: ${ar((r.badges||[]).length)}</p>
    <div class="tbl-wrap"><table><thead><tr><th style="text-align:right">القصة</th><th>آخر مشاهدة</th><th>الزمن</th><th>كلمة/د</th><th>الاختبار</th><th>اللعبة</th></tr></thead><tbody>
    ${items.map(([id,sp])=>`<tr><td style="text-align:right;font-family:var(--f-read)">${ALL[id].title} <span class="muted" style="font-size:12px">(ص${ar(ALL[id].grade)})</span></td><td>${new Date(sp.lastSeen||sp.seen).toLocaleDateString("ar-OM")}</td><td>${sp.readSecs?ar(fmt(sp.readSecs)):"—"}</td><td>${sp.wpm?ar(sp.wpm):"—"}</td><td>${sp.quizTotal!=null?`${ar(sp.quiz)}/${ar(sp.quizTotal)}`:"—"}</td><td>${sp.game?"✓":"—"}</td></tr>`).join("") || `<tr><td colspan="6">لم يشاهد أي قصة بعد.</td></tr>`}
    </tbody></table></div>
    <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn ghost small" id="mdel" style="color:var(--bad)">حذف الطالب</button></div></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close(); };
  m.querySelector("#mclose").onclick = close;
  const del = m.querySelector("#mdel");
  del.onclick = () => { if (del.dataset.sure){ Store.remove(r.id); T.list = T.list.filter(x=>x.id!==r.id); close(); paintTeacher(); } else { del.dataset.sure = 1; del.textContent = "اضغط مرة أخرى للتأكيد"; } };
}
function copyReport(){
  const g = STORIES.find(x=>x.grade==T.grade), rows = teacherRows();
  const head = ["الطالب","الشعبة","النجوم","عدد المشاهدات", ...g.stories.map((s,i)=>`${i+1}. ${strip(s.title)}`)].join("\t");
  const body = rows.map(r => [r.name, r.section||"", summarize(r).stars, g.stories.filter(s=>r.stories?.[s.id]?.seen).length,
    ...g.stories.map(s=>{ const sp=r.stories?.[s.id]; return !sp?.seen ? "" : (sp.readSecs && sp.quizTotal!=null ? `مكتمل ${sp.quiz}/${sp.quizTotal}` : "تمت المشاهدة"); })].join("\t")).join("\n");
  const txt = head + "\n" + body;
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = txt; ta.style.cssText="position:fixed;inset:20% 10%;height:50%;z-index:70"; document.body.appendChild(ta); ta.select(); toast("حدّد النص وانسخه يدويًا، ثم اضغط خارجه."); ta.onblur = () => ta.remove(); };
  try { navigator.clipboard.writeText(txt).then(()=>toast("نُسخ التقرير، الصقه في Excel أو Google Sheets."), fallback); } catch(e){ fallback(); }
}

/* ---------- boot ---------- */
(async function(){
  app.innerHTML = `<p class="muted" style="text-align:center;margin-top:30vh">جارٍ التحميل…</p>`;
  await Store.init();
  vLogin();
})();
})();
