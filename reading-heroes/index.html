<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أبطال القراءة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: a watercolor-sky library — one centered column, reading "paper" sheets, gold trim borrowed from the school poster */
:root{
  --bg:#F2F7FB; --paper:#FFFFFF; --paper-2:#F8FBFD; --ink:#13304A; --muted:#5A7186;
  --sky:#2F7FAF; --sky-soft:#DDEBF5; --gold:#B0842F; --gold-soft:#F5EAD3; --maroon:#8A2B3A;
  --ok:#23794A; --ok-soft:#DDF1E5; --bad:#B3392F; --bad-soft:#F8E1DE; --line:#D2E1EC; --hl:#FFF0C2;
  --f-display:"Reem Kufi","Tajawal",system-ui,sans-serif;
  --f-read:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  --f-ui:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(19,48,74,.06),0 6px 20px rgba(19,48,74,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A26; --paper:#132433; --paper-2:#172C3E; --ink:#E5EEF5; --muted:#9BB0C2;
  --sky:#6DB2DD; --sky-soft:#1B3549; --gold:#DDB262; --gold-soft:#3A2F1B; --maroon:#E07D8D;
  --ok:#5DC48B; --ok-soft:#173A29; --bad:#EA7A6E; --bad-soft:#3E1F1C; --line:#26405A; --hl:#4A3D17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A26; --paper:#132433; --paper-2:#172C3E; --ink:#E5EEF5; --muted:#9BB0C2;
  --sky:#6DB2DD; --sky-soft:#1B3549; --gold:#DDB262; --gold-soft:#3A2F1B; --maroon:#E07D8D;
  --ok:#5DC48B; --ok-soft:#173A29; --bad:#EA7A6E; --bad-soft:#3E1F1C; --line:#26405A; --hl:#4A3D17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;
  background-image:radial-gradient(60% 40% at 100% 0%,var(--sky-soft) 0%,transparent 70%),radial-gradient(50% 35% at 0% 100%,var(--gold-soft) 0%,transparent 70%);
  background-attachment:fixed;min-height:100vh}
#app{max-width:1080px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-ui);font-weight:800;text-wrap:balance;margin:0;line-height:1.35}
.hero h1{font-family:var(--f-display);font-weight:700}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;background:var(--sky);color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:transparent;color:var(--sky);border:1.5px solid var(--line)}
.btn.small{padding:6px 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon{width:20px;height:20px;flex:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;background:var(--sky-soft);color:var(--sky)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.trim{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border:0;margin:14px auto;width:60%}

/* ---------- login ---------- */
.hero{text-align:center;padding:18px 0 8px}
.hero .eyebrow{font-weight:700;color:var(--maroon);letter-spacing:.02em}
.hero h1{font-size:clamp(38px,8vw,64px);color:var(--ink)}
.hero h1 span{color:var(--gold)}
.hero p{margin:6px auto 0;max-width:46ch;color:var(--muted)}
.login-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:22px;align-items:start}
@media (max-width:760px){.login-grid{grid-template-columns:1fr}}
.login{padding:22px;display:grid;gap:16px}
.login label{font-weight:700;display:block;margin-bottom:6px}
.field{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper-2);font-size:18px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper-2);border-radius:12px;padding:10px 4px;font-weight:700;text-align:center}
.chip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#fff}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin:0}
.vm{padding:20px;display:grid;gap:14px}
.vm h3{color:var(--sky);font-size:20px;display:flex;align-items:center;gap:8px}
.vm p{margin:0;font-family:var(--f-read);font-size:17px;line-height:1.9}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.fact{padding:12px;text-align:center}
.fact b{display:block;font-family:var(--f-display);font-size:28px;color:var(--gold)}
.fact span{font-size:14px;color:var(--muted)}
.teacher-link{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:700}

/* ---------- topbar ---------- */
.top{padding:14px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
@media (max-width:680px){.top{grid-template-columns:1fr}}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-size:24px;border:2px solid var(--gold)}
.who b{font-size:19px;display:block}
.rank{display:grid;gap:4px}
.bar{height:10px;border-radius:99px;background:var(--sky-soft);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E2BC6A);border-radius:99px;transition:width .5s}
.starcount{font-family:var(--f-display);font-size:26px;color:var(--gold);display:flex;align-items:center;gap:6px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badge{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;color:var(--muted)}
.badge svg{width:22px;height:22px}
.badge.on{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
.badge:not(.on) svg{opacity:.35;filter:grayscale(1)}

/* ---------- library ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 14px}
.tab{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;font-weight:700}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.story-card{padding:14px 16px;text-align:right;display:grid;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);transition:transform .15s,border-color .15s}
.story-card:hover{transform:translateY(-2px);border-color:var(--sky)}
.story-card .num{font-family:var(--f-display);color:var(--gold);font-size:14px}
.story-card h3{font-family:var(--f-read);font-size:20px;font-weight:700}
.story-card .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.stars{display:inline-flex;gap:1px}
.stars svg{width:16px;height:16px}
.seen{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:700}

/* ---------- reader ---------- */
.reader-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.reader-head h2{font-family:var(--f-read);font-size:clamp(26px,5vw,36px)}
.steps{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.step{flex:1;min-width:120px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px;font-weight:800;display:flex;gap:8px;align-items:center;justify-content:center}
.step[aria-selected="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--sky)}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:13px}
.step[aria-selected="true"] .n{background:var(--sky);color:#fff}
.step.done .n{background:var(--ok);color:#fff}
.tools{padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-bottom:14px}
.clock{font-family:var(--f-display);font-size:30px;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:center;color:var(--ink);direction:ltr}
.clock.run{color:var(--sky)}
.toolgroup{display:flex;gap:6px;align-items:center;padding-inline:10px;border-inline-start:1px solid var(--line)}
.toolgroup:first-child{border:0;padding-inline-start:0}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper-2);display:grid;place-items:center;color:var(--ink)}
.iconbtn.on{background:var(--sky);border-color:var(--sky);color:#fff}
.rate{width:90px;accent-color:var(--sky)}
.sheet{padding:clamp(18px,4vw,40px);background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative}
.sheet::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold-soft);border-radius:10px;pointer-events:none}
.text{font-family:var(--f-read);font-size:var(--fs,26px);line-height:2.15;margin:0;padding:0;list-style:none;position:relative}
.text li{padding:2px 10px;border-radius:10px;cursor:pointer;transition:background .2s}
.text li:hover{background:var(--sky-soft)}
.text li.speaking{background:var(--hl)}
.finish{margin-top:18px;display:flex;justify-content:center}
.result{margin-top:16px;padding:18px;display:grid;gap:6px;text-align:center;border:2px solid var(--gold);background:var(--gold-soft);border-radius:var(--r)}
.result b{font-family:var(--f-display);font-size:22px}
.result .nums{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-weight:700}
.result .nums span{font-size:26px;font-family:var(--f-display);color:var(--sky);display:block}
.note{font-size:14px;color:var(--muted);margin-top:8px}

/* quiz */
.q{padding:18px;margin-bottom:12px}
.q h3{font-family:var(--f-read);font-size:21px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{text-align:right;border:1.5px solid var(--line);background:var(--paper-2);border-radius:12px;padding:11px 14px;font-size:18px;font-weight:500;display:flex;align-items:center;gap:10px}
.opt:hover:not([disabled]){border-color:var(--sky)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin:10px 0 0;font-weight:800}
.fb.good{color:var(--ok)} .fb.bad{color:var(--bad)}
.score{padding:20px;text-align:center;display:grid;gap:8px;justify-items:center}

/* game */
.game{padding:18px;display:grid;gap:14px}
.slot{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;background:var(--paper-2)}
.slot.col{flex-direction:column;align-items:stretch}
.tile{border:1.5px solid var(--sky);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 14px;font-family:var(--f-read);font-size:21px;font-weight:600;text-align:right;box-shadow:0 2px 0 var(--sky-soft)}
.tile.in{background:var(--sky-soft)}
.tile.bad{border-color:var(--bad);background:var(--bad-soft)}
.tile.good{border-color:var(--ok);background:var(--ok-soft)}
.slot.col .tile{font-size:19px}
.gamehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* teacher */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--paper-2);font-weight:800;position:sticky;top:0}
td.name,th.name{position:sticky;right:0;background:var(--paper);text-align:right;font-weight:700;z-index:1;border-left:1px solid var(--line);padding-inline:12px}
th.name{z-index:2;background:var(--paper-2)}
.cell{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center}
.cell.v{color:var(--sky);background:var(--sky-soft)}
.cell.c{color:#fff;background:var(--ok)}
.cell.n{color:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center;margin:10px 0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile-stat{padding:12px 14px}
.tile-stat b{font-family:var(--f-display);font-size:28px;color:var(--ink);display:block;font-variant-numeric:tabular-nums}
.tile-stat span{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--sky);font-weight:800;text-decoration:underline;padding:0}
.modal{position:fixed;inset:0;background:rgba(10,25,40,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:14px;font-weight:700;z-index:60;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast svg{width:28px;height:28px}
.foot{margin-top:40px;text-align:center;color:var(--muted);font-size:13px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<script>
const STORIES = [{"grade":1,"stories":[{"id":"g1-01","title":"قِطَّتِي لُولُو","lines":["عِنْدِي قِطَّةٌ صَغِيرَةٌ.","اسْمُهَا لُولُو.","لَوْنُهَا أَبْيَضُ.","تُحِبُّ لُولُو الْحَلِيبَ.","تَلْعَبُ لُولُو مَعِي كُلَّ يَوْمٍ."],"qs":[["ما اسم القطة؟","لولو","سوسو","ميمي"],["ما لون القطة؟","أبيض","أسود","أحمر"],["ماذا تحب القطة؟","الحليب","الخبز","التمر"]]},{"id":"g1-02","title":"سَالِمٌ وَالْكُرَةُ","lines":["سَالِمٌ وَلَدٌ نَشِيطٌ.","عِنْدَ سَالِمٍ كُرَةٌ كَبِيرَةٌ.","لَعِبَ سَالِمٌ بِالْكُرَةِ فِي السَّاحَةِ.","رَكَلَ سَالِمٌ الْكُرَةَ بِقُوَّةٍ.","فَرِحَ سَالِمٌ وَأَصْدِقَاؤُهُ."],"qs":[["ماذا عند سالم؟","كرة كبيرة","دراجة","قطة"],["أين لعب سالم؟","في الساحة","في المطبخ","في السوق"],["كيف كان سالم؟","نشيطا","كسولا","حزينا"]]},{"id":"g1-03","title":"التُّفَّاحَةُ الْحَمْرَاءُ","lines":["ذَهَبَتْ مَرْيَمُ إِلَى السُّوقِ.","اشْتَرَتْ مَرْيَمُ تُفَّاحَةً حَمْرَاءَ.","غَسَلَتْ مَرْيَمُ التُّفَّاحَةَ بِالْمَاءِ.","أَكَلَتْ مَرْيَمُ التُّفَّاحَةَ.","التُّفَّاحُ لَذِيذٌ وَمُفِيدٌ."],"qs":[["أين ذهبت مريم؟","إلى السوق","إلى البحر","إلى الحديقة"],["ماذا فعلت مريم قبل الأكل؟","غسلت التفاحة","نامت","رسمت التفاحة"],["ما لون التفاحة؟","حمراء","خضراء","صفراء"]]},{"id":"g1-04","title":"مَرْيَمُ فِي الْمَدْرَسَةِ","lines":["تَذْهَبُ مَرْيَمُ إِلَى الْمَدْرَسَةِ.","تَحْمِلُ مَرْيَمُ حَقِيبَتَهَا.","تُسَلِّمُ مَرْيَمُ عَلَى مُعَلِّمَتِهَا.","تَكْتُبُ مَرْيَمُ دَرْسَهَا بِخَطٍّ جَمِيلٍ.","مَرْيَمُ تُحِبُّ مَدْرَسَتَهَا."],"qs":[["إلى أين تذهب مريم؟","إلى المدرسة","إلى البيت","إلى الشاطئ"],["على من تسلم مريم؟","على معلمتها","على جارتها","على قطتها"],["كيف تكتب مريم درسها؟","بخط جميل","بسرعة كبيرة","بخط صغير جدا"]]},{"id":"g1-05","title":"الْعُصْفُورُ الصَّغِيرُ","lines":["عَلَى الشَّجَرَةِ عُصْفُورٌ صَغِيرٌ.","يُغَرِّدُ الْعُصْفُورُ فِي الصَّبَاحِ.","يَطِيرُ الْعُصْفُورُ فِي السَّمَاءِ.","يَبْنِي الْعُصْفُورُ عُشًّا لِصِغَارِهِ.","أُحِبُّ صَوْتَ الْعُصْفُورِ."],"qs":[["أين العصفور؟","على الشجرة","في البحر","تحت الأرض"],["متى يغرد العصفور؟","في الصباح","في الليل","في الظهر فقط"],["ماذا الجمل؟","على العطش","على البرد فقط","على الضوضاء"]]},{"id":"g1-11","title":"الْبَحْرُ","lines":["ذَهَبْنَا إِلَى الْبَحْرِ.","الْمَاءُ أَزْرَقُ صَافٍ.","بَنَتْ عَائِشَةُ بَيْتًا مِنَ الرَّمْلِ.","جَمَعَ سَعِيدٌ الْأَصْدَافَ.","كَانَ يَوْمًا جَمِيلًا."],"qs":[["أين ذهبوا؟","إلى البحر","إلى الجبل","إلى السوق"],["ماذا بنت عائشة؟","بيتا من الرمل","سفينة","سورا من الحجر"],["ماذا جمع سعيد؟","الأصداف","الأوراق","الحجارة الكبيرة"]]},{"id":"g1-12","title":"حَدِيقَةُ جَدِّي","lines":["لِجَدِّي حَدِيقَةٌ كَبِيرَةٌ.","فِي الْحَدِيقَةِ وُرُودٌ وَأَشْجَارٌ.","يَسْقِي جَدِّي الْوُرُودَ كُلَّ صَبَاحٍ.","أُسَاعِدُ جَدِّي فِي قَطْفِ اللَّيْمُونِ.","رَائِحَةُ الْحَدِيقَةِ جَمِيلَةٌ."],"qs":[["لمن الحديقة؟","للجد","للمعلم","للجار"],["متى يسقي الجد الورود؟","كل صباح","كل ليلة","مرة في السنة"],["ماذا نقطف من الحديقة؟","الليمون","السمك","الخبز"]]},{"id":"g1-13","title":"الْأَرْنَبُ النَّشِيطُ","lines":["رَأَيْتُ أَرْنَبًا فِي الْحَقْلِ.","الْأَرْنَبُ لَهُ أُذُنَانِ طَوِيلَتَانِ.","يَقْفِزُ الْأَرْنَبُ بِسُرْعَةٍ.","يَأْكُلُ الْأَرْنَبُ الْجَزَرَ.","الْأَرْنَبُ حَيَوَانٌ لَطِيفٌ."],"qs":[["أين رأيت الأرنب؟","في الحقل","في البحر","في السماء"],["ماذا يأكل الأرنب؟","الجزر","اللحم","السمك"],["كيف أذنا الأرنب؟","طويلتان","قصيرتان","صغيرتان جدا"]]},{"id":"g1-14","title":"فَاطِمَةُ تَقْرَأُ","lines":["فَاطِمَةُ تُحِبُّ الْقِرَاءَةَ.","اشْتَرَى لَهَا أَبُوهَا قِصَّةً جَدِيدَةً.","جَلَسَتْ فَاطِمَةُ تَقْرَأُ الْقِصَّةَ.","فِي الْقِصَّةِ صُوَرٌ جَمِيلَةٌ.","قَالَتْ فَاطِمَةُ: الْكِتَابُ صَدِيقِي."],"qs":[["ماذا تحب فاطمة؟","القراءة","النوم","اللعب فقط"],["من اشترى القصة؟","أبوها","أخوها","جدتها"],["ماذا قالت فاطمة؟","الكتاب صديقي","أنا جائعة","أريد أن أنام"]]},{"id":"g1-15","title":"الشَّمْسُ وَالْقَمَرُ","lines":["تَطْلُعُ الشَّمْسُ فِي النَّهَارِ.","الشَّمْسُ تُعْطِينَا الضَّوْءَ وَالدِّفْءَ.","يَظْهَرُ الْقَمَرُ فِي اللَّيْلِ.","حَوْلَ الْقَمَرِ نُجُومٌ كَثِيرَةٌ.","سُبْحَانَ اللَّهِ الْخَالِقِ."],"qs":[["متى تطلع الشمس؟","في النهار","في الليل","عند النوم"],["متى يظهر القمر؟","في الليل","في الظهر","في الصباح"],["ماذا تعطينا الشمس؟","الضوء والدفء","الماء","المطر"]]},{"id":"g1-16","title":"الْعَلَمُ الْعُمَانِيُّ","lines":["هَذَا عَلَمُ بِلَادِي عُمَانَ.","فِيهِ اللَّوْنُ الْأَحْمَرُ وَالْأَبْيَضُ وَالْأَخْضَرُ.","يُرَفْرِفُ الْعَلَمُ فَوْقَ الْمَدْرَسَةِ.","نَقِفُ لِلسَّلَامِ الْوَطَنِيِّ كُلَّ صَبَاحٍ.","أُحِبُّ وَطَنِي عُمَانَ."],"qs":[["علم أي بلد؟","عمان","مصر","المغرب"],["أين يرفرف العلم؟","فوق المدرسة","في البحر","تحت الشجرة"],["متى نقف للسلام الوطني؟","كل صباح","كل ليلة","في الإجازة فقط"]]},{"id":"g1-17","title":"السُّلَحْفَاةُ","lines":["السُّلَحْفَاةُ تَمْشِي بِبُطْءٍ.","عَلَى ظَهْرِهَا بَيْتٌ قَوِيٌّ.","تَضَعُ السُّلَحْفَاةُ بَيْضَهَا عَلَى الشَّاطِئِ.","يَزُورُ النَّاسُ شَاطِئَ رَأْسِ الْجِنْزِ لِيَرَوْهَا.","نَحْنُ نَحْمِي السُّلَحْفَاةَ."],"qs":[["كيف تمشي السلحفاة؟","ببطء","بسرعة","تقفز"],["ماذا على ظهر السلحفاة؟","بيت قوي","حقيبة","ريش"],["أين تضع السلحفاة بيضها؟","على الشاطئ","فوق الجبل","في البيت"]]},{"id":"g1-18","title":"الْخُبْزُ السَّاخِنُ","lines":["تَخْبِزُ جَدَّتِي الْخُبْزَ فِي الصَّبَاحِ.","رَائِحَةُ الْخُبْزِ طَيِّبَةٌ.","نَأْكُلُ الْخُبْزَ مَعَ الْعَسَلِ.","نَقُولُ: بِسْمِ اللَّهِ قَبْلَ الْأَكْلِ.","نَقُولُ: الْحَمْدُ لِلَّهِ بَعْدَ الْأَكْلِ."],"qs":[["من تخبز الخبز؟","الجدة","الأخت","المعلمة"],["مع ماذا نأكل الخبز؟","مع العسل","مع الملح فقط","مع العصير"],["ماذا نقول قبل الأكل؟","بسم الله","تصبح على خير","مع السلامة"]]},{"id":"g1-19","title":"الدَّرَّاجَةُ الزَّرْقَاءُ","lines":["عِنْدَ يُوسُفَ دَرَّاجَةٌ زَرْقَاءُ.","يَرْكَبُ يُوسُفُ الدَّرَّاجَةَ فِي الْعَصْرِ.","يَلْبَسُ يُوسُفُ الْخُوذَةَ لِيَحْمِيَ رَأْسَهُ.","يَمْشِي يُوسُفُ بِحَذَرٍ.","يُحَافِظُ يُوسُفُ عَلَى دَرَّاجَتِهِ."],"qs":[["ما لون الدراجة؟","زرقاء","حمراء","خضراء"],["متى يركب يوسف الدراجة؟","في العصر","في منتصف الليل","وقت الدرس"],["لماذا يلبس يوسف الخوذة؟","ليحمي رأسه","ليصبح طويلا","لأنها جميلة فقط"]]},{"id":"g1-20","title":"النَّحْلَةُ","lines":["النَّحْلَةُ حَشَرَةٌ نَافِعَةٌ.","تَطِيرُ النَّحْلَةُ مِنْ زَهْرَةٍ إِلَى زَهْرَةٍ.","تَصْنَعُ النَّحْلَةُ الْعَسَلَ.","الْعَسَلُ غِذَاءٌ وَدَوَاءٌ.","النَّحْلَةُ تَعْمَلُ بِجِدٍّ وَنَشَاطٍ."],"qs":[["ماذا تصنع النحلة؟","العسل","الحليب","الخبز"],["إلى أين تطير النحلة؟","من زهرة إلى زهرة","إلى البحر","إلى البيت"],["كيف تعمل النحلة؟","بجد ونشاط","بكسل","ببطء شديد"]]}]},{"grade":2,"stories":[{"id":"g2-01","title":"الْغُرَابُ وَالْجَرَّةُ","lines":["عَطِشَ غُرَابٌ فِي يَوْمٍ حَارٍّ.","رَأَى الْغُرَابُ جَرَّةً فِيهَا قَلِيلٌ مِنَ الْمَاءِ.","حَاوَلَ أَنْ يَشْرَبَ، لَكِنَّ مِنْقَارَهُ لَمْ يَصِلْ إِلَى الْمَاءِ.","فَكَّرَ الْغُرَابُ قَلِيلًا، ثُمَّ جَمَعَ حَصًى صَغِيرًا.","وَضَعَ الْغُرَابُ الْحَصَى فِي الْجَرَّةِ وَاحِدَةً بَعْدَ وَاحِدَةٍ.","ارْتَفَعَ الْمَاءُ، فَشَرِبَ الْغُرَابُ حَتَّى ارْتَوَى."],"qs":[["لماذا لم يشرب الغراب في البداية؟","لأن منقاره لم يصل إلى الماء","لأن الماء كان ساخنا","لأنه لم يكن عطشان"],["ماذا وضع الغراب في الجرة؟","حصى صغيرا","أوراقا","رملا"],["ماذا نتعلم من القصة؟","التفكير يحل المشكلات","الغضب مفيد","الاستسلام سريعا"]]},{"id":"g2-02","title":"الْأَسَدُ وَالْفَأْرُ","lines":["نَامَ الْأَسَدُ تَحْتَ شَجَرَةٍ كَبِيرَةٍ.","مَرَّ فَأْرٌ صَغِيرٌ فَوْقَ ظَهْرِهِ فَأَيْقَظَهُ.","أَمْسَكَ الْأَسَدُ الْفَأْرَ، فَقَالَ الْفَأْرُ: اعْفُ عَنِّي، وَسَأُسَاعِدُكَ يَوْمًا.","ضَحِكَ الْأَسَدُ وَتَرَكَهُ.","بَعْدَ أَيَّامٍ وَقَعَ الْأَسَدُ فِي شَبَكَةِ صَيَّادٍ.","جَاءَ الْفَأْرُ وَقَرَضَ الشَّبَكَةَ بِأَسْنَانِهِ، فَنَجَا الْأَسَدُ."],"qs":[["أين نام الأسد؟","تحت شجرة كبيرة","في كهف","قرب النهر"],["كيف ساعد الفأر الأسد؟","قرض الشبكة","أحضر له الطعام","نادى الحيوانات"],["ماذا نتعلم من القصة؟","المعروف لا يضيع","الصغير لا ينفع","النوم مفيد"]]},{"id":"g2-03","title":"رِحْلَةٌ إِلَى نِزْوَى","lines":["فِي يَوْمِ الْجُمُعَةِ زَارَتْ عَائِلَةُ سُعَادَ مَدِينَةَ نِزْوَى.","صَعِدُوا إِلَى قَلْعَةِ نِزْوَى الْكَبِيرَةِ.","رَأَتْ سُعَادُ الْمَدَافِعَ الْقَدِيمَةَ وَالْأَبْوَابَ الْخَشَبِيَّةَ.","ثُمَّ ذَهَبُوا إِلَى السُّوقِ الْقَدِيمِ.","اشْتَرَى أَبُوهَا حَلْوَى عُمَانِيَّةً لَذِيذَةً.","قَالَتْ سُعَادُ: بِلَادِي جَمِيلَةٌ وَتَارِيخُهَا عَرِيقٌ."],"qs":[["أي مدينة زارت العائلة؟","نزوى","صلالة","صور"],["ماذا رأت سعاد في القلعة؟","المدافع القديمة","السفن","الطائرات"],["ماذا اشترى الأب؟","حلوى عمانية","ألعابا","ملابس"]]},{"id":"g2-04","title":"الصَّدِيقَانِ","lines":["كَانَ سَعِيدٌ وَحَمَدٌ صَدِيقَيْنِ.","يَذْهَبَانِ إِلَى الْمَدْرَسَةِ مَعًا كُلَّ يَوْمٍ.","فِي يَوْمٍ نَسِيَ حَمَدٌ قَلَمَهُ فِي الْبَيْتِ.","أَعْطَاهُ سَعِيدٌ قَلَمًا مِنْ حَقِيبَتِهِ.","شَكَرَ حَمَدٌ صَدِيقَهُ وَقَالَ: أَنْتَ صَدِيقٌ وَفِيٌّ.","الصَّدِيقُ الْحَقِيقِيُّ يُسَاعِدُ صَدِيقَهُ."],"qs":[["ماذا نسي حمد؟","قلمه","كتابه","طعامه"],["من ساعد حمدا؟","سعيد","المعلم","أخوه"],["ما صفة سعيد؟","صديق وفي","أناني","كسول"]]},{"id":"g2-05","title":"الْقِطَّةُ وَصِغَارُهَا","lines":["وَلَدَتِ الْقِطَّةُ ثَلَاثَ قِطَطٍ صَغِيرَةٍ.","كَانَتِ الْقِطَطُ تَنَامُ قُرْبَ أُمِّهَا.","تُرْضِعُ الْأُمُّ صِغَارَهَا وَتَحْمِيهِمْ.","خَرَجَ أَصْغَرُهُمْ مِنَ الْبَيْتِ فَضَاعَ.","بَحَثَتِ الْأُمُّ عَنْهُ حَتَّى وَجَدَتْهُ تَحْتَ السَّيَّارَةِ.","حَمَلَتْهُ بِفَمِهَا وَعَادَتْ بِهِ إِلَى إِخْوَتِهِ."],"qs":[["كم قطة صغيرة ولدت؟","ثلاث","اثنتان","خمس"],["أين وجدت الأم صغيرها؟","تحت السيارة","فوق الشجرة","في المطبخ"],["ماذا نتعلم عن الأم؟","تحمي صغارها وتحبهم","لا تهتم بصغارها","تحب النوم"]]},{"id":"g2-06","title":"الْمِصْبَاحُ وَالْكَهْرَبَاءُ","lines":["فِي الْمَسَاءِ أَطْفَأَ خَالِدٌ مِصْبَاحَ غُرْفَتِهِ.","سَأَلَتْهُ أُخْتُهُ: لِمَاذَا أَطْفَأْتَ الْمِصْبَاحَ؟","قَالَ خَالِدٌ: خَرَجْتُ مِنَ الْغُرْفَةِ، فَلَا أَحْتَاجُهُ.","عَلَّمَتْنَا الْمُعَلِّمَةُ أَنْ نُحَافِظَ عَلَى الْكَهْرَبَاءِ.","قَالَتِ الْأُخْتُ: وَأَنَا سَأُغْلِقُ الْمِرْوَحَةَ.","فَرِحَ الْأَبُ بِوَلَدَيْهِ الْحَرِيصَيْنِ."],"qs":[["ماذا أطفأ خالد؟","المصباح","التلفاز","الفرن"],["لماذا أطفأه؟","لأنه خرج من الغرفة","لأنه خاف","لأنه مكسور"],["من علمهم الحفاظ على الكهرباء؟","المعلمة","الجار","الطبيب"]]},{"id":"g2-07","title":"الشَّجَرَةُ الْعَطْشَى","lines":["فِي حَدِيقَةِ الْمَدْرَسَةِ شَجَرَةٌ صَغِيرَةٌ.","لَاحَظَتْ شَيْخَةُ أَنَّ أَوْرَاقَهَا صَفْرَاءُ.","قَالَتْ: الشَّجَرَةُ عَطْشَى، تَحْتَاجُ إِلَى الْمَاءِ.","مَلَأَتْ شَيْخَةُ إِبْرِيقًا وَسَقَتِ الشَّجَرَةَ.","صَارَتْ تَسْقِيهَا كُلَّ يَوْمٍ قَبْلَ الطَّابُورِ.","بَعْدَ أُسْبُوعٍ عَادَتِ الْأَوْرَاقُ خَضْرَاءَ نَضِرَةً."],"qs":[["ماذا لاحظت شيخة؟","أوراق الشجرة صفراء","الشجرة طويلة","الشجرة فيها ثمار"],["متى كانت تسقي الشجرة؟","قبل الطابور","في الليل","يوم الجمعة فقط"],["كيف صارت الأوراق بعد أسبوع؟","خضراء نضرة","بنية يابسة","سقطت كلها"]]},{"id":"g2-08","title":"سَفِينَةُ الصَّيَّادِ","lines":["خَرَجَ الصَّيَّادُ سَالِمٌ بِقَارِبِهِ فِي الْفَجْرِ.","رَمَى شَبَكَتَهُ فِي الْبَحْرِ وَانْتَظَرَ.","بَعْدَ سَاعَةٍ سَحَبَ الشَّبَكَةَ، فَإِذَا هِيَ مَلِيئَةٌ بِالسَّمَكِ.","عَادَ إِلَى الشَّاطِئِ وَبَاعَ السَّمَكَ فِي السُّوقِ.","أَعْطَى جَارَهُ الْفَقِيرَ بَعْضَ السَّمَكِ.","دَعَا لَهُ الْجَارُ بِالْخَيْرِ وَالْبَرَكَةِ."],"qs":[["متى خرج الصياد؟","في الفجر","في الظهر","في الليل"],["ماذا وجد في الشبكة؟","السمك","الأصداف فقط","الحجارة"],["لمن أعطى بعض السمك؟","لجاره الفقير","لمعلمه","للبائع"]]},{"id":"g2-09","title":"الْعَصِيرُ اللَّذِيذُ","lines":["أَرَادَتْ مَرْيَمُ أَنْ تَصْنَعَ عَصِيرًا لِأُمِّهَا.","أَحْضَرَتْ بُرْتُقَالًا وَمَانْجُو مِنَ الثَّلَّاجَةِ.","غَسَلَتِ الْفَوَاكِهَ جَيِّدًا.","قَشَّرَتْهَا بِمُسَاعَدَةِ أُخْتِهَا الْكَبِيرَةِ.","وَضَعَتِ الْفَوَاكِهَ فِي الْخَلَّاطِ مَعَ الْمَاءِ.","شَرِبَتِ الْأُمُّ الْعَصِيرَ وَقَالَتْ: سَلِمَتْ يَدَاكِ."],"qs":[["لمن صنعت مريم العصير؟","لأمها","لمعلمتها","لصديقتها"],["من ساعد مريم في التقشير؟","أختها الكبيرة","أبوها","جدتها"],["ماذا قالت الأم؟","سلمت يداك","لا أحب العصير","أنا مشغولة"]]},{"id":"g2-10","title":"الْحَمَامَةُ وَالنَّمْلَةُ","lines":["نَزَلَتْ نَمْلَةٌ إِلَى النَّهْرِ لِتَشْرَبَ فَسَقَطَتْ فِيهِ.","رَأَتْهَا حَمَامَةٌ فَأَلْقَتْ لَهَا وَرَقَةً.","صَعِدَتِ النَّمْلَةُ عَلَى الْوَرَقَةِ وَنَجَتْ.","بَعْدَ أَيَّامٍ جَاءَ صَيَّادٌ يُرِيدُ صَيْدَ الْحَمَامَةِ.","قَرَصَتِ النَّمْلَةُ قَدَمَ الصَّيَّادِ فَصَاحَ.","سَمِعَتِ الْحَمَامَةُ الصَّوْتَ فَطَارَتْ بَعِيدًا."],"qs":[["ماذا ألقت الحمامة للنملة؟","ورقة","حبة قمح","غصنا كبيرا"],["كيف ردت النملة الجميل؟","قرصت قدم الصياد","أحضرت طعاما","غنت للحمامة"],["ماذا نتعلم من القصة؟","من يفعل الخير يجد الخير","الصيد ممتع","النهر خطير فقط"]]},{"id":"g2-11","title":"يَوْمُ النَّظَافَةِ","lines":["أَعْلَنَتِ الْمَدْرَسَةُ عَنْ يَوْمِ النَّظَافَةِ.","لَبِسَ الطُّلَّابُ الْقُفَّازَاتِ وَحَمَلُوا الْأَكْيَاسَ.","جَمَعُوا الْأَوْرَاقَ مِنَ السَّاحَةِ.","نَظَّفَ بَعْضُهُمُ الْفُصُولَ وَرَتَّبُوا الْمَقَاعِدَ.","زَرَعَتِ الطَّالِبَاتُ وُرُودًا عِنْدَ الْبَابِ.","صَارَتِ الْمَدْرَسَةُ نَظِيفَةً جَمِيلَةً."],"qs":[["ماذا لبس الطلاب؟","القفازات","المعاطف","القبعات"],["ماذا زرعت الطالبات؟","ورودا","نخلا","قمحا"],["كيف صارت المدرسة؟","نظيفة جميلة","مزدحمة","مغلقة"]]},{"id":"g2-12","title":"الْبَالُونُ الْأَحْمَرُ","lines":["اشْتَرَى أَبِي لِي بَالُونًا أَحْمَرَ.","رَبَطْتُ الْبَالُونَ بِخَيْطٍ طَوِيلٍ.","هَبَّتْ رِيحٌ قَوِيَّةٌ فَطَارَ الْبَالُونُ.","حَزِنْتُ قَلِيلًا وَأَنَا أَنْظُرُ إِلَيْهِ فِي السَّمَاءِ.","قَالَ أَبِي: لَا تَحْزَنْ، سَنَرْبِطُهُ جَيِّدًا فِي الْمَرَّةِ الْقَادِمَةِ.","تَعَلَّمْتُ أَنْ أَكُونَ أَكْثَرَ حِرْصًا."],"qs":[["ما لون البالون؟","أحمر","أزرق","أصفر"],["لماذا طار البالون؟","هبت ريح قوية","انفجر","أعطاه لصديقه"],["ماذا تعلم الطفل؟","أن يكون أكثر حرصا","أن يبكي","ألا يشتري بالونا"]]},{"id":"g2-13","title":"جَدَّتِي تَحْكِي","lines":["فِي اللَّيْلِ نَجْلِسُ حَوْلَ جَدَّتِي.","تَحْكِي لَنَا جَدَّتِي حِكَايَاتٍ جَمِيلَةً.","حَكَتْ لَنَا عَنِ الْبَحَّارِ الَّذِي سَافَرَ إِلَى بِلَادٍ بَعِيدَةٍ.","كَانَ الْبَحَّارُ شُجَاعًا وَصَبُورًا.","نَسْتَمِعُ إِلَيْهَا بِانْتِبَاهٍ حَتَّى نَنَامَ.","أُحِبُّ جَدَّتِي وَحِكَايَاتِهَا."],"qs":[["متى تحكي الجدة؟","في الليل","في الصباح","في الظهر"],["عمن حكت الجدة؟","عن البحار","عن الطبيب","عن الفلاح"],["كيف كان البحار؟","شجاعا وصبورا","خائفا","كسولا"]]},{"id":"g2-14","title":"الطَّبِيبُ الصَّغِيرُ","lines":["مَرِضَتْ دُمْيَةُ لَيْلَى، هَكَذَا قَالَتْ لِأَخِيهَا زَيْدٍ.","لَبِسَ زَيْدٌ ثَوْبًا أَبْيَضَ وَصَارَ طَبِيبًا صَغِيرًا.","فَحَصَ الدُّمْيَةَ بِسَمَّاعَةٍ مِنَ الْوَرَقِ.","قَالَ زَيْدٌ: تَحْتَاجُ إِلَى الرَّاحَةِ وَشُرْبِ الْمَاءِ.","ضَحِكَتْ لَيْلَى وَغَطَّتِ الدُّمْيَةَ بِلِحَافٍ صَغِيرٍ.","قَالَ زَيْدٌ: عِنْدَمَا أَكْبَرُ سَأَكُونُ طَبِيبًا حَقِيقِيًّا."],"qs":[["من مرضت؟","دمية ليلى","ليلى","زيد"],["ماذا لبس زيد؟","ثوبا أبيض","ثوبا أسود","ملابس الرياضة"],["ماذا يريد زيد أن يكون؟","طبيبا","طيارا","خبازا"]]},{"id":"g2-15","title":"اللُّبَانُ الْعُمَانِيُّ","lines":["فِي ظُفَارَ تَنْمُو شَجَرَةُ اللُّبَانِ.","يَجْرَحُ الْمُزَارِعُ سَاقَ الشَّجَرَةِ بِلُطْفٍ.","تَخْرُجُ مِنْهَا قَطَرَاتٌ بَيْضَاءُ تَجِفُّ بَعْدَ أَيَّامٍ.","هَذِهِ الْقَطَرَاتُ هِيَ اللُّبَانُ.","لِلُّبَانِ رَائِحَةٌ طَيِّبَةٌ، وَيُبَاعُ فِي الْأَسْوَاقِ.","عُرِفَتْ عُمَانُ بِاللُّبَانِ مُنْذُ زَمَنٍ بَعِيدٍ."],"qs":[["أين تنمو شجرة اللبان؟","في ظفار","في مسقط","في البريمي"],["ما لون قطرات اللبان؟","بيضاء","سوداء","حمراء"],["بماذا عرفت عمان منذ زمن بعيد؟","باللبان","بالثلج","بالقمح"]]},{"id":"g2-16","title":"الْكُرَةُ فِي حَدِيقَةِ الْجَارِ","lines":["كَانَ هِلَالٌ يَلْعَبُ بِالْكُرَةِ مَعَ أَخِيهِ.","طَارَتِ الْكُرَةُ وَسَقَطَتْ فِي حَدِيقَةِ الْجَارِ.","أَرَادَ أَخُوهُ أَنْ يَقْفِزَ فَوْقَ السُّورِ.","قَالَ هِلَالٌ: لَا، يَجِبُ أَنْ نَسْتَأْذِنَ أَوَّلًا.","طَرَقَ هِلَالٌ الْبَابَ وَطَلَبَ الْكُرَةَ بِأَدَبٍ.","أَعْطَاهُ الْجَارُ الْكُرَةَ وَشَكَرَهُ عَلَى أَدَبِهِ."],"qs":[["أين سقطت الكرة؟","في حديقة الجار","في الشارع","في البحر"],["ماذا أراد الأخ أن يفعل؟","يقفز فوق السور","يبكي","يشتري كرة"],["ماذا فعل هلال؟","طرق الباب واستأذن","قفز فوق السور","ترك الكرة"]]},{"id":"g2-17","title":"الْقَمَرُ الْمُنِيرُ","lines":["خَرَجَتْ نُورَةُ مَعَ أَبِيهَا إِلَى سَطْحِ الْبَيْتِ.","رَأَتِ الْقَمَرَ مُسْتَدِيرًا مُنِيرًا.","سَأَلَتْ: لِمَاذَا يَتَغَيَّرُ شَكْلُ الْقَمَرِ؟","قَالَ أَبُوهَا: يَبْدُو هِلَالًا، ثُمَّ يَكْبُرُ حَتَّى يَصِيرَ بَدْرًا.","عَرَفَتْ نُورَةُ أَنَّ الْقَمَرَ يُسَاعِدُنَا فِي مَعْرِفَةِ الشُّهُورِ.","نَامَتْ نُورَةُ وَهِيَ تَحْلُمُ بِالْقَمَرِ."],"qs":[["أين خرجت نورة مع أبيها؟","إلى سطح البيت","إلى البحر","إلى السوق"],["كيف كان القمر؟","مستديرا منيرا","مختفيا","أحمر"],["بماذا يساعدنا القمر؟","في معرفة الشهور","في الطبخ","في السباحة"]]},{"id":"g2-18","title":"الدَّجَاجَةُ الْحَمْرَاءُ","lines":["وَجَدَتِ الدَّجَاجَةُ حَبَّاتِ قَمْحٍ.","سَأَلَتْ: مَنْ يُسَاعِدُنِي فِي زِرَاعَتِهَا؟","قَالَ الْقِطُّ: لَا أَنَا، وَقَالَ الْكَلْبُ: لَا أَنَا.","زَرَعَتْهَا وَحْدَهَا، ثُمَّ حَصَدَتْهَا وَخَبَزَتْ خُبْزًا.","قَالَتْ: مَنْ يَأْكُلُ مَعِي؟ فَقَالُوا جَمِيعًا: أَنَا!","قَالَتِ الدَّجَاجَةُ: مَنْ لَا يَعْمَلُ لَا يَأْكُلُ."],"qs":[["ماذا وجدت الدجاجة؟","حبات قمح","حبات تمر","بيضة"],["من ساعدها في الزراعة؟","لا أحد","القط","الكلب"],["ماذا نتعلم من القصة؟","العمل طريق النجاح","الكسل مفيد","الأكل قبل العمل"]]},{"id":"g2-19","title":"الْمَطَرُ وَالْوَادِي","lines":["تَجَمَّعَتِ الْغُيُومُ فَوْقَ الْجَبَلِ.","نَزَلَ مَطَرٌ غَزِيرٌ طُولَ اللَّيْلِ.","فِي الصَّبَاحِ جَرَى الْمَاءُ فِي الْوَادِي.","قَالَ الْأَبُ: لَا نَقْتَرِبُ مِنَ الْوَادِي وَهُوَ يَجْرِي.","نَظَرَ الْأَطْفَالُ إِلَيْهِ مِنْ مَكَانٍ آمِنٍ.","بَعْدَ أَيَّامٍ اخْضَرَّتِ الْأَرْضُ وَامْتَلَأَتِ الْآبَارُ."],"qs":[["أين تجمعت الغيوم؟","فوق الجبل","فوق البحر","فوق المدرسة"],["ماذا قال الأب؟","لا نقترب من الوادي وهو يجري","اسبحوا في الوادي","اذهبوا للعب هناك"],["ماذا حدث بعد أيام؟","اخضرت الأرض","جفت الأشجار","سقط الثلج"]]},{"id":"g2-20","title":"الْهَدِيَّةُ","lines":["اقْتَرَبَ عِيدُ الْأُمِّ، فَفَكَّرَ عَلِيٌّ فِي هَدِيَّةٍ.","لَمْ يَكُنْ مَعَهُ مَالٌ كَثِيرٌ.","أَخَذَ وَرَقًا مُلَوَّنًا وَرَسَمَ عَلَيْهِ وَرْدَةً.","كَتَبَ تَحْتَهَا: أُحِبُّكِ يَا أُمِّي.","قَدَّمَ الْبِطَاقَةَ لِأُمِّهِ صَبَاحَ الْعِيدِ.","عَانَقَتْهُ أُمُّهُ وَقَالَتْ: هَذِهِ أَجْمَلُ هَدِيَّةٍ."],"qs":[["بماذا فكر علي؟","في هدية لأمه","في رحلة","في لعبة جديدة"],["ماذا رسم علي؟","وردة","سيارة","بيتا"],["ماذا قالت الأم؟","هذه أجمل هدية","لا أريدها","أين المال؟"]]}]},{"grade":3,"stories":[{"id":"g3-01","title":"الْفَلَجُ مَصْدَرُ الْحَيَاةِ","lines":["فِي قَرْيَةِ مَازِنٍ فَلَجٌ قَدِيمٌ يَجْرِي فِيهِ الْمَاءُ.","سَأَلَ مَازِنٌ جَدَّهُ: مِنْ أَيْنَ يَأْتِي مَاءُ الْفَلَجِ؟","قَالَ الْجَدُّ: يَأْتِي مِنْ بَاطِنِ الْأَرْضِ عِنْدَ الْجَبَلِ.","حَفَرَ أَجْدَادُنَا قَنَوَاتٍ طَوِيلَةً لِيَصِلَ الْمَاءُ إِلَى الْقُرَى.","يَشْرَبُ النَّاسُ مِنَ الْفَلَجِ، وَيَسْقُونَ مِنْهُ النَّخِيلَ وَالْمَزَارِعَ.","وَلِكُلِّ مُزَارِعٍ وَقْتٌ مُحَدَّدٌ يَأْخُذُ فِيهِ نَصِيبَهُ مِنَ الْمَاءِ.","تَعَجَّبَ مَازِنٌ مِنْ هَذَا النِّظَامِ الدَّقِيقِ.","قَالَ الْجَدُّ: الْأَفْلَاجُ مِنْ تُرَاثِ عُمَانَ، وَعَلَيْنَا أَنْ نُحَافِظَ عَلَيْهَا.","وَعَدَ مَازِنٌ جَدَّهُ أَلَّا يَرْمِيَ شَيْئًا فِي الْفَلَجِ أَبَدًا."],"qs":[["من أين يأتي ماء الفلج؟","من باطن الأرض عند الجبل","من البحر","من المطر مباشرة"],["ماذا يسقي الناس من الفلج؟","النخيل والمزارع","السيارات","الطرق"],["ما الذي تعجب منه مازن؟","النظام الدقيق لتوزيع الماء","طول الجبل","لون الماء"],["بماذا وعد مازن جده؟","ألا يرمي شيئا في الفلج","أن يسبح في الفلج","أن يحفر فلجا جديدا"]]},{"id":"g3-02","title":"الثَّعْلَبُ وَالْعِنَبُ","lines":["خَرَجَ ثَعْلَبٌ جَائِعٌ يَبْحَثُ عَنْ طَعَامٍ.","رَأَى عَنَاقِيدَ عِنَبٍ تَتَدَلَّى مِنْ غُصْنٍ عَالٍ.","قَالَ فِي نَفْسِهِ: هَذَا الْعِنَبُ يَبْدُو حُلْوًا لَذِيذًا.","قَفَزَ الثَّعْلَبُ لِيَصِلَ إِلَى الْعِنَبِ، فَلَمْ يَصِلْ.","قَفَزَ مَرَّةً ثَانِيَةً وَثَالِثَةً، وَلَكِنَّهُ لَمْ يَنْجَحْ.","تَعِبَ الثَّعْلَبُ وَجَلَسَ يَلْهَثُ تَحْتَ الشَّجَرَةِ.","ثُمَّ قَامَ وَمَشَى وَهُوَ يَقُولُ: هَذَا الْعِنَبُ حَامِضٌ، لَا أُرِيدُهُ.","كَانَ الثَّعْلَبُ يَكْذِبُ عَلَى نَفْسِهِ لِأَنَّهُ عَجَزَ عَنْهُ.","الْعَاقِلُ يَعْتَرِفُ بِعَجْزِهِ، وَيَبْحَثُ عَنْ طَرِيقَةٍ أُخْرَى."],"qs":[["لماذا خرج الثعلب؟","يبحث عن طعام","يبحث عن صديق","يريد النوم"],["أين كان العنب؟","على غصن عال","على الأرض","في سلة"],["ماذا قال الثعلب في النهاية؟","هذا العنب حامض","سأعود غدا","العنب لذيذ جدا"],["ماذا نتعلم من القصة؟","الاعتراف بالعجز والبحث عن حل","القفز مفيد دائما","العنب حامض دائما"]]},{"id":"g3-03","title":"الْمَكْتَبَةُ الْمَدْرَسِيَّةُ","lines":["فِي حِصَّةِ الْقِرَاءَةِ ذَهَبَ الطُّلَّابُ إِلَى الْمَكْتَبَةِ.","رَحَّبَتْ بِهِمْ أَمِينَةُ الْمَكْتَبَةِ بِابْتِسَامَةٍ.","قَالَتْ: هُنَا كُتُبٌ عَنِ الْحَيَوَانَاتِ وَالْفَضَاءِ وَالْقِصَصِ.","اخْتَارَتْ رَحْمَةُ كِتَابًا عَنِ النُّجُومِ وَالْكَوَاكِبِ.","وَاخْتَارَ يَاسِرٌ قِصَّةً عَنْ بَحَّارٍ عُمَانِيٍّ شُجَاعٍ.","جَلَسَ الطُّلَّابُ بِهُدُوءٍ، وَكُلٌّ مِنْهُمْ يَقْرَأُ كِتَابَهُ.","فِي آخِرِ الْحِصَّةِ حَكَى كُلُّ طَالِبٍ مَا قَرَأَهُ لِزُمَلَائِهِ.","تَعَلَّمَ الطُّلَّابُ أَشْيَاءَ جَدِيدَةً مِنْ بَعْضِهِمْ.","قَالَتِ الْمُعَلِّمَةُ: الْقِرَاءَةُ نَافِذَةٌ نَرَى مِنْهَا الْعَالَمَ."],"qs":[["من رحبت بالطلاب؟","أمينة المكتبة","مديرة المدرسة","الطبيبة"],["عن ماذا كان كتاب رحمة؟","النجوم والكواكب","الطبخ","السيارات"],["كيف جلس الطلاب؟","بهدوء","بضجيج","واقفين"],["ماذا قالت المعلمة عن القراءة؟","نافذة نرى منها العالم","مضيعة للوقت","صعبة جدا"]]},{"id":"g3-04","title":"السُّلَحْفَاةُ وَالْأَرْنَبُ","lines":["سَخِرَ الْأَرْنَبُ مِنَ السُّلَحْفَاةِ لِأَنَّهَا بَطِيئَةٌ.","قَالَتِ السُّلَحْفَاةُ: هَيَّا نَتَسَابَقْ إِلَى الشَّجَرَةِ الْبَعِيدَةِ.","ضَحِكَ الْأَرْنَبُ وَوَافَقَ عَلَى السِّبَاقِ.","انْطَلَقَ الْأَرْنَبُ بِسُرْعَةٍ وَسَبَقَ السُّلَحْفَاةَ كَثِيرًا.","قَالَ: مَا زَالَ الْوَقْتُ طَوِيلًا، سَأَنَامُ قَلِيلًا.","أَمَّا السُّلَحْفَاةُ فَظَلَّتْ تَمْشِي دُونَ تَوَقُّفٍ.","مَرَّتْ بِجَانِبِ الْأَرْنَبِ وَهُوَ نَائِمٌ، وَوَاصَلَتْ طَرِيقَهَا.","اسْتَيْقَظَ الْأَرْنَبُ فَرَأَى السُّلَحْفَاةَ قَدْ وَصَلَتْ إِلَى الشَّجَرَةِ.","عَرَفَ الْأَرْنَبُ أَنَّ الْغُرُورَ يُضَيِّعُ الْفَوْزَ، وَأَنَّ الْمُثَابَرَةَ طَرِيقُ النَّجَاحِ."],"qs":[["لماذا سخر الأرنب من السلحفاة؟","لأنها بطيئة","لأنها صغيرة","لأنها نائمة"],["ماذا فعل الأرنب في منتصف السباق؟","نام","أكل جزرا","رجع إلى البيت"],["من فاز في السباق؟","السلحفاة","الأرنب","لم يفز أحد"],["ما الصفة التي جعلت السلحفاة تفوز؟","المثابرة","الغرور","السرعة"]]},{"id":"g3-05","title":"صَبَاحٌ فِي سُوقِ مَطْرَحَ","lines":["اصْطَحَبَ الْأَبُ ابْنَتَهُ شَمْسَةَ إِلَى سُوقِ مَطْرَحَ.","كَانَ السُّوقُ مُزْدَحِمًا بِالنَّاسِ مِنْ كُلِّ مَكَانٍ.","شَمَّتْ شَمْسَةُ رَائِحَةَ الْبَخُورِ وَاللُّبَانِ.","رَأَتْ دَكَاكِينَ تَبِيعُ الْخَنَاجِرَ الْفِضِّيَّةَ وَالْمَلَابِسَ الْمُلَوَّنَةَ.","تَوَقَّفَا عِنْدَ بَائِعٍ عَجُوزٍ يَصْنَعُ السِّلَالَ مِنْ سَعَفِ النَّخِيلِ.","قَالَ الْبَائِعُ: هَذِهِ حِرْفَةٌ وَرِثْتُهَا عَنْ أَبِي.","اشْتَرَى الْأَبُ سَلَّةً صَغِيرَةً لِشَمْسَةَ.","ثُمَّ جَلَسَا عَلَى الْكُورْنِيشِ يَنْظُرَانِ إِلَى السُّفُنِ فِي الْبَحْرِ.","قَالَتْ شَمْسَةُ: سَأَضَعُ فِي السَّلَّةِ أَقْلَامِي وَأَحْتَفِظُ بِهَا لِلذِّكْرَى."],"qs":[["إلى أي سوق ذهبا؟","سوق مطرح","سوق نزوى","سوق صحار"],["ما الرائحة التي شمتها شمسة؟","البخور واللبان","الخبز","السمك"],["مم يصنع البائع السلال؟","من سعف النخيل","من الحديد","من البلاستيك"],["ماذا ستضع شمسة في السلة؟","أقلامها","الحلوى","الملابس"]]},{"id":"g3-06","title":"النَّمْلَةُ وَالْجُنْدُبُ","lines":["فِي الصَّيْفِ كَانَتِ النَّمْلَةُ تَعْمَلُ طُولَ النَّهَارِ.","تَجْمَعُ الْحُبُوبَ وَتَحْمِلُهَا إِلَى بَيْتِهَا.","أَمَّا الْجُنْدُبُ فَكَانَ يُغَنِّي وَيَلْعَبُ تَحْتَ الشَّمْسِ.","قَالَ لِلنَّمْلَةِ: لِمَاذَا تُتْعِبِينَ نَفْسَكِ؟ تَعَالَيْ نَلْعَبْ.","قَالَتِ النَّمْلَةُ: أَجْمَعُ طَعَامًا لِأَيَّامِ الشِّتَاءِ.","جَاءَ الشِّتَاءُ، وَاخْتَفَى الطَّعَامُ مِنَ الْحُقُولِ.","جَاعَ الْجُنْدُبُ وَذَهَبَ إِلَى النَّمْلَةِ يَطْلُبُ الْمُسَاعَدَةَ.","أَعْطَتْهُ النَّمْلَةُ قَلِيلًا مِنَ الطَّعَامِ وَقَالَتْ: اعْمَلْ فِي الصَّيْفِ الْقَادِمِ.","تَعَلَّمَ الْجُنْدُبُ أَنَّ الِاسْتِعْدَادَ لِلْمُسْتَقْبَلِ حِكْمَةٌ."],"qs":[["ماذا كانت تفعل النملة في الصيف؟","تجمع الحبوب","تغني","تنام"],["ماذا كان يفعل الجندب؟","يغني ويلعب","يجمع الطعام","يبني بيتا"],["لماذا ذهب الجندب إلى النملة؟","لأنه جاع","ليغني لها","ليلعب معها"],["ماذا تعلم الجندب؟","الاستعداد للمستقبل حكمة","اللعب أهم شيء","الشتاء قصير"]]},{"id":"g3-07","title":"الْمُسَابَقَةُ الْعِلْمِيَّةُ","lines":["أَعْلَنَتِ الْمَدْرَسَةُ عَنْ مُسَابَقَةٍ لِأَفْضَلِ تَجْرِبَةٍ عِلْمِيَّةٍ.","قَرَّرَتْ مَيْثَاءُ وَصَدِيقَتُهَا أَنْ تَشْتَرِكَا مَعًا.","فَكَّرَتَا فِي تَجْرِبَةٍ تُبَيِّنُ أَنَّ النَّبَاتَ يَحْتَاجُ إِلَى الضَّوْءِ.","زَرَعَتَا حَبَّتَيْ فُولٍ فِي كُوبَيْنِ.","وَضَعَتَا الْكُوبَ الْأَوَّلَ قُرْبَ النَّافِذَةِ، وَالثَّانِيَ فِي خِزَانَةٍ مُظْلِمَةٍ.","بَعْدَ أُسْبُوعٍ نَمَا النَّبَاتُ الْأَوَّلُ أَخْضَرَ قَوِيًّا.","أَمَّا النَّبَاتُ الثَّانِي فَكَانَ ضَعِيفًا أَصْفَرَ اللَّوْنِ.","شَرَحَتِ الصَّدِيقَتَانِ التَّجْرِبَةَ أَمَامَ لَجْنَةِ التَّحْكِيمِ بِثِقَةٍ.","فَازَتَا بِالْمَرْكَزِ الْأَوَّلِ، وَصَفَّقَ لَهُمَا الْجَمِيعُ."],"qs":[["ماذا تبين التجربة؟","النبات يحتاج إلى الضوء","النبات لا يحتاج إلى الماء","الفول لا ينبت"],["أين وضعتا الكوب الثاني؟","في خزانة مظلمة","قرب النافذة","في الثلاجة"],["كيف كان النبات الثاني؟","ضعيفا أصفر","أخضر قويا","طويلا جدا"],["بأي مركز فازتا؟","الأول","الثاني","الثالث"]]},{"id":"g3-08","title":"الْبَحَّارُ أَحْمَدُ بْنُ مَاجِدٍ","lines":["كَانَ أَحْمَدُ بْنُ مَاجِدٍ بَحَّارًا عَرَبِيًّا مَشْهُورًا.","عَاشَ قَبْلَ مِئَاتِ السِّنِينَ، وَأَحَبَّ الْبَحْرَ مُنْذُ صِغَرِهِ.","تَعَلَّمَ مِنْ أَبِيهِ وَجَدِّهِ فُنُونَ الْمِلَاحَةِ.","كَانَ يَعْرِفُ طُرُقَ الْبِحَارِ بِالنَّظَرِ إِلَى النُّجُومِ.","وَكَانَ يَعْرِفُ مَتَى تَهُبُّ الرِّيَاحُ وَمَتَى تَهْدَأُ.","كَتَبَ كُتُبًا كَثِيرَةً عَنِ الْبَحْرِ وَالسُّفُنِ وَالنُّجُومِ.","لُقِّبَ بِأَسَدِ الْبِحَارِ لِشَجَاعَتِهِ وَعِلْمِهِ.","مَا زَالَ النَّاسُ يَذْكُرُونَهُ وَيَفْخَرُونَ بِهِ إِلَى الْيَوْمِ.","فَالْعِلْمُ يَبْقَى، وَيَرْفَعُ صَاحِبَهُ."],"qs":[["ماذا كان أحمد بن ماجد؟","بحارا","طبيبا","مزارعا"],["كيف كان يعرف طرق البحار؟","بالنظر إلى النجوم","بالسؤال فقط","بالخرائط الحديثة"],["بماذا لقب؟","أسد البحار","ملك الصحراء","نجم السماء"],["ماذا كتب؟","كتبا عن البحر والسفن والنجوم","قصائد عن الطعام","رسائل لأصدقائه"]]},{"id":"g3-09","title":"الْوَعْدُ","lines":["وَعَدَ عُمَرُ صَدِيقَهُ أَنْ يَزُورَهُ يَوْمَ الْخَمِيسِ.","فِي يَوْمِ الْخَمِيسِ دَعَاهُ ابْنُ عَمِّهِ إِلَى مَدِينَةِ الْأَلْعَابِ.","فَرِحَ عُمَرُ كَثِيرًا، ثُمَّ تَذَكَّرَ وَعْدَهُ.","احْتَارَ عُمَرُ مَاذَا يَفْعَلُ، فَذَهَبَ إِلَى أُمِّهِ يَسْأَلُهَا.","قَالَتِ الْأُمُّ: الْوَعْدُ دَيْنٌ، وَالْمُسْلِمُ يَفِي بِوَعْدِهِ.","اعْتَذَرَ عُمَرُ مِنِ ابْنِ عَمِّهِ بِلُطْفٍ.","ذَهَبَ إِلَى صَدِيقِهِ، فَوَجَدَهُ مَرِيضًا فِي الْبَيْتِ.","فَرِحَ الصَّدِيقُ بِزِيَارَةِ عُمَرَ، وَأَحَسَّ أَنَّهُ صَارَ أَفْضَلَ.","شَعَرَ عُمَرُ بِسَعَادَةٍ كَبِيرَةٍ لِأَنَّهُ وَفَى بِوَعْدِهِ."],"qs":[["بماذا وعد عمر صديقه؟","أن يزوره يوم الخميس","أن يعطيه لعبة","أن يذاكر معه"],["إلى أين دعاه ابن عمه؟","مدينة الألعاب","البحر","المسجد"],["ماذا قالت الأم؟","الوعد دين","اذهب إلى الألعاب","لا تذهب لأحد"],["كيف وجد عمر صديقه؟","مريضا","مسافرا","نائما في المدرسة"]]},{"id":"g3-10","title":"الدَّلَّةُ وَالضُّيُوفُ","lines":["فِي صَبَاحِ الْعِيدِ اجْتَمَعَتِ الْعَائِلَةُ فِي بَيْتِ الْجَدِّ.","جَاءَ الضُّيُوفُ مِنَ الْجِيرَانِ وَالْأَقَارِبِ لِلتَّهْنِئَةِ.","حَمَلَ نَاصِرٌ الدَّلَّةَ، وَحَمَلَ أَخُوهُ الْفَنَاجِينَ.","عَلَّمَهُ الْجَدُّ أَنْ يَبْدَأَ بِالضَّيْفِ الْأَكْبَرِ سِنًّا.","يَصُبُّ نَاصِرٌ الْقَهْوَةَ بِيَدِهِ الْيُمْنَى، وَيُقَدِّمُ الْفِنْجَانَ بِأَدَبٍ.","وَقَدَّمَتِ الْبَنَاتُ التَّمْرَ وَالْحَلْوَى الْعُمَانِيَّةَ.","هَزَّ الضَّيْفُ الْفِنْجَانَ، فَعَرَفَ نَاصِرٌ أَنَّهُ اكْتَفَى.","قَالَ الضُّيُوفُ: مَا شَاءَ اللَّهُ، أَحْفَادٌ يَعْرِفُونَ الْأُصُولَ.","ابْتَسَمَ الْجَدُّ فَخُورًا بِأَحْفَادِهِ."],"qs":[["متى اجتمعت العائلة؟","في صباح العيد","في الليل","يوم الامتحان"],["بمن يبدأ ناصر في تقديم القهوة؟","بالضيف الأكبر سنا","بالأصغر","بأخيه"],["ماذا يعني هز الفنجان؟","أن الضيف اكتفى","أنه يريد المزيد","أنه غاضب"],["ماذا قدمت البنات؟","التمر والحلوى","العصير فقط","الخبز"]]},{"id":"g3-11","title":"الطَّائِرَةُ الْوَرَقِيَّةُ","lines":["صَنَعَ بَدْرٌ طَائِرَةً وَرَقِيَّةً مَعَ أَبِيهِ.","اسْتَخْدَمَا عِيدَانًا خَفِيفَةً وَوَرَقًا مُلَوَّنًا وَخَيْطًا طَوِيلًا.","فِي الْعَصْرِ ذَهَبَا إِلَى الشَّاطِئِ حَيْثُ الرِّيحُ قَوِيَّةٌ.","رَكَضَ بَدْرٌ، وَلَكِنَّ الطَّائِرَةَ سَقَطَتْ عَلَى الرَّمْلِ.","لَمْ يَيْأَسْ بَدْرٌ، وَحَاوَلَ مَرَّةً أُخْرَى.","قَالَ أَبُوهُ: أَطْلِقْهَا عَكْسَ اتِّجَاهِ الرِّيحِ، وَأَرْخِ الْخَيْطَ قَلِيلًا.","ارْتَفَعَتِ الطَّائِرَةُ عَالِيًا فِي السَّمَاءِ الزَّرْقَاءِ.","صَفَّقَ الْأَطْفَالُ عَلَى الشَّاطِئِ وَهُمْ يَنْظُرُونَ إِلَيْهَا.","تَعَلَّمَ بَدْرٌ أَنَّ الْمُحَاوَلَةَ وَالنَّصِيحَةَ تَصْنَعَانِ النَّجَاحَ."],"qs":[["مع من صنع بدر الطائرة؟","مع أبيه","مع معلمه","وحده"],["لماذا ذهبا إلى الشاطئ؟","لأن الريح قوية هناك","للسباحة","لصيد السمك"],["ماذا حدث في المحاولة الأولى؟","سقطت الطائرة","طارت عاليا","ضاعت"],["ماذا تعلم بدر؟","المحاولة والنصيحة تصنعان النجاح","اليأس أفضل","الطائرة لا تطير"]]},{"id":"g3-12","title":"الْمَاءُ نِعْمَةٌ","lines":["فِي دَرْسِ الْعُلُومِ تَحَدَّثَتِ الْمُعَلِّمَةُ عَنِ الْمَاءِ.","قَالَتْ: الْمَاءُ سِرُّ الْحَيَاةِ، وَلَا يَعِيشُ كَائِنٌ بِدُونِهِ.","سَأَلَتْ: كَيْفَ نُحَافِظُ عَلَى الْمَاءِ؟","قَالَ حَمْزَةُ: نُغْلِقُ الصُّنْبُورَ أَثْنَاءَ تَنْظِيفِ الْأَسْنَانِ.","وَقَالَتْ رِيمُ: نَسْقِي الْحَدِيقَةَ فِي الصَّبَاحِ الْبَاكِرِ أَوِ الْمَسَاءِ.","وَقَالَ مُعَاذٌ: نُخْبِرُ الْكِبَارَ إِذَا رَأَيْنَا أُنْبُوبًا يَتَسَرَّبُ مِنْهُ الْمَاءُ.","فَرِحَتِ الْمُعَلِّمَةُ بِأَفْكَارِ الطُّلَّابِ وَكَتَبَتْهَا عَلَى السَّبُّورَةِ.","ثُمَّ صَنَعَ الطُّلَّابُ لَوْحَةً كَبِيرَةً عُنْوَانُهَا: قَطْرَةُ الْمَاءِ أَمَانَةٌ.","عَلَّقُوا اللَّوْحَةَ فِي مَمَرِّ الْمَدْرَسَةِ لِيَرَاهَا الْجَمِيعُ."],"qs":[["عن ماذا تحدثت المعلمة؟","عن الماء","عن الفضاء","عن الحيوانات"],["ماذا اقترح حمزة؟","إغلاق الصنبور أثناء تنظيف الأسنان","السباحة كثيرا","شرب العصير"],["متى نسقي الحديقة كما قالت ريم؟","في الصباح الباكر أو المساء","وقت الظهر","منتصف الليل"],["ما عنوان اللوحة؟","قطرة الماء أمانة","الشمس جميلة","مدرستي بيتي"]]},{"id":"g3-13","title":"الْكَلْبُ الْوَفِيُّ","lines":["كَانَ لِلرَّاعِي سُلَيْمَانَ كَلْبٌ يُرَافِقُهُ كُلَّ يَوْمٍ.","يَخْرُجَانِ مَعَ الْأَغْنَامِ إِلَى الْمَرْعَى فِي الصَّبَاحِ.","يَحْرُسُ الْكَلْبُ الْأَغْنَامَ وَيُعِيدُ مَا يَبْتَعِدُ مِنْهَا.","فِي يَوْمٍ مِنَ الْأَيَّامِ نَامَ سُلَيْمَانُ تَحْتَ شَجَرَةِ سِدْرٍ.","اقْتَرَبَ ذِئْبٌ مِنَ الْأَغْنَامِ يُرِيدُ أَنْ يَخْطَفَ حَمَلًا صَغِيرًا.","نَبَحَ الْكَلْبُ بِصَوْتٍ عَالٍ، وَوَقَفَ أَمَامَ الذِّئْبِ بِشَجَاعَةٍ.","اسْتَيْقَظَ سُلَيْمَانُ، فَهَرَبَ الذِّئْبُ إِلَى الْجَبَلِ.","مَسَحَ سُلَيْمَانُ عَلَى رَأْسِ كَلْبِهِ وَشَكَرَهُ.","وَقَالَ: الْوَفَاءُ صِفَةٌ جَمِيلَةٌ، حَتَّى عِنْدَ الْحَيَوَانِ."],"qs":[["ما عمل سليمان؟","راع","صياد","تاجر"],["تحت أي شجرة نام سليمان؟","السدر","النخلة","الليمون"],["ماذا أراد الذئب؟","أن يخطف حملا","أن يشرب الماء","أن يلعب"],["ما صفة الكلب في القصة؟","الوفاء والشجاعة","الخوف","الكسل"]]},{"id":"g3-14","title":"زِيَارَةُ الْمُسْتَشْفَى","lines":["مَرِضَتْ جَدَّةُ هَنَاءَ وَدَخَلَتِ الْمُسْتَشْفَى.","ذَهَبَتْ هَنَاءُ مَعَ أُمِّهَا لِزِيَارَتِهَا بَعْدَ الْعَصْرِ.","حَمَلَتْ هَنَاءُ بَاقَةَ وَرْدٍ وَبِطَاقَةً كَتَبَتْ فِيهَا: شِفَاكِ اللَّهُ يَا جَدَّتِي.","فِي الْمُسْتَشْفَى رَأَتِ الْأَطِبَّاءَ وَالْمُمَرِّضَاتِ يَعْمَلُونَ بِنَشَاطٍ.","قَالَتْ أُمُّهَا: نَتَكَلَّمُ بِصَوْتٍ هَادِئٍ لِنُرِيحَ الْمَرْضَى.","دَخَلَتَا غُرْفَةَ الْجَدَّةِ، فَابْتَسَمَتْ حِينَ رَأَتْهُمَا.","قَرَأَتْ هَنَاءُ الْبِطَاقَةَ، وَجَلَسَتْ بِجَانِبِ جَدَّتِهَا تُحَدِّثُهَا.","قَالَتِ الْجَدَّةُ: زِيَارَتُكُمَا أَفْضَلُ دَوَاءٍ.","بَعْدَ أَيَّامٍ خَرَجَتِ الْجَدَّةُ مِنَ الْمُسْتَشْفَى بِصِحَّةٍ وَعَافِيَةٍ."],"qs":[["من مرضت؟","جدة هناء","أم هناء","هناء"],["ماذا حملت هناء؟","باقة ورد وبطاقة","لعبة","طعاما"],["لماذا نتكلم بصوت هادئ في المستشفى؟","لنريح المرضى","لأننا خائفون","لأن الأطباء نائمون"],["ماذا قالت الجدة عن الزيارة؟","أفضل دواء","متعبة","قصيرة"]]},{"id":"g3-15","title":"الْغَزَالَةُ الْعَرَبِيَّةُ","lines":["فِي مَحْمِيَّةٍ وَاسِعَةٍ تَعِيشُ غِزْلَانٌ جَمِيلَةٌ.","لِلْغَزَالِ عُيُونٌ وَاسِعَةٌ، وَقُرُونٌ طَوِيلَةٌ، وَأَرْجُلٌ رَشِيقَةٌ.","يَعِيشُ الْغَزَالُ فِي الصَّحْرَاءِ، وَيَتَحَمَّلُ الْحَرَّ وَقِلَّةَ الْمَاءِ.","يَأْكُلُ الْأَعْشَابَ وَأَوْرَاقَ الشُّجَيْرَاتِ.","كَادَتْ هَذِهِ الْغِزْلَانُ أَنْ تَنْقَرِضَ بِسَبَبِ الصَّيْدِ.","لِذَلِكَ أُنْشِئَتِ الْمَحْمِيَّاتُ لِحِمَايَتِهَا وَرِعَايَتِهَا.","زَارَ طُلَّابُ الصَّفِّ الثَّالِثِ الْمَحْمِيَّةَ مَعَ مُعَلِّمِهِمْ.","شَاهَدُوا الْغِزْلَانَ تَرْكُضُ بِحُرِّيَّةٍ وَأَمَانٍ.","قَالَ الْمُعَلِّمُ: حِمَايَةُ الْحَيَوَانَاتِ مَسْؤُولِيَّتُنَا جَمِيعًا."],"qs":[["أين تعيش الغزلان في القصة؟","في محمية واسعة","في البحر","في المدينة"],["ماذا يأكل الغزال؟","الأعشاب وأوراق الشجيرات","اللحم","السمك"],["لماذا كادت الغزلان تنقرض؟","بسبب الصيد","بسبب المطر","بسبب البرد"],["لماذا أنشئت المحميات؟","لحماية الحيوانات","للتجارة","للسباق"]]},{"id":"g3-16","title":"خَطُّ يَدِي","lines":["كَانَ خَطُّ مُنْذِرٍ غَيْرَ وَاضِحٍ، وَكَانَتْ كَلِمَاتُهُ مُتَدَاخِلَةً.","لَمْ يَسْتَطِعِ الْمُعَلِّمُ أَنْ يَقْرَأَ إِجَابَتَهُ فِي الِاخْتِبَارِ.","حَزِنَ مُنْذِرٌ لِأَنَّهُ كَانَ يَعْرِفُ الْإِجَابَةَ الصَّحِيحَةَ.","قَالَ لَهُ الْمُعَلِّمُ: الْخَطُّ الْجَمِيلُ يُوَصِّلُ أَفْكَارَكَ لِلْآخَرِينَ.","اشْتَرَى لَهُ أَبُوهُ دَفْتَرًا لِتَحْسِينِ الْخَطِّ.","صَارَ مُنْذِرٌ يَكْتُبُ صَفْحَةً وَاحِدَةً كُلَّ يَوْمٍ بِتَأَنٍّ.","يَتْرُكُ مَسَافَةً بَيْنَ الْكَلِمَاتِ، وَيَكْتُبُ عَلَى السَّطْرِ.","بَعْدَ شَهْرٍ صَارَ خَطُّهُ وَاضِحًا جَمِيلًا.","عَلَّقَ الْمُعَلِّمُ وَرَقَتَهُ فِي رُكْنِ الْمُبْدِعِينَ."],"qs":[["ما مشكلة منذر؟","خطه غير واضح","لا يحب القراءة","ينسى كتبه"],["ماذا اشترى له أبوه؟","دفترا لتحسين الخط","قلما ملونا","حقيبة"],["كم صفحة كان يكتب كل يوم؟","صفحة واحدة","عشر صفحات","لا شيء"],["أين علق المعلم ورقته؟","في ركن المبدعين","على الباب","في المكتبة"]]},{"id":"g3-17","title":"الْجَزِيرَةُ وَالسُّفُنُ","lines":["عَاشَ فِي جَزِيرَةِ مَصِيرَةَ صَبِيٌّ اسْمُهُ رَاشِدٌ.","كَانَ أَبُوهُ يَصْنَعُ السُّفُنَ الْخَشَبِيَّةَ عَلَى الشَّاطِئِ.","يَجْلِسُ رَاشِدٌ يُرَاقِبُ أَبَاهُ وَهُوَ يَقْطَعُ الْأَلْوَاحَ وَيُثَبِّتُهَا.","سَأَلَ رَاشِدٌ: كَمْ يَوْمًا تَحْتَاجُ السَّفِينَةُ حَتَّى تَكْتَمِلَ؟","قَالَ الْأَبُ: تَحْتَاجُ إِلَى شُهُورٍ مِنَ الصَّبْرِ وَالْعَمَلِ.","سَاعَدَ رَاشِدٌ أَبَاهُ فِي دَهْنِ الْأَلْوَاحِ بِزَيْتِ السَّمَكِ لِتَقْوَى.","وَعِنْدَمَا اكْتَمَلَتِ السَّفِينَةُ اجْتَمَعَ أَهْلُ الْجَزِيرَةِ عَلَى الشَّاطِئِ.","دَفَعُوهَا مَعًا إِلَى الْبَحْرِ وَهُمْ يُرَدِّدُونَ الْأَهَازِيجَ.","قَالَ رَاشِدٌ: سَأَتَعَلَّمُ هَذِهِ الْحِرْفَةَ، لِتَبْقَى حَيَّةً فِي بِلَادِي."],"qs":[["في أي جزيرة عاش راشد؟","مصيرة","البحرين","سقطرى"],["ماذا كان يصنع أبوه؟","السفن الخشبية","السلال","الخبز"],["كم تحتاج السفينة لتكتمل؟","شهورا","يوما واحدا","ساعة"],["ماذا قرر راشد؟","أن يتعلم صناعة السفن","أن يسافر بعيدا","أن يترك الجزيرة"]]},{"id":"g3-18","title":"الْهَاتِفُ وَاللَّعِبُ","lines":["كَانَ زَاهِرٌ يَقْضِي وَقْتًا طَوِيلًا أَمَامَ الْهَاتِفِ.","لَاحَظَتْ أُمُّهُ أَنَّهُ صَارَ يَنَامُ مُتَأَخِّرًا وَيَشْكُو مِنْ عَيْنَيْهِ.","جَلَسَتْ مَعَهُ وَقَالَتْ: مَا رَأْيُكَ أَنْ نَضَعَ جَدْوَلًا لِلْوَقْتِ؟","اتَّفَقَا عَلَى سَاعَةٍ وَاحِدَةٍ لِلْهَاتِفِ بَعْدَ إِنْهَاءِ الْوَاجِبَاتِ.","وَفِي بَاقِي الْوَقْتِ يَلْعَبُ زَاهِرٌ الْكُرَةَ مَعَ أَصْدِقَائِهِ.","وَيَقْرَأُ قِصَّةً قَبْلَ النَّوْمِ.","فِي الْبِدَايَةِ كَانَ الْأَمْرُ صَعْبًا عَلَيْهِ.","وَبَعْدَ أُسْبُوعَيْنِ صَارَ يَنَامُ مُبَكِّرًا وَيَسْتَيْقِظُ نَشِيطًا.","قَالَ زَاهِرٌ: الْيَوْمَ عِنْدِي وَقْتٌ لِكُلِّ شَيْءٍ أُحِبُّهُ."],"qs":[["ماذا كانت مشكلة زاهر؟","يقضي وقتا طويلا أمام الهاتف","لا يأكل","لا يحب أصدقاءه"],["كم ساعة اتفقا عليها للهاتف؟","ساعة واحدة","خمس ساعات","لا شيء"],["ماذا يفعل قبل النوم؟","يقرأ قصة","يلعب بالهاتف","يشاهد التلفاز"],["كيف صار زاهر بعد أسبوعين؟","ينام مبكرا ويستيقظ نشيطا","متعبا","حزينا"]]},{"id":"g3-19","title":"شَجَرَةُ الْمَانْجُو","lines":["زَرَعَ الْجَدُّ شَجَرَةَ مَانْجُو صَغِيرَةً أَمَامَ الْبَيْتِ.","سَأَلَهُ حَفِيدُهُ: يَا جَدِّي، هَلْ سَتَأْكُلُ مِنْ ثِمَارِهَا؟","قَالَ الْجَدُّ: رُبَّمَا لَا، فَهِيَ تَحْتَاجُ إِلَى سَنَوَاتٍ لِتُثْمِرَ.","تَعَجَّبَ الْحَفِيدُ وَقَالَ: فَلِمَاذَا تَزْرَعُهَا إِذَنْ؟","قَالَ الْجَدُّ: أَكَلْنَا مِمَّا زَرَعَ آبَاؤُنَا، وَنَزْرَعُ لِيَأْكُلَ أَبْنَاؤُنَا.","مَرَّتِ السَّنَوَاتُ، وَكَبِرَتِ الشَّجَرَةُ وَصَارَ لَهَا ظِلٌّ وَارِفٌ.","أَثْمَرَتِ الشَّجَرَةُ ثِمَارًا صَفْرَاءَ حُلْوَةً.","جَلَسَ الْحَفِيدُ مَعَ أَبْنَائِهِ تَحْتَهَا يَأْكُلُونَ وَيَدْعُونَ لِلْجَدِّ.","فَهِمَ الْحَفِيدُ الْآنَ مَعْنَى كَلَامِ جَدِّهِ."],"qs":[["ماذا زرع الجد؟","شجرة مانجو","نخلة","وردة"],["لماذا زرعها الجد؟","ليأكل الأبناء من بعده","ليبيعها","ليأكل منها غدا"],["كيف كانت الثمار؟","صفراء حلوة","خضراء حامضة","صغيرة مرة"],["ماذا فعل الحفيد تحت الشجرة؟","يأكل مع أبنائه ويدعو للجد","ينام","يقطع الأغصان"]]},{"id":"g3-20","title":"الْمُعَلِّمَةُ الْجَدِيدَةُ","lines":["جَاءَتْ إِلَى الصَّفِّ مُعَلِّمَةٌ جَدِيدَةٌ اسْمُهَا الْأُسْتَاذَةُ زَيْنَبُ.","كَانَ الطُّلَّابُ يَخَافُونَ أَنْ تَكُونَ شَدِيدَةً.","دَخَلَتِ الْمُعَلِّمَةُ مُبْتَسِمَةً وَقَالَتْ: صَبَاحُ الْخَيْرِ يَا أَبْطَالُ.","طَلَبَتْ مِنْ كُلِّ طَالِبٍ أَنْ يُعَرِّفَ نَفْسَهُ وَيَذْكُرَ هِوَايَتَهُ.","قَالَتْ رُؤَى: أُحِبُّ الرَّسْمَ، وَقَالَ عَبْدُ اللَّهِ: أُحِبُّ السِّبَاحَةَ.","كَتَبَتِ الْمُعَلِّمَةُ الْهِوَايَاتِ وَوَعَدَتْ بِنَشَاطٍ لِكُلِّ هِوَايَةٍ.","فِي نِهَايَةِ الْأُسْبُوعِ أَقَامَتْ مَعْرِضًا لِرُسُومِ الطُّلَّابِ.","صَارَ الطُّلَّابُ يَنْتَظِرُونَ حِصَّتَهَا بِشَوْقٍ.","عَرَفُوا أَنَّ الْحُكْمَ عَلَى النَّاسِ قَبْلَ مَعْرِفَتِهِمْ خَطَأٌ."],"qs":[["ما اسم المعلمة الجديدة؟","زينب","فاطمة","خديجة"],["مم كان الطلاب يخافون؟","أن تكون شديدة","أن تتأخر","أن تمرض"],["ماذا أقامت المعلمة؟","معرضا لرسوم الطلاب","رحلة","مسابقة جري"],["ماذا تعلم الطلاب؟","الحكم على الناس قبل معرفتهم خطأ","الخوف مفيد","المعلمات شديدات"]]},{"id":"g3-21","title":"الْقَارِبُ الْمَثْقُوبُ","lines":["كَانَ صَيَّادٌ يَطْلِي قَارِبَهُ قَبْلَ مَوْسِمِ الصَّيْدِ.","وَجَدَ فِي أَسْفَلِ الْقَارِبِ ثُقْبًا صَغِيرًا، فَسَدَّهُ دُونَ أَنْ يُخْبِرَ أَحَدًا.","فِي الصَّبَاحِ أَخَذَ أَبْنَاءُ صَاحِبِ الْقَارِبِ الْقَارِبَ لِلصَّيْدِ.","وَعِنْدَمَا عَادُوا فَرِحَ أَبُوهُمْ وَذَهَبَ إِلَى الصَّيَّادِ.","قَالَ: لَمْ أَعْلَمْ أَنَّ فِي الْقَارِبِ ثُقْبًا، وَقَدْ سَدَدْتَهُ أَنْتَ.","لَوْلَاكَ لَغَرِقَ أَبْنَائِي فِي الْبَحْرِ.","وَأَعْطَاهُ هَدِيَّةً كَبِيرَةً، فَقَالَ الصَّيَّادُ: لَمْ أَفْعَلْ إِلَّا شَيْئًا صَغِيرًا.","قَالَ الرَّجُلُ: الْعَمَلُ الصَّغِيرُ الْمُتْقَنُ قَدْ يُنْقِذُ حَيَاةً.","فَلَا تَسْتَهِنْ بِأَيِّ عَمَلٍ طَيِّبٍ تَقُومُ بِهِ."],"qs":[["ماذا وجد الصياد في القارب؟","ثقبا صغيرا","سمكة","كنزا"],["ماذا فعل بالثقب؟","سده","تركه","وسعه"],["لماذا فرح صاحب القارب؟","لأن أبناءه عادوا سالمين","لأنه صاد سمكا كثيرا","لأنه باع القارب"],["ما العبرة من القصة؟","العمل الصغير المتقن قد ينقذ حياة","الصيد خطير","القوارب غالية"]]},{"id":"g3-22","title":"نَادِي الْقِرَاءَةِ","lines":["قَرَّرَ أَرْبَعَةُ أَصْدِقَاءَ أَنْ يُنْشِئُوا نَادِيًا لِلْقِرَاءَةِ.","اتَّفَقُوا أَنْ يَجْتَمِعُوا يَوْمَ السَّبْتِ فِي بَيْتِ أَحَدِهِمْ.","يَقْرَأُ كُلُّ وَاحِدٍ مِنْهُمْ قِصَّةً خِلَالَ الْأُسْبُوعِ.","ثُمَّ يَحْكِيهَا لِأَصْدِقَائِهِ، وَيَذْكُرُ مَا أَعْجَبَهُ فِيهَا.","صَنَعُوا لَوْحَةً يُسَجِّلُونَ عَلَيْهَا أَسْمَاءَ الْكُتُبِ الَّتِي قَرَؤُوهَا.","كُلُّ كِتَابٍ جَدِيدٍ يَضَعُونَ بِجَانِبِهِ نَجْمَةً ذَهَبِيَّةً.","بَعْدَ شَهْرَيْنِ امْتَلَأَتِ اللَّوْحَةُ بِالنُّجُومِ.","انْضَمَّ إِلَى النَّادِي أَطْفَالٌ آخَرُونَ مِنَ الْحَيِّ.","قَالَ أَحَدُهُمْ: الْقِرَاءَةُ مَعَ الْأَصْدِقَاءِ أَمْتَعُ بِكَثِيرٍ."],"qs":[["كم صديقا أنشأ النادي؟","أربعة","اثنان","عشرة"],["متى يجتمعون؟","يوم السبت","كل يوم","يوم الجمعة"],["ماذا يضعون بجانب كل كتاب؟","نجمة ذهبية","صورة","رقما"],["ماذا حدث بعد شهرين؟","امتلأت اللوحة بالنجوم","أغلق النادي","ضاعت الكتب"]]},{"id":"g3-23","title":"الْخَيْمَةُ فِي الرِّمَالِ","lines":["خَرَجَتْ عَائِلَةُ سَيْفٍ فِي رِحْلَةٍ إِلَى رِمَالِ الشَّرْقِيَّةِ.","نَصَبُوا خَيْمَةً كَبِيرَةً بَيْنَ الْكُثْبَانِ الذَّهَبِيَّةِ.","صَعِدَ سَيْفٌ وَأَخُوهُ أَعْلَى كَثِيبٍ وَتَزَحْلَقَا عَلَى الرَّمْلِ.","عِنْدَ الْغُرُوبِ تَغَيَّرَ لَوْنُ السَّمَاءِ إِلَى الْبُرْتُقَالِيِّ.","أَشْعَلَ الْأَبُ النَّارَ، وَشَوَوُا الْخُبْزَ عَلَى الْجَمْرِ.","فِي اللَّيْلِ ظَهَرَتْ نُجُومٌ كَثِيرَةٌ لَمْ يَرَهَا سَيْفٌ فِي الْمَدِينَةِ.","قَالَ الْأَبُ: أَضْوَاءُ الْمَدِينَةِ تُخْفِي النُّجُومَ عَنَّا.","قَبْلَ الرَّحِيلِ جَمَعُوا كُلَّ النُّفَايَاتِ فِي أَكْيَاسٍ.","قَالَ سَيْفٌ: نَتْرُكُ الصَّحْرَاءَ نَظِيفَةً كَمَا وَجَدْنَاهَا."],"qs":[["إلى أين خرجت العائلة؟","رمال الشرقية","جبل شمس","شاطئ صلالة"],["ماذا فعل سيف وأخوه؟","تزحلقا على الرمل","سبحا في البحر","ركبا الخيل"],["لماذا لا نرى نجوما كثيرة في المدينة؟","لأن أضواء المدينة تخفيها","لأن النجوم تنام","لأن السماء صغيرة"],["ماذا فعلوا قبل الرحيل؟","جمعوا النفايات","تركوا النار مشتعلة","ناموا"]]},{"id":"g3-24","title":"الْجَارُ الْجَدِيدُ","lines":["انْتَقَلَتْ عَائِلَةٌ جَدِيدَةٌ إِلَى الْبَيْتِ الْمُجَاوِرِ لِبَيْتِ مَرْوَةَ.","لَاحَظَتْ مَرْوَةُ بِنْتًا فِي عُمْرِهَا تَقِفُ وَحِيدَةً عِنْدَ الْبَابِ.","قَالَتْ لِأُمِّهَا: أَظُنُّهَا لَا تَعْرِفُ أَحَدًا هُنَا.","اقْتَرَحَتِ الْأُمُّ أَنْ يُرَحِّبُوا بِالْجِيرَانِ الْجُدُدِ.","خَبَزَتَا كَعْكًا، وَحَمَلَتْهُ مَرْوَةُ إِلَى بَيْتِ الْجِيرَانِ.","فَتَحَتِ الْبِنْتُ الْبَابَ، وَقَالَتْ: اسْمِي لُجَيْنُ، شُكْرًا لَكِ.","لَعِبَتِ الْبِنْتَانِ مَعًا، وَاكْتَشَفَتَا أَنَّهُمَا فِي الصَّفِّ نَفْسِهِ.","صَارَتَا تَذْهَبَانِ إِلَى الْمَدْرَسَةِ مَعًا كُلَّ يَوْمٍ.","قَالَتْ لُجَيْنُ: كُنْتُ حَزِينَةً، وَالْآنَ عِنْدِي صَدِيقَةٌ."],"qs":[["ماذا لاحظت مروة؟","بنتا تقف وحيدة","قطة ضائعة","سيارة جديدة"],["ماذا حملت مروة للجيران؟","كعكا","ورودا","ألعابا"],["ما اسم البنت الجديدة؟","لجين","مروة","سلمى"],["ماذا اكتشفت البنتان؟","أنهما في الصف نفسه","أنهما أختان","أنهما مسافرتان"]]},{"id":"g3-25","title":"الْعَنْكَبُوتُ الصَّبُورُ","lines":["جَلَسَ رَجُلٌ حَزِينٌ فِي كَهْفٍ بَعْدَ أَنْ خَسِرَ كَثِيرًا.","رَأَى عَنْكَبُوتًا يُحَاوِلُ أَنْ يَبْنِيَ بَيْتَهُ بَيْنَ صَخْرَتَيْنِ.","صَعِدَ الْعَنْكَبُوتُ بِخَيْطِهِ الرَّقِيقِ فَانْقَطَعَ الْخَيْطُ وَسَقَطَ.","عَادَ وَحَاوَلَ مَرَّةً أُخْرَى، فَسَقَطَ أَيْضًا.","ظَلَّ الرَّجُلُ يَعُدُّ الْمُحَاوَلَاتِ: ثَلَاثٌ، أَرْبَعٌ، خَمْسٌ.","وَفِي الْمَرَّةِ السَّابِعَةِ نَجَحَ الْعَنْكَبُوتُ وَبَنَى بَيْتَهُ.","قَالَ الرَّجُلُ: إِذَا كَانَ هَذَا الْمَخْلُوقُ الصَّغِيرُ لَا يَيْأَسُ، فَكَيْفَ أَيْأَسُ أَنَا؟","خَرَجَ الرَّجُلُ مِنَ الْكَهْفِ، وَبَدَأَ عَمَلَهُ مِنْ جَدِيدٍ.","وَبِالصَّبْرِ وَالْعَزِيمَةِ حَقَّقَ مَا كَانَ يَتَمَنَّاهُ."],"qs":[["أين جلس الرجل؟","في كهف","في سوق","في سفينة"],["ماذا كان العنكبوت يحاول؟","أن يبني بيته","أن يأكل","أن يهرب"],["في أي مرة نجح العنكبوت؟","السابعة","الأولى","الثانية"],["ماذا تعلم الرجل؟","عدم اليأس","الجلوس في الكهف","الخوف من العنكبوت"]]},{"id":"g3-26","title":"يَوْمٌ فِي الْمَزْرَعَةِ","lines":["زَارَ طُلَّابُ الصَّفِّ الثَّالِثِ مَزْرَعَةً فِي وِلَايَةِ صُحَارَ.","اسْتَقْبَلَهُمُ الْمُزَارِعُ حَمَدٌ وَأَخَذَهُمْ فِي جَوْلَةٍ.","رَأَوْا أَشْجَارَ اللَّيْمُونِ وَالْمَانْجُو وَالْمَوْزِ.","شَاهَدُوا كَيْفَ يَحْلُبُ الْمُزَارِعُ الْبَقَرَةَ فِي الصَّبَاحِ.","وَجَمَعُوا الْبَيْضَ مِنْ قِنِّ الدَّجَاجِ بِحَذَرٍ.","شَرَحَ لَهُمُ الْمُزَارِعُ أَهَمِّيَّةَ السَّمَادِ الطَّبِيعِيِّ لِلتُّرْبَةِ.","زَرَعَ كُلُّ طَالِبٍ شَتْلَةً صَغِيرَةً وَكَتَبَ اسْمَهُ عِنْدَهَا.","فِي نِهَايَةِ الْجَوْلَةِ شَرِبُوا الْحَلِيبَ الطَّازَجَ وَأَكَلُوا الْمَوْزَ.","قَالُوا: عَرَفْنَا الْيَوْمَ كَمْ يَتْعَبُ الْمُزَارِعُ لِيُطْعِمَنَا."],"qs":[["في أي ولاية المزرعة؟","صحار","صور","خصب"],["ماذا جمع الطلاب من قن الدجاج؟","البيض","الريش","الحبوب"],["ماذا زرع كل طالب؟","شتلة صغيرة","نخلة كبيرة","وردة"],["ماذا عرف الطلاب؟","تعب المزارع ليطعمنا","أن الزراعة سهلة","أن البقر يطير"]]},{"id":"g3-27","title":"الْحَقِيقَةُ الشُّجَاعَةُ","lines":["كَانَ إِلْيَاسُ يَلْعَبُ بِالْكُرَةِ دَاخِلَ الْبَيْتِ.","ضَرَبَتِ الْكُرَةُ مَزْهَرِيَّةَ أُمِّهِ فَانْكَسَرَتْ.","خَافَ إِلْيَاسُ، وَفَكَّرَ أَنْ يَقُولَ إِنَّ الْقِطَّ هُوَ الَّذِي كَسَرَهَا.","ثُمَّ تَذَكَّرَ قَوْلَ مُعَلِّمِهِ: الصِّدْقُ يَهْدِي إِلَى الْخَيْرِ.","عِنْدَمَا عَادَتْ أُمُّهُ ذَهَبَ إِلَيْهَا وَقَالَ الْحَقِيقَةَ.","قَالَ: أَنَا آسِفٌ يَا أُمِّي، كُنْتُ أَلْعَبُ بِالْكُرَةِ فِي الْبَيْتِ.","نَظَرَتْ إِلَيْهِ أُمُّهُ وَقَالَتْ: حَزِنْتُ عَلَى الْمَزْهَرِيَّةِ، وَفَرِحْتُ بِصِدْقِكَ.","اتَّفَقَا أَنْ يَلْعَبَ إِلْيَاسُ بِالْكُرَةِ فِي السَّاحَةِ فَقَطْ.","شَعَرَ إِلْيَاسُ بِرَاحَةٍ كَبِيرَةٍ لِأَنَّهُ لَمْ يَكْذِبْ."],"qs":[["ماذا كسر إلياس؟","مزهرية أمه","النافذة","الصحن"],["من فكر أن يتهم؟","القط","أخاه","صديقه"],["ماذا قالت الأم؟","فرحت بصدقك","أنت معاقب","لا تتكلم"],["أين اتفقا أن يلعب بالكرة؟","في الساحة فقط","في المطبخ","في غرفة النوم"]]},{"id":"g3-28","title":"السَّحَابَةُ الصَّغِيرَةُ","lines":["فِي السَّمَاءِ سَحَابَةٌ صَغِيرَةٌ بَيْضَاءُ.","كَانَتْ تَرَى السُّحُبَ الْكَبِيرَةَ تُمْطِرُ عَلَى الْجِبَالِ وَالْوِدْيَانِ.","قَالَتْ بِحُزْنٍ: أَنَا صَغِيرَةٌ، لَا أَسْتَطِيعُ أَنْ أُفِيدَ أَحَدًا.","سَمِعَتْهَا الرِّيحُ فَقَالَتْ: كُلُّ قَطْرَةٍ لَهَا فَائِدَةٌ.","حَمَلَتِ الرِّيحُ السَّحَابَةَ إِلَى حَدِيقَةٍ صَغِيرَةٍ عَطْشَى.","أَمْطَرَتِ السَّحَابَةُ قَطَرَاتِهَا الْقَلِيلَةَ عَلَى زَهْرَةٍ ذَابِلَةٍ.","رَفَعَتِ الزَّهْرَةُ رَأْسَهَا، وَتَفَتَّحَتْ أَوْرَاقُهَا مِنْ جَدِيدٍ.","فَرِحَتِ السَّحَابَةُ وَعَرَفَتْ أَنَّ لِكُلِّ أَحَدٍ دَوْرًا مُهِمًّا.","لَا تَحْتَقِرْ نَفْسَكَ، فَقَدْ يَكُونُ عَمَلُكَ الصَّغِيرُ كَبِيرًا عِنْدَ غَيْرِكَ."],"qs":[["لماذا حزنت السحابة؟","لأنها صغيرة","لأنها سوداء","لأنها بعيدة"],["إلى أين حملتها الريح؟","إلى حديقة عطشى","إلى البحر","إلى الصحراء"],["ماذا حدث للزهرة؟","تفتحت من جديد","ذبلت أكثر","سقطت"],["ما فكرة القصة؟","لكل أحد دور مهم","الصغير لا ينفع","الريح قوية"]]},{"id":"g3-29","title":"دَرْسُ الْإِسْعَافِ","lines":["زَارَ الْمَدْرَسَةَ مُسْعِفٌ مِنَ الدِّفَاعِ الْمَدَنِيِّ.","عَلَّمَ الطُّلَّابَ مَاذَا يَفْعَلُونَ إِذَا جُرِحَ أَحَدُ زُمَلَائِهِمْ.","قَالَ: أَوَّلًا نَبْقَى هَادِئِينَ وَلَا نَخَافُ.","ثَانِيًا نُخْبِرُ شَخْصًا كَبِيرًا فَوْرًا.","وَإِذَا كَانَ الْجُرْحُ صَغِيرًا نَغْسِلُهُ بِالْمَاءِ النَّظِيفِ.","ثُمَّ نُغَطِّيهِ بِضِمَادَةٍ نَظِيفَةٍ.","وَعَلَّمَهُمْ رَقْمَ الطَّوَارِئِ وَطَلَبَ أَنْ يَحْفَظُوهُ.","تَدَرَّبَ الطُّلَّابُ عَلَى وَضْعِ الضِّمَادَةِ عَلَى يَدِ زَمِيلٍ.","قَالَ الْمُسْعِفُ: الْمَعْرِفَةُ الصَّغِيرَةُ قَدْ تُنْقِذُ حَيَاةً كَبِيرَةً."],"qs":[["من زار المدرسة؟","مسعف من الدفاع المدني","طبيب أسنان","شرطي مرور"],["ما أول خطوة؟","نبقى هادئين","نركض بعيدا","نصرخ"],["بماذا نغسل الجرح الصغير؟","بالماء النظيف","بالعصير","بالتراب"],["ماذا طلب منهم أن يحفظوا؟","رقم الطوارئ","أسماء الأدوية","عنوان المسعف"]]},{"id":"g3-30","title":"أُمْنِيَّةُ رَيَّانَ","lines":["كَانَ رَيَّانُ يُحِبُّ النَّظَرَ إِلَى السَّمَاءِ فِي اللَّيْلِ.","يَعُدُّ النُّجُومَ وَيَتَسَاءَلُ: مَاذَا يُوجَدُ هُنَاكَ بَعِيدًا؟","أَهْدَاهُ خَالُهُ مِنْظَارًا صَغِيرًا فِي يَوْمِ مِيلَادِهِ.","رَأَى رَيَّانُ الْقَمَرَ قَرِيبًا، وَرَأَى فِيهِ حُفَرًا وَجِبَالًا.","قَرَأَ رَيَّانُ كُتُبًا عَنِ الْكَوَاكِبِ وَالْمَجَرَّاتِ.","عَرَفَ أَنَّ الْأَرْضَ تَدُورُ حَوْلَ الشَّمْسِ مَرَّةً كُلَّ سَنَةٍ.","وَأَنَّ الْعُلَمَاءَ يُرْسِلُونَ مَرْكَبَاتٍ لِاسْتِكْشَافِ الْفَضَاءِ.","قَالَ لِأُمِّهِ: أُرِيدُ أَنْ أَكُونَ عَالِمَ فَلَكٍ.","قَالَتْ أُمُّهُ: اجْتَهِدْ فِي دِرَاسَتِكَ، وَسَتُحَقِّقُ حُلْمَكَ بِإِذْنِ اللَّهِ."],"qs":[["ماذا كان يحب ريان؟","النظر إلى السماء","السباحة","الطبخ"],["ماذا أهداه خاله؟","منظارا صغيرا","كرة","دراجة"],["كم مرة تدور الأرض حول الشمس في السنة؟","مرة واحدة","مرتين","عشر مرات"],["ماذا يريد ريان أن يكون؟","عالم فلك","طيارا","تاجرا"]]}]},{"grade":4,"stories":[{"id":"g4-01","title":"حُرَّاسُ الشَّاطِئِ","lines":["فِي مَحْمِيَّةِ رَأْسِ الْجِنْزِ تَخْرُجُ السَّلَاحِفُ الْخَضْرَاءُ مِنَ الْبَحْرِ لَيْلًا.","تَحْفِرُ السُّلَحْفَاةُ حُفْرَةً عَمِيقَةً فِي الرَّمْلِ، وَتَضَعُ فِيهَا بَيْضَهَا.","ثُمَّ تُغَطِّي الْحُفْرَةَ بِعِنَايَةٍ، وَتَعُودُ إِلَى الْبَحْرِ وَقَدْ أَنْهَكَهَا التَّعَبُ.","زَارَتْ آمِنَةُ الْمَحْمِيَّةَ مَعَ أُسْرَتِهَا، وَرَافَقَهُمْ مُرْشِدٌ مُتَخَصِّصٌ.","طَلَبَ الْمُرْشِدُ مِنَ الزُّوَّارِ أَلَّا يُشْعِلُوا الْأَضْوَاءَ، وَأَنْ يَمْشُوا بِهُدُوءٍ.","وَأَوْضَحَ أَنَّ الضَّوْءَ يُرْبِكُ السَّلَاحِفَ الصَّغِيرَةَ، فَتَضِلُّ طَرِيقَهَا إِلَى الْبَحْرِ.","بَعْدَ مُنْتَصَفِ اللَّيْلِ رَأَتْ آمِنَةُ صِغَارًا تَخْرُجُ مِنَ الرَّمْلِ وَتَزْحَفُ نَحْوَ الْمَوْجِ.","كَانَتِ الصِّغَارُ تَهْتَدِي بِضَوْءِ الْقَمَرِ الْمُنْعَكِسِ عَلَى سَطْحِ الْمَاءِ.","قَالَ الْمُرْشِدُ: مِنْ بَيْنِ أَلْفِ سُلَحْفَاةٍ صَغِيرَةٍ، قَدْ لَا تَكْبُرُ إِلَّا وَاحِدَةٌ.","لِذَلِكَ تُعَدُّ حِمَايَةُ الشَّوَاطِئِ مِنَ النُّفَايَاتِ وَالْإِزْعَاجِ وَاجِبًا عَلَى الْجَمِيعِ.","عَادَتْ آمِنَةُ إِلَى مَدْرَسَتِهَا، وَأَلْقَتْ كَلِمَةً فِي الْإِذَاعَةِ الصَّبَاحِيَّةِ بِعُنْوَانِ: كُونُوا حُرَّاسًا لِلشَّاطِئِ."],"qs":[["متى تخرج السلاحف من البحر؟","ليلا","ظهرا","عند الفجر فقط"],["لماذا طلب المرشد عدم إشعال الأضواء؟","لأن الضوء يربك السلاحف الصغيرة","لأن الضوء غال","لأن الزوار نائمون"],["بماذا تهتدي الصغار إلى البحر؟","بضوء القمر المنعكس على الماء","بصوت المرشد","برائحة الطعام"],["ما عنوان كلمة آمنة في الإذاعة؟","كونوا حراسا للشاطئ","السلاحف بطيئة","رحلتي الجميلة"]]},{"id":"g4-02","title":"ابْنُ سِينَا الصَّغِيرُ","lines":["وُلِدَ ابْنُ سِينَا قَبْلَ أَكْثَرَ مِنْ أَلْفِ عَامٍ، وَكَانَ شَغُوفًا بِالْعِلْمِ مُنْذُ صِغَرِهِ.","حَفِظَ الْقُرْآنَ الْكَرِيمَ وَهُوَ فِي الْعَاشِرَةِ مِنْ عُمُرِهِ.","ثُمَّ دَرَسَ اللُّغَةَ وَالْحِسَابَ وَالْفَلَكَ، وَكَانَ يَسْأَلُ أَسَاتِذَتَهُ أَسْئِلَةً تُدْهِشُهُمْ.","أَحَبَّ الطِّبَّ، فَكَانَ يَقْرَأُ الْكُتُبَ وَيُرَاقِبُ الْمَرْضَى وَيُسَجِّلُ مُلَاحَظَاتِهِ.","وَإِذَا صَعُبَتْ عَلَيْهِ مَسْأَلَةٌ، أَعَادَ قِرَاءَتَهَا مَرَّاتٍ كَثِيرَةً حَتَّى يَفْهَمَهَا.","فِي السَّابِعَةَ عَشْرَةَ عَالَجَ أَمِيرًا مَرِيضًا عَجَزَ الْأَطِبَّاءُ عَنْ عِلَاجِهِ.","فَرِحَ الْأَمِيرُ، وَسَمَحَ لَهُ أَنْ يَدْخُلَ مَكْتَبَتَهُ الْعَظِيمَةَ.","قَضَى ابْنُ سِينَا أَيَّامًا وَلَيَالِيَ بَيْنَ الْكُتُبِ، يَنْهَلُ مِنْهَا الْمَعْرِفَةَ.","أَلَّفَ بَعْدَ ذَلِكَ كِتَابَ الْقَانُونِ فِي الطِّبِّ، وَظَلَّ يُدَرَّسُ قُرُونًا طَوِيلَةً.","تُعَلِّمُنَا قِصَّتُهُ أَنَّ الْفُضُولَ وَالْمُثَابَرَةَ يَصْنَعَانِ الْعُلَمَاءَ."],"qs":[["متى حفظ ابن سينا القرآن؟","في العاشرة","في العشرين","في الخامسة عشرة"],["ماذا كان يفعل إذا صعبت عليه مسألة؟","يعيد قراءتها حتى يفهمها","يتركها","ينام"],["ماذا حدث عندما عالج الأمير؟","سمح له بدخول مكتبته","أعطاه قصرا","أرسله في سفر"],["ما اسم كتابه المشهور؟","القانون في الطب","كليلة ودمنة","ألف ليلة وليلة"]]},{"id":"g4-03","title":"الْمِرْآةُ الصَّادِقَةُ","lines":["كَانَ فِي إِحْدَى الْقُرَى صَبِيٌّ يُدْعَى مُهَنَّدًا، يُحِبُّ أَنْ يَسْخَرَ مِنْ زُمَلَائِهِ.","يَضْحَكُ مِمَّنْ يُخْطِئُ فِي الْقِرَاءَةِ، وَيُطْلِقُ عَلَى بَعْضِهِمْ أَلْقَابًا مُزْعِجَةً.","فِي يَوْمٍ مِنَ الْأَيَّامِ وَقَفَ مُهَنَّدٌ لِيُلْقِيَ قَصِيدَةً أَمَامَ الصَّفِّ.","ارْتَبَكَ وَنَسِيَ الْأَبْيَاتَ، فَانْتَظَرَ أَنْ يَضْحَكَ مِنْهُ الْجَمِيعُ.","لَكِنَّ زَمِيلَهُ حَسَنًا قَالَ بِهُدُوءٍ: خُذْ نَفَسًا عَمِيقًا، وَابْدَأْ مِنْ جَدِيدٍ.","وَصَفَّقَ لَهُ الطُّلَّابُ تَشْجِيعًا، فَأَكْمَلَ الْقَصِيدَةَ بِثِقَةٍ.","جَلَسَ مُهَنَّدٌ يُفَكِّرُ: لَقَدْ عَامَلُونِي بِعَكْسِ مَا كُنْتُ أُعَامِلُهُمْ.","شَعَرَ بِالْخَجَلِ مِنْ نَفْسِهِ، وَكَأَنَّهُ رَأَى صُورَتَهُ فِي مِرْآةٍ صَادِقَةٍ.","فِي نِهَايَةِ الْيَوْمِ اعْتَذَرَ لِكُلِّ مَنْ أَسَاءَ إِلَيْهِ.","وَصَارَ مُهَنَّدٌ أَوَّلَ مَنْ يُشَجِّعُ زُمَلَاءَهُ عِنْدَ الْخَطَأِ."],"qs":[["ماذا كانت عادة مهند السيئة؟","السخرية من زملائه","التأخر عن المدرسة","النوم في الحصة"],["ماذا حدث لمهند أثناء إلقاء القصيدة؟","ارتبك ونسي الأبيات","أكملها بسرعة","خرج من الصف"],["ماذا قال حسن؟","خذ نفسا عميقا وابدأ من جديد","اجلس مكانك","أنت لا تعرف"],["لماذا سميت القصة المرآة الصادقة؟","لأن مهندا رأى حقيقة تصرفاته","لأن في الصف مرآة","لأن حسنا يحمل مرآة"]]},{"id":"g4-04","title":"قَلْعَةُ بَهْلَا","lines":["تَقِفُ قَلْعَةُ بَهْلَا شَامِخَةً فِي مُحَافَظَةِ الدَّاخِلِيَّةِ مُنْذُ مِئَاتِ السِّنِينَ.","وَهِيَ مِنْ أَقْدَمِ الْقِلَاعِ فِي عُمَانَ، وَقَدْ أُدْرِجَتْ فِي قَائِمَةِ التُّرَاثِ الْعَالَمِيِّ.","بُنِيَتِ الْقَلْعَةُ مِنَ الطِّينِ وَالْحِجَارَةِ، وَيُحِيطُ بِهَا سُورٌ طَوِيلٌ.","زَارَهَا طُلَّابُ الصَّفِّ الرَّابِعِ، وَاسْتَقْبَلَهُمْ مُرْشِدٌ يَعْرِفُ تَارِيخَهَا جَيِّدًا.","قَالَ الْمُرْشِدُ: كَانَ السُّورُ يَحْمِي الْوَاحَةَ وَالْبُيُوتَ وَالْمَزَارِعَ.","وَأَشَارَ إِلَى الْأَبْرَاجِ الَّتِي كَانَ الْحُرَّاسُ يُرَاقِبُونَ مِنْهَا الطُّرُقَ.","سَأَلَ أَحَدُ الطُّلَّابِ: كَيْفَ صَمَدَ الطِّينُ كُلَّ هَذِهِ السِّنِينَ؟","أَجَابَ الْمُرْشِدُ: لِأَنَّ الْأَجْدَادَ أَتْقَنُوا الْبِنَاءَ، وَلِأَنَّ النَّاسَ يُرَمِّمُونَهَا بِعِنَايَةٍ.","تَجَوَّلَ الطُّلَّابُ فِي الْمَمَرَّاتِ الضَّيِّقَةِ وَالْغُرَفِ الْبَارِدَةِ.","وَكَتَبَ كُلُّ وَاحِدٍ مِنْهُمْ تَقْرِيرًا قَصِيرًا عَنِ الزِّيَارَةِ.","اخْتَارَتِ الْمُعَلِّمَةُ أَجْمَلَ التَّقَارِيرِ وَعَلَّقَتْهَا فِي مَجَلَّةِ الْحَائِطِ."],"qs":[["في أي محافظة تقع قلعة بهلا؟","الداخلية","ظفار","مسندم"],["مم بنيت القلعة؟","من الطين والحجارة","من الحديد","من الخشب فقط"],["ماذا كان دور السور؟","حماية الواحة والبيوت والمزارع","الزينة فقط","حبس الحيوانات"],["لماذا صمدت القلعة؟","لإتقان البناء والترميم بعناية","لأنها جديدة","لأن المطر لا ينزل هناك"]]},{"id":"g4-05","title":"الْمُخْتَرِعُ الصَّغِيرُ","lines":["لَاحَظَ حَارِثٌ أَنَّ جَدَّتَهُ تَتْعَبُ كُلَّ يَوْمٍ وَهِيَ تَسْقِي نَبَاتَاتِ الْحَدِيقَةِ.","فَكَّرَ فِي طَرِيقَةٍ تُرِيحُهَا، وَتُوَفِّرُ الْمَاءَ أَيْضًا.","قَرَأَ فِي كِتَابِ الْعُلُومِ عَنِ الرَّيِّ بِالتَّنْقِيطِ، فَأَعْجَبَتْهُ الْفِكْرَةُ.","جَمَعَ قَوَارِيرَ بِلَاسْتِيكِيَّةً فَارِغَةً، وَثَقَبَ أَغْطِيَتَهَا ثُقُوبًا صَغِيرَةً.","مَلَأَ الْقَوَارِيرَ بِالْمَاءِ، وَغَرَسَهَا مَقْلُوبَةً بِجَانِبِ كُلِّ نَبْتَةٍ.","أَخَذَ الْمَاءُ يَتَسَرَّبُ قَطْرَةً قَطْرَةً إِلَى جُذُورِ النَّبَاتَاتِ.","فِي الْأَيَّامِ الْأُولَى سَقَطَتْ بَعْضُ الْقَوَارِيرِ، فَثَبَّتَهَا بِالْحِجَارَةِ.","بَعْدَ أُسْبُوعَيْنِ كَانَتِ النَّبَاتَاتُ نَضِرَةً، وَقَلَّ اسْتِهْلَاكُ الْمَاءِ.","عَرَضَ حَارِثٌ فِكْرَتَهُ فِي مَعْرِضِ الْمَدْرَسَةِ لِلِابْتِكَارِ، فَنَالَتْ إِعْجَابَ الْحُكَّامِ.","قَالَتْ جَدَّتُهُ: الِاخْتِرَاعُ يَبْدَأُ بِقَلْبٍ يَشْعُرُ بِحَاجَةِ الْآخَرِينَ."],"qs":[["ما المشكلة التي لاحظها حارث؟","تعب جدته في سقي النباتات","تلف الأزهار","قلة الكتب"],["ماذا استخدم حارث؟","قوارير بلاستيكية فارغة","أنابيب حديدية","دلوا كبيرا"],["ماذا فعل عندما سقطت القوارير؟","ثبتها بالحجارة","تركها","اشترى غيرها"],["ماذا قالت الجدة عن الاختراع؟","يبدأ بقلب يشعر بحاجة الآخرين","يحتاج إلى مال كثير","صعب جدا"]]},{"id":"g4-06","title":"الْمَلِكُ وَالْبُذُورُ","lines":["أَرَادَ مَلِكٌ حَكِيمٌ أَنْ يَخْتَارَ مَنْ يَخْلُفُهُ فِي الْحُكْمِ.","جَمَعَ أَطْفَالَ الْمَمْلَكَةِ، وَأَعْطَى كُلَّ وَاحِدٍ مِنْهُمْ بِذْرَةً.","قَالَ: ازْرَعُوهَا وَاعْتَنُوا بِهَا، وَعُودُوا إِلَيَّ بَعْدَ سِتَّةِ أَشْهُرٍ.","زَرَعَ الصَّبِيُّ مُؤْمِنٌ بِذْرَتَهُ، وَسَقَاهَا كُلَّ يَوْمٍ، لَكِنَّهَا لَمْ تَنْبُتْ.","مَرَّتِ الْأَشْهُرُ، وَجَاءَ الْأَطْفَالُ يَحْمِلُونَ نَبَاتَاتٍ جَمِيلَةً وَأَزْهَارًا مُلَوَّنَةً.","أَمَّا مُؤْمِنٌ فَحَمَلَ أَصِيصًا فَارِغًا، وَوَقَفَ خَجِلًا فِي آخِرِ الصَّفِّ.","نَظَرَ الْمَلِكُ إِلَى الْأَصِيصِ الْفَارِغِ وَسَأَلَهُ عَنْ قِصَّتِهِ.","قَالَ مُؤْمِنٌ: فَعَلْتُ كُلَّ مَا أَسْتَطِيعُ، وَلَكِنَّ الْبِذْرَةَ لَمْ تَنْبُتْ.","ابْتَسَمَ الْمَلِكُ وَقَالَ: لَقَدْ أَعْطَيْتُكُمْ بُذُورًا مَسْلُوقَةً لَا تَنْبُتُ أَبَدًا.","أَنْتَ الْوَحِيدُ الَّذِي جَاءَ بِالْحَقِيقَةِ، وَالصَّادِقُ أَحَقُّ بِالْأَمَانَةِ."],"qs":[["ماذا أعطى الملك الأطفال؟","بذرة لكل واحد","ذهبا","كتبا"],["ماذا حمل مؤمن إلى الملك؟","أصيصا فارغا","زهرة كبيرة","شجرة"],["لماذا لم تنبت البذور؟","لأنها كانت مسلوقة","لأن الأطفال لم يسقوها","لأن الشمس قليلة"],["لماذا اختار الملك مؤمنا؟","لأنه صادق","لأنه أقوى الأطفال","لأنه أكبرهم"]]},{"id":"g4-07","title":"رِحْلَةٌ إِلَى جَبَلِ شَمْسٍ","lines":["صَعِدَتْ عَائِلَةُ عَزَّانَ بِالسَّيَّارَةِ إِلَى جَبَلِ شَمْسٍ، أَعْلَى قِمَّةٍ فِي عُمَانَ.","كَانَ الطَّرِيقُ مُتَعَرِّجًا، وَكُلَّمَا ارْتَفَعُوا انْخَفَضَتْ دَرَجَةُ الْحَرَارَةِ.","لَاحَظَ عَزَّانُ أَنَّ أُذُنَيْهِ تَشْعُرَانِ بِضَغْطٍ خَفِيفٍ، فَشَرَحَ لَهُ أَبُوهُ السَّبَبَ.","قَالَ: يَقِلُّ ضَغْطُ الْهَوَاءِ كُلَّمَا صَعِدْنَا إِلَى الْأَعْلَى.","وَقَفُوا عَلَى حَافَّةِ الْوَادِي الْعَمِيقِ الَّذِي يُسَمِّيهِ النَّاسُ الْأُخْدُودَ الْعَظِيمَ.","رَأَى عَزَّانُ قُرًى صَغِيرَةً مُعَلَّقَةً عَلَى سُفُوحِ الْجِبَالِ، وَمُدَرَّجَاتٍ زِرَاعِيَّةً خَضْرَاءَ.","الْتَقَوْا بِامْرَأَةٍ مِنْ أَهْلِ الْجَبَلِ تَنْسِجُ السَّجَّادَ مِنْ صُوفِ الْمَاعِزِ.","أَخْبَرَتْهُمْ أَنَّ الشِّتَاءَ هُنَا بَارِدٌ جِدًّا، وَقَدْ تَنْزِلُ دَرَجَةُ الْحَرَارَةِ تَحْتَ الصِّفْرِ.","فِي الْمَسَاءِ لَبِسُوا الْمَعَاطِفَ، وَجَلَسُوا يَتَأَمَّلُونَ غُرُوبَ الشَّمْسِ بَيْنَ الْقِمَمِ.","كَتَبَ عَزَّانُ فِي دَفْتَرِ مُذَكَّرَاتِهِ: بِلَادِي فِيهَا الْبَحْرُ وَالصَّحْرَاءُ وَالْجَبَلُ، فَمَا أَجْمَلَهَا!"],"qs":[["ما أعلى قمة في عمان حسب القصة؟","جبل شمس","الجبل الأخضر","جبل سمحان"],["لماذا شعر عزان بضغط في أذنيه؟","لأن ضغط الهواء يقل في الأعلى","لأنه مريض","بسبب الضجيج"],["مم تنسج المرأة السجاد؟","من صوف الماعز","من القطن","من سعف النخيل"],["ماذا كتب عزان في دفتره؟","بلادي فيها البحر والصحراء والجبل","الجبل مخيف","لا أحب الرحلات"]]},{"id":"g4-08","title":"الْخَطَأُ الَّذِي عَلَّمَنِي","lines":["أَعَدَّ رَاكَانُ مَشْرُوعًا عَنِ الْبَرَاكِينِ لِيَعْرِضَهُ فِي الصَّفِّ.","قَضَى أَيَّامًا يَصْنَعُ نَمُوذَجًا مِنَ الصَّلْصَالِ، وَيُلَوِّنُهُ بِعِنَايَةٍ.","فِي يَوْمِ الْعَرْضِ وَضَعَ الْخَلِيطَ دَاخِلَ الْبُرْكَانِ لِيُخْرِجَ الرَّغْوَةَ.","وَلَكِنَّ شَيْئًا لَمْ يَحْدُثْ، فَقَدْ نَسِيَ أَنْ يُضِيفَ الْخَلَّ.","احْمَرَّ وَجْهُهُ، وَأَرَادَ أَنْ يَعُودَ إِلَى مَقْعَدِهِ.","قَالَتِ الْمُعَلِّمَةُ: لَا بَأْسَ، أَخْبِرْنَا مَاذَا تَعَلَّمْتَ مِنْ هَذَا.","تَمَالَكَ رَاكَانُ نَفْسَهُ، وَشَرَحَ أَنَّ التَّفَاعُلَ يَحْتَاجُ إِلَى مَادَّتَيْنِ مَعًا.","ثُمَّ طَلَبَ قَلِيلًا مِنَ الْخَلِّ مِنْ مَقْصِفِ الْمَدْرَسَةِ، وَأَعَادَ التَّجْرِبَةَ.","فَارَتِ الرَّغْوَةُ مِنْ فُوَّهَةِ الْبُرْكَانِ، وَصَفَّقَ الْجَمِيعُ بِحَمَاسٍ.","تَعَلَّمَ رَاكَانُ أَنَّ الْخَطَأَ لَيْسَ نِهَايَةَ الطَّرِيقِ، بَلْ دَرْسٌ يُقَرِّبُنَا مِنَ النَّجَاحِ."],"qs":[["عن ماذا كان مشروع راكان؟","البراكين","الفضاء","البحار"],["لماذا لم تخرج الرغوة؟","لأنه نسي إضافة الخل","لأن النموذج مكسور","لأن الماء ساخن"],["ماذا طلبت المعلمة؟","أن يخبرهم بما تعلم","أن يجلس","أن يعيد المشروع غدا"],["ماذا تعلم راكان؟","الخطأ درس يقربنا من النجاح","ألا يحاول مرة أخرى","أن البراكين خطيرة"]]},{"id":"g4-09","title":"الْحَمَامَةُ الْمُطَوَّقَةُ","lines":["كَانَتْ أَسْرَابٌ مِنَ الْحَمَامِ تَطِيرُ مَعًا تَقُودُهَا حَمَامَةٌ حَكِيمَةٌ تُسَمَّى الْمُطَوَّقَةَ.","رَأَى الْحَمَامُ حَبًّا مَنْثُورًا عَلَى الْأَرْضِ، فَنَزَلَ يَأْكُلُ مِنْهُ.","وَمَا إِنْ هَبَطَ حَتَّى وَقَعَ فِي شَبَكَةٍ نَصَبَهَا صَيَّادٌ.","أَخَذَتْ كُلُّ حَمَامَةٍ تُحَاوِلُ النَّجَاةَ وَحْدَهَا، فَازْدَادَتِ الشَّبَكَةُ الْتِفَافًا.","قَالَتِ الْمُطَوَّقَةُ: لَا تَتَفَرَّقْنَ، لِنَطِرْ جَمِيعًا فِي وَقْتٍ وَاحِدٍ.","تَعَاوَنَ الْحَمَامُ، فَارْتَفَعَ بِالشَّبَكَةِ عَالِيًا وَالصَّيَّادُ يَنْظُرُ مُتَعَجِّبًا.","طَارَتِ الْمُطَوَّقَةُ بِهِمْ إِلَى صَدِيقِهَا الْجُرَذِ الَّذِي يَسْكُنُ قُرْبَ الشَّجَرَةِ.","بَدَأَ الْجُرَذُ يَقْرِضُ عُقْدَةَ الْمُطَوَّقَةِ، فَقَالَتْ: ابْدَأْ بِأَصْحَابِي أَوَّلًا.","تَعَجَّبَ الْجُرَذُ، فَقَالَتْ: أَخَافُ أَنْ تَتْعَبَ فَتَتْرُكَ بَعْضَهُمْ، وَأَنَا قَائِدَتُهُمْ.","قَرَضَ الْجُرَذُ الشَّبَكَةَ كُلَّهَا، فَنَجَا الْحَمَامُ جَمِيعًا بِفَضْلِ التَّعَاوُنِ وَحِكْمَةِ الْقَائِدَةِ."],"qs":[["كيف وقع الحمام في الشبكة؟","نزل ليأكل الحب","طار في الليل","اصطدم بشجرة"],["ماذا نصحت المطوقة الحمام؟","أن يطير جميعا في وقت واحد","أن يحاول كل واحد وحده","أن يستسلم"],["من قرض الشبكة؟","الجرذ","الصياد","الغراب"],["لماذا طلبت المطوقة أن يبدأ بأصحابها؟","لأنها قائدتهم وتخاف أن يتركهم","لأنها لا تريد النجاة","لأنها خائفة من الجرذ"]]},{"id":"g4-10","title":"الطَّاقَةُ مِنَ الشَّمْسِ","lines":["فِي دَرْسِ الْعُلُومِ سَأَلَ الْمُعَلِّمُ: مَا أَكْبَرُ مَصْدَرٍ لِلطَّاقَةِ عَلَى الْأَرْضِ؟","أَجَابَتْ جُمَانَةُ بِسُرْعَةٍ: الشَّمْسُ يَا أُسْتَاذُ.","قَالَ الْمُعَلِّمُ: أَحْسَنْتِ، فَالشَّمْسُ تُعْطِينَا الضَّوْءَ وَالْحَرَارَةَ، وَيُمْكِنُنَا تَحْوِيلُهَا إِلَى كَهْرَبَاءَ.","ثُمَّ عَرَضَ صُورًا لِأَلْوَاحٍ شَمْسِيَّةٍ فَوْقَ أَسْطُحِ الْبُيُوتِ وَالْمَدَارِسِ.","وَأَوْضَحَ أَنَّ هَذِهِ الْأَلْوَاحَ تُنْتِجُ طَاقَةً نَظِيفَةً لَا تُلَوِّثُ الْهَوَاءَ.","سَأَلَ سُهَيْلٌ: وَمَاذَا نَفْعَلُ فِي اللَّيْلِ عِنْدَمَا تَغِيبُ الشَّمْسُ؟","قَالَ الْمُعَلِّمُ: نُخَزِّنُ الطَّاقَةَ فِي بَطَّارِيَّاتٍ كَبِيرَةٍ لِنَسْتَخْدِمَهَا لَاحِقًا.","قَسَّمَ الْمُعَلِّمُ الطُّلَّابَ مَجْمُوعَاتٍ، وَصَنَعَتْ كُلُّ مَجْمُوعَةٍ فُرْنًا شَمْسِيًّا مِنْ صُنْدُوقٍ وَوَرَقِ أَلُومِنْيُومٍ.","وَضَعُوا قِطَعًا مِنَ الشُّوكُولَاتَةِ دَاخِلَ الْأَفْرَانِ تَحْتَ الشَّمْسِ.","بَعْدَ نِصْفِ سَاعَةٍ ذَابَتِ الشُّوكُولَاتَةُ، فَضَحِكَ الطُّلَّابُ فَرَحًا بِنَجَاحِ التَّجْرِبَةِ."],"qs":[["ما أكبر مصدر للطاقة على الأرض؟","الشمس","الرياح","البحر"],["ما ميزة الطاقة الشمسية؟","نظيفة لا تلوث الهواء","غالية جدا","تعمل في الليل فقط"],["أين نخزن الطاقة لليل؟","في بطاريات كبيرة","في الماء","في الصناديق"],["ماذا حدث للشوكولاتة؟","ذابت","تجمدت","اختفت"]]},{"id":"g4-11","title":"الْعَجُوزُ وَالْبِئْرُ","lines":["فِي قَرْيَةٍ صَغِيرَةٍ عَاشَ رَجُلٌ عَجُوزٌ يَمْلِكُ بِئْرًا عَذْبَةَ الْمَاءِ.","كَانَ يَسْمَحُ لِأَهْلِ الْقَرْيَةِ أَنْ يَشْرَبُوا مِنْهَا دُونَ مُقَابِلٍ.","جَاءَهُ تَاجِرٌ طَمَّاعٌ، وَعَرَضَ أَنْ يَشْتَرِيَ الْبِئْرَ بِمَالٍ كَثِيرٍ.","فَكَّرَ الْعَجُوزُ قَلِيلًا ثُمَّ قَالَ: سَأَبِيعُكَ الْبِئْرَ، وَلَكِنْ لَا أَبِيعُكَ الْمَاءَ.","ضَحِكَ التَّاجِرُ وَقَالَ: وَمَا فَائِدَةُ الْبِئْرِ بِلَا مَاءٍ؟","قَالَ الْعَجُوزُ: إِذَنْ فَالْمَاءُ هُوَ الثَّمِينُ، وَهُوَ رِزْقُ اللَّهِ لِلْجَمِيعِ.","فَهِمَ التَّاجِرُ أَنَّ الْعَجُوزَ كَشَفَ نِيَّتَهُ فِي احْتِكَارِ الْمَاءِ وَبَيْعِهِ لِلنَّاسِ.","انْصَرَفَ التَّاجِرُ خَائِبًا، وَبَقِيَتِ الْبِئْرُ لِأَهْلِ الْقَرْيَةِ.","وَبَعْدَ وَفَاةِ الْعَجُوزِ أَوْقَفَ أَبْنَاؤُهُ الْبِئْرَ لِلنَّاسِ كَمَا أَوْصَى.","وَمَا زَالَ أَهْلُ الْقَرْيَةِ يَذْكُرُونَهُ بِالْخَيْرِ كُلَّمَا شَرِبُوا."],"qs":[["ماذا كان يملك العجوز؟","بئرا عذبة الماء","مزرعة كبيرة","سفينة"],["ماذا أراد التاجر؟","أن يشتري البئر","أن يشرب فقط","أن يحفر بئرا"],["ماذا قال العجوز للتاجر؟","أبيعك البئر لا الماء","خذها مجانا","لا أعرفك"],["ماذا فعل الأبناء بعد وفاة أبيهم؟","أوقفوا البئر للناس","باعوها","أغلقوها"]]},{"id":"g4-12","title":"حِكَايَةُ الْخَنْجَرِ","lines":["فِي بَيْتِ جَدِّ سُلْطَانٍ خَنْجَرٌ فِضِّيٌّ مُعَلَّقٌ عَلَى الْجِدَارِ.","سَأَلَ سُلْطَانٌ: يَا جَدِّي، لِمَاذَا تَحْتَفِظُ بِهَذَا الْخَنْجَرِ مُنْذُ سَنَوَاتٍ؟","قَالَ الْجَدُّ: هَذَا الْخَنْجَرُ وَرِثْتُهُ عَنْ أَبِي، وَوَرِثَهُ أَبِي عَنْ جَدِّهِ.","الْخَنْجَرُ رَمْزٌ مِنْ رُمُوزِ عُمَانَ، وَهُوَ مَرْسُومٌ عَلَى شِعَارِ الدَّوْلَةِ.","يَلْبَسُهُ الرِّجَالُ فِي الْمُنَاسَبَاتِ وَالْأَعْيَادِ مَعَ الدِّشْدَاشَةِ وَالْمُصَرِّ.","وَيَصْنَعُهُ حِرَفِيُّونَ مَهَرَةٌ، يَنْقُشُونَ الْفِضَّةَ بِنُقُوشٍ دَقِيقَةٍ تَسْتَغْرِقُ أَيَّامًا.","أَخَذَ الْجَدُّ سُلْطَانًا إِلَى مَحَلِّ صَانِعِ الْخَنَاجِرِ فِي السُّوقِ.","رَأَى سُلْطَانٌ الصَّانِعَ يَطْرُقُ الْفِضَّةَ بِصَبْرٍ، وَيَرْسُمُ عَلَيْهَا خُيُوطًا رَقِيقَةً.","قَالَ الصَّانِعُ: كُلُّ خَنْجَرٍ يَحْمِلُ قِصَّةَ صَاحِبِهِ وَتَارِيخَ عَائِلَتِهِ.","عَادَ سُلْطَانٌ إِلَى الْبَيْتِ، وَنَظَرَ إِلَى الْخَنْجَرِ نَظْرَةً جَدِيدَةً مَلِيئَةً بِالْفَخْرِ."],"qs":[["من أين حصل الجد على الخنجر؟","ورثه عن أبيه","اشتراه أمس","وجده في الطريق"],["أين يرسم الخنجر؟","على شعار الدولة","على النقود فقط","على الأبواب"],["متى يلبس الرجال الخنجر؟","في المناسبات والأعياد","عند النوم","في المدرسة"],["ماذا قال الصانع؟","كل خنجر يحمل قصة صاحبه","الخناجر رخيصة","لا أحب عملي"]]},{"id":"g4-13","title":"السَّمَكَةُ الذَّهَبِيَّةُ وَالْقِرْشُ","lines":["فِي أَعْمَاقِ بَحْرِ الْعَرَبِ عَاشَتْ سَمَكَةٌ ذَهَبِيَّةٌ صَغِيرَةٌ مَعَ سِرْبِهَا.","كَانَتْ تُحِبُّ الِاسْتِكْشَافَ، وَتَبْتَعِدُ أَحْيَانًا عَنْ أَصْدِقَائِهَا.","نَصَحَتْهَا أُمُّهَا: لَا تَبْتَعِدِي عَنِ السِّرْبِ، فَالْبَحْرُ مَلِيءٌ بِالْمَخَاطِرِ.","فِي يَوْمٍ رَأَتْ كَهْفًا مُلَوَّنًا بَيْنَ الشُّعَبِ الْمَرْجَانِيَّةِ، فَسَبَحَتْ إِلَيْهِ وَحْدَهَا.","وَفَجْأَةً ظَهَرَ قِرْشٌ ضَخْمٌ يَقْتَرِبُ مِنْهَا بِسُرْعَةٍ.","تَذَكَّرَتْ نَصِيحَةَ أُمِّهَا، فَاخْتَبَأَتْ بَيْنَ فُرُوعِ الْمَرْجَانِ الضَّيِّقَةِ.","لَمْ يَسْتَطِعِ الْقِرْشُ أَنْ يَدْخُلَ، فَدَارَ حَوْلَ الْمَرْجَانِ ثُمَّ ابْتَعَدَ.","خَرَجَتِ السَّمَكَةُ بِحَذَرٍ، وَعَادَتْ مُسْرِعَةً إِلَى سِرْبِهَا.","قَالَتْ لِأُمِّهَا: لَقَدْ فَهِمْتُ الْآنَ أَنَّ نَصِيحَتَكِ كَانَتْ لِحِمَايَتِي.","وَصَارَتْ تَسْتَكْشِفُ الْبَحْرَ مَعَ أَصْدِقَائِهَا، فَالْمُتْعَةُ مَعَ الْأَمَانِ أَجْمَلُ."],"qs":[["أين عاشت السمكة؟","في بحر العرب","في نهر صغير","في حوض زجاجي"],["ماذا نصحتها أمها؟","ألا تبتعد عن السرب","أن تسبح وحدها","أن تلعب مع القرش"],["أين اختبأت السمكة؟","بين فروع المرجان","في فم الحوت","تحت سفينة"],["ما فكرة القصة؟","المتعة مع الأمان أجمل","القرش صديق","الاستكشاف ممنوع"]]},{"id":"g4-14","title":"مُذَكَّرَاتُ قَطْرَةِ مَاءٍ","lines":["أَنَا قَطْرَةُ مَاءٍ، بَدَأَتْ رِحْلَتِي فِي مِيَاهِ الْبَحْرِ الْوَاسِعِ.","فِي يَوْمٍ حَارٍّ سَخَّنَتْنِي الشَّمْسُ، فَتَحَوَّلْتُ إِلَى بُخَارٍ خَفِيفٍ.","صَعِدْتُ إِلَى السَّمَاءِ، وَهُنَاكَ بَرَدْتُ وَاجْتَمَعْتُ مَعَ قَطَرَاتٍ أُخْرَى.","صِرْنَا سَحَابَةً كَبِيرَةً تَحْمِلُهَا الرِّيَاحُ فَوْقَ الْجِبَالِ.","عِنْدَمَا ثَقُلَتِ السَّحَابَةُ، نَزَلْتُ مَطَرًا عَلَى قِمَّةِ الْجَبَلِ الْأَخْضَرِ.","جَرَيْتُ فِي الْوَادِي، ثُمَّ تَسَرَّبْتُ إِلَى بَاطِنِ الْأَرْضِ.","وَبَعْدَ أَيَّامٍ خَرَجْتُ فِي قَنَاةِ فَلَجٍ قَدِيمٍ، وَسَقَيْتُ نَخْلَةً عَطْشَى.","ثُمَّ حَمَلَتْنِي الْقَنَاةُ إِلَى الْوَادِي مِنْ جَدِيدٍ، وَمِنْهُ إِلَى الْبَحْرِ.","وَهَكَذَا أَدُورُ فِي رِحْلَةٍ لَا تَنْتَهِي يُسَمِّيهَا الْعُلَمَاءُ دَوْرَةَ الْمَاءِ.","فَإِذَا رَأَيْتَنِي يَوْمًا فِي كُوبِكَ، فَلَا تُضَيِّعْنِي، فَأَنَا أَمَانَةٌ بَيْنَ يَدَيْكَ."],"qs":
