function setMode(m){mode=m;localStorage.setItem('civ11_mode',m);document.getElementById('mSep').classList.toggle('on',m==='sep');document.getElementById('mComb').classList.toggle('on',m==='comb');render()}
document.getElementById('mSep').onclick=()=>setMode('sep'); document.getElementById('mComb').onclick=()=>setMode('comb');
async function copyText(text,btn){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}btn.textContent='تم النسخ ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='نسخ';btn.classList.remove('done')},1100)}
function makeCard(title,text){const s=document.createElement('section');s.className='card';const h=document.createElement('div');h.className='card-head';const hh=document.createElement('h2');hh.textContent=title;const b=document.createElement('button');b.className='copy';b.textContent='نسخ';b.onclick=()=>copyText(text,b);h.append(hh,b);const p=document.createElement('p');p.className='txt';p.textContent=text;s.append(h,p);return s}
function renderTabs(){tabs.innerHTML='';const l=DATA.lessons[Number(lessonSel.value)];if(mode==='comb')return;l.periods.forEach((p,i)=>{const b=document.createElement('button');b.textContent=`${i+1}`;b.classList.toggle('on',i===curP);b.onclick=()=>{curP=i;localStorage.setItem('civ11_period',i);render()};tabs.appendChild(b)})}
function render(){const li=Number(lessonSel.value),l=DATA.lessons[li];if(curP>=l.periods.length)curP=0;localStorage.setItem('civ11_lesson',li);renderTabs();cards.innerHTML='';if(mode==='sep'){const p=l.periods[curP];meta.textContent=`${l.unit} | الأسبوع ${p.week} | ${p.date} | الحصة ${p.n} من ${l.count} | ${p.focus}`;counter.textContent=`الحصة ${p.n} / ${l.count}`;DATA.fields.forEach((f,i)=>cards.appendChild(makeCard(f,p.t[i])));}else{meta.textContent=`${l.unit} | تحضير مدمج للدرس | ${l.count} حصة`;counter.textContent=`${l.count} حصة مدمجة`;DATA.fields.forEach((f,fi)=>{let txt=l.periods.map(p=>`الحصة ${p.n} – الأسبوع ${p.week} – ${p.date} – ${p.focus}:
${p.t[fi]}`).join('\n\n');cards.appendChild(makeCard(f,txt))});}}
lessonSel.onchange=()=>{curP=0;localStorage.setItem('civ11_period',0);render()};
document.getElementById('prev').onclick=()=>{if(mode==='comb')return;const l=DATA.lessons[Number(lessonSel.value)];if(curP>0)curP--;else if(Number(lessonSel.value)>0){lessonSel.value=Number(lessonSel.value)-1;curP=DATA.lessons[Number(lessonSel.value)].periods.length-1}localStorage.setItem('civ11_period',curP);render()};
document.getElementById('next').onclick=()=>{if(mode==='comb')return;const l=DATA.lessons[Number(lessonSel.value)];if(curP<l.periods.length-1)curP++;else if(Number(lessonSel.value)<DATA.lessons.length-1){lessonSel.value=Number(lessonSel.value)+1;curP=0}localStorage.setItem('civ11_period',curP);render()};
setMode(mode);
</script>
</body>
</html>
